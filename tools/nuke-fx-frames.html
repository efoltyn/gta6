<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nuke FX frame</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090b0f; }
    canvas { display: block; width: 100%; height: 100%; }
    #stamp {
      position: fixed; left: 18px; top: 16px; z-index: 3; color: #f5eee2;
      font: 600 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 10px 12px; border: 1px solid #ffffff2b; border-radius: 7px;
      background: #090b0fbb; white-space: pre;
    }
    #nukeFlash { position: fixed; inset: 0; opacity: 0; pointer-events: none; background: #fff; z-index: 2; }
    #error { color: #ff8c80; }
  </style>
</head>
<body>
  <div id="stamp">loading actual src/city/nukefx.js…</div>
  <div id="nukeFlash"></div>
  <script src="../src/vendor/three.r128.min.js"></script>
  <script>
    (() => {
      const target = Math.max(0, Math.min(33, +(new URLSearchParams(location.search).get("t") || 1.47)));
      const callbacks = [];
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x121820);
      scene.fog = new THREE.Fog(0x37424c, 300, 2200);

      const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 1000);
      const d = target < 2 ? 760 : target < 5 ? 1900 : target < 12 ? 4600 : 8200;
      const aimY = target < 2 ? 120 : target < 5 ? 700 : target < 12 ? 2100 : 3800;
      camera.position.set(d * 0.72, target < 2 ? 120 : 520, d * 0.72);
      camera.lookAt(0, aimY, 0);

      const renderer = new THREE.WebGLRenderer({
        antialias: true, alpha: false, preserveDrawingBuffer: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      document.body.prepend(renderer.domElement);

      const sun = new THREE.DirectionalLight(0xffe2bb, 1.35);
      sun.position.set(-500, 900, 300);
      scene.add(sun);
      const hemi = new THREE.HemisphereLight(0x9eb8d4, 0x241b17, 0.72);
      scene.add(hemi);
      scene.add(new THREE.AmbientLight(0x8994a0, 0.25));

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(700, 64),
        new THREE.MeshLambertMaterial({ color: 0x28231e })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);
      const blockMat = new THREE.MeshLambertMaterial({ color: 0x17191c });
      for (let i = 0; i < 18; i++) {
        const a = i * 2.399963, r = 150 + (i % 5) * 68;
        const h = 35 + (i * 47 % 130);
        const b = new THREE.Mesh(new THREE.BoxGeometry(55 + i % 3 * 22, h, 55 + i % 4 * 15), blockMat);
        b.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r);
        scene.add(b);
      }

      window.CBZ = {
        scene, camera, sun, hemi, bounce: null,
        CONFIG: { NUKE_FX_ASH: false },
        game: { mode: "nuke-frame" },
        qScale: (_lo, hi) => hi,
        floorAt: () => 0,
        onAlways: (order, fn) => callbacks.push({ order, fn }),
        cityAirstrikeExplosion: () => {},
        cityShatter: () => {},
        shake: () => {},
        sfx: () => {},
      };
      callbacks.sort((a, b) => a.order - b.order);
      window.__NUKE_TARGET__ = target;
      window.__NUKE_CALLBACKS__ = callbacks;
      window.__NUKE_RENDERER__ = renderer;
    })();
  </script>
  <script src="../src/city/nukefx.js"></script>
  <script>
    (() => {
      const stamp = document.getElementById("stamp");
      try {
        if (!CBZ.cityNukeFX) throw new Error("nukefx did not initialize");
        const target = window.__NUKE_TARGET__;
        CBZ.cityNukeFX(0, 0, 0, { quiet: true, noDamage: true });
        let elapsed = 0;
        while (elapsed < target - 1e-8) {
          const dt = Math.min(1 / 60, target - elapsed);
          for (const row of window.__NUKE_CALLBACKS__) row.fn(dt);
          elapsed += dt;
        }
        window.__NUKE_RENDERER__.render(CBZ.scene, CBZ.camera);
        const debug = CBZ.nukeFxDebug();
        const live = debug.live || {};
        stamp.textContent =
          `actual nukefx.js  t=${target.toFixed(2)}s\n` +
          `phase ${live.cloudPhase ?? "-"} · cap ${live.capWNow ?? "-"}m · altitude ${live.capYNow ?? "-"}m\n` +
          `generic puff events ${live.genericPuffEvents ?? "-"} · ${live.impostor ? "far tier" : "3D tier"}`;
        window.__NUKE_DEBUG__ = debug;
        window.__NUKE_READY__ = true;
      } catch (error) {
        stamp.id = "error";
        stamp.textContent = error.stack || String(error);
        window.__NUKE_ERROR__ = String(error);
        window.__NUKE_READY__ = true;
      }
    })();
  </script>
</body>
</html>
