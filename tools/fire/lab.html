<!DOCTYPE html>
<!-- tools/fire/lab.html — the fire / smoke / light engines on their own.
     src/systems/gpufx.js (CBZ.gpuParticles) and src/core/clusterlights.js
     (CBZ.clusterLights) on a cone and a plain, with no game around them:
     boots in a second, so a change to the engine is seen in a second.
       tools/fire/lab.html?gpu=webgpu&scene=volcano|fire|lights|all
     Driven headless by tools/fire/lab.mjs (window.__lab). -->
<html lang="en"><head><meta charset="UTF-8"><title>Fire lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%;background:#0d0f12;overflow:hidden;color:#ddd;font:12px -apple-system,sans-serif}#game{position:fixed;inset:0}#hud{position:fixed;left:8px;top:6px;z-index:2;white-space:pre}</style>
</head><body><div id="game"></div><div id="hud"></div>
<script src="../../src/vendor/three.r187.js"></script>
<script>
(function () {
  const Q = new URLSearchParams(location.search);
  const always = [];
  window.CBZ = {
    CONFIG: { GPU_PARTICLES: true, CLUSTER_LIGHTS: Q.get("cluster") !== "0" },
    game: { state: "playing", mode: "lab" },
    TUNE: { gravity: 9.8 },
    qualityLevel: 4,
    onAlways(order, fn) { always.push({ order, fn }); always.sort((a, b) => a.order - b.order); },
    onUpdate() {},
    qScale(lo, hi) { return hi; },
  };
  const CBZ = window.CBZ;
  const R = THREE.createRenderer({ antialias: true, powerPreference: "high-performance" });
  R.setPixelRatio(1);
  R.setSize(innerWidth, innerHeight);
  R.toneMapping = THREE.ACESFilmicToneMapping;
  R.outputColorSpace = THREE.SRGBColorSpace;
  R.shadowMap.enabled = true;
  document.getElementById("game").appendChild(R.domElement);
  CBZ.renderer = R;
  const scene = new THREE.Scene();
  CBZ.scene = scene;
  const night = Q.get("night") === "1";
  scene.background = new THREE.Color(night ? 0x04060a : 0x8fa6bf);
  scene.fog = new THREE.Fog(scene.background.getHex(), 160, 900);
  const cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.3, 3000);
  CBZ.camera = cam;
  const sun = new THREE.DirectionalLight(0xfff0dc, night ? 0.05 : 3.2);
  sun.position.set(120, 160, 60); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -160, right: 160, top: 160, bottom: -160, near: 1, far: 600 });
  scene.add(sun); scene.add(sun.target);
  CBZ.sun = sun; CBZ.sunTarget = sun.target;
  scene.add(new THREE.HemisphereLight(0xb8c8e0, 0x3a3328, night ? 0.04 : 0.9));
  // THE GROUND: a stratovolcano on a plain (peak 60 m, r 80 m) at the origin
  const PEAK = 60, RAD = 80, RIM = 6;
  function groundAt(x, z) {
    const d = Math.hypot(x, z);
    if (d < RIM) return PEAK - 3 * (1 - d / RIM);
    const t = Math.max(0, 1 - (d - RIM) / (RAD - RIM));
    const gully = 0.9 * Math.sin(Math.atan2(z, x) * 9) * t * (1 - t) * 4;
    return PEAK * Math.pow(t, 1.35) + gully + 0.6 * Math.sin(x * 0.05) * Math.cos(z * 0.06);
  }
  CBZ.labGroundAt = groundAt;
  const N = 220, SZ = 520;
  const geo = new THREE.PlaneGeometry(SZ, SZ, N, N); geo.rotateX(-Math.PI / 2);
  const pp = geo.attributes.position;
  const col = new Float32Array(pp.count * 3);
  for (let i = 0; i < pp.count; i++) {
    const x = pp.getX(i), z = pp.getZ(i), y = groundAt(x, z);
    pp.setY(i, y);
    const t = Math.min(1, Math.max(0, (y - 6) / 30));
    col[i * 3] = 0.09 + 0.05 * (1 - t); col[i * 3 + 1] = 0.08 + 0.12 * (1 - t); col[i * 3 + 2] = 0.07 + 0.02 * (1 - t);
  }
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
  ground.receiveShadow = true; scene.add(ground);
  // a few houses, so lights and smoke have something to land on
  for (let i = 0; i < 8; i++) {
    const a = i * 0.8 + 0.3, d = 110 + (i % 3) * 18;
    const m = new THREE.Mesh(new THREE.BoxGeometry(8, 6, 10), new THREE.MeshStandardMaterial({ color: 0x9a8f80, roughness: 0.9 }));
    m.position.set(Math.cos(a) * d, groundAt(Math.cos(a) * d, Math.sin(a) * d) + 3, Math.sin(a) * d);
    m.castShadow = m.receiveShadow = true; scene.add(m);
  }
  function load(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.body.appendChild(s); }); }
  const errors = [];
  const ce = console.error; console.error = function () { errors.push([].slice.call(arguments).map(String).join(" ").slice(0, 400)); ce.apply(console, arguments); };
  window.addEventListener("error", (e) => errors.push("onerror: " + e.message));
  let clock = 0, frames = 0, running = Q.get("freeze") !== "1";
  const lab = window.__lab = { errors, ready: false, groundAt };
  const scn = Q.get("scene") || "all";
  function tick(dt) {
    clock += dt; frames++;
    const GP = CBZ.gpuParticles;
    if (lab.driver) lab.driver(dt, clock);
    for (const a of always) a.fn(dt);
  }
  lab.step = function (n, dt) { dt = dt || 1 / 60; for (let i = 0; i < n; i++) tick(dt); };
  lab.render = function () { const t0 = performance.now(); R.render(scene, cam); return performance.now() - t0; };
  lab.cam = function (x, y, z, ax, ay, az, fov) { cam.position.set(x, y, z); cam.lookAt(ax, ay, az); if (fov) { cam.fov = fov; } cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); };
  lab.cam(150, 40, 150, 0, 25, 0);
  (R.cbzReady || Promise.resolve()).then(async () => {
    await load("../../src/core/clusterlights.js?v=" + Date.now());
    await load("../../src/systems/gpufx.js?v=" + Date.now());
    await (R.cbzReady || Promise.resolve());
    await new Promise((r) => setTimeout(r, 50));
    const GP = CBZ.gpuParticles;
    GP.setGround(groundAt, 0, 0, 520, 256);
    for (let i = 0; i < 40; i++) GP.step(0);   // finish the bake
    lab.driver = makeDriver(scn);
    lab.ready = true;
    function loop() { if (running) { tick(1 / 60); R.render(scene, cam); } requestAnimationFrame(loop); }
    loop();
  });
  lab.freeze = function () { running = false; };

  function makeDriver(which) {
    const GP = CBZ.gpuParticles, CL = CBZ.clusterLights;
    let rockCd = 0, fireLights = [];
    const fires = [];
    for (let i = 0; i < 24; i++) {
      const a = i * 0.27 + 2.2, d = 92 + (i % 5) * 4;
      fires.push({ x: Math.cos(a) * d, z: Math.sin(a) * d });
    }
    if (which === "lights" || which === "all") {
      // a field of fires on the plain: 120 lights, every one of them real
      for (let i = 0; i < 120; i++) {
        const a = i * 2.39996, d = 95 + 60 * Math.sqrt((i + 0.5) / 120);
        const x = Math.cos(a) * d, z = Math.sin(a) * d;
        fireLights.push(CL.add({ x, y: groundAt(x, z) + 1.5, z, color: 0xff7a2a, intensity: 1.6, distance: 14, flicker: 0.8 }));
      }
    }
    return function (dt, t) {
      if (which === "volcano" || which === "all") {
        // the column the owner likes is the volume; here: the rockfall and its ash
        rockCd -= dt;
        if (rockCd <= 0) {
          rockCd = 0.18;
          const a = Math.random() * 6.283, sp = 6 + Math.random() * 10;
          GP.rock({ x: Math.cos(a) * 4, y: PEAK + 2, z: Math.sin(a) * 4, vx: Math.cos(a) * sp, vy: 6 + Math.random() * 8, vz: Math.sin(a) * sp,
            size: 0.4 + Math.random() * 1.3, temp: Math.random() < 0.6 ? 0.9 : 0.0, life: 25 });
        }
        GP.emit("smoke", { x: 0, y: PEAK + 2, z: 0, n: 6, r: 4, vy: 14, vr: 3, life: 9, size: 6, grow: 22, temp: 0.9, tone: 0.75 });
        GP.emit("spark", { x: 0, y: PEAK + 1, z: 0, n: 4, r: 2, vy: 22, vr: 9, life: 3, size: 0.25, temp: 1 });
      }
      if (which === "fire" || which === "all") {
        for (const f of fires) {
          const y = groundAt(f.x, f.z);
          GP.emit("fire", { x: f.x, y: y + 0.3, z: f.z, n: 2, r: 1.4, rUp: 0.2, vy: 1.5, vr: 0.6, life: 0.9, size: 1.6, temp: 1 });
          if (Math.random() < 0.5) GP.emit("smoke", { x: f.x, y: y + 2.5, z: f.z, n: 1, r: 1, vy: 2.5, life: 7, size: 2, grow: 9, temp: 0.5, tone: 0.55 });
          if (Math.random() < 0.15) GP.emit("spark", { x: f.x, y: y + 1, z: f.z, n: 1, r: 1, vy: 5, vr: 2, life: 2.5, size: 0.12, temp: 1, buoy: 3 });
          if (Math.random() < 0.08) GP.emit("ash", { x: f.x, y: y + 8, z: f.z, n: 1, r: 4, vy: 0.5, life: 6, size: 0.12, temp: 0 });
        }
      }
    };
  }
  lab.stats = function () {
    const ri = R.info && R.info.render ? R.info.render : {};
    return { frames, clock: +clock.toFixed(2), backend: R.cbzBackend, gp: CBZ.gpuParticles && CBZ.gpuParticles.stats(), cl: CBZ.clusterLights && CBZ.clusterLights.stats(),
      calls: ri.calls != null ? ri.calls : ri.drawCalls, errors: errors.slice(0, 20) };
  };
  setInterval(() => { const s = lab.stats(); document.getElementById("hud").textContent = JSON.stringify({ f: s.frames, be: s.backend, cms: s.gp && s.gp.computeMs, err: s.errors.length }); }, 500);
})();
</script>
</body></html>
