<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bomb Survivor B</title>
<!-- ============================================================
  BOMB SURVIVOR — B.

  Same game as bomb-survivor.html. A different bet about where the lines go.

  A carries seventeen script tags, its own character kit, its own aircraft
  primitives, its own HUD markup and its own explosion. Roughly 2,600 lines,
  most of them redrawing things Gang City already ships.

  B carries ONE tag. Every asset is asked for by name. What is left in this
  file is the part that is actually this game: who is on which side, what a
  bombing run is, what a runner does about it, and how the clock decides.

  The HUD is deliberately bare. Health top left, the clock, nothing else
  competing for the same glance.
============================================================ -->
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden;
    font:600 15px/1.35 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f2efe8;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #gate{position:fixed;inset:0;display:grid;place-items:center;padding:26px;z-index:60;
    background:radial-gradient(120% 90% at 50% 0%,#1b2330,#0b0d10 70%)}
  #gate .in{text-align:center;max-width:520px;width:100%}
  #gate h1{margin:0 0 6px;font-size:clamp(30px,9vw,54px);letter-spacing:-.02em;line-height:.95}
  #gate h1 em{font-style:normal;color:#ff7a45}
  #gate p{margin:0 0 26px;opacity:.62;letter-spacing:.1em;font-size:12px}
  #gate button{-webkit-appearance:none;appearance:none;border:0;cursor:pointer;width:100%;
    padding:20px;border-radius:16px;background:#4fbf6a;color:#07130b;font:800 20px/1 inherit;
    letter-spacing:.12em;box-shadow:0 6px 0 #2f8a4a}
  #gate button:active{transform:translateY(3px);box-shadow:0 3px 0 #2f8a4a}
  #gate .st{margin-top:20px;font-size:12px;letter-spacing:.14em;opacity:.45;min-height:16px}
  #side{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top,0px));transform:translateX(-50%);
    z-index:41;font-size:12px;letter-spacing:.2em;opacity:.75;pointer-events:none;text-align:center}
  #over{position:fixed;inset:0;display:none;place-items:center;z-index:62;background:rgba(9,11,14,.9);padding:26px}
  #over .in{text-align:center}
  #over h2{margin:0 0 14px;font-size:clamp(24px,7vw,40px)}
  #over table{margin:0 auto 22px;border-collapse:collapse;font-variant-numeric:tabular-nums}
  #over td{padding:6px 16px;opacity:.85}
  #over button{-webkit-appearance:none;appearance:none;border:1px solid rgba(255,255,255,.25);
    background:transparent;color:inherit;padding:14px 30px;border-radius:999px;font:700 15px/1 inherit;
    letter-spacing:.14em;cursor:pointer}
</style>
</head>
<body>

<div id="gate"><div class="in">
  <h1>BOMB <em>SURVIVOR</em></h1>
  <p>TEN MINUTES BOMBING. TEN MINUTES BOMBED.</p>
  <button id="go">PLAY</button>
  <div class="st" id="st"></div>
</div></div>

<div id="side"></div>

<div id="over"><div class="in">
  <h2 id="overTitle">RESULT</h2>
  <table id="overTable"></table>
  <button id="again">AGAIN</button>
</div></div>

<!-- ============ THE STUDIO IS ONE TAG ============================
  core/studio.js resolves the packs named below into the files and the
  ORDER measured to work, finds src/ from its own URL, and skips
  anything a page already lists by hand. Everything this game draws is
  something Gang City already draws.
============================================================ -->
<script src="../src/core/studio.js"></script>
<script>
CBZ.studio.need(
  "caps",      // be reachable: modeHas, worldActors, blast damage
  "green",     // instanced trees
  "people",    // the shipped 1.82 m rig, gait, poses
  "military",  // real jets, bombers, cargo, helis, tanks, trucks, the B-2
  "desert",    // 200 towers in a desert basin
  "airbase",   // runway, hangars, aircraft that sit on their wheels
  "air",       // flight with derived coefficients
  "ordnance",  // bombs and one shared ballistic integrator
  "damage",    // fireball, wall ruin, and the building-collapse verb
  "match"      // two sides, a clock, the half-time swap
).then(function () {
"use strict";
const CBZ = window.CBZ, THREE = window.THREE;
const el = function (id) { return document.getElementById(id); };
const st = function (t) { el("st").textContent = t; };

// ============================================================ THE RULES
const SQUAD = 8;             // per side
const HALVES = 2;
const HALF_SECONDS = 600;    // ten minutes each way
const PTS_KILL = 250;
const PTS_ALIVE = 0.4;       // per second, per living runner
const BOMB_ALT = 360;        // where a bombing run lives
const BOMB_SPEED = 170;
const RUN_SPEED = 6.2;
const STICK = 6;             // bombs per press

const TEAMS = [
  { id: "talon", name: "TALON", color: 0xff6a3d },
  { id: "ghost", name: "GHOST", color: 0x49c6ff },
];

let world = null, base = null, hud = null, match = null, cam = null;
let units = [], me = null, started = false, dead = false;
const tmp = new THREE.Vector3();

// ============================================================ BOOT
st("RAISING THE BASIN");
CBZ.micro.boot({
  fov: 72, far: 16000, exposure: 0.88,
  sky: { top: 0x2a6bb2, bottom: 0xe3c893, fogNear: 1200, fogFar: 9000, radius: 12000 },
  lights: { sun: 0.98, hemi: 0.46, shadowSpan: 700, groundColor: 0x8f7850 },
});
cam = CBZ.camera;

// BE REACHABLE. One call, and every shared verb in the engine can find these
// people: the blast, the vault, the ledge step, the wall breach. `units` is the
// roster this file already keeps and `hurt` is the same funnel the scoreboard
// reads, so the engine cannot kill somebody the score does not know about.
CBZ.studio.join({
  id: "bombsurvivor", label: "Bomb Survivor",
  actors: function (out) { for (let i = 0; i < units.length; i++) if (units[i].alive) out.push(units[i]); return out; },
  hurt: function (u, dmg, imp) { hurt(u, dmg, imp); return true; },
  hurtPlayer: function (dmg, x, z, cause) { if (!me || !me.alive) return false; hurt(me, dmg, { cause: cause }); return true; },
  route: "bomb survivor units + hurt()",
});

// THE WORLD, BY NAME. 200 towers, a park, shelters, dunes, an inland sea, salt
// flats, a mountain rim, and heightAt(x,z) as a pure function.
st("TWO HUNDRED TOWERS");
world = CBZ.studio.world("desert", { seed: "basincity" });
const groundAt = (world && world.heightAt) || function () { return 0; };

// THE BASE, in the dunes, runway pointed at the city so the first thing a
// takeoff sees is the target. atan2(x, z) because the airframe's nose is -Z.
st("A RUNWAY IN THE DUNES");
const BX = -(world.rings.city + 620), BZ = world.rings.city * 0.42;
base = CBZ.airbase.build({
  x: BX, z: BZ, heading: Math.atan2(-BX, -BZ), groundAt: groundAt, seed: "bs-base",
});

CBZ.ordnance.init({ scene: CBZ.scene, groundAt: groundAt });

// THE HUD. Health top left. The clock. Nothing else asking for the same
// glance. Everything below comes from the engine, including the rule that a
// touchscreen never gets shown a keyboard key.
hud = CBZ.studio.hud({ health: true, clock: true, score: false, feed: false, note: false });

// ============================================================ THE CAST
// Nobody here is drawn by this file. A runner is the shipped body, cast and
// dressed; a bomber is the shipped B-2 with the derived-coefficient airframe
// already attached to it.
function spawnUnit(rec, role, i) {
  const team = teamOf(rec.team);
  const u = {
    rec: rec, id: rec.id, team: rec.team, role: role, human: !!rec.human,
    alive: true, hp: 100, pos: new THREE.Vector3(), yaw: 0,
    group: null, af: null, tgt: null, cool: 0, aim: null,
  };
  if (role === "bomber") {
    const ring = world.rings.city + 900 + (i % 4) * 220;
    const a = (i / SQUAD) * Math.PI * 2 + (rec.team === TEAMS[0].id ? 0 : Math.PI);
    const x = Math.cos(a) * ring, z = Math.sin(a) * ring;
    const flown = CBZ.studio.fly("bomber", {
      at: { x: x, y: BOMB_ALT + (i % 3) * 40, z: z },
      heading: Math.atan2(x, z), speed: BOMB_SPEED, groundAt: groundAt,
    });
    if (flown) { u.group = flown.group; u.af = flown.af; }
    if (u.af) u.pos.copy(u.af.pos);
  } else {
    u.group = CBZ.studio.cast("runner", { color: team.color, variant: i });
    if (u.group) CBZ.scene.add(u.group);
    const a = (i / SQUAD) * Math.PI * 2, r = 180 + (i % 5) * 90;
    u.pos.set(Math.cos(a) * r, 0, Math.sin(a) * r);
    u.pos.y = groundAt(u.pos.x, u.pos.z);
  }
  // a bomber can be hurt by its own stick, which is the honest punishment for
  // pressing an attack below release altitude
  u.tgt = CBZ.ordnance.addTarget({
    pos: u.pos, team: u.team, unit: u,
    onDamage: function (dmg, info) { hurt(u, role === "bomber" ? dmg * 0.55 : dmg, info); },
  });
  units.push(u);
  return u;
}

function teamOf(id) { for (let i = 0; i < TEAMS.length; i++) if (TEAMS[i].id === id) return TEAMS[i]; return TEAMS[0]; }
function clearUnits() {
  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    if (u.tgt && CBZ.ordnance.removeTarget) CBZ.ordnance.removeTarget(u.tgt);
    if (u.group && u.group.parent) u.group.parent.remove(u.group);
    if (u.af && u.af.retire) u.af.retire();
  }
  units = [];
}

// ============================================================ DAMAGE
function hurt(u, dmg, info) {
  if (!u || !u.alive || !(dmg > 0)) return;
  u.hp -= dmg;
  if (u.hp > 0) return;
  u.alive = false;
  u.hp = 0;
  const killer = info && info.by ? unitById(info.by) : null;
  match.kill(u.rec, killer ? killer.rec : null, (info && info.crash) ? "CRASH" : "ORDNANCE");
  if (u.role === "runner") {
    const enemy = match.enemyOf(u.team);
    if (enemy) match.addScore(enemy.id, PTS_KILL, "kill");
    // the engine owns what a body coming apart looks like
    CBZ.studio.boom(u.pos, { radius: 6, power: 0.5, structural: false });
    if (u.group && u.group.parent) u.group.parent.remove(u.group);
  } else if (u.af) {
    CBZ.studio.boom(u.af.pos, { radius: 22, power: 1.4, structural: false });
  }
  if (u === me) { dead = true; hud.health(0); }
}
function unitById(id) { for (let i = 0; i < units.length; i++) if (units[i].id === id) return units[i]; return null; }

// ============================================================ THE MATCH
match = CBZ.teammatch.create({
  teams: TEAMS, roles: ["bomber", "runner"], halves: HALVES, halfSeconds: HALF_SECONDS,
  onHalfStart: function (half, m) {
    clearUnits();
    dead = false;
    const players = m.players;
    for (let i = 0; i < players.length; i++) {
      const p = players[i];
      const u = spawnUnit(p, m.roleOf(p.team), i % SQUAD);
      if (p.human) me = u;
    }
    el("side").textContent = me ? (me.role === "bomber" ? "YOU BOMB" : "YOU RUN") : "";
  },
  onEnd: function (result, m) { finish(result, m); },
});

for (let t = 0; t < TEAMS.length; t++) {
  for (let i = 0; i < SQUAD; i++) {
    match.addPlayer({
      id: TEAMS[t].id + i, name: TEAMS[t].name + " " + (i + 1),
      team: TEAMS[t].id, human: t === 0 && i === 0,
    });
  }
}

// ============================================================ A BOMBING RUN
// The one piece of maths this file owns, because it is the game: where a
// falling bomb lands. It asks the SHARED integrator, so the mark under the
// nose and the bomb that follows it cannot disagree.
function aimPoint(u) {
  if (!u.af) return null;
  const p = CBZ.ordnance.predict(u.af.pos, u.af.vel, "iron", 30);
  return p && p.pos ? p.pos : null;
}

function dropStick(u) {
  if (!u.af || u.cool > 0) return;
  u.cool = 2.2;
  CBZ.ordnance.stick({
    count: STICK, interval: 0.14, kind: "iron", team: u.team, by: u.id,
    getState: function () { return { pos: u.af.pos, vel: u.af.vel }; },
  });
}

// ============================================================ THE FRAME
let camYaw = 0, camPitch = -0.22;
CBZ.micro.onFrame(function (dt) {
  if (!started) return;
  match.step(dt);
  if (match.phase === "over") return;

  const IN = CBZ.micro.input, T = CBZ.micro.touch;
  const stick = (T && T.stick) || null;

  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    if (!u.alive) continue;
    if (u.role === "bomber") stepBomber(u, dt, u === me ? IN : null, u === me ? stick : null);
    else stepRunner(u, dt, u === me ? IN : null, u === me ? stick : null);
    if (u.role === "runner" && u.alive) {
      const enemy = match.enemyOf(u.team);
      if (enemy) match.addScore(enemy.id === u.team ? u.team : u.team, PTS_ALIVE * dt, "alive");
    }
  }

  CBZ.ordnance.step(dt);
  drive(dt);
  paint();
});

// The airframe steers toward a POINT, and holds its altitude separately —
// that split is why an aeroplane here cannot roll itself into the ground. A
// player turns by walking the aim point around; the AI puts it on the city.
const _aimV = new THREE.Vector3();
function stepBomber(u, dt, IN, stick) {
  if (!u.af) return;
  u.cool = Math.max(0, u.cool - dt);
  if (u.hdg == null) u.hdg = u.af.heading ? u.af.heading() : 0;

  if (IN) {
    let turn = IN.axis("KeyA", "KeyD");
    if (stick && stick.mag > 0.05) turn = stick.x;
    u.hdg += turn * 0.6 * dt;
    u.af.throttle = Math.max(0.25, Math.min(1, u.af.throttle + IN.axis("KeyS", "KeyW") * 0.5 * dt));
    if (IN.isDown("Space") || u.tapFire) { dropStick(u); u.tapFire = false; }
  } else {
    // AI: put the aim point on the city, and let go when the SHARED integrator
    // says the fall lands inside the built area. Nothing here models a bomb.
    u.hdg = Math.atan2(-u.af.pos.x, -u.af.pos.z);
    u.af.throttle = 0.78;
    const mark = aimPoint(u);
    if (mark && Math.hypot(mark.x, mark.z) < world.rings.city * 0.86) dropStick(u);
  }

  _aimV.set(u.af.pos.x + Math.sin(u.hdg) * 2200, BOMB_ALT, u.af.pos.z + Math.cos(u.hdg) * 2200);
  const aim = u.af.steerTo(_aimV, { gain: 2.0 });
  u.af.holdAltitude(BOMB_ALT, aim);
  u.af.step(dt, aim);
  u.pos.copy(u.af.pos);
  if (u.group) u.af.applyTo(u.group);
}

function stepRunner(u, dt, IN, stick) {
  let mx = 0, mz = 0;
  if (IN) {
    mx = IN.axis("KeyA", "KeyD");
    mz = IN.axis("KeyW", "KeyS");
    if (stick && (stick.x || stick.y)) { mx = stick.x; mz = stick.y; }
    const s = Math.hypot(mx, mz);
    if (s > 0.001) {
      const c = Math.cos(camYaw), sn = Math.sin(camYaw);
      const wx = mx * c - mz * sn, wz = mx * sn + mz * c;
      mx = wx / Math.max(1, s); mz = wz / Math.max(1, s);
    }
  } else {
    // AI: ordnance already publishes a danger field, so a runner samples it
    // in eight directions and walks down the gradient. Nothing here models a
    // bomb, a trajectory or a warning time.
    let best = 1e9, bx = 0, bz = 0;
    for (let a = 0; a < 8; a++) {
      const th = (a / 8) * Math.PI * 2;
      const sx = u.pos.x + Math.cos(th) * 14, sz = u.pos.z + Math.sin(th) * 14;
      const risk = CBZ.ordnance.dangerAt ? CBZ.ordnance.dangerAt(sx, sz, 8) : 0;
      const drift = Math.abs(th - u.yaw) * 0.02;      // prefer not to pirouette
      if (risk + drift < best) { best = risk + drift; bx = Math.cos(th); bz = Math.sin(th); }
    }
    mx = bx; mz = bz;
  }
  if (mx || mz) {
    const n = Math.hypot(mx, mz) || 1;
    u.pos.x += (mx / n) * RUN_SPEED * dt;
    u.pos.z += (mz / n) * RUN_SPEED * dt;
    u.yaw = Math.atan2(mx, mz);
    // the engine's own slide resolver, so a runner uses the city as cover
    // rather than walking through it. It corrects `pos` in place.
    if (CBZ.micro.resolveCircle) CBZ.micro.resolveCircle(u.pos, 0.55, u.pos.y, 1.8);
  }
  u.pos.y = groundAt(u.pos.x, u.pos.z);
  if (u.group) {
    u.group.position.copy(u.pos);
    u.group.rotation.y = u.yaw;
    if (CBZ.animChar) CBZ.animChar(u.group.userData.charRig, dt, { speed: (mx || mz) ? RUN_SPEED : 0 });
  }
}

function drive(dt) {
  const IN = CBZ.micro.input;
  camYaw -= IN.mx * (IN.sensitivity || 0.0022) * 60 * dt * 12;
  camPitch = Math.max(-1.2, Math.min(0.5, camPitch - IN.mz * (IN.sensitivity || 0.0022) * 60 * dt * 12));
  const look = (me && me.alive) ? me.pos : (units[0] ? units[0].pos : tmp.set(0, 40, 0));
  const back = (me && me.role === "bomber") ? 62 : 7.5;
  const up = (me && me.role === "bomber") ? 16 : 2.6;
  const yaw = (me && me.role === "bomber" && me.af) ? me.af.yaw + Math.PI : camYaw;
  cam.position.set(look.x - Math.sin(yaw) * back, look.y + up, look.z - Math.cos(yaw) * back);
  cam.lookAt(look.x, look.y + (me && me.role === "bomber" ? 0 : 1.5), look.z);
}

function paint() {
  if (me) hud.health(Math.max(0, me.hp) / 100);
  hud.clock(match.clock());
  if (dead && me) hud.clock(match.clock());
}

// ============================================================ START / END
function finish(result, m) {
  el("over").style.display = "grid";
  el("overTitle").textContent = result && result.winner ? (teamOf(result.winner).name + " TAKE IT") : "DRAW";
  const rows = m.standings();
  let h = "";
  for (let i = 0; i < rows.length; i++) h += "<tr><td>" + rows[i].name + "</td><td>" + Math.round(rows[i].total) + "</td></tr>";
  el("overTable").innerHTML = h;
}
el("again").addEventListener("click", function () { location.reload(); });

st("READY");
el("go").addEventListener("click", function () {
  el("gate").style.display = "none";
  started = true;
  match.start();
  if (!CBZ.studio.touchDevice && CBZ.micro.lock) CBZ.micro.lock();
});

// a probe surface, so the reuse claim can be checked rather than asserted
window.__bombB = {
  audit: function () {
    return {
      tags: document.querySelectorAll("script[src]").length,
      studio: CBZ.studio.audit(),
      caps: CBZ.modeHas ? {
        traverse: CBZ.modeHas("traverse"), blast: CBZ.modeHas("blast"),
        blastActors: CBZ.modeHas("blastActors"), breach: CBZ.modeHas("breach"),
      } : null,
      route: CBZ.modeCapsAudit ? CBZ.modeCapsAudit().routes[CBZ.game.mode] : null,
      colliders: (CBZ.colliders && CBZ.colliders.length) || 0,
      reuse: {
        people: !!CBZ.makeCharacter, gait: !!CBZ.animChar,
        aircraft: CBZ.airbase ? CBZ.airbase.usingReal && CBZ.airbase.usingReal() : null,
        models: CBZ.studio.models(),
        roles: CBZ.studio.roles(),
      },
      units: units.length, alive: units.filter(function (u) { return u.alive; }).length,
    };
  },
};
});
</script>
</body>
</html>
