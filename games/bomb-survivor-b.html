<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bomb Survivor B</title>
<!-- ============================================================
  BOMB SURVIVOR — B.

  Same game as bomb-survivor.html. A different bet about where the lines go.

  A carries seventeen script tags, its own character kit, its own aircraft
  primitives, its own HUD markup, its own camera and its own explosion.

  B carries ONE. Every asset, every instrument and every camera is asked for
  by name through core/studio.js. What is left in this file is the part that
  is actually this game: who is on which side, what a bombing run is, what a
  runner does about it, and what the clock decides.

  The HUD is deliberately bare. Health top left, the clock, the role. Nothing
  else competing for the same glance.
============================================================ -->
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden;
    font:600 15px/1.35 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f2efe8;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #gate{position:fixed;inset:0;display:grid;place-items:center;padding:26px;z-index:60;
    background:radial-gradient(120% 90% at 50% 0%,#1b2330,#0b0d10 70%)}
  #gate .in{text-align:center;max-width:480px;width:100%}
  #gate h1{margin:0 0 8px;font-size:clamp(32px,10vw,58px);letter-spacing:-.02em;line-height:.92}
  #gate h1 em{font-style:normal;color:#ff7a45}
  #gate p{margin:0 0 30px;opacity:.6;letter-spacing:.16em;font-size:11px}
  #gate button{-webkit-appearance:none;appearance:none;border:0;cursor:pointer;width:100%;
    padding:22px;border-radius:18px;background:#4fbf6a;color:#07130b;font:800 21px/1 inherit;
    letter-spacing:.14em;box-shadow:0 6px 0 #2f8a4a}
  #gate button:active{transform:translateY(3px);box-shadow:0 3px 0 #2f8a4a}
  #gate .st{margin-top:22px;font-size:11px;letter-spacing:.18em;opacity:.4;min-height:15px}
  #role{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);
    z-index:41;font-size:11px;letter-spacing:.28em;opacity:.7;pointer-events:none;white-space:nowrap}
  #streak{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    z-index:41;font-size:12px;letter-spacing:.22em;color:#ffc46a;opacity:0;transition:opacity .3s;pointer-events:none}
  #streak.on{opacity:.95}
  #swap{position:fixed;inset:0;display:grid;place-items:center;z-index:58;pointer-events:none;
    background:rgba(9,11,14,.82);opacity:0;transition:opacity .45s;font-size:clamp(26px,8vw,52px);
    letter-spacing:.06em;text-align:center;line-height:1.15}
  #swap.on{opacity:1}
  #swap small{display:block;font-size:12px;letter-spacing:.3em;opacity:.55;margin-top:14px}
  #radar{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));
    bottom:calc(14px + env(safe-area-inset-bottom,0px));width:132px;height:132px;z-index:41;
    opacity:.82;pointer-events:none;display:none}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:55;transition:opacity .5s}
  #over{position:fixed;inset:0;display:none;place-items:center;z-index:62;background:rgba(9,11,14,.92);padding:26px}
  #over .in{text-align:center}
  #over h2{margin:0 0 16px;font-size:clamp(26px,7vw,42px)}
  #over table{margin:0 auto 24px;border-collapse:collapse;font-variant-numeric:tabular-nums}
  #over td{padding:7px 18px;opacity:.85}
  #over button{-webkit-appearance:none;appearance:none;border:1px solid rgba(255,255,255,.25);
    background:transparent;color:inherit;padding:15px 32px;border-radius:999px;font:700 15px/1 inherit;
    letter-spacing:.16em;cursor:pointer}
</style>
</head>
<body>

<div id="gate"><div class="in">
  <h1>BOMB <em>SURVIVOR</em></h1>
  <p>TEN MINUTES BOMBING. TEN MINUTES BOMBED.</p>
  <button id="go">PLAY</button>
  <div class="st" id="st"></div>
</div></div>

<div id="role"></div>
<div id="swap"></div>
<div id="streak"></div>
<canvas id="radar" width="264" height="264"></canvas>
<div id="flash"></div>

<div id="over"><div class="in">
  <h2 id="overTitle">RESULT</h2>
  <table id="overTable"></table>
  <button id="again">AGAIN</button>
</div></div>

<!-- ============ THE STUDIO IS ONE TAG ============================
  core/studio.js resolves the packs below into the files and the ORDER
  measured to work, finds src/ from its own URL, and skips anything a
  page already lists by hand. Everything this game draws is something
  Gang City already draws.
============================================================ -->
<script src="../src/core/studio.js"></script>
<script>
CBZ.studio.need(
  "caps",      // be reachable: modeHas, worldActors, blast damage
  "green",     // instanced trees
  "people",    // the shipped 1.82 m rig, gait, poses
  "military",  // real jets, bombers, cargo, helis, tanks, trucks, the B-2
  "desert",    // 200 towers in a desert basin
  "airbase",   // runway, hangars, aircraft that sit on their wheels
  "air",       // flight with derived coefficients
  "ordnance",  // bombs and one shared ballistic integrator
  "damage",    // fireball, wall ruin, and the building-collapse verb
  "nukefx",    // the researched mushroom
  "radar",     // PPI scope
  "match"      // two sides, a clock, the half-time swap
).then(function () {
"use strict";
const CBZ = window.CBZ, THREE = window.THREE;
const el = function (id) { return document.getElementById(id); };
const st = function (t) { const n = el("st"); if (n) n.textContent = t; };

// ============================================================ THE RULES
const SQUAD        = 8;        // per side
const HALVES       = 2;
const HALF_SECONDS = 600;      // ten minutes each way
const PTS_KILL     = 250;
const PTS_ALIVE    = 0.4;      // per second, per living runner
const BOMB_ALT     = 360;      // where a bombing run lives
const RUN_SPEED    = 6.4;
const STICK        = 7;        // stores per press
const RELEASE_MIN  = 120;      // press below this and the stick is yours
const NUKE_ARM     = 6;        // runner kills that earn the one round
const RESPAWN_AIR  = 9;

const TEAMS = [
  { id: "talon", name: "TALON", color: 0xff6a3d },
  { id: "ghost", name: "GHOST", color: 0x49c6ff },
];

let world, base, hud, match, cam, chase, sight, scope, ctl, eng;
let units = [], me = null, started = false, groundAt = function () { return 0; };
const nuke = { kills: 0, armed: false, spent: false };
const _v = new THREE.Vector3();

// ============================================================ BOOT
st("RAISING THE BASIN");
CBZ.micro.boot({
  fov: 74, far: 16000, exposure: 0.88,
  sky: { top: 0x2a6bb2, bottom: 0xe3c893, fogNear: 1200, fogFar: 9000, radius: 12000 },
  lights: { sun: 0.98, hemi: 0.46, shadowSpan: 700, groundColor: 0x8f7850 },
});
cam = CBZ.camera;

// BE REACHABLE. One call, and every shared verb in the engine can find these
// people: the blast, the vault, the ledge step, the wall breach. `units` is the
// roster this file already keeps and `hurt` is the funnel the scoreboard reads,
// so the engine cannot kill somebody the score does not hear about.
CBZ.studio.join({
  id: "bombsurvivor", label: "Bomb Survivor",
  actors: function (out) { for (let i = 0; i < units.length; i++) if (units[i].alive) out.push(units[i]); return out; },
  hurt: function (u, dmg, imp) { hurt(u, dmg, imp); return true; },
  hurtPlayer: function (dmg, x, z, cause) { if (!me || !me.alive) return false; hurt(me, dmg, { cause: cause }); return true; },
  route: "bomb survivor units + hurt()",
});

// THE WORLD, BY NAME. 200 towers, a park, shelters, dunes, an inland sea, salt
// flats, a mountain rim, and heightAt(x,z) as a pure function.
st("TWO HUNDRED TOWERS");
world = CBZ.studio.world("desert", { seed: "basincity" });
groundAt = (world && world.heightAt) || groundAt;

// THE BASE, in the dunes, runway pointed at the city so the first thing a
// takeoff sees is the target. The airframe's nose is -Z, so a heading that
// flies from (x,z) toward the origin is atan2(-x, -z) and not a compass bearing.
st("A RUNWAY IN THE DUNES");
const BX = -(world.rings.city + 640), BZ = world.rings.city * 0.42;
base = CBZ.airbase.build({ x: BX, z: BZ, heading: Math.atan2(-BX, -BZ), groundAt: groundAt, seed: "bs-base" });

CBZ.ordnance.init({ scene: CBZ.scene, groundAt: groundAt });

// EVERY INSTRUMENT COMES FROM THE ENGINE.
hud   = CBZ.studio.hud({ health: true, clock: true, score: false, feed: false, note: false });
chase = CBZ.studio.chase({ groundAt: groundAt, camera: cam });
sight = CBZ.studio.bombsight({ kind: "iron", outer: 9 });
ctl   = CBZ.studio.controls("fly", { buttons: { fire: "DROP", nuke: "NUKE" } });
eng   = CBZ.studio.engineSound({ vRef: 260, earshot: 300 });
scope = CBZ.radar.create({
  canvas: el("radar"), range: 3000, label: "AIR",
  self: function () {
    if (!me) return { x: 0, z: 0, y: 0, heading: 0 };
    return { x: me.pos.x, z: me.pos.z, y: me.pos.y, heading: me.af ? me.af.heading() : me.yaw };
  },
  contacts: function () {
    const out = [];
    if (!me) return out;
    for (let i = 0; i < units.length; i++) {
      const u = units[i];
      if (!u.alive || u === me) continue;
      out.push({ id: u.id, x: u.pos.x, z: u.pos.z, y: u.pos.y, hostile: u.team !== me.team });
    }
    return out;
  },
});

// THE CITY IS INHABITED. Forty neutral bodies on the streets, asked for by
// name — they are not scored and not targets, they are the reason a city reads
// as a city from 360 m up. One call, and the engine casts and dresses them.
const locals = CBZ.studio.crowd(40, "civilian", {
  at: function (i) {
    const a = (i / 40) * Math.PI * 2 * 3.7, r = 90 + (i % 9) * 96;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    return { x: x, z: z, y: groundAt(x, z) };
  },
});
for (let i = 0; i < locals.length; i++) locals[i].rotation.y = i * 1.7;

// ============================================================ THE CAST
// Nobody here is drawn by this file. A runner is the shipped body, cast and
// dressed. A bomber is the shipped B-2 with the derived-coefficient airframe
// attached, and it starts ON THE RUNWAY because taxiing 1.8 km is not the game.
function spawnUnit(rec, role, i) {
  const team = teamOf(rec.team);
  const u = {
    rec: rec, id: rec.id, team: rec.team, role: role, human: !!rec.human,
    alive: true, hp: 100, pos: new THREE.Vector3(), yaw: 0, hdg: 0,
    group: null, af: null, tgt: null, cool: 0, respawnIn: 0, rolling: false,
  };
  if (role === "bomber") {
    const flown = CBZ.studio.fly("bomber", { groundAt: groundAt });
    if (flown) { u.group = flown.group; u.af = flown.af; }
    if (u.human && u.af) {
      // rolling start on the threshold. airHeading, not heading: airbase.js
      // publishes both because the base and the airframe disagree about which
      // way a nose points.
      const rw = base.runway;
      u.af.place(rw.startX, base.y + (u.af.spec.gearHeight || 3.4), rw.startZ, rw.airHeading, 0);
      u.af.throttle = 1;
      u.rolling = true;
      u.hdg = rw.airHeading;
    } else if (u.af) {
      const a = (i / SQUAD) * Math.PI * 2 + (rec.team === TEAMS[1].id ? Math.PI : 0);
      const r = world.rings.city + 900 + (i % 4) * 240;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      u.hdg = Math.atan2(-x, -z);
      u.af.launch(x, BOMB_ALT + (i % 3) * 45, z, u.hdg, 168);
    }
    if (u.af) u.pos.copy(u.af.pos);
    u.trail = CBZ.studio.trail({ length: 70, color: team.color, opacity: 0.4, minStep: 22 });
  } else {
    u.group = CBZ.studio.cast("runner", { color: team.color, variant: i });
    if (u.group) CBZ.scene.add(u.group);
    const a = (i / SQUAD) * Math.PI * 2 + (rec.team === TEAMS[1].id ? 0.4 : 0);
    const r = 190 + (i % 5) * 95;
    u.pos.set(Math.cos(a) * r, 0, Math.sin(a) * r);
    u.pos.y = groundAt(u.pos.x, u.pos.z);
  }
  // a bomber can be hurt by its own stick, which is the honest punishment for
  // pressing the attack below release altitude
  u.tgt = CBZ.ordnance.addTarget({
    pos: u.pos, team: u.team, unit: u,
    onDamage: function (dmg, info) { hurt(u, role === "bomber" ? dmg * 0.55 : dmg, info); },
  });
  units.push(u);
  return u;
}

function teamOf(id) { for (let i = 0; i < TEAMS.length; i++) if (TEAMS[i].id === id) return TEAMS[i]; return TEAMS[0]; }
function unitById(id) { for (let i = 0; i < units.length; i++) if (units[i].id === id) return units[i]; return null; }
function clearUnits() {
  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    if (u.tgt && CBZ.ordnance.removeTarget) CBZ.ordnance.removeTarget(u.tgt);
    if (u.group && u.group.parent) u.group.parent.remove(u.group);
    if (u.af && u.af.dispose) u.af.dispose();
    if (u.trail) u.trail.dispose();
  }
  units = [];
  me = null;
}

// ============================================================ DAMAGE
function hurt(u, dmg, info) {
  if (!u || !u.alive || !(dmg > 0)) return;
  u.hp -= dmg;
  if (u === me && CBZ.micro.shake) CBZ.micro.shake(Math.min(1, dmg / 80));
  if (u.hp > 0) return;
  u.alive = false; u.hp = 0;
  const killer = info && info.by ? unitById(info.by) : null;
  // A CRASH IS NOT A KILL. The feed prints the cause when nobody is credited,
  // so an airframe meeting the ground has to say so rather than blame a weapon.
  match.kill(u.rec, killer ? killer.rec : null, (info && info.crash) ? "CRASH" : "ORDNANCE");

  if (u.role === "runner") {
    const enemy = match.enemyOf(u.team);
    if (enemy) match.addScore(enemy.id, PTS_KILL, "kill");
    if (killer === me) earnKill();
    CBZ.studio.boom(u.pos, { radius: 5, power: 0.45, structural: false });
    if (u.group && u.group.parent) u.group.parent.remove(u.group);
    if (u === me) hud.health(0);
  } else {
    if (u.af) CBZ.studio.boom(u.af.pos, { radius: 22, power: 1.5, structural: false });
    if (u.group) u.group.visible = false;
    if (u.trail) u.trail.cut();
    u.respawnIn = RESPAWN_AIR;      // pressure that stops when you die is not pressure
  }
}

// ============================================================ THE MATCH
match = CBZ.teammatch.create({
  teams: TEAMS, roles: ["bomber", "runner"], halves: HALVES, halfSeconds: HALF_SECONDS,
  onHalfStart: function (half, m) {
    clearUnits();
    nuke.kills = 0; nuke.armed = false; nuke.spent = false;
    const players = m.players;
    for (let i = 0; i < players.length; i++) {
      const p = players[i];
      const u = spawnUnit(p, m.roleOf(p.team), i % SQUAD);
      if (p.human) me = u;
    }
    if (chase) chase.reset();
    el("radar").style.display = (me && me.role === "bomber") ? "block" : "none";
    setRole();
    if (me) showSwap(half);
  },
  onEnd: function (result, m) { finish(result, m); },
});

for (let t = 0; t < TEAMS.length; t++) {
  for (let i = 0; i < SQUAD; i++) {
    match.addPlayer({
      id: TEAMS[t].id + i, name: TEAMS[t].name + " " + (i + 1),
      team: TEAMS[t].id, human: t === 0 && i === 0,
    });
  }
}

let swapT = 0;
function showSwap(half) {
  const n = el("swap");
  n.innerHTML = (me.role === "bomber" ? "YOU BOMB" : "YOU RUN") +
    "<small>HALF " + (half + 1) + " OF " + HALVES + "</small>";
  n.classList.add("on");
  swapT = 2.4;
}

function setRole() {
  if (!me) { el("role").textContent = ""; return; }
  el("role").textContent = me.role === "bomber"
    ? (me.rolling ? "FULL POWER · ROLL" : "YOU BOMB")
    : "YOU RUN";
}

// ============================================================ A BOMBING RUN
function dropStick(u) {
  if (!u.af || u.cool > 0) return;
  const agl = u.af.pos.y - groundAt(u.af.pos.x, u.af.pos.z);
  if (agl < RELEASE_MIN && u.human) {
    // the stick will find you, and that is the whole of the lesson
    if (CBZ.micro.sfx) CBZ.micro.sfx.tone(140, 0.18, { type: "square", gain: 0.16 });
  }
  u.cool = 2.4;
  CBZ.ordnance.stick({
    count: STICK, interval: 0.13, kind: "iron", team: u.team, owner: u.id, by: u.id,
    getState: function () { return u.alive && u.af ? { pos: u.af.pos, vel: u.af.vel } : null; },
    onDetonate: onStoreLands,
  });
}

// A STORE THAT LANDS ON A BUILDING TAKES THE BUILDING DOWN. The verb is
// city/crashfx.js's cityAirstrikeCollapse, which stopped asking which scenario
// was running, and it resolves its own face out of CBZ.colliders — which
// microboot now publishes under the name the engine reads. Nothing about a
// collapsing tower is written in this file.
function onStoreLands(b) {
  if (!b || !b.impact) return;
  CBZ.studio.boom(b.impact, { radius: b.radius, power: b.power, by: b.owner, structural: true });
}

function fireNuke(u) {
  if (!u || !u.af || !nuke.armed || nuke.spent) return;
  nuke.spent = true; nuke.armed = false;
  CBZ.ordnance.release({
    pos: u.af.pos, vel: u.af.vel, kind: "nuke", team: u.team, owner: u.id,
    onDetonate: function (b) {
      const f = el("flash");
      f.style.transition = "none"; f.style.opacity = "1";
      setTimeout(function () { f.style.transition = "opacity 2.4s"; f.style.opacity = "0"; }, 90);
      if (CBZ.cityNukeFX) { try { CBZ.cityNukeFX(b.impact.x, b.impact.y, b.impact.z, {}); } catch (e) {} }
      CBZ.studio.boom(b.impact, { radius: b.radius, power: b.power, by: u.id, structural: true, earshot: 4000 });
    },
  });
  streak("ROUND AWAY");
}

function earnKill() {
  if (nuke.spent) return;
  nuke.kills++;
  if (nuke.kills >= NUKE_ARM && !nuke.armed) { nuke.armed = true; streak("NUKE ARMED"); }
  else streak(nuke.kills + " OF " + NUKE_ARM);
}
let streakT = 0;
function streak(t) { el("streak").textContent = t; el("streak").classList.add("on"); streakT = 2.6; }

// ============================================================ THE FRAME
CBZ.micro.onFrame(function (dt) {
  if (!started) return;
  match.step(dt);
  if (streakT > 0 && (streakT -= dt) <= 0) el("streak").classList.remove("on");
  if (swapT > 0 && (swapT -= dt) <= 0) el("swap").classList.remove("on");
  if (match.phase === "over") return;

  ctl.step(dt);

  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    if (!u.alive) {
      if (u.role === "bomber" && (u.respawnIn -= dt) <= 0) reflight(u);
      continue;
    }
    if (u.role === "bomber") stepBomber(u, dt, u === me);
    else {
      stepRunner(u, dt, u === me);
      const own = match.team(u.team);
      if (own) match.addScore(u.team, PTS_ALIVE * dt, "alive");
    }
  }

  CBZ.ordnance.step(dt);

  // WHAT YOU HEAR IS WHAT IS HAPPENING TO YOU. A bomber hears its own machine;
  // a runner hears the interval between warnings shorten as a stick closes.
  if (me && me.alive && eng) {
    if (me.role === "bomber" && me.af) eng.set(me.af.throttle, me.af.speed, 0);
    else {
      eng.set(0, 0, 400);
      const risk = CBZ.ordnance.dangerAt ? CBZ.ordnance.dangerAt(me.pos.x, me.pos.z, 10) : 0;
      CBZ.studio.alarm(risk);
    }
  }

  aimAndFollow(dt);
  hud.clock(match.clock());
  if (me) hud.health(Math.max(0, me.hp) / 100);
  if (scope && me && me.role === "bomber") scope.draw(dt);
});

function reflight(u) {
  u.alive = true; u.hp = 100; u.respawnIn = 0;
  if (u.group) u.group.visible = true;
  const a = Math.random() * Math.PI * 2;
  const r = world.rings.city + 1100;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  u.hdg = Math.atan2(-x, -z);
  if (u.af) u.af.launch(x, BOMB_ALT, z, u.hdg, 168);
  if (u === me) setRole();
}

// The airframe steers toward a POINT and holds its altitude separately. That
// split is why an aeroplane here cannot roll itself into the ground: the
// autopilot commands bank ANGLE, never bank rate.
function stepBomber(u, dt, mine) {
  if (!u.af) return;
  u.cool = Math.max(0, u.cool - dt);

  if (u.rolling) {
    // takeoff: hold the centreline, let the elevator bite at rotate speed
    u.af.throttle = 1;
    const aim = u.af.steerTo(_v.set(
      u.af.pos.x + Math.sin(u.hdg) * 3000, base.y + 4, u.af.pos.z + Math.cos(u.hdg) * 3000), { gain: 3.2 });
    u.af.step(dt, aim);
    u.pos.copy(u.af.pos);
    if (u.group) u.af.applyTo(u.group);
    if (u.af.pos.y - groundAt(u.af.pos.x, u.af.pos.z) > 45) { u.rolling = false; if (mine) setRole(); }
    return;
  }

  if (mine) {
    u.hdg += ctl.move.x * 0.55 * dt;
    u.af.throttle = Math.max(0.25, ctl.throttle);
    if (ctl.tapped("fire")) dropStick(u);
    if (ctl.tapped("nuke")) fireNuke(u);
  } else {
    // AI: put the run on the city, and let go when the SHARED integrator says
    // the fall lands inside the built area. Nothing here models a bomb.
    u.hdg = Math.atan2(-u.af.pos.x, -u.af.pos.z);
    u.af.throttle = 0.8;
    const p = CBZ.ordnance.predict(u.af.pos, u.af.vel, "iron", 40);
    if (p && Math.hypot(p.x, p.z) < world.rings.city * 0.88) dropStick(u);
  }

  _v.set(u.af.pos.x + Math.sin(u.hdg) * 2400, BOMB_ALT, u.af.pos.z + Math.cos(u.hdg) * 2400);
  const aim = u.af.steerTo(_v, { gain: 2.0 });
  u.af.holdAltitude(BOMB_ALT, aim);
  u.af.step(dt, aim);
  u.pos.copy(u.af.pos);
  if (u.group) u.af.applyTo(u.group);
  if (u.trail && !u.rolling) u.trail.push(u.af.pos);
}

function stepRunner(u, dt, mine) {
  let mx = 0, mz = 0;
  if (mine) {
    mx = ctl.move.x; mz = -ctl.move.y;
    const s = Math.hypot(mx, mz);
    if (s > 0.01) {
      // move relative to where the camera is looking, which is the only
      // third-person control scheme anybody finds natural
      const c = Math.cos(u.camYaw || 0), sn = Math.sin(u.camYaw || 0);
      const wx = mx * c + mz * sn, wz = -mx * sn + mz * c;
      mx = wx; mz = wz;
    }
    u.camYaw = (u.camYaw || 0) + ctl.look.x * 60 * dt;
  } else {
    // ordnance already publishes a danger field, so a runner samples it in
    // eight directions and walks down the gradient. Nothing here models a
    // bomb, a trajectory or a warning time.
    let best = 1e9, bx = Math.cos(u.yaw), bz = Math.sin(u.yaw);
    // a shelter is a LID, and ordnance already knows what a lid is worth — the
    // roof test is its own. So under fire, run for one; otherwise drift.
    const here = CBZ.ordnance.dangerAt ? CBZ.ordnance.dangerAt(u.pos.x, u.pos.z, 10) : 0;
    const lid = here > 0.05 ? nearestShelter(u.pos) : null;
    for (let a = 0; a < 8; a++) {
      const th = (a / 8) * Math.PI * 2;
      const cx = Math.cos(th), cz = Math.sin(th);
      const sx = u.pos.x + cx * 16, sz = u.pos.z + cz * 16;
      let cost = CBZ.ordnance.dangerAt ? CBZ.ordnance.dangerAt(sx, sz, 10) : 0;
      cost += Math.abs(Math.atan2(Math.sin(th - u.yaw), Math.cos(th - u.yaw))) * 0.03;
      if (lid) {
        const dx = lid.x - u.pos.x, dz = lid.z - u.pos.z, n2 = Math.hypot(dx, dz) || 1;
        cost -= (cx * dx / n2 + cz * dz / n2) * 0.5;      // pull toward the lid
      }
      if (cost < best) { best = cost; bx = cx; bz = cz; }
    }
    mx = bx; mz = bz;
  }
  const n = Math.hypot(mx, mz);
  if (n > 0.01) {
    u.pos.x += (mx / n) * RUN_SPEED * dt;
    u.pos.z += (mz / n) * RUN_SPEED * dt;
    u.yaw = Math.atan2(mx, mz);
    // the engine's own slide resolver, so a runner uses the city as cover
    // rather than walking through it. It corrects `pos` in place.
    if (CBZ.micro.resolveCircle) CBZ.micro.resolveCircle(u.pos, 0.55, u.pos.y, 1.8);
  }
  u.pos.y = groundAt(u.pos.x, u.pos.z);
  if (u.group) {
    u.group.position.copy(u.pos);
    u.group.rotation.y = u.yaw;
    if (CBZ.animChar && u.group.userData.charRig) {
      try { CBZ.animChar(u.group.userData.charRig, dt, { speed: n > 0.01 ? RUN_SPEED : 0 }); } catch (e) {}
    }
  }
}

const _sh = new THREE.Vector3();
function nearestShelter(p) {
  const list = (world && world.shelters) || null;
  if (!list || !list.length) return null;
  let best = null, bd = 1e18;
  for (let i = 0; i < list.length; i++) {
    const s = list[i];
    const sx = s.x != null ? s.x : (s.pos ? s.pos.x : 0);
    const sz = s.z != null ? s.z : (s.pos ? s.pos.z : 0);
    const d = (sx - p.x) * (sx - p.x) + (sz - p.z) * (sz - p.z);
    if (d < bd) { bd = d; best = _sh.set(sx, 0, sz); }
  }
  return best;
}

function aimAndFollow(dt) {
  // spectate the nearest living friend rather than a black screen
  let look = me;
  if (!look || !look.alive) {
    for (let i = 0; i < units.length; i++) if (units[i].alive && (!me || units[i].team === me.team)) { look = units[i]; break; }
  }
  if (!look) return;
  const air = look.role === "bomber";
  if (air && look.af) {
    chase.follow(look.af.pos, look.af.heading(), dt, { air: true, back: look.rolling ? 34 : 66, up: look.rolling ? 9 : 18 });
    if (look === me && !look.rolling) sight.aim(look.af.pos, look.af.vel); else sight.hide();
  } else {
    chase.follow(look.pos, look.camYaw || look.yaw, dt, { air: false });
    sight.hide();
  }
}

// ============================================================ START / END
function finish(result, m) {
  el("over").style.display = "grid";
  el("overTitle").textContent = result && result.winner ? (teamOf(result.winner).name + " TAKE IT") : "DRAW";
  const rows = m.standings();
  let h = "";
  for (let i = 0; i < rows.length; i++) h += "<tr><td>" + rows[i].name + "</td><td>" + Math.round(rows[i].total) + "</td></tr>";
  el("overTable").innerHTML = h;
  if (scope) el("radar").style.display = "none";
}
el("again").addEventListener("click", function () { location.reload(); });

st("READY");
el("go").addEventListener("click", function () {
  el("gate").style.display = "none";
  started = true;
  match.start();
  ctl.lock();
});

// a probe surface, so the reuse claim can be checked rather than asserted
window.__bombB = {
  audit: function () {
    return {
      tags: document.querySelectorAll("script[src]").length,
      studio: CBZ.studio.audit(),
      caps: CBZ.modeHas ? {
        traverse: CBZ.modeHas("traverse"), blast: CBZ.modeHas("blast"),
        blastActors: CBZ.modeHas("blastActors"), breach: CBZ.modeHas("breach"),
      } : null,
      route: CBZ.modeCapsAudit ? CBZ.modeCapsAudit().routes[CBZ.game.mode] : null,
      colliders: (CBZ.colliders && CBZ.colliders.length) || 0,
      structural: !!CBZ.cityAirstrikeCollapse,
      reuse: {
        people: !!CBZ.makeCharacter, gait: !!CBZ.animChar,
        aircraft: CBZ.airbase.usingReal ? CBZ.airbase.usingReal() : null,
        models: CBZ.studio.models(), roles: CBZ.studio.roles(),
        sight: !!(sight && sight.ok), scope: !!scope, touch: ctl.touch,
      },
      units: units.length, alive: units.filter(function (u) { return u.alive; }).length,
      nuke: { kills: nuke.kills, armed: nuke.armed, spent: nuke.spent },
    };
  },
};
});
