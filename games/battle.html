<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="data:,">
<title>NPC War</title>
<!-- ============================================================
  NPC WAR — a battle you WATCH.

  Two armies of Gang City's own people, any size, any gun in the armoury,
  fighting each other with the engine's own combat brain while you fly a
  camera around it and turn the clock up.

  Nothing violent here is drawn by this file. The men are studio.cast. The
  guns in their hands are weapons/appearances via systems/actorweapons.js.
  HOW they fight is systems/combat_iq.js — the same fire tokens, cover
  breaks, flanking arcs, suppression and per-training accuracy the city
  runs. Tracers, muzzle flashes, impacts and the pocked walls afterwards
  are systems/gunfx.js. Dead men sprawl through CBZ.deathPose and their
  rifles fall through CBZ.weaponPhysics and clatter on the real ground.
  Rockets detonate through studio.boom, so they hurt both sides and bring
  the towers down through the same collapse chain a bomber uses.

  What IS this file: who is on which side, the spectator cameras, the sim
  clock (pause, quarter speed, up to eight times), and the benchmark that
  answers "how many can this machine actually show" by measuring instead
  of guessing. There is NO cap on team size anywhere in this page — the
  input takes what you type and the frame rate tells you the truth.
============================================================ -->
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden;
    font:600 15px/1.35 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f2efe8;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  button{font:inherit;color:inherit}

  /* ---- the war room (setup) ---- */
  #menu{position:fixed;inset:0;z-index:60;overflow:auto;
    background:radial-gradient(130% 100% at 50% 0%,#1c2431,#0b0d10 72%);padding:20px 16px 40px}
  #menu .in{max-width:760px;margin:0 auto}
  #menu h1{margin:6px 0 2px;font-size:clamp(30px,8vw,52px);letter-spacing:-.02em;line-height:.94}
  #menu h1 em{font-style:normal;color:#ff7a45}
  #menu .sub{margin:0 0 18px;opacity:.55;letter-spacing:.18em;font-size:11px}
  .lbl{font-size:11px;letter-spacing:.22em;opacity:.6;margin:18px 0 8px}
  .maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .maps button{appearance:none;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.04);
    padding:13px 12px;text-align:left;cursor:pointer}
  .maps button b{display:block;font-size:14px;letter-spacing:.08em}
  .maps button i{display:block;font-style:normal;font-size:11px;opacity:.55;margin-top:4px}
  .maps button.on{border-color:#ff7a45;background:rgba(255,122,69,.12)}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){.teams{grid-template-columns:1fr}}
  .team{border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px}
  .team.red{box-shadow:inset 3px 0 0 #ff5a3d}
  .team.blue{box-shadow:inset 3px 0 0 #3fa8ff}
  .team h3{margin:0 0 10px;font-size:13px;letter-spacing:.22em}
  .team .cnt{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .team .cnt button{appearance:none;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);
    border-radius:10px;width:44px;height:44px;font-size:18px;cursor:pointer;flex:none}
  .team input[type=number]{appearance:none;-moz-appearance:textfield;width:100%;min-width:0;height:44px;border-radius:10px;
    border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:inherit;font:700 19px/1 inherit;
    text-align:center;letter-spacing:.06em}
  .team input::-webkit-inner-spin-button{display:none}
  .team select{width:100%;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.3);color:inherit;font:600 14px/1 inherit;padding:0 10px;margin-bottom:8px}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .presets button{appearance:none;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);
    border-radius:999px;padding:9px 14px;font-size:12px;letter-spacing:.1em;cursor:pointer}
  #start{appearance:none;border:0;cursor:pointer;width:100%;margin-top:20px;
    padding:20px;border-radius:18px;background:#4fbf6a;color:#07130b;font:800 20px/1 inherit;
    letter-spacing:.14em;box-shadow:0 6px 0 #2f8a4a}
  #start:active{transform:translateY(3px);box-shadow:0 3px 0 #2f8a4a}
  #bench{appearance:none;cursor:pointer;width:100%;margin-top:10px;padding:14px;border-radius:14px;
    border:1px solid rgba(255,255,255,.22);background:transparent;font:700 14px/1 inherit;letter-spacing:.14em}
  #maxline{margin-top:10px;font-size:11px;letter-spacing:.16em;opacity:.5;text-align:center;min-height:14px}
  #bootst{margin-top:14px;font-size:11px;letter-spacing:.2em;opacity:.45;text-align:center;min-height:14px}
  #boottrack{margin:8px auto 0;max-width:280px;height:2px;border-radius:2px;background:rgba(255,255,255,.1)}
  #bootbar{height:100%;width:0;border-radius:2px;background:#4fbf6a;transition:width .18s linear}
  #boottrack.done{opacity:0;transition:opacity .5s}

  /* ---- battle chrome ---- */
  #top{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);
    z-index:41;display:none;align-items:center;gap:12px;padding:8px 14px;border-radius:999px;
    background:rgba(12,14,17,.55);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);
    font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap}
  #top .r{color:#ff8a70;font-weight:800}
  #top .b{color:#7cc4ff;font-weight:800}
  #top .bar{width:min(17vw,110px);height:7px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
  #top .bar s{display:block;height:100%}
  #top .bar.rr s{background:#ff5a3d}
  #top .bar.bb s{background:#3fa8ff;margin-left:auto}
  #top .mid{font-size:12px;opacity:.85;letter-spacing:.08em;text-align:center;min-width:86px}
  #top .mid small{display:block;font-size:10px;opacity:.6;letter-spacing:.2em}
  #ctl{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    z-index:42;display:none;gap:7px;align-items:center}
  #ctl button{appearance:none;border:1px solid rgba(255,255,255,.2);background:rgba(12,14,17,.6);
    backdrop-filter:blur(6px);border-radius:12px;min-width:46px;height:44px;padding:0 12px;cursor:pointer;
    font:700 13px/1 inherit;letter-spacing:.06em}
  #ctl button.on{background:rgba(255,122,69,.28);border-color:#ff7a45}
  body.coarse #ctl button{min-width:52px;height:52px}
  #banner{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:44;pointer-events:none;
    font-size:clamp(20px,5.4vw,38px);letter-spacing:.1em;text-align:center;opacity:0;transition:opacity .4s;
    text-shadow:0 2px 12px rgba(0,0,0,.8);white-space:nowrap}
  #banner.on{opacity:.96}
  #banner small{display:block;font-size:12px;letter-spacing:.3em;opacity:.6;margin-top:8px}
  #end{position:fixed;inset:0;display:none;place-items:center;z-index:62;background:rgba(9,11,14,.9);padding:26px}
  #end .in{text-align:center;max-width:440px;width:100%}
  #end h2{margin:0 0 14px;font-size:clamp(26px,7vw,42px)}
  #end table{margin:0 auto 22px;border-collapse:collapse;font-variant-numeric:tabular-nums}
  #end td{padding:6px 16px;opacity:.85;text-align:left}
  #end td+td{text-align:right}
  #end .row{display:flex;gap:10px}
  #end button{appearance:none;border:1px solid rgba(255,255,255,.25);background:transparent;color:inherit;
    flex:1;padding:15px 10px;border-radius:999px;font:700 14px/1 inherit;letter-spacing:.14em;cursor:pointer}
  #end button.big{background:#4fbf6a;border:0;color:#07130b}
  #nflash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:55}
  #hint{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
    z-index:41;font-size:10px;letter-spacing:.14em;opacity:.45;pointer-events:none;display:none;max-width:26vw;line-height:1.6}

  /* ---- THE MAN ON THE LENS: who the camera is on, and how his fight is
     going. Ammo is the reason this exists — a magazine emptying and a man
     reloading is the beat the war is made of, and it was invisible. ---- */
  #who{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));
    z-index:41;display:none;pointer-events:none;padding:9px 12px 10px;border-radius:12px;min-width:172px;
    background:rgba(12,14,17,.55);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);
    font-variant-numeric:tabular-nums}
  #who.down{opacity:.55}
  #whoN{font-size:13px;letter-spacing:.16em;font-weight:800}
  #whoN i{font-style:normal;opacity:.5;font-weight:600;letter-spacing:.1em}
  #whoHp{height:3px;border-radius:2px;background:rgba(255,255,255,.14);margin:6px 0 8px;overflow:hidden}
  #whoHp s{display:block;height:100%;background:#4fbf6a;transition:width .12s linear}
  #whoG{font-size:11px;letter-spacing:.14em;opacity:.75;display:flex;justify-content:space-between;gap:10px}
  #whoG b{font-weight:800;opacity:.95}
  #whoMagT{height:5px;border-radius:3px;background:rgba(255,255,255,.14);margin:5px 0 7px;overflow:hidden}
  #whoMagT s{display:block;height:100%;background:#e8dcc0;transition:width .1s linear}
  #whoMagT.rl s{background:#ff9a3d}
  #whoK{font-size:11px;letter-spacing:.14em;opacity:.7}
  #whoK b{color:#ffd08a;font-weight:800}
  body.coarse #who{min-width:150px;padding:7px 10px 8px}
</style>
</head>
<body>

<div id="menu"><div class="in">
  <h1>NPC <em>WAR</em></h1>
  <p class="sub">TWO ARMIES. YOUR CLOCK. NO CAP.</p>

  <div class="lbl">GROUND</div>
  <div class="maps" id="maps"></div>

  <div class="teams" style="margin-top:16px">
    <div class="team red">
      <h3>RED</h3>
      <div class="cnt">
        <button data-t="red" data-d="-10">&minus;</button>
        <input id="redN" type="number" inputmode="numeric" min="1" value="30">
        <button data-t="red" data-d="10">+</button>
      </div>
      <select id="redU"></select>
      <select id="redW"></select>
      <select id="redT"></select>
      <select id="redS"></select>
    </div>
    <div class="team blue">
      <h3>BLUE</h3>
      <div class="cnt">
        <button data-t="blue" data-d="-10">&minus;</button>
        <input id="blueN" type="number" inputmode="numeric" min="1" value="30">
        <button data-t="blue" data-d="10">+</button>
      </div>
      <select id="blueU"></select>
      <select id="blueW"></select>
      <select id="blueT"></select>
      <select id="blueS"></select>
    </div>
  </div>

  <div class="presets" id="presets">
    <button data-n="10">10 v 10</button>
    <button data-n="30">30 v 30</button>
    <button data-n="80">80 v 80</button>
    <button data-n="200">200 v 200</button>
    <button data-n="500">500 v 500</button>
  </div>

  <div class="lbl">THE MATCHUPS</div>
  <div class="presets" id="matchups"></div>

  <button id="start">START THE WAR</button>
  <button id="bench">FIND MY MAX</button>
  <div id="maxline"></div>
  <div id="bootst"></div>
  <div id="boottrack"><div id="bootbar"></div></div>
</div></div>

<div id="top">
  <span class="r" id="redC">0</span>
  <span class="bar rr"><s id="redB" style="width:100%"></s></span>
  <span class="mid"><span id="clk">0:00</span><small id="spd">SPEED 1</small></span>
  <span class="bar bb"><s id="blueB" style="width:100%"></s></span>
  <span class="b" id="blueC">0</span>
</div>
<div id="ctl">
  <button id="cPause">PAUSE</button>
  <button data-s="0.25">&frac14;</button>
  <button data-s="1" class="on">1</button>
  <button data-s="2">2</button>
  <button data-s="4">4</button>
  <button data-s="8">8</button>
  <button id="cCam">AUTO CAM</button>
</div>
<div id="banner"></div>
<div id="nflash"></div>
<div id="hint"></div>
<div id="who">
  <div id="whoN"></div>
  <div id="whoHp"><s></s></div>
  <div id="whoG"><span id="whoGun"></span><b id="whoAmmo"></b></div>
  <div id="whoMagT"><s></s></div>
  <div id="whoK"></div>
</div>

<div id="end"><div class="in">
  <h2 id="endT">RESULT</h2>
  <table id="endTable"></table>
  <div class="row">
    <button id="endWatch">WATCH</button>
    <button id="endMenu">SETUP</button>
    <button id="endAgain" class="big">AGAIN</button>
  </div>
</div></div>

<!-- ============ ONE TAG FOR THE STUDIO ============================
  The packs below are the studio's front door. The combat stack under
  THE ARMOURY is listed by hand because no pack names it yet: the studio
  skips files a page already carries, so the day a "guns" pack ships,
  these lines simply stop being needed.
============================================================ -->
<script src="../src/core/studio.js"></script>
<script>
"use strict";
(function () {
const el = function (id) { return document.getElementById(id); };
const bootst = function (t) { const n = el("bootst"); if (n) n.textContent = t; };

/* ============================================================ SETTINGS
   URL params override localStorage so a benchmark or a shared link can
   reproduce a battle exactly. */
const Q = new URLSearchParams(location.search);
const saved = (function () { try { return JSON.parse(localStorage.getItem("cbz-npcwar") || "{}"); } catch (e) { return {}; } })();
const SET = {
  map:   Q.get("map")  || saved.map  || "city",
  redN:  parseInt(Q.get("red")  || saved.redN  || 30, 10) || 30,
  blueN: parseInt(Q.get("blue") || saved.blueN || 30, 10) || 30,
  redU:  Q.get("ru") || saved.redU || "men",     // WHO fights: "men" or a bestiary species id
  blueU: Q.get("bu") || saved.blueU || "men",
  redW:  Q.get("rw") || saved.redW || "ak47",
  blueW: Q.get("bw") || saved.blueW || "ak47",
  redT:  Q.get("rt") || saved.redT || "elite",
  blueT: Q.get("bt") || saved.blueT || "elite",
  redS:  Q.get("rs") || saved.redS || "none",
  blueS: Q.get("bs") || saved.blueS || "none",
  bench: Q.get("bench") === "1",
  auto:  Q.get("auto") === "1",
};
/* The quality counters cost a segment test and a lane scan on every trigger
   pull, which is worth paying when a tool is watching and worth nothing when
   a person is. On for ?auto=1 and ?bench=1 (both are tools), on for ?probe=1,
   off otherwise. */
const PROBE = Q.get("probe") === "1" || (Q.get("probe") !== "0" && (SET.auto || SET.bench));
const SEP_OLD = Q.get("sep") === "old";      // the revert switch — see separateOld()
const FIRE_OLD = Q.get("fire") === "old";    // ditto, for fire discipline
const STEER_OLD = Q.get("steer") === "old";  // ditto, for wall-aware goal projection
const SHARE_OLD = Q.get("share") === "old";  // ditto, for squad target sharing
const SUPPORTS = [
  { id: "none", label: "NO AIR" },
  { id: "bomber", label: "ONE BOMBER" },
  { id: "bomber2", label: "TWO BOMBERS" },
  { id: "nuke", label: "NUKE RUN" },
];
if (SET.redN < 1) SET.redN = 1;
if (SET.blueN < 1) SET.blueN = 1;

/* ============================================================ THE GROUND
   FOUR OF THESE ARE PLACES IN GANG CITY, AT THEIR OWN COORDINATES.

   The first build fought its wars in a procedural desert: 200 box towers on a
   grid standing in for a city this repo already ships, whole. That is the
   exact mistake games/bomb-survivor.html deleted a wave earlier, and the note
   at the top of that page is the whole argument — the studio can RAISE the
   real map, so a stage flat is a choice nobody has to make.

     city    CBZ.studio.town()  — the real fabric: marked streets, sidewalks,
             crosswalks, shops with lit signs, and a cluster of the enterable
             instanced-glass towers the mainland is made of. A man takes cover
             behind a REAL doorway and a rocket brings down a REAL floor.
     island  CBZ.studio.raise("militaryisland") — the base at its authored
             place (-620,-700): fence, airstrip, parked fighters, motor pool.
     field   CBZ.studio.raise("airport") — Halloran Field: terminal, aprons,
             the airliners on their stands.
     dunes   the desert erg, out where the dunes measure as dunes: an open
             firing line is a different game and worth having, and here the
             sight lines live and die on the crests.
     arena   the kill box, kept, because it is the control: no world at all,
             so anything that goes wrong there is the men, not the map. */
const TOWN_AT = { x: 0, z: -700 };       // the mainland coordinates bomb-survivor stands on
/* THE VENUES.

   Gang City is already built. Every entry with a `raise` list is a real place
   from the map — the same geometry the mainland uses — and costs exactly this
   one row, because studio.raise() runs the builders the file already
   registered and studio.heightfield() measures the ground they left behind.
   Nothing below authors a wall, a floor or a height function.

   raise:  studio packs to RAISE as the ground (order is the build order)
   packs:  what must LOAD for that to work (raise packs plus anything the
           venue's own props need); studio resolves each pack's `needs`
   sea:    lay the deep sea plate under it, for a venue that reads as coastal */
const MAPS = {
  city:     { label: "GANG CITY", note: "the real downtown. streets, glass, doors", packs: ["citycore"] },
  island:   { label: "MILITARY ISLAND", note: "the real base. fence, strip, jets", packs: ["militaryisland", "airbase"], raise: ["militaryisland"], sea: true },
  field:    { label: "HALLORAN FIELD", note: "the real airport. aprons, terminal", packs: ["airport"], raise: ["airport"], sea: true },
  gov:      { label: "THE SEAT OF STATE", note: "the real complex. wings, strongrooms", packs: ["govcomplex"], raise: ["govcomplex"] },
  harbor:   { label: "CAPE HARBOR", note: "the coastal strip. apron, helipads", packs: ["capeharbor"], raise: ["capeharbor"], sea: true },
  marina:   { label: "THE MARINA", note: "basin, pontoons, moored boats", packs: ["marina"], raise: ["marina"], sea: true },
  speedway: { label: "THE SPEEDWAY", note: "banked oval. a ground that is NOT flat", packs: ["speedway"], raise: ["speedway"], sea: true },
  dunes:    { label: "OPEN DUNES", note: "rolling sand. crests hide men", packs: ["desert"] },
  arena:    { label: "KILL BOX", note: "flat yard. crates. walls", packs: [] },
};
if (!MAPS[SET.map]) SET.map = "city";

const TRAININGS = [
  { id: "civ",   label: "UNTRAINED",  role: "civilian", hp: 90 },
  { id: "thug",  label: "STREET",     role: "thug",     hp: 100 },
  { id: "pro",   label: "TRAINED",    role: "guard",    hp: 120 },
  { id: "elite", label: "SOLDIER",    role: "soldier",  hp: 140 },
  { id: "swat",  label: "SWAT",       role: "agent",    hp: 160 },
];
const TEAMS = {
  red:  { id: "red",  name: "RED",  color: 0xff5a3d },
  blue: { id: "blue", name: "BLUE", color: 0x3fa8ff },
};

/* actor.weapon strings chosen so BOTH consumers read them right:
   actorweapons.js resolves the appearance model, combat_iq.js classifies the
   competence column. "MIXED" and "EVERYTHING" pick per man, seeded. */
const GUN_NAME = {
  sidearm: "Pistol", shotgun: "Shotgun", carbine: "Carbine", smg: "SMG",
  revolver: "Revolver", deagle: "Desert Eagle", ak47: "AK-47", uzi: "Uzi",
  sniper: "Sniper", lmg: "LMG", taser: "Taser", bazooka: "bazooka", glauncher: "glauncher",
};
const GUN_ORDER = ["ak47", "carbine", "lmg", "smg", "uzi", "shotgun", "sniper",
  "sidearm", "revolver", "deagle", "glauncher", "bazooka", "taser"];
const MIX_RIFLES = ["ak47", "carbine", "lmg", "smg", "shotgun", "sniper"];
/* the men's empty hands are a weapon row too — combat_iq's own melee exchange
   (IQ.melee: close, circle, guard, windup, swing) drives them, so "100 unarmed
   men vs the gorilla" is a supported army and not a special case. Punch damage
   by training: a SWAT officer hits harder than a clerk. */
const PUNCH = { civ: 6, thug: 8, pro: 10, elite: 12, swat: 14 };

/* ============================================================ LOAD
   Base packs first; the armoury after, in dependency order. Every file in
   the second list is engine source loaded verbatim — the page adds nothing
   to any of them. */
/* bestiary + beasts ride in the base load on purpose: the menu lists every
   species BY READING the bestiary (a hardcoded copy of 54 names is the exact
   stat-fiction this repo bans), and the three beast files are pure drivers —
   no engine, no spawner, nothing scheduled. Measured cost is a handful of
   small data files on a load that already fetches thirty. */
const NEED = ["caps", "people", "fx", "damage", "sound", "batch", "bestiary", "beasts"];
const ARMOURY = [
  "weapons/weapon-data.js",
  "weapons/weapon-scale.js",   // real-dimension display sizing (math, not magic scalars)
  "weapons/appearances/sidearm.js", "weapons/appearances/shotgun.js",
  "weapons/appearances/carbine.js", "weapons/appearances/smg.js",
  "weapons/appearances/revolver.js", "weapons/appearances/deagle.js",
  "weapons/appearances/ak47.js", "weapons/appearances/uzi.js",
  "weapons/appearances/sniper.js", "weapons/appearances/lmg.js",
  "weapons/appearances/bazooka.js", "weapons/appearances/taser.js",
  "weapons/appearances/glauncher.js",
  "systems/actorweapons.js",   // guns in hands + muzzle points + drop physics
  "systems/gunfx.js",          // tracers, flashes, impacts, holes, suppression
  "systems/combat_iq.js",      // HOW WELL A PERSON FIGHTS — the whole point
  "systems/wounds.js",         // bodies remember hits (optional, self-capping)
];
/* THE LOAD USED TO BE THIRTY-ONE ROUND TRIPS IN A ROW.

   Both halves waited on one file at a time: studio.need() awaits each pack
   file before appending the next (it must — the load ORDER is a contract),
   and the armoury chain above it did the same by hand, one Promise per gun.
   Serial execution is right; serial DOWNLOADING was never asked for and cost
   the whole boot on a hop-per-file host.

   exactly the order it always was.
     • studio.warm()/prefetch() emit <link rel=preload as=script>, which fills
       the HTTP cache without running a line — need()'s serial chain then
       finds every file already in hand.
     • the armoury goes in as one batch of tags with async=false, which is the
       spec's "execute in order as soon as possible" list. That is safe HERE
       and not in the studio, because none of these files calls addLandmass,
       so nothing depends on exactly one script being in flight.
     • and the person watching gets a real bar instead of three words. */
const PLAN = CBZ.studio.plan(NEED);
let TOTAL_FILES = PLAN.files.length + ARMOURY.length;
let filesIn = 0;
function bar(label) {
  const b = el("bootbar");
  if (b) b.style.width = Math.round(filesIn / Math.max(1, TOTAL_FILES) * 100) + "%";
  if (label) bootst(label + "  " + filesIn + "/" + TOTAL_FILES);
}
CBZ.studio.onProgress(function (p) {
  filesIn++;
  bar("LOADING " + p.file.replace(/^.*\//, "").replace(/\.js$/, "").toUpperCase());
});
function loadArmoury() {
  return new Promise(function (resolve) {
    let left = ARMOURY.length;
    if (!left) return resolve();
    ARMOURY.forEach(function (rel) {
      const s = document.createElement("script");
      s.src = CBZ.studio.root + rel;
      s.async = false;                        // ordered execution, parallel download
      const tick = function () {
        filesIn++; bar("ARMOURY");
        if (--left === 0) resolve();
      };
      s.onload = tick;
      s.onerror = function () { console.warn("[war] optional file failed:", rel); tick(); };
      document.head.appendChild(s);
    });
  });
}

/* the armoury the way it used to arrive — one file, one round trip, wait,
   repeat. Kept only so ?warm=0 can put a number on what the change bought. */
function loadArmourySerial() {
  let chain = Promise.resolve();
  ARMOURY.forEach(function (rel) {
    chain = chain.then(function () {
      return new Promise(function (resolve) {
        const s = document.createElement("script");
        s.src = CBZ.studio.root + rel;
        s.async = false;
        s.onload = function () { filesIn++; bar("ARMOURY"); resolve(); };
        s.onerror = function () { filesIn++; resolve(); };
        document.head.appendChild(s);
      });
    });
  });
  return chain;
}

  function flatDisc(r, color, y) {

     the road surface and the whole downtown rendered as open water with lane
     markings floating on it. A 26 km plane and a 16 km far plane leave very
     little depth resolution to separate two surfaces a metre apart. At -9 m
     it is unambiguous at every camera range, and the apron edge below reads
     as the quay it now is. */
  function seaPlate(y) {

    g.rotateX(-Math.PI / 2); g.translate(0, y == null ? -9 : y, 0);
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0x2e4c66 }));
    m.receiveShadow = true; m.matrixAutoUpdate = false; m.updateMatrix();

    m.receiveShadow = true; m.matrixAutoUpdate = false; m.updateMatrix();

  /* NOBODY SPAWNS INSIDE A BUILDING. The desert maps could get away without
     this — a dune has nothing in it — but the moment the ground is a real
     downtown, a ranked column drawn on paper puts a third of an army inside
     the Exchange Bank, where nothing can see them and nothing can shoot them.
     A golden-angle spiral, so the search is a spiral and not a ring: the
     first free point is genuinely the nearest one, and it is deterministic. */
  const _fs = [];
  function blockedAt(x, z) {
    const cols = CBZ.micro.queryColliders(x, z, 0.9, _fs);
    for (let c = 0; c < cols.length; c++) {
      const b = cols[c];
      if (x < b.minX - 0.55 || x > b.maxX + 0.55) continue;
      if (z < b.minZ - 0.55 || z > b.maxZ + 0.55) continue;
      if (b.y0 != null && b.y1 != null && (b.y1 < 0.35 || b.y0 > 1.7)) continue;  // a kerb is not a wall
      return true;
    }
    return false;
  }
  /* AND NOT ON TOP OF EACH OTHER EITHER. The spiral above only ever asked the
     geometry. On an open field that is enough, because the ranked grid never
     puts two men in the same square — but on a DENSE venue (the seat of state
     is walls, planters and steps) many grid points are blocked, several men
     spiral out of their own square and converge on the same first free metre,
     and they start the battle interpenetrating. Measured on `gov`: one
     overlapping pair at t=0, which the sweep counts as a fault and should.
     Claimed points are remembered for the length of one build. */
  /* AND THE CLAIM IS THE BODY'S OWN SIZE. A flat 1.15 m is the right answer
     for a man and a fiction for a bull elephant: an army of them spawned
     INSIDE one another and spent the opening seconds of the battle shoving
     itself apart. Each claim carries the radius that took it, so a pair only
     has to clear what the two of them actually occupy. */
  const _claim = [];
  const CLAIM_R = 0.575;         // a man's half of the old 1.15 m pair
  function crowdedAt(x, z, r) {
    for (let i = 0; i < _claim.length; i++) {
      const c = _claim[i];
      const dx = x - c.x, dz = z - c.z, need = r + c.r;
      if (dx * dx + dz * dz < need * need) return true;
    }
    return false;
  }
  function freeSpot(x, z, r) {
    r = r || CLAIM_R;
    const take = function (px, pz) { _claim.push({ x: px, z: pz, r: r }); return { x: px, z: pz }; };
    if (!blockedAt(x, z) && !crowdedAt(x, z, r)) return take(x, z);
    // the search walks outward in the body's OWN units, so a big animal is
    // not condemned to test forty man-sized rings it can never fit in
    const step = 1.35 * Math.max(1, r / CLAIM_R * 0.72);
    for (let k = 1; k < 40; k++) {
      const a = k * 2.399963229728653, d = k * step;      // golden angle
      const px = x + Math.cos(a) * d, pz = z + Math.sin(a) * d;
      if (!blockedAt(px, pz) && !crowdedAt(px, pz, r)) return take(px, pz);
    }
    return take(x, z);
  }

  /* SPAWN ON THE STREET, NOT ON A GRID. Given the town's own road records,
     each side forms up in the outermost north-south streets on its half and
     walks in. That is one lookup per man and it is the reason an urban fight
     reads as an assault down avenues instead of two blocks of men shuffling
     through masonry. */
  function streetSpawner(roads, cx, cz, side) {
    const lanes = (roads || []).filter(function (r) {
      return r.vertical && (r.x - cx) * side > 24;
    }).sort(function (a, b) { return Math.abs(b.x - cx) - Math.abs(a.x - cx); }).slice(0, 3);
    if (!lanes.length) return null;
    return function (i) {
      const L = lanes[i % lanes.length];
      const k = (i / lanes.length) | 0;
      const row = k % 11, rank = (k / 11) | 0;
      const t = (row - 5) * (L.len / 13);
      const off = ((rank % 2) ? 1 : -1) * Math.min(L.w * 0.3, 3.4) + (sWorld() - 0.5) * 1.4;
      const along = ((rank / 2) | 0) * 3.2 * side;         // ranks stack BEHIND
      return { x: L.x + off + along, z: L.z + t + (sWorld() - 0.5) * 1.4 };

  let MEASURED = null;        // what the heightfield found, for the audit
  function buildMap(id) {
    const M = MAPS[id] || MAPS.arena;
    _claim.length = 0;          // spawn claims belong to ONE build
    let gap = { city: 300, island: 230, field: 260, dunes: 150, arena: 120 }[id] || 150;
    let gapOverride = 0;      // measured venues size their own no-man's land
    let groundAt = function () { return 0; };

        if (Math.abs(x) > gap / 2 - 6 && Math.abs(x) < gap / 2 + 18) continue;  // keep spawn lanes open
        const tall = sWorld() < 0.62;
        crate(x, z, 2.4 + sWorld() * 4.4, tall ? 1.9 + sWorld() * 0.6 : 1.15,
          1.6 + sWorld() * 2.6, sWorld() < 0.5 ? 0x7a5f43 : 0x5d6a70);
      }
    } else if (id === "dunes") {
      world = CBZ.studio.world("desert", { seed: "npcwar" });
      groundAt = (world && world.heightAt) || groundAt;
      /* WALK OUT UNTIL THE GROUND MEASURES AS DUNES. The old centre was a
         constant — rings.city + 650 — and nothing ever asked what the ground
         there looked like. Measured: 7.6 m of relief across the whole field,
         because the dune amplitude ramps up with radius and r=1700 is barely a
         third of the way up the ramp. A map called OPEN DUNES was a flat plate
         with the word "dunes" on the menu row.

         So the venue scans the erg and takes the FIRST centre that passes TWO
         measurements: the battlefield window (±160 m) holds at least 16 m of
         relief, and the dunes STAND BETWEEN the armies — at least two of the
         three central spawn lanes are crest-cut at eye height. Relief alone
         is not enough (measured: the best on-axis window put all of its sand
         on the flanks and the two firing lines still saw each other spawn to
         spawn), and the scan is two-dimensional because the erg is a ring,
         not a bearing — on the shipped terrain the qualifying ground lies off
         the old axis entirely. The terrain derives from WORLD_SEED alone, so
         the same URL lands the same war on the same sand. The fallback is the
         old constant, so a retuned noise field can never strand the map with
         no centre at all. High ground is not dealt evenly here; neither are
         the city map's streets. A venue is a place, and a place has a better
         side. */
      const rings = (world && world.rings) || { city: 1050, dune: 2700 };
      cx = rings.city + 650; cz = 0;
      scan:
      for (let x = rings.city + 550; x <= rings.dune - 250; x += 50) {
        for (let z = -450; z <= 450; z += 50) {
          if (Math.hypot(x, z) + 170 > rings.dune - 60) continue;
          let lo = 1e9, hi = -1e9;
          for (let sx = -160; sx <= 160; sx += 16) for (let sz = -160; sz <= 160; sz += 16) {
            const y = groundAt(x + sx, z + sz);
            if (y < lo) lo = y; if (y > hi) hi = y;
          }
          if (hi - lo < 16) continue;
          let cut = 0;
          for (let li = -1; li <= 1; li++) {
            const lz = z + li * 12, ax = x - 83, bx = x + 83;
            if (terrainBlocked(ax, groundAt(ax, lz) + 1.52, lz,
                               bx, groundAt(bx, lz) + 1.35, lz, groundAt)) cut++;
          }
          if (cut >= 2) { cx = x; cz = z; break scan; }
        }
      }
    } else if (id === "city") {
      // THE REAL FABRIC. Eight blocks square is 490 m of street — big enough
      // that an army has to cross ground it does not own, small enough that
      // the two sides find each other without a search party.
      cx = TOWN_AT.x; cz = TOWN_AT.z;
      town = CBZ.studio.town({
        at: TOWN_AT, seed: "npcwar-" + (Q.get("seed") || "talloran"), name: "Talloran",
        cols: 8, rows: 8, blockW: 44, blockD: 44, roadW: 15,
        // the studio's default downtown palette is authored for the mainland's
        // own light. Under this map's sun the sidewalks and the square came
        // out as paper — a white field with a road painted on it — so the
        // stone comes down to something a camera can still see men against.
        palette: {
          ground: 0x5f636a, sidewalk: 0x6d7278, road: 0x2b2e34,
          plaza: 0x6f747b, wood: 0x4c545d, accent: 0x616a75,
        },
      });
      if (town && town.rect) {
        // a WIDE apron and no water: the downtown is inland, and the sea plate
        // this map used to carry was the thing fighting the road for the depth
        // buffer. Ground that runs out to the fog is the honest answer here.
        apron(town.rect.minX - 900, town.rect.maxX + 900, town.rect.minZ - 900, town.rect.maxZ + 900, 0x555a61);
        spawners = {
          red: streetSpawner(town.roads, cx, cz, -1),
          blue: streetSpawner(town.roads, cx, cz, 1),
        };
      }
    } else if (M.raise) {
      /* A REAL GANG CITY VENUE, MEASURED RATHER THAN DECLARED.

         Every raised venue took the same three hand-written constants before
         this: a centre, an apron rectangle and a flat groundAt. All three were
         guesses that nothing checked, and all three are readable from the
         geometry once it exists. Raise into our OWN group so the heightfield
         casts against the venue and not the skybox, then ask it where it is
         and how high it stands. A venue that is flat measures flat; the
         speedway's banking measures as banking, for free. */
      if (M.sea) seaPlate();
      const venue = new THREE.Group();
      CBZ.scene.add(venue);
      for (let i = 0; i < M.raise.length; i++) {
        const got = CBZ.studio.raise(M.raise[i], { parent: venue });
        if (!base) base = got;
        if (!got) console.error("[battle] nothing raised for pack:", M.raise[i]);
      }
      const H = CBZ.studio.heightfield(venue, { step: 6, pad: 30 });
      if (H) {
        groundAt = H.heightAt;
        cx = H.cx; cz = H.cz;
        // ground out to the fog under the venue's own floor, so its edge is a
        // quay and not the inside of the sky dome
        apron(H.box.min.x - 420, H.box.max.x + 420, H.box.min.z - 420, H.box.max.z + 420,
              M.apronColor || 0x7d7a6c, H.minY);
        // the armies start half the venue apart, clamped to a distance two
        // sides can actually cross before the watcher loses interest
        gapOverride = Math.max(90, Math.min(320, Math.min(H.spanX, H.spanZ) * 0.5));
        MEASURED = { cols: H.cols, rows: H.rows, step: +H.step.toFixed(1), miss: H.miss,
                     minY: +H.minY.toFixed(2), maxY: +H.maxY.toFixed(2),
                     spanX: Math.round(H.spanX), spanZ: Math.round(H.spanZ) };
      } else {
        console.error("[battle] heightfield measured nothing for", id, "— falling back to flat");
      }
    }

    if (gapOverride) gap = gapOverride;
    /* HOW MUCH GROUND IS THERE IN THIS GROUND? One number, measured off the
       same groundAt the men will stand on, over the same window they will
       fight in — so the audit can state it and the checker can hold the map
       named OPEN DUNES to actually having dunes. */
    let relief = 0;
    (function () {
      const span = gap * 0.5 + 120;
      let lo = 1e9, hi = -1e9;
      for (let sx = -span; sx <= span; sx += 12) for (let sz = -span; sz <= span; sz += 12) {
        const y = groundAt(cx + sx, cz + sz);
        if (y < lo) lo = y; if (y > hi) hi = y;
      }
      relief = Math.round((hi - lo) * 10) / 10;
    })();
    const grid = function (team, i) {
      const side = team === "red" ? -1 : 1;
      const col = (i / 10) | 0, row = i % 10;
      const x = cx + side * (gap / 2 + 8 + col * 3.1) + (sWorld() - 0.5) * 1.8;
      const z = cz + (row - 4.5) * 3.4 + (col % 2) * 1.7 + (sWorld() - 0.5) * 1.8;
      return { x: x, z: z };
    };
    return {
      id: id, gap: gap, cx: cx, cz: cz, groundAt: groundAt, relief: relief,
      /* TERRAIN JOINS THE SIGHT LINE — but only where groundAt is genuinely
         TERRAIN. The dunes map's height function is the desert's own analytic
         surface, so a sample along the eye line is sand and nothing else. A
         RAISED venue's groundAt is a raycast heightfield, and a raycast from
         above cannot tell a roof from a hill — arming terrain sight there
         would wall off every lane that passes beside a building the grid
         touched. The buildings already block sight the honest way, through
         their own colliders. So: dunes only, until a map's ground is measured
         by something that knows the difference. */
      terrainTrue: id === "dunes",
      terrainLos: id === "dunes" && relief > 6 && Q.get("tlos") !== "0",
      // team spawn: down the streets where there are streets, ranked columns
      // where there are not, and in both cases OUT of the geometry
      spawnAt: function (team, i, r) {
        const s = spawners && spawners[team];
        const p = (s && s(i)) || grid(team, i);
        return freeSpot(p.x, p.z, r);
      },
    };
  }

  /* ============================================================ THE MEN */
  const trainingOf = function (id) {

    return TRAININGS[3];
  };
  function pickGun(choice, i) {

    if (choice === "everything") return GUN_ORDER[(i * 5 + ((i / GUN_ORDER.length) | 0)) % GUN_ORDER.length];
    return GUN_NAME[choice] ? choice : "ak47";
  }
  function makeMan(teamId, i) {

    const wid = pickGun(teamId === "red" ? SET.redW : SET.blueW, i);
    const fists = wid === "fists";
    const w = fists ? null : (CBZ.weaponById(wid) || CBZ.weaponById("ak47"));
    const group = CBZ.studio.cast(tr.role, { color: T.color, variant: i * 2 + (teamId === "red" ? 0 : 1) });
    if (!group) return null;
    const at = MAP.spawnAt(teamId, i);
    group.position.set(at.x, MAP.groundAt(at.x, at.z), at.z);
    group.rotation.y = teamId === "red" ? Math.PI / 2 : -Math.PI / 2;
    CBZ.scene.add(group);
    const man = {
      id: teamId + i, team: teamId, i: i,
      group: group, char: group.userData.charRig,
      pos: group.position,                    // combat_iq + actorweapons read .pos
      target: V(),                            // combat_iq's posture() steers this
      yaw: group.rotation.y, speed: 0,
      hp: bench ? 1e9 : tr.hp, maxHp: bench ? 1e9 : tr.hp,
      armed: !fists, weapon: fists ? null : GUN_NAME[wid], wid: wid,
      fists: fists, punch: PUNCH[tr.id] || 8, rad: 0.45,
      launcher: !!(w && w.explosive),
      mag: w ? (w.magSize || w.mag || 30) : 0, magSize: w ? (w.magSize || w.mag || 30) : 0,
      cool: 0.4 + lcg() * 1.2, reloadT: 0,
      tgt: null, losBadT: 0, slot: "hold", thinkAt: simT + lcg() * 0.3, lastThink: simT,
      dead: false, dieT: 0, dieDir: 1, animF: (i % 4),
      lastShotT: -9, sq: Math.floor(i / 10), sqSlot: i % 10,
      kills: 0, shotsF: 0, hitsF: 0, reloads: 0,
    };
    man.target.set(at.x, 0, at.z);
    (squads[teamId][man.sq] = squads[teamId][man.sq] || []).push(man);
    // when there is an air war, every man is a thing a bomb can find — through
    // ordnance's OWN cover rules, so a roof or a wall between the bang and the
    // body genuinely spares him
    if (AIR.on && CBZ.ordnance && CBZ.ordnance.addTarget) {
      man.ordTgt = CBZ.ordnance.addTarget({
        pos: man.pos, team: teamId, unit: man,
        onDamage: function (dmg, info) {

    else if (tr.id === "pro") man.kind = "guard";
    else if (tr.id === "thug") man.aggr = 0.92;

    return man;
  }

  /* ============================================================ THE BEASTS
     An army out of the bestiary. The body is the species' own build() — the
     same low-poly animal the mainland hunts — walked by the shared gait rig
     and fought by creature_combat's one strike driver. NOTHING here is a new
     animal AI: stats come off the species row (hp, spd, danger, bite), the
     lope comes from wildlife_rig's class table, and the bite comes from
     CBZ.creatureFight with this page's ground and damage funnel plugged into
     its seams. */
  const BEAST_TUNE = {};
  function beastTuning(sp) {
    let b = BEAST_TUNE[sp.id];
    if (b) return b;
    const cls = CBZ.wildlifeRig.classify(sp);
    // charge speed off the species' own wander speed and its class's attack
    // multiplier, lifted into the men's speed register (walkers 4.6–8.0) so
    // a wolf runs a man down and an elephant arrives like weather
    const chase = Math.max(4.2, Math.min(8.6, (sp.spd || 2) * (cls.atkM || 2.2) * 1.15));
    b = BEAST_TUNE[sp.id] = {
      chase: chase,
      march: Math.max(2.6, chase * 0.55),
      dmg: Math.max(6, (sp.bite || 10) * 1.35),   // the men's own +45% band rule, scaled for teeth
      // a dangerous animal strikes FASTER, not just harder — measured on the
      // first arena run: at a flat 1.24 s a gorilla ring-fenced by circling
      // brawlers landed ~7% of its potential strikes and thirty of them lost
      // to thirty thugs, which is not what a silverback is
      rate: 0.95 + (1 - Math.min(1, sp.danger || 0)) * 0.7,
      brave: (sp.danger || 0) >= 0.7,             // bears, cats, the gorilla: no rout in them
      prey: (sp.danger || 0) < 0.15,              // deer and rabbits fight nobody
    };
    return b;
  }
  function makeBeast(teamId, i) {
    const spId = teamId === "red" ? SET.redU : SET.blueU;
    const sp = (CBZ.WILDLIFE_SPECIES || {})[spId];
    if (!sp || !sp.build) return null;
    const T = TEAMS[teamId];
    let group = null;
    try { group = sp.build({ THREE: THREE, mat: CBZ.cmat, rng: lcg }); } catch (e) { console.warn("[war] species build failed:", spId, e); }
    if (!group) return null;
    const s = sp.scale || 1;
    group.scale.setScalar(s);
    // measure the body once: separation radius, aim heights, the collar seat
    const bb = new THREE.Box3().setFromObject(group);
    const H = Math.max(0.5, bb.max.y - bb.min.y);
    /* THE FOOTPRINT AN ANIMAL ACTUALLY OCCUPIES.

       The first pass took 0.3 of the SMALLER of (length, 1.6 x width) and
       capped it at 1.1 m, which asked a 2.2 m dog to keep 0.84 m from the
       next dog and a lion 1.26 m — so a pack closed up and drew straight
       through itself, exactly as reported. A body's separation circle has to
       account for the length as well as the beam, because an animal is long
       and it turns: half the mean of the two spans is the honest radius for a
       circle standing in for a body that can face any way. */
    const spanX = Math.max(0.3, bb.max.x - bb.min.x);     // nose to tail (+X authored)
    const spanZ = Math.max(0.3, bb.max.z - bb.min.z);     // across the shoulders
    const rad = Math.min(3.4, Math.max(0.45, (spanX + spanZ) * 0.28));
    noteBodyRadius(rad);
    // the coat stays the animal's own — a thin team collar says whose side,
    // seated on the neck line the box measured rather than a guessed height
    const collar = new THREE.Mesh(CBZ.boxGeom(0.18 / s, 0.12 / s, Math.min(0.9, spanZ * 0.85) / s),
      CBZ.cmat(T.color));
    collar.position.set((bb.max.x * 0.55) / s, (H * 0.7) / s, 0);
    group.add(collar);
    const at = MAP.spawnAt(teamId, i, rad);
    group.position.set(at.x, MAP.groundAt(at.x, at.z), at.z);
    CBZ.scene.add(group);
    const tn = beastTuning(sp);
    const m = {
      id: teamId + i, team: teamId, i: i, beast: true, species: sp, tn: tn,
      group: group, pos: group.position, target: V(),
      heading: teamId === "red" ? 0 : Math.PI, faceH: teamId === "red" ? 0 : Math.PI,
      yaw: 0, speed: 0, state: "wander",           // gait's flee-bound reads .state
      hp: bench ? 1e9 : sp.hp || 40, maxHp: bench ? 1e9 : sp.hp || 40,
      armed: false, weapon: null, launcher: false, mag: 0, magSize: 0,
      cool: 0, reloadT: 0,
      rad: rad,
      /* REACH IS A DISTANCE BETWEEN CENTRES, so it has to clear whatever the
         separation pass will hold this body away from — the men's melee
         circle (IQ.melee orbits at ~1.8 m; measured as the run where thirty
         gorillas lost to thirty thugs by idling at the edge of their own
         strike gate) AND, now that bodies keep their real footprints, a
         second animal of its own kind. Two lions holding 2.6 m apart with a
         2.47 m reach would have circled each other forever. */
      reach: Math.max(1.2 + s * 1.1, rad * 2 + 0.55),
      eyeH: Math.max(0.5, H * 0.8), losY: Math.max(0.35, H * 0.55),
      aimY: Math.max(0.3, H * 0.5), headY: Math.max(0.45, H * 0.8),
      tgt: null, losBadT: 0, slot: "hold", thinkAt: simT + lcg() * 0.3, lastThink: simT,
      dead: false, dieT: 0, dieDir: 1, animF: (i % 4),
      lastShotT: -9, sq: Math.floor(i / 10), sqSlot: i % 10,
      kills: 0, shotsF: 0, hitsF: 0, reloads: 0,
    };
    CBZ.faceAnimalHeading(m, m.heading);
    if (CBZ.wildlifeRig) CBZ.wildlifeRig.buildGait(m);
    m.target.set(at.x, 0, at.z);
    (squads[teamId][m.sq] = squads[teamId][m.sq] || []).push(m);
    if (AIR.on && CBZ.ordnance && CBZ.ordnance.addTarget) {
      m.ordTgt = CBZ.ordnance.addTarget({
        pos: m.pos, team: teamId, unit: m,
        onDamage: function (dmg, info) {
          hurtMan(m, dmg, { byTeam: info && info.team, cause: "bomb" });
        },
      });
    }
    return m;
  }
  /* HOW CLOSE TWO BODIES CAN GET, so a fist can always land on what it is
     standing next to. The separation pass holds a pair `radA + radB` apart;
     an arm swung at a fixed 1.9 m connects with a man and whiffs forever at
     a bear, which is not a difficulty setting, it is a bug. Man on man this
     answers 1.85 — the number it always used — and it grows with whatever is
     actually in front of him. */
  function meleeReach(a, b) {
    return 0.95 + (a.rad || 0.45) + (b.rad || 0.45);
  }
  // one mover for the strike bubble: creature_combat decides where, this page
  // answers to its own walls and ground — the exact locomotion seam the file
  // published for water, used here for a city
  function beastMove(a, dx, dz, step) {
    /* AND IT DOES NOT WALK INTO THE BODY IT IS BITING. creature_combat closes
       to 70% of the reach it was handed — right for a driver that cannot know
       how wide either party is, and a guaranteed overlap once both parties are
       lions: 0.7 x 3.13 m is 2.19 m, and two lions owe each other 2.58 m. The
       locomotion seam is the honest place to say so, because the seam exists
       exactly so the caller can own what "moving" means in its own world. */
    const t = a.tgt;
    if (t && !t.dead) {
      const cx = t.pos.x - a.pos.x, cz = t.pos.z - a.pos.z;
      const d = Math.hypot(cx, cz);
      const keep = (a.rad || 0.5) + (t.rad || 0.45);
      if (d - step < keep) step = Math.max(0, d - keep);
    }
    if (step <= 0) return;
    a.pos.x += dx * step;
    a.pos.z += dz * step;
    CBZ.micro.resolveCircle(a.pos, a.rad || 0.6, a.pos.y, 1.8);
    a.pos.y = MAP.groundAt(a.pos.x, a.pos.z);
  }
  function beastFight(m, tgt, sdt) {
    let o = m._bf;
    if (!o) {
      o = m._bf = {
        speed: 0, reach: m.reach, rate: m.tn.rate, dmg: m.tn.dmg, move: beastMove,
        onHit: null,
      };
      o.onHit = function (dmg) {
        const t = m.tgt;
        if (!t || t.dead) return;
        hurtMan(t, dmg, { by: m });

        // already staggers through the damage funnel's suppression
        if (t.beast && !t.dead && CBZ.creatureFlinch) { try { CBZ.creatureFlinch(t); } catch (e) {} }
      };
    }
    o.speed = m.tn.chase * 0.9;
    m.speed = 2;                       // close-quarters footwork, for the sprint-target test
    CBZ.creatureFight(m, tgt, sdt, o);
    m.heading = typeof m.heading === "number" ? m.heading : 0;
    m.faceH = m.heading;
  }

  /* ============================================================ REACHABLE
     One join and the engine's shared verbs can find these men: a rocket's
     studio.boom sweeps THIS roster (both sides — a blast has no team), and
     the hurt funnel is the same one the scoreboard reads. */
  CBZ.studio.join({
    id: "npcwar", label: "NPC War",
    caps: { traverse: 1, stepLedge: 1, blast: 1, blastActors: 1, breach: 1 },
    actors: function (out) {
      for (let i = 0; i < men.length; i++) if (!men[i].dead) out.push(men[i]);
      return out;
    },
    hurt: function (a, dmg, imp) { hurtMan(a, dmg, imp || {}); return true; },
    hurtPlayer: function () { return true; },   // nobody IS the player here
    route: "npcwar roster + hurtMan",
  });

  /* ============================================================ DAMAGE */
  function hurtMan(m, dmg, imp) {
    if (!m || m.dead || !(dmg > 0) || over) return;
    m.hp -= dmg;
    if (CBZ.combatIQ && CBZ.combatIQ.suppress) CBZ.combatIQ.suppress(m, 0.9);
    // getting shot IS information: retaliate at the shooter if unengaged
    if (imp && imp.by && imp.by.team && imp.by.team !== m.team && (!m.tgt || m.tgt.dead)) m.tgt = imp.by;
    if (m.hp <= 0) killMan(m, imp);
  }
  function killMan(m, imp) {
    m.dead = true; m.hp = 0;
    // a beast that dies mid-swing must let the pose go, or the strike offset

    if (m.beast && CBZ.creatureEndAttack) { try { CBZ.creatureEndAttack(m); } catch (e) {} }
    if (m.ordTgt) {
      m.ordTgt.alive = false;
      if (CBZ.ordnance && CBZ.ordnance.removeTarget) CBZ.ordnance.removeTarget(m.ordTgt);
      m.ordTgt = null;
    }
    const byT = (imp && imp.by && imp.by.team) || (imp && imp.byTeam) || null;
    if (byT && byT !== m.team) stats[byT].kills++;
    else if (!byT) stats[m.team === "red" ? "blue" : "red"].kills++;   // blast with no author still scores the other side
    // fratricide (a bomb is a blunt tool) credits nobody
    // and the man who did it keeps his own tally, with his gun
    const by = imp && imp.by;
    if (by && by.team && by.team !== m.team) {
      by.kills = (by.kills || 0) + 1;
      if (by.wid) gunLedger(by.wid).kills++;
    }
    // sprawl: the rig's own death variety; the topple is ours (caller owns it)
    if (m.char && CBZ.deathPose) { try { CBZ.deathPose(m.char, m.i * 3.7 + 1.3, lcg()); } catch (e) {} }
    m.dieT = 0.0001;
    m.dieDir = lcg() < 0.5 ? -1 : 1;
    // the rifle leaves his hands and lands like hardware, not like a prop
    const prop = m._weaponProp;
    if (prop && CBZ.weaponPhysics && CBZ.weaponPhysics.drop) {
      try {
        CBZ.scene.attach(prop);
        m._weaponProp = null; m._weaponPropId = null;
        CBZ.weaponPhysics.drop(prop, {
          vx: (lcg() - 0.5) * 2.4, vy: 1.6 + lcg(), vz: (lcg() - 0.5) * 2.4,
          source: "npcwar-death",
        });
        dropGuns.push(prop);
        if (dropGuns.length > 140) {
          const old = dropGuns.shift();
          if (old && old.parent) old.parent.remove(old);
        }
      } catch (e) {}
    }
    m.armed = false;
    corpses.push(m);
    if (corpses.length > 260) {
      const old = corpses.shift();
      const k = men.indexOf(old);
      if (k >= 0) men.splice(k, 1);
      if (old.group) CBZ.studio.drop(old.group);
    }
    if (camDist2(m.pos) < 120 * 120 || aliveCount("red") + aliveCount("blue") < 40) {
      hud.feed((m.beast ? TEAMS[m.team].name + " " + String(m.species.name).toUpperCase()
        : TEAMS[m.team].name + " " + (m.i + 1)) + " DOWN");
    }
  }
  function aliveCount(team) {
    let n = 0;
    for (let i = 0; i < men.length; i++) if (men[i].team === team && !men[i].dead) n++;
    return n;
  }

  /* ============================================================ THE GRID
     Target search over thousands of men cannot be O(n squared). One uniform
     grid, rebuilt on a slow tick, queried in rings. */
  const GRID_CELL = 14;
  const grid = new Map();
  let gridAt = -1;
  function gridKey(cx, cz) { return cx * 73856093 ^ cz * 19349663; }
  function rebuildGrid() {
    grid.clear();
    for (let i = 0; i < men.length; i++) {
      const m = men[i];
      if (m.dead) continue;
      const k = gridKey(Math.floor(m.pos.x / GRID_CELL), Math.floor(m.pos.z / GRID_CELL));
      let a = grid.get(k);
      if (!a) { a = []; grid.set(k, a); }
      a.push(m);
    }
    gridAt = simT;
  }
  function nearestEnemy(m, range) {
    const cx = Math.floor(m.pos.x / GRID_CELL), cz = Math.floor(m.pos.z / GRID_CELL);
    const maxR = Math.ceil(range / GRID_CELL);
    let best = null, bd = range * range;
    for (let r = 0; r <= maxR; r++) {
      for (let dx = -r; dx <= r; dx++) for (let dz = -r; dz <= r; dz++) {
        if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;   // ring shell only
        const a = grid.get(gridKey(cx + dx, cz + dz));
        if (!a) continue;
        for (let i = 0; i < a.length; i++) {
          const o = a[i];
          if (o.team === m.team || o.dead) continue;
          const d = (o.pos.x - m.pos.x) * (o.pos.x - m.pos.x) + (o.pos.z - m.pos.z) * (o.pos.z - m.pos.z);
          if (d < bd) { bd = d; best = o; }

      }
      if (best && r > 1) break;    // a full ring past the first hit is enough

  }
  /* THE NEAREST MAN IS NOT THE MAN YOU CAN SHOOT. On open sand those are the
     same sentence and the old code was right; put a city under it and the
     nearest enemy is routinely three buildings away, so every soldier locked
     onto somebody he could not see, waited out 2.6 s of `losBadT`, and
     assaulted a facade while a clean target stood in the street beside him.
     So: gather the near candidates, and prefer one there is a line to. The
     LOS tests only happen on a RE-target — a man keeps his mark until it dies
     or the dead-end timer gives up on it — so this is a handful of segment
     tests per casualty, not per frame. */
  const _cand = [];
  function pickTarget(m, range) {
    const cx = Math.floor(m.pos.x / GRID_CELL), cz = Math.floor(m.pos.z / GRID_CELL);
    const maxR = Math.ceil(range / GRID_CELL);
    _cand.length = 0;
    for (let r = 0; r <= maxR; r++) {
      for (let dx = -r; dx <= r; dx++) for (let dz = -r; dz <= r; dz++) {
        if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
        const a = grid.get(gridKey(cx + dx, cz + dz));
        if (!a) continue;
        for (let i = 0; i < a.length; i++) {
          const o = a[i];
          if (o.team === m.team || o.dead) continue;
          const d2 = (o.pos.x - m.pos.x) * (o.pos.x - m.pos.x) + (o.pos.z - m.pos.z) * (o.pos.z - m.pos.z);
          if (d2 < range * range) _cand.push(o, d2);

    let bestO = null, bestD = 1e18;
    for (let i = 0; i < _cand.length; i += 2) if (_cand[i + 1] < bestD) { bestD = _cand[i + 1]; bestO = _cand[i]; }

  }
  /* ============================================================ BODIES
     A MAN IS 0.52 m ACROSS THE SHOULDERS AND THE GRID WAS 14 m WIDE.

     The old separation pass ran on the TARGET-SEARCH grid, and the two jobs
     want opposite cells: target search wants cells big enough that a 175 m
     look is a handful of lookups, separation wants cells at BODY scale. On a
     14 m cell it could only ever be wrong in three ways at once, and all
     three were measured:

       • it never compared across a cell boundary, so two men 0.2 m apart on
         opposite sides of an invisible line interpenetrated forever;
       • it capped the inner loop at five neighbours (`i + 6`), so in the
         press of a real fight most pairs in the same cell were skipped, and
         WHICH five depended on spawn order;
       • it fired at 1.0 m, which for a 0.52 m body is contact, not clearance.

     So bodies get their own grid at 2.4 m — wide enough that a 0.9 m
     clearance test only ever needs the cell and its four FORWARD neighbours,
     which visits every pair exactly once — rebuilt every sub-step, because a
     stale body grid is exactly the thing that lets two men swap cells and
     stop seeing each other. */
  const SEP = 0.9;               // centre-to-centre clearance two men keep
  /* AND THE CELL FOLLOWS THE BIGGEST BODY ON THE FIELD.

     2.4 m is "wider than two men", which is what makes the four-neighbour fan
     below a COMPLETE sweep: two bodies further apart than one cell can never
     be touching, so they never need comparing. The moment an army is lions
     that arithmetic breaks — a lion pair owes each other 2.6 m of clearance,
     more than the cell, so the pairs that mattered most were exactly the ones
     the sweep was allowed to skip. Measured on 120 lions v 400 dogs before
     this: 32 overlapping pairs at peak, the worst pair 84% inside each other.

     So the cell is sized off the widest body that has actually spawned, and
     the completeness bound holds by construction: FINE > 2 * maxRadius >=
     every pair clearance. An army of men never grows it (the max stays 0.45)
     and pays nothing. */
  let FINE = 2.4;
  let bodyRadMax = 0.45;

    if (!(r > bodyRadMax)) return;

  }
  const fine = new Map();
  function rebuildFine() {
    fine.clear();
    for (let i = 0; i < men.length; i++) {
      const m = men[i];
      if (m.dead) continue;
      const k = gridKey(Math.floor(m.pos.x / FINE), Math.floor(m.pos.z / FINE));
      let a = fine.get(k);
      if (!a) { a = []; fine.set(k, a); }
      a.push(m);
    }
  }
  // the four cells that make each pair appear once: same cell (j > i), then
  // E, NE, N, NW. Anything closer than one cell is inside this fan.
  const FAN = [[1, 0], [1, 1], [0, 1], [-1, 1]];
  let sepFixed = 0;
  function separatePass(k) {
    if (SEP_OLD) { separateOld(k); return 0; }
    sepFixed = 0;
    fine.forEach(function (a, key) {
      for (let i = 0; i < a.length; i++) {
        const m = a[i];
        if (m.dead) continue;
        for (let j = i + 1; j < a.length; j++) push2(m, a[j], k);
        const cx = Math.floor(m.pos.x / FINE), cz = Math.floor(m.pos.z / FINE);
        for (let f = 0; f < 4; f++) {
          const b = fine.get(gridKey(cx + FAN[f][0], cz + FAN[f][1]));
          if (!b) continue;
          for (let j = 0; j < b.length; j++) push2(m, b[j], k);
        }
      }
    });
    return sepFixed;
  }
  /* ONE SWEEP IS NOT A SOLVER.

     A single relaxation pass fixes any pair it looks at — and then the next
     pair moves one of them back. In open order that is invisible (a man's
     residual is under a shoulder width); in a crush of four hundred dogs
     converging on a pride it is not, because every body is inside several
     constraints at once and each correction partly cancels the last. The
     probe proved it was this and not a hole in the grid: instrumented with
     the grid's OWN sweep, the survivors after one pass matched the O(n^2)
     count exactly, 33 for 33 — nothing was being missed, everything was
     being undone.

     So the pass runs until it converges, up to three sweeps, rebuilding the
     body grid between them because the bodies have moved. It stops the
     instant a sweep corrects nothing, so open order still costs exactly one
     sweep, and a battle of men — whose radii never grow past 0.45 — never
     enters the loop at all. */
  function separateSolve(k) {
    const fixed = separatePass(k);
    if (!fixed || bodyRadMax <= 0.5) return;
    for (let it = 0; it < 2; it++) {
      rebuildFine();
      if (!separatePass(k)) return;
    }
  }
  function push2(m, o, k) {
    if (o.dead || o === m) return;
    // clearance is the PAIR's, not the species': a man by a man keeps the old
    // 0.9, a man by a bear keeps more, and the radii are clamped at build so
    // the widest pair (2.2) still fits the FINE cell's completeness bound
    const clr = (m.rad || 0.45) + (o.rad || 0.45);
    const dx = o.pos.x - m.pos.x, dz = o.pos.z - m.pos.z;
    const d2 = dx * dx + dz * dz;
    if (d2 > clr * clr) return;
    let d = Math.sqrt(d2), ux, uz;
    if (d < 1e-4) {
      // exactly co-located: a deterministic bearing off the pair's own ids,
      // never Math.random — two men in the same spot must part the same way
      // every run or the battle stops being reproducible
      const a = ((m.i * 37 + o.i * 91) % 360) * Math.PI / 180;
      ux = Math.cos(a); uz = Math.sin(a); d = 1e-4;
    } else { ux = dx / d; uz = dz / d; }
    // A DEEP OVERLAP IS NOT A SPRING. Relaxation at k≈0.4 walks two men apart
    // over a few frames, which is right for a crowd easing itself out and
    // wrong for two bodies genuinely inside each other — that has to be gone
    // THIS step or it is on screen. Inside shoulder width the correction is
    // full; outside it, the soft pass keeps the crowd from jittering.
    const push = (clr - d) * 0.5 * (d < clr * 0.69 ? 1 : k);
    m.pos.x -= ux * push; m.pos.z -= uz * push;
    o.pos.x += ux * push; o.pos.z += uz * push;
    sepFixed++;
    // a shove is a move, and a move has to answer to the walls. Marking them
    // makes the NEXT step resolve them instead of every one of them now: a
    // body squeezed into a crate is invisible to every line of sight, so it
    // is immortal, and a battle with an immortal in it cannot end.
    m.resT = 0; o.resT = 0;
  }
  /* THE PASS THIS ONE REPLACED, kept so the claim is two-sided: ?sep=old and
     the overlap count has to come BACK. A fix that cannot be turned off has
     not been measured, it has been asserted. */
  function separateOld(k) {
    grid.forEach(function (a) {
      for (let i = 0; i < a.length; i++) {
        const m = a[i];
        if (m.dead) continue;
        const jEnd = Math.min(a.length, i + 6);
        for (let j = i + 1; j < jEnd; j++) {
          const o = a[j];
          if (o.dead) continue;
          const dx = o.pos.x - m.pos.x, dz = o.pos.z - m.pos.z;
          const d2 = dx * dx + dz * dz;
          if (d2 > 1.0 || d2 < 1e-6) continue;
          const d = Math.sqrt(d2);
          const push = (1.0 - d) * 0.5 * k / d;
          m.pos.x -= dx * push; m.pos.z -= dz * push;
          o.pos.x += dx * push; o.pos.z += dz * push;
        }
      }
    });
  }
  /* DID THE PASS ACTUALLY DO ITS JOB? The probe's overlap count is O(n^2) and
     deliberately shares none of the grid's assumptions, which makes it honest
     about the RESULT and silent about the CAUSE: a pair can survive because
     the pass never visited it (a grid that is not complete) or because it was
     visited and something moved it back. This counts the survivors using the
     grid's OWN sweep immediately after the pass — so a residual of zero here
     beside a non-zero probe means the grid is missing pairs, and a residual
     that matches the probe means the pass is being fought. */
  let sepResid = 0;
  function sepResidual() {
    let n = 0;
    fine.forEach(function (a) {
      for (let i = 0; i < a.length; i++) {
        const m = a[i];
        if (m.dead) continue;
        const cx = Math.floor(m.pos.x / FINE), cz = Math.floor(m.pos.z / FINE);
        for (let j = i + 1; j < a.length; j++) n += tooClose(m, a[j]);
        for (let f = 0; f < 4; f++) {
          const b = fine.get(gridKey(cx + FAN[f][0], cz + FAN[f][1]));
          if (!b) continue;
          for (let j = 0; j < b.length; j++) n += tooClose(m, b[j]);
        }
      }
    });
    return n;
  }
  function tooClose(m, o) {
    if (o.dead || o === m) return 0;
    if (Math.abs(m.pos.y - o.pos.y) >= 1.8) return 0;
    const need = 0.69 * ((m.rad || 0.45) + (o.rad || 0.45));
    const dx = o.pos.x - m.pos.x, dz = o.pos.z - m.pos.z;
    return (dx * dx + dz * dz) < need * need ? 1 : 0;
  }
  // NEIGHBOURS, for anything that needs to ask about bodies rather than push
  // them: the fire-discipline lane test, and the director.
  const _fine1 = [];
  function fineNear(x, z, r, out) {
    out = out || _fine1;
    out.length = 0;
    const x0 = Math.floor((x - r) / FINE), x1 = Math.floor((x + r) / FINE);
    const z0 = Math.floor((z - r) / FINE), z1 = Math.floor((z + r) / FINE);
    for (let cx = x0; cx <= x1; cx++) for (let cz = z0; cz <= z1; cz++) {
      const a = fine.get(gridKey(cx, cz));
      if (a) for (let i = 0; i < a.length; i++) out.push(a[i]);
    }
    return out;
  }
  /* ============================================================ THE WAY THROUGH
     A MAN IS NOT A PATHFINDER — AND IN A CITY THAT IS NOT SURVIVABLE.

     Measured, first build on the real downtown: 25 of 40 men in slot "push",
     `cool` at -28 s, both armies 135 m apart with eight blocks of masonry
     between them and not a shot fired for half a minute. The wall-slide
     detour is the right instinct for a crate and hopeless against a city
     block: a man walks into the Exchange Bank, slides 1.5 s along the
     facade, turns back into it, and does that until the clock runs out.

     So the ground gets a FLOW FIELD, and it is multi-source on purpose. Seed
     Dijkstra from EVERY living enemy at once and the resulting field is
     "path distance to the nearest enemy" — one solve, and each man descending
     it walks toward whichever opponent is genuinely closest THROUGH the
     streets, not the one closest as the crow flies. Seeding from a centre of
     mass instead funnels an army into a single point, which is what the first
     draft did and what the corner-bunching in the measurement was.

     Cells are 4 m: a 15 m street is three of them wide, and a 490 m town is
     22 500 cells, which Dial's bucket queue clears in about a millisecond.
     The blocked map is built ONCE, because buildings do not move; the field
     is re-solved on a slow tick, because men do. */
  const NAV = { cell: 4, x0: 0, z0: 0, w: 0, h: 0, block: null, on: false,
    dist: { red: null, blue: null }, at: { red: -9, blue: -9 }, solves: 0, blocked: 0 };
  const NBX = [1, -1, 0, 0, 1, 1, -1, -1], NBZ = [0, 0, 1, -1, 1, -1, 1, -1];
  const NAV_MAXD = 6000;                        // ~2.4 km of path; past that, no route
  function navBuild(cx, cz, radius) {
    const C = NAV.cell;
    const w = Math.max(8, Math.ceil(radius * 2 / C));
    NAV.x0 = cx - radius; NAV.z0 = cz - radius; NAV.w = w; NAV.h = w;
    const block = new Uint8Array(w * w);
    let blocked = 0;
    for (let iz = 0; iz < w; iz++) for (let ix = 0; ix < w; ix++) {
      if (blockedAt(NAV.x0 + (ix + 0.5) * C, NAV.z0 + (iz + 0.5) * C)) { block[iz * w + ix] = 1; blocked++; }
    }
    NAV.block = block; NAV.blocked = blocked;
    // NOTHING IN THE WAY MEANS NO FIELD. On open sand a gradient is a worse
    // straight line than a straight line, and the solve is pure cost.
    NAV.on = blocked > 24;
    NAV.dist.red = new Uint16Array(w * w);
    NAV.dist.blue = new Uint16Array(w * w);
    NAV.at.red = NAV.at.blue = -9;
    return NAV.on;
  }
  const _bk = [];
  function navSolve(team) {
    const w = NAV.w, C = NAV.cell, blk = NAV.block, d = NAV.dist[team];
    if (!d) return 0;
    d.fill(65535);
    for (let i = 0; i < NAV_MAXD; i++) { if (!_bk[i]) _bk[i] = []; else _bk[i].length = 0; }
    let seeded = 0;
    for (let i = 0; i < men.length; i++) {
      const m = men[i];
      if (m.dead || m.team === team) continue;
      const ix = ((m.pos.x - NAV.x0) / C) | 0, iz = ((m.pos.z - NAV.z0) / C) | 0;
      if (ix < 0 || iz < 0 || ix >= w || iz >= w) continue;
      const k = iz * w + ix;
      if (d[k] !== 0) { d[k] = 0; _bk[0].push(k); seeded++; }
    }
    NAV.at[team] = simT;
    if (!seeded) return 0;
    for (let b = 0; b < NAV_MAXD; b++) {
      const q = _bk[b];
      if (!q.length) continue;
      for (let qi = 0; qi < q.length; qi++) {
        const k = q[qi];
        if (d[k] !== b) continue;                       // a cheaper route already claimed it
        const ix = k % w, iz = (k / w) | 0;
        for (let n = 0; n < 8; n++) {
          const nx = ix + NBX[n], nz = iz + NBZ[n];
          if (nx < 0 || nz < 0 || nx >= w || nz >= w) continue;
          const nk = nz * w + nx;
          if (blk[nk]) continue;
          const nd = b + (n < 4 ? 10 : 14);
          if (nd < d[nk] && nd < NAV_MAXD) { d[nk] = nd; _bk[nd].push(nk); }

  }
  /* Descend the field a few cells and hand back where that lands. Three steps
     rather than one because a single-cell goal is 4 m away and makes a column
     walk in stair steps; three is far enough to read as a direction and near
     enough that the next think re-asks. */
  function navStep(m, out) {
    if (!NAV.on) return false;
    const w = NAV.w, C = NAV.cell, d = NAV.dist[m.team];
    if (!d) return false;
    let ix = ((m.pos.x - NAV.x0) / C) | 0, iz = ((m.pos.z - NAV.z0) / C) | 0;
    if (ix < 1 || iz < 1 || ix >= w - 1 || iz >= w - 1) return false;
    if (d[iz * w + ix] === 65535) return false;         // no route from here
    let moved = false;
    for (let s = 0; s < 3; s++) {
      let best = d[iz * w + ix], bx = -1, bz = -1;
      for (let n = 0; n < 8; n++) {
        const nx = ix + NBX[n], nz = iz + NBZ[n];
        if (nx < 1 || nz < 1 || nx >= w - 1 || nz >= w - 1) continue;
        const v = d[nz * w + nx];
        if (v < best) { best = v; bx = nx; bz = nz; }
      }
      if (bx < 0) break;
      ix = bx; iz = bz; moved = true;
      if (best === 0) break;                            // standing on him
    }
    if (!moved) return false;
    out.set(NAV.x0 + (ix + 0.5) * C, 0, NAV.z0 + (iz + 0.5) * C);
    return true;
  }

  const teamCOM = { red: { x: 0, z: 0 }, blue: { x: 0, z: 0 } };
  const HUNT = { red: false, blue: false };
  let comAt = -1;
  function updateCOM() {
    const count = { red: 0, blue: 0 };
    ["red", "blue"].forEach(function (t) {
      let x = 0, z = 0, n = 0;
      for (let i = 0; i < men.length; i++) {
        const m = men[i];
        if (m.team !== t || m.dead) continue;
        x += m.pos.x; z += m.pos.z; n++;
      }
      count[t] = n;
      if (n) { teamCOM[t].x = x / n; teamCOM[t].z = z / n; }
    });
    HUNT.red = count.blue > 0 && count.red >= count.blue * 8;
    HUNT.blue = count.red > 0 && count.blue >= count.red * 8;
    comAt = simT;
  }

  /* ============================================================ FIRE
     The trigger pull is combat_iq's: reaction beat, settle, burst rhythm,
     token discipline, derived damage. This page only draws the round,
     plays the report and applies the number it was handed. */
  const SIGHT = 175;
  /* A DUNE IS NOT MADE OF COLLIDERS. segmentBlocked answers for every box in
     the world and nothing else, which was the whole truth while every venue
     fought on a flat plate — and a lie the moment the war moved onto real
     dunes, where a man would sight and fire straight through twenty metres
     of sand. So on a map that declares terrainLos, the ground itself is
     sampled along the eye line: 3 m steps against a 420 m dune wavelength
     cannot step over a crest, and the first and last couple of metres are
     the two bodies' own footing and never count. The colliders are asked
     first because they are cheaper and usually the answer. ?tlos=0 turns the
     sand transparent again, so the difference is measurable. */
  function terrainBlocked(ax, ay, az, bx, by, bz, ground) {
    const g = ground || MAP.groundAt;   // buildMap scans before MAP exists
    const dx = bx - ax, dz = bz - az;
    const d = Math.hypot(dx, dz);
    if (d < 8) return false;
    const dy = by - ay, n = Math.ceil(d / 3);
    for (let i = 1; i < n; i++) {
      const t = i / n, at = t * d;

  }
  // eye and torso heights are PER BODY now: a man looks from 1.52 and is hit
  // at 1.35; a wolf looks from half a metre and a giraffe from four — the
  // measured box each beast carries says so, and the default is the man.
  function eyeLos(m, o) {
    const ay = m.pos.y + (m.eyeH || 1.52), by = o.pos.y + (o.losY || 1.35);
    if (CBZ.micro.segmentBlocked(m.pos.x, ay, m.pos.z, o.pos.x, by, o.pos.z)) return false;
    return !(MAP.terrainLos && terrainBlocked(m.pos.x, ay, m.pos.z, o.pos.x, by, o.pos.z));
  }
  /* IS ONE OF MINE STANDING IN THIS LANE? Only the near end is asked: past
     about twelve metres the round has cleared the firing line and anybody it
     meets is the enemy's problem. Cheap enough to ask on every trigger pull,
     which is what makes it a rule and not a report. */
  function mateInLane(m, tgt) {
    const dx = tgt.pos.x - m.pos.x, dz = tgt.pos.z - m.pos.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.5) return 0;
    const nx = dx / d, nz = dz / d, reach = Math.min(d - 0.6, 12);
    if (reach <= 1) return 0;
    const a = fineNear(m.pos.x + nx * reach * 0.5, m.pos.z + nz * reach * 0.5, reach * 0.5 + 1.2);
    let worst = 0, worstOff = 9;
    for (let i = 0; i < a.length; i++) {
      const o = a[i];
      if (o === m || o.dead || o.team !== m.team) continue;
      const ox = o.pos.x - m.pos.x, oz = o.pos.z - m.pos.z;
      const along = ox * nx + oz * nz;
      if (along < 0.8 || along > reach) continue;
      const off = ox * nz - oz * nx;                 // SIGNED: which side he is on
      if (Math.abs(off) < 0.62 && Math.abs(off) < worstOff) {
        worstOff = Math.abs(off);
        worst = off >= 0 ? 1 : -1;                   // 0 means clear, ±1 the side
      }
    }
    return worst;
  }
  /* AND THE MAN GETS OUT OF THE WAY. Measured before this rule: 167 of 776
     rounds — one in five — fired down a lane one of the shooter's own men was
     standing in, and because a friendly round in this game passes through a
     friendly body, the result was not fratricide, it was GHOST BULLETS. Worse
     to watch than a friendly-fire kill and impossible to read.

     Holding fire alone would produce a rank of men who never shoot, so the
     answer is the one a rifleman actually uses: step off the line. He moves
     to the side the mate is NOT on — moving a shoulder-width perpendicular
     grows the mate's offset from the new line by (1 - along/d) of the step,
     so away-from-him is the direction that clears fastest — and he keeps his
     mark the whole time. */
  function stepOffLine(m, tgt, side) {
    const dx = tgt.pos.x - m.pos.x, dz = tgt.pos.z - m.pos.z;
    const d = Math.hypot(dx, dz) || 1;
    const nx = dx / d, nz = dz / d;
    const s = -side;                                  // away from the man in the way
    m.target.set(m.pos.x + nz * s * 2.4, 0, m.pos.z - nx * s * 2.4);
    m.slot = "sidestep";
    m.stepAsideT = 0.55;
    m.cool = Math.max(m.cool, 0.18);                  // and he does NOT fire through him
  }
  function camDist2(p) {
    const c = CBZ.camera.position;
    return (p.x - c.x) * (p.x - c.x) + (p.y - c.y) * (p.y - c.y) + (p.z - c.z) * (p.z - c.z);
  }
  let fxBudget = 0;              // tracers drawn this frame — a salvo cannot flood it
  function fireShot(m, tgt, r) {
    const w = CBZ.weaponById(m.wid);
    m.mag--; m.lastShotT = simT;
    stats[m.team].shots++;
    m.shotsF++; gunLedger(m.wid).shots++;
    if (PROBE) {
      // both counters are asked AT THE TRIGGER and with a fresh test, because
      // a cached answer from the last think is exactly the thing being checked
      if (!eyeLos(m, tgt)) QUAL.blindFire++;
      if (mateInLane(m, tgt)) QUAL.throughMate++;
      // asked with the TERRAIN test regardless of whether terrainLos is armed,
      // which is what lets ?tlos=0 prove the sand goes transparent without it
      if (MAP.terrainTrue && terrainBlocked(m.pos.x, m.pos.y + (m.eyeH || 1.52), m.pos.z,
        tgt.pos.x, tgt.pos.y + (tgt.losY || 1.35), tgt.pos.z)) QUAL.throughSand++;
    }
    if (shotsRing.length > 90) shotsRing.shift();
    shotsRing.push({ x: m.pos.x, z: m.pos.z, t: simT, m: m });

    const cd2 = camDist2(m.pos);
    const seen = cd2 < 240 * 240;
    const hit = lcg() < r.hit;
    const head = hit && lcg() < 0.12;

    // the round, resolved: chest point on a hit, a spread-true near miss on a
    // miss — at the TARGET BODY's own heights (a dog's chest is not at 1.28)
    _v.set(tgt.pos.x, tgt.pos.y + (head ? (tgt.headY || 1.62) : (tgt.aimY || 1.28)), tgt.pos.z);
    if (!hit) {
      const slot = (w && w.slot) || "_def";
      const spread = (CBZ.NPC_SPREAD && (CBZ.NPC_SPREAD[slot] || CBZ.NPC_SPREAD._def)) || 0.055;
      const mul = CBZ.suppressionAccuracyMul ? CBZ.suppressionAccuracyMul(m) : 1;
      const dist = Math.hypot(tgt.pos.x - m.pos.x, tgt.pos.z - m.pos.z);
      const miss = spread * mul * dist * (0.5 + lcg() * 1.6);
      const ang = lcg() * Math.PI * 2;
      _v.x += Math.cos(ang) * miss;
      _v.y += (lcg() - 0.35) * miss * 0.8;
      _v.z += Math.sin(ang) * miss;
    }

    if (seen && fxBudget < 26) {
      fxBudget++;
      let from = null;
      if (cd2 < 130 * 130 && CBZ.actorMuzzle) from = CBZ.actorMuzzle(m, _muz);
      if (!from) from = _muz.set(m.pos.x + Math.sin(m.yaw) * 0.5, m.pos.y + 1.42, m.pos.z + Math.cos(m.yaw) * 0.5);
      // pellets read as a cone; everything else is one line
      const lines = (w && w.pellets) ? 3 : 1;
      for (let i = 0; i < lines; i++) {
        _v2.copy(_v);
        if (i) { _v2.x += (lcg() - 0.5) * 1.6; _v2.y += (lcg() - 0.5) * 0.9; _v2.z += (lcg() - 0.5) * 1.6; }
        CBZ.tracer(from, _v2, { shooter: m, targetActor: tgt, muzzle: i === 0,
          muzzleScale: (w && w.flash ? 0.5 + w.flash : 0.9) });
      }
      const dCam = Math.sqrt(cd2);
      if (w && w.sfx && dCam < 230) {
        try {
          CBZ.sfx(w.sfx, { dist: dCam, ghost: true, volume: (w.sfxVol || 1) * 0.82,
            pitch: w.sfxPitch || 1, delay: dCam > 40 ? dCam / 343 : 0 });
        } catch (e) {}
      }
      if (!hit) missImpact(from, _v, cd2);
    }

    if (hit) {
      stats[m.team].hits++;
      m.hitsF++; gunLedger(m.wid).hits++;
      if (CBZ.bodyWound && cd2 < 90 * 90) { try { CBZ.bodyWound(tgt, _v, {}); } catch (e) {} }
      // combat_iq's ladder is authored for fights against the PLAYER, whose
      // fairness cap this page has no player to need. Army-on-army trades at
      // band edge under mutual suppression, so battles read livelier a step
      // hotter — a page rule, applied where damage lands, never inside the IQ.
      hurtMan(tgt, r.dmg * 1.45 * (head ? 2.2 : 1), { by: m, headshot: head });
    }
  }
  // where did the miss land: walk the line for the first collider, else the
  // ground, and let gunfx stamp the world so the fight leaves evidence
  const _mq = [];
  function missImpact(from, to, cd2) {
    if (cd2 > 150 * 150) return;
    const dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z;
    const len = Math.hypot(dx, dy, dz);
    if (len < 1) return;
    const steps = Math.min(14, Math.ceil(len / 2.4));
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const x = from.x + dx * t, y = from.y + dy * t, z = from.z + dz * t;
      const g = MAP.groundAt(x, z);
      if (y <= g + 0.05) {
        _v2.set(x, g + 0.03, z);
        CBZ.bulletImpact(_v2, { x: 0, y: 1, z: 0 }, { kind: "dust", power: 0.8 });
        return;
      }
      const cols = CBZ.micro.queryColliders(x, z, 0.4, _mq);
      for (let c = 0; c < cols.length; c++) {
        const b = cols[c];
        if (x < b.minX || x > b.maxX || z < b.minZ || z > b.maxZ) continue;
        if (b.y0 != null && (y < b.y0 || y > b.y1)) continue;
        _v2.set(x, y, z);
        const nx = Math.abs(x - b.minX) < Math.abs(x - b.maxX) ? -1 : 1;
