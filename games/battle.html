        CBZ.bulletImpact(_v2, { x: nx, y: 0.2, z: 0 }, { kind: "spark", power: 1 });
        if (CBZ.bulletHole) CBZ.bulletHole(_v2, { x: nx, y: 0, z: 0 }, { mm: 8, noProp: true });
        return;
      }
    }
  }

  /* ---- rockets: the launcher classes fly a real round and detonate
     through studio.boom, which damages BOTH rosters through the caps bus
     and takes the building face with it outside the kill box. ---- */
  function fireRocket(m, tgt) {
    const w = CBZ.weaponById(m.wid);
    m.mag--; m.lastShotT = simT;
    stats[m.team].shots++;
    m.shotsF++; gunLedger(m.wid).shots++;
    shotsRing.push({ x: m.pos.x, z: m.pos.z, t: simT, m: m });
    let from = null;
    if (camDist2(m.pos) < 150 * 150 && CBZ.actorMuzzle) from = CBZ.actorMuzzle(m, _muz);
    if (!from) from = _muz.set(m.pos.x + Math.sin(m.yaw) * 0.6, m.pos.y + 1.45, m.pos.z + Math.cos(m.yaw) * 0.6);
    const dx = tgt.pos.x - from.x, dy = (tgt.pos.y + 1.1) - from.y, dz = tgt.pos.z - from.z;
    const dist = Math.hypot(dx, dz);
    const spd = (w.projSpeed || 60) * 0.95;
    const grav = w.projGravity || 6;
    const tFly = dist / spd;
    const r = {
      pos: V().copy(from),
      vel: new THREE.Vector3(dx / tFly, dy / tFly + 0.5 * grav * tFly, dz / tFly),
      grav: grav, t: 0, w: w, by: m,
      trail: CBZ.studio.trail({ length: 26, color: 0xd8c39a, opacity: 0.5, minStep: 1.6 }),
    };
    rockets.push(r);
    const dCam = Math.sqrt(camDist2(m.pos));
    if (dCam < 240) {
      try { CBZ.sfx(w.sfx || "shoot_shotgun", { dist: dCam, ghost: true, pitch: w.sfxPitch || 1, volume: (w.sfxVol || 1) * 0.85 }); } catch (e) {}
      CBZ.muzzleFlash(from, { scale: 1.6 });
    }
  }
  function stepRockets(sdt) {
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.t += sdt;
      r.vel.y -= r.grav * sdt;
      r.pos.addScaledVector(r.vel, sdt);
      r.trail.push(r.pos);
      let boom = r.t > 7 || r.pos.y <= MAP.groundAt(r.pos.x, r.pos.z) + 0.25;
      if (!boom) {
        const cols = CBZ.micro.queryColliders(r.pos.x, r.pos.z, 0.5, _mq);
        for (let c = 0; c < cols.length; c++) {
          const b = cols[c];
          if (r.pos.x < b.minX || r.pos.x > b.maxX || r.pos.z < b.minZ || r.pos.z > b.maxZ) continue;
          if (b.y0 != null && (r.pos.y < b.y0 || r.pos.y > b.y1)) continue;
          boom = true; break;
        }
      }
      if (boom) {
        r.trail.dispose();
        rockets.splice(i, 1);
        CBZ.studio.boom({ x: r.pos.x, y: Math.max(r.pos.y, MAP.groundAt(r.pos.x, r.pos.z) + 0.6), z: r.pos.z }, {
          radius: r.w.blastRadius || 13, power: (r.w.blastPower || 1.9) * 0.55,
          structural: MAP.id !== "arena" && spawnTotal < 700,
          // THE MAN WHO FIRED IT. blastWorldActors has forwarded `opts.by` to
          // every hurt call since it was written; this page simply never told
          // it whose rocket that was, so a launcher crew's kills credited
          // nobody — measured on an EVERYTHING roster where the bazooka ended
          // the battle and finished the ledger with 0 kills against its name.
          by: r.by,
        });
      }
    }
  }

  /* ============================================================ AIR SUPPORT
     A team's bombers are the SHIPPED B-2 on the derived-coefficient airframe,
     dropping ordnance sticks on the densest enemy concentration the grid can
     see. The nuke run is one aircraft, one release, after the armies have
     already met — then it leaves. Aircraft are equipment, not actors: nobody
     down there has anything that reaches 330 m. */
  const airAim = { red: null, blue: null };   // where each team's AIR is looking (enemy mass)
  let airAimT = 0;
  function densestCellOf(team) {
    let best = null, bn = 0;
    grid.forEach(function (a) {
      let n = 0, x = 0, z = 0;
      for (let i = 0; i < a.length; i++) {
        const m = a[i];
        if (m.dead || m.team !== team) continue;
        n++; x += m.pos.x; z += m.pos.z;
      }
      if (n > bn) { bn = n; best = { x: x / n, z: z / n, n: n }; }
    });
    return best;
  }
  function spawnPlanes() {
    ["red", "blue"].forEach(function (team) {
      const opt = team === "red" ? SET.redS : SET.blueS;
      if (opt === "none") return;
      const count = opt === "bomber2" ? 2 : 1;
      for (let i = 0; i < count; i++) {
        const side = team === "red" ? -1 : 1;
        const isNuke = opt === "nuke" && i === 0;
        // A NUKE PLANE NEVER TURNS. A loaded bomber's turnaround measured
        // close to a minute here, longer than half a war — so the armed run
        // is its FIRST run: it spawns however far out release-time-times-
        // airspeed says, already nose-on, and simply arrives.
        // release happens ~1.3 km short of the mass (that is how far a bomb
        // thrown at 165 m/s travels): the spawn distance buys the seconds
        // that put each plane's FIRST window after its own opening gate
        const dist = isNuke ? Math.max(2800, 165 * (AIR.nukeAt + 6)) : 3400;
        const sx = MAP.cx + side * dist, sz = MAP.cz + (300 + i * 340) * side;
        const flown = CBZ.studio.fly("bomber", {
          groundAt: MAP.groundAt,
          at: { x: sx, y: 330 + i * 45, z: sz },
          heading: Math.atan2(sx - MAP.cx, sz - MAP.cz), speed: 165,
        });
        if (!flown || !flown.af) return;
        planes.push({
          team: team, af: flown.af, group: flown.group,
          mode: "in", outPt: null, runPt: null,
          nuke: isNuke, egress: false, dropCool: 1 + i * 2,
          trail: CBZ.studio.trail({ length: 60, color: TEAMS[team].color, opacity: 0.35, minStep: 24 }),
        });
      }
    });
    if (planes.length) hud.feed("AIR IS UP");
  }
  function dropStick(p) {
    // five bombs a pass on a long cooldown: air PUNCTUATES an infantry fight.
    // Seven on a short one deleted both armies at first contact and the
    // scoreboard read 8% infantry hits — a bombing demo, not a war.
    p.dropCool = 15 + lcg() * 9;
    AIR.sticks = (AIR.sticks || 0) + 1;
    CBZ.ordnance.stick({
      count: 5, interval: 0.14, kind: "iron", team: p.team, owner: "air-" + p.team,
      getState: function () { return p.af ? { pos: p.af.pos, vel: p.af.vel } : null;
      },
      onDetonate: function (b) {
        if (b && b.impact && MAP.id !== "arena") {
          CBZ.studio.collapseAt(b.impact, { radius: b.radius, power: b.power });
        }
      },
    });
  }
  function releaseNuke(p) {
    p.nuke = false; p.egress = true;
    AIR.nukes = (AIR.nukes || 0) + 1;
    const kinds = CBZ.ordnance.kinds || {};
    CBZ.ordnance.release({
      pos: p.af.pos, vel: p.af.vel, kind: kinds.nuke ? "nuke" : "heavy",
      team: p.team, owner: "air-" + p.team,
      onDetonate: function (b) {
        const f = el("nflash");
        if (f) {
          f.style.transition = "none"; f.style.opacity = "1";
          setTimeout(function () { f.style.transition = "opacity 2.6s"; f.style.opacity = "0"; }, 90);
        }
        if (b && b.impact && MAP.id !== "arena") {
          for (let r = 0; r < 9; r++) {
            const a = (r / 9) * Math.PI * 2, d = b.radius * 0.5;
            CBZ.studio.collapseAt({ x: b.impact.x + Math.cos(a) * d, y: b.impact.y, z: b.impact.z + Math.sin(a) * d },
              { radius: d * 0.5, power: 3 });
          }
        }
      },
    });
    banner("NUKE AWAY", TEAMS[p.team].name + " AIR");
  }
  /* A bomber at 165 m/s turns on a KILOMETRES-wide circle — measured here:
     bank-limited, ~1.6 km radius, which is why "orbit the target" never put
     the fall line over the mass and the first build dropped nothing all
     battle. So it flies what real bombers fly: a RACETRACK. A long straight
     run-in (head-on geometry always sweeps the release solution through the
     aim), one stick per pass, then a slow wide turnaround far past the
     target and back in. The pause between passes is not a limitation, it is
     the drone of a returning bomber. */
  function stepPlanes(sdt) {
    for (let i = planes.length - 1; i >= 0; i--) {
      const p = planes[i];
      const enemy = p.team === "red" ? "blue" : "red";
      const aim = airAim[p.team] || teamCOM[enemy];
      p.dropCool -= sdt;
      const distAim = Math.hypot(p.af.pos.x - aim.x, p.af.pos.z - aim.z);
      /* THE ORBIT TRAP, measured twice before this shape: a jet whose turn
         circle is WIDER than its distance to the mark can chase the mark's
         bearing forever and never arrive — it settles into a stable ring at
         exactly its own turn radius (logged: d≈1.1 km, "inbound", for a
         whole battle). So the pattern is a real attack profile:
           out  — fly well past the mass and away (3 km), any bank
           turn — far out, slow to ~90 and haul around until the nose is ON
           in   — LOCK THE LINE: a fixed point far beyond the mass on the
                  run-in bearing; never chase the aim sideways again. The
                  predict gate spends the precision; the line spends none. */
      let hx, hz, phase = p.egress ? "egress" : p.mode;
      if (phase === "egress") {
        hx = MAP.cx + (p.team === "red" ? -4200 : 4200); hz = MAP.cz;
      } else if (phase === "out") {
        hx = p.outPt.x; hz = p.outPt.z;
        if (distAim > 1900) { p.mode = "turn"; phase = "turn"; }
      }
      if (phase === "turn") {
        hx = aim.x; hz = aim.z;
        let hErr = Math.atan2(p.af.pos.x - aim.x, p.af.pos.z - aim.z) - p.af.heading();
        while (hErr > Math.PI) hErr -= Math.PI * 2;
        while (hErr < -Math.PI) hErr += Math.PI * 2;
        if (Math.abs(hErr) < 0.3) {
          p.mode = "in"; phase = "in";
          const fx = aim.x - p.af.pos.x, fz = aim.z - p.af.pos.z;
          const fl = Math.hypot(fx, fz) || 1;
          p.runPt = { x: aim.x + (fx / fl) * 3000, z: aim.z + (fz / fl) * 3000 };
        }
      }
      if (phase === "in") {
        // the line is RE-LOCKED while far (the mass marches; a line drawn at
        // spawn points at where they were) and FROZEN inside 1200 m, where
        // chasing the aim sideways is the orbit trap again
        if (!p.runPt || (distAim > 1200 && (p.relockT = (p.relockT || 0) - sdt) <= 0)) {
          p.relockT = 2;
          const fx = aim.x - p.af.pos.x, fz = aim.z - p.af.pos.z;
          const fl = Math.hypot(fx, fz) || 1;
          p.runPt = { x: aim.x + (fx / fl) * 3000, z: aim.z + (fz / fl) * 3000 };
        }
        hx = p.runPt.x; hz = p.runPt.z;
      }
      // the airframe convention: heading h means forward is (-sin h, -cos h)
      const hdg = Math.atan2(p.af.pos.x - hx, p.af.pos.z - hz);
      _v.set(p.af.pos.x - Math.sin(hdg) * 2400, 330, p.af.pos.z - Math.cos(hdg) * 2400);
      const cmd = p.af.steerTo(_v, { gain: 2.4, bankLimit: phase === "turn" ? 1.15 : 0.8 });
      p.af.holdAltitude(330, cmd);
      p.af.throttle = phase === "turn" ? 0.42 : 0.72;
      p.af.step(sdt, cmd);
      if (p.group) p.af.applyTo(p.group);
      if (p.trail) p.trail.push(p.af.pos);
      if (p.egress) {
        if (Math.hypot(p.af.pos.x - MAP.cx, p.af.pos.z - MAP.cz) > 3200) {
          if (p.trail) p.trail.dispose();
          if (p.group) CBZ.studio.drop(p.group);
          if (p.af.dispose) p.af.dispose();
          planes.splice(i, 1);
        }
        continue;
      }
      if (p.mode !== "in" && distAim > 500) continue;
      // release when the SHARED integrator says the fall lands on the mass —
      // the same one-integrator rule the bombing game learned the hard way
      let dropped = false;
      if (CBZ.ordnance.predict) {
        const wantNuke = p.nuke && simT >= AIR.nukeAt;
        const nukeKind = (CBZ.ordnance.kinds && CBZ.ordnance.kinds.nuke) ? "nuke" : "heavy";
        const pr = CBZ.ordnance.predict(p.af.pos, p.af.vel, wantNuke ? nukeKind : "iron", 40);
        if (pr && pr.x != null) {
          const d = Math.hypot(pr.x - aim.x, pr.z - aim.z);
          p._predD = d;
          // a kilometre-radius weapon does not need a bullseye: any pass
          // within a few hundred metres of the mass IS on target
          if (wantNuke && (d < 400 || distAim < 700)) { releaseNuke(p); dropped = true; }
          // no bombs before the lines have even formed: the opening belongs
          // to the infantry, the air arrives ON a battle. The stick WALKS, so
          // overhead within half its spread is close enough when the
          // predicted point never quite kisses the aim.
          else if (!p.nuke && (d < 110 || (d < 300 && distAim < 500)) && p.dropCool <= 0 && simT > 10) { dropStick(p); dropped = true; }
        } else p._predD = -2;
      }
      // one pass, one stick: past the mass (or having dropped, or overshot
      // the locked line), swing out and set up the next run
      const overshot = p.runPt && Math.hypot(p.af.pos.x - p.runPt.x, p.af.pos.z - p.runPt.z) < 1100;
      if (!p.egress && p.mode === "in" && (dropped || distAim < 300 || overshot)) {
        p.mode = "out"; p.runPt = null;
        // outbound point: straight ahead through the mass and past it — kept
        // short, because every metre out here is lap time between passes
        const fwdH = p.af.heading();
        p.outPt = { x: p.af.pos.x - Math.sin(fwdH) * 1900, z: p.af.pos.z - Math.cos(fwdH) * 1900 };
      }
    }
  }

  /* ============================================================ THINK
     Slow tick per man: pick a mark, hand steering to combat_iq's posture
     (cover, fire token, band, bearing slot), advance when walls have kept
     the mark unseen too long. The fast path below only moves and shoots. */
  // nobody in sight: MARCH. Squads move as ranked columns behind their
  // senior man — the approach reads as an army, and it costs one lookup
  // per follower. Contact dissolves the parade: the moment anyone has a
  // mark, combat_iq (or the beast brain) owns him.
  //
  // THE SENIOR MAN IS THE ONLY ONE WHO NAVIGATES. He descends the flow
  // field, the column trails him on his own bearing, and a squad rounds a
  // block as a squad. Before this, every follower solved the same wall
  // independently and the formation came apart on the first corner.
  // (Shared with the beasts verbatim: a wolf pack files through the same
  // streets the men do, and spreads the same way when it finds the fight.)
  function marchGoal(m) {
    const com = teamCOM[m.team === "red" ? "blue" : "red"];
    const sq = squads[m.team][m.sq];
    let lead = null;
    if (sq) for (let i = 0; i < sq.length; i++) if (!sq[i].dead) { lead = sq[i]; break; }
    if (lead && lead !== m) {
      const ahead = lead.target;
      const my = Math.atan2(ahead.x - lead.pos.x, ahead.z - lead.pos.z);
      const row = ((m.sqSlot / 2) | 0) + 1, col = (m.sqSlot & 1) ? 1.25 : -1.25;
      m.target.set(
        lead.pos.x - Math.sin(my) * row * 2.0 + Math.cos(my) * col, 0,
        lead.pos.z - Math.cos(my) * row * 2.0 - Math.sin(my) * col);
    } else if (!navStep(m, m.target)) {
      const j = m.hunt ? 0 : 14;      // a hunt marches STRAIGHT at them
      m.target.set(com.x + (lcg() - 0.5) * j, 0, com.z + (lcg() - 0.5) * j);
    }
    // a pack marching in also spreads: the column-follow above is a MAN's
    // formation, and animals that ignore it would otherwise walk in a stack
    if (m.beast) spreadGoal(m);
    m.slot = "march";
  }
  /* THE WALL RULE — the fix this wave is actually for. A combat goal is only
     a straight line if the world agrees: posture()'s bearing and band goals
     are pure geometry around the mark, and in a real downtown they routinely
     land through a building, which is the man pressing his face into the
     facade until the detour timer spins him. One torso-height segment test
     per think; when the line is walled, descend the flow field instead — the
     same "around, not through" the marches already use. ?steer=old reverts. */
  function goalBlocked(m) {
    return CBZ.micro.segmentBlocked(
      m.pos.x, m.pos.y + 1.1, m.pos.z,
      m.target.x, MAP.groundAt(m.target.x, m.target.z) + 1.1, m.target.z);
  }
  function steerAroundWalls(m) {
    if (STEER_OLD) return;
    const gd = Math.hypot(m.target.x - m.pos.x, m.target.z - m.pos.z);
    if (gd > 8 && goalBlocked(m) && navStep(m, m.target)) {
      // the field hands every man in a cell the SAME cell centre, and two
      // walled men approaching it from opposite sides would meet head-on at
      // a point by construction. A man-stable lateral inside the 4 m cell
      // keeps the descent direction and loses the pile-up.
      m.target.x += ((m.i % 5) - 2) * 0.8;
      m.target.z += (((m.i * 7) % 5) - 2) * 0.8;
    }
  }
  /* A CHARGE IS NOT A QUEUE.

     The men have had a goal-level anti-clump since the first build: after
     combat_iq picks a spot, the goal is pushed off whichever mates are
     already standing near it, so two riflemen are never sent to the same
     metre of street. The beasts had NOTHING — every lion in the pride was
     steered at the same enemy body, so a hundred goals stacked on one point
     and the separation pass spent every frame shoving apart bodies that the
     steering shoved straight back together. Measured on 120 lions v 400 dogs:
     70 overlapping pairs at peak, and the probe named them for what they were
     — same team, both charging, mostly not even fighting anybody yet.

     Same rule as the men's, in the pair's own units: two lions need more room
     than two dogs, and the fine grid already knows who is nearby. */
  const _bn = [];
  function spreadGoal(m) {
    const reach = (m.rad + bodyRadMax) * 1.3;
    const a = fineNear(m.target.x, m.target.z, reach, _bn);
    let ox = 0, oz = 0, n = 0;
    for (let i = 0; i < a.length && n < 5; i++) {
      const o = a[i];
      if (o === m || o.dead || o.team !== m.team) continue;
      const want = (m.rad + (o.rad || 0.45)) * 1.1;
      const dx = m.target.x - o.pos.x, dz = m.target.z - o.pos.z;
      const d = Math.hypot(dx, dz);
      if (d > want || d < 0.001) continue;
      ox += (dx / d) * (want - d); oz += (dz / d) * (want - d); n++;
    }
    if (n) { m.target.x += ox; m.target.z += oz; }
  }
  // the beast's slow tick: pick the fight, close on it, surround it. The
  // strike itself is creature_combat's, in the bubble stepMan owns.
  function thinkBeast(m, tgt, thinkDt) {
    const tn = m.tn;
    // a mauled animal that is not one of the brave ones quits and runs — and
    // is run down or lives by the same chase-and-retreat physics the men
    // already play by. Prey species skip straight to flight.
    const beaten = m.hp < m.maxHp * 0.3 && !tn.brave;
    if (beaten || tn.prey) {
      const com = teamCOM[m.team === "red" ? "blue" : "red"];
      const fx = m.pos.x - (tgt ? tgt.pos.x : com.x), fz = m.pos.z - (tgt ? tgt.pos.z : com.z);
      const fl = Math.hypot(fx, fz) || 1;
      m.target.set(m.pos.x + (fx / fl) * 16, 0, m.pos.z + (fz / fl) * 16);
      m.slot = "fallback"; m.state = "flee"; m.tgt = null;
      return;
    }
    m.state = "charge";                        // the gait's flee-bound reads this
    const sees = eyeLos(m, tgt);
    m.sees = sees;
    if (!sees) {
      m.losBadT += thinkDt;
      if (m.losBadT > 7) { m.tgt = null; m.losBadT = 0; return; }
      if (m.losBadT > 2.0) {                   // an animal does not trade with a facade at all
        if (!navStep(m, m.target)) m.target.set(tgt.pos.x, 0, tgt.pos.z);
        m.slot = "push";
        return;
      }
    } else m.losBadT = 0;
    const d = Math.hypot(tgt.pos.x - m.pos.x, tgt.pos.z - m.pos.z);
    if (d < 14) {
      /* THE SURROUND: a pack does not queue single file behind the prey.
         Each pack index takes a bearing around the mark — the same slot idea
         the gunmen's fire arcs use, at claw range.

         The ring is the two BODIES' own sizes, not a fraction of the reach.
         Sizing it off reach put every attacker inside the clearance the
         separation pass was simultaneously trying to keep them at, so the two
         rules fought each other and the pack shimmered through itself — 25 of
         the 32 overlapping pairs in the lions-and-dogs measurement were on a
         surround ring. Twelve bearings around the WHOLE circle, too: seven
         slots across 172 degrees left the far side of the prey empty. */
      /* AND THE RING HAS A CAPACITY. One ring at touching distance holds
         2*pi*r / (bodies wide) animals and no more — for dogs on a lion that
         is eight — so when four hundred dogs pick the same lion, the ring
         itself was ordering three hundred of them to stand inside each other.
         Twelve bearings on THREE concentric rings, assigned off the animal's
         own stable index: the front rank bites, the ranks behind wait their
         turn at a body's distance back, and a pack reads as a pack closing in
         rather than a single pile. */
      const slot = (m.i % 12) * (Math.PI / 6);
      const ringN = (((m.i / 12) | 0) % 3);
      const base = Math.atan2(m.pos.x - tgt.pos.x, m.pos.z - tgt.pos.z) + slot;
      const r = m.rad + (tgt.rad || 0.45) + 0.12 + ringN * m.rad * 1.9;
      m.target.set(tgt.pos.x + Math.sin(base) * r, 0, tgt.pos.z + Math.cos(base) * r);
    } else {
      m.target.set(tgt.pos.x, 0, tgt.pos.z);
      steerAroundWalls(m);
    }
    spreadGoal(m);
    m.slot = "push";
  }

  function think(m, now) {
    const thinkDt = Math.min(1.2, now - m.lastThink);
    m.lastThink = now;
    const crowd = men.length;
    m.thinkAt = now + 0.14 + Math.min(0.42, crowd / 2600) + lcg() * 0.06;
    m.hunt = HUNT[m.team];
    // a man stepping off his own man's firing line finishes the step. Half a
    // second of not re-deciding is the whole point: re-deciding is what put
    // him back in the lane.
    if (m.stepAsideT > 0 && m.tgt && !m.tgt.dead) { m.stepAsideT -= thinkDt; return; }

    if (!m.tgt || m.tgt.dead) { m.tgt = pickTarget(m, m.hunt ? SIGHT * 2 : SIGHT); m.losBadT = 0; }
    // CONTACT IS INFORMATION A SQUAD SHARES. Before marching blind past a
    // fight, a man asks his own column: a mate already engaged hands him the
    // mark, and the squad turns to the guns together instead of one man
    // duelling while nine file past. One squad scan per think, only while
    // unengaged — this is what "acting under orders" costs when it is real.
    if (!m.tgt && !SHARE_OLD) {
      /* AT MOST TWO MEN TURN ON ONE SHOUT. Whole-column adoption was a
         measured pile-up (ten mates beelining one mark crossed files into a
         sub-0.62 m pair on the arena probe); two is a buddy answering a
         contact, and the rest of the column keeps its shape and its march,
         acquiring organically as the fight arrives. The pair still tells
         the watcher the squad is a squad — without a scrum. */
      const sqB = squads[m.team][m.sq];
      if (sqB) for (let i = 0; i < sqB.length; i++) {
        const b = sqB[i];
        if (b === m || b.dead || !b.tgt || b.tgt.dead) continue;
        let onIt = 0;
        for (let j = 0; j < sqB.length; j++) {
          if (sqB[j] !== m && !sqB[j].dead && sqB[j].tgt === b.tgt) onIt++;
        }
        if (onIt >= 2) continue;
        const bd = Math.hypot(b.tgt.pos.x - m.pos.x, b.tgt.pos.z - m.pos.z);
        if (bd < SIGHT * 1.3) {
          m.tgt = b.tgt; m.losBadT = 0;
          // and hold rank for the rest of this beat — the man engages on his
          // own next think, with the fire arcs handing him a bearing.
          marchGoal(m);
          return;
        }
      }
    }
    const tgt = m.tgt;
    if (!tgt) { marchGoal(m); return; }
    if (m.beast) { thinkBeast(m, tgt, thinkDt); return; }
    const sees = eyeLos(m, tgt);
    m.sees = sees;
    if (!sees) {
      m.losBadT += thinkDt;
      // a wall has held this line too long: push up on the mark instead of
      // trading nothing with a facade. The assault around the corner IS the
      // readable behaviour — and "around" is the field's word, not a straight
      // line into the facade, which is what it used to mean.
      if (m.losBadT > 2.6) {
        // and a mark that stays unseeable even at arm's length is a dead end
        // (a body wedged in geometry, a hole nobody can shoot into) — let it
        // go and take the next fight rather than freezing the war on it
        if (m.losBadT > 7) { m.tgt = null; m.losBadT = 0; return; }
        if (!navStep(m, m.target)) m.target.set(tgt.pos.x, 0, tgt.pos.z);
        m.slot = "push";
        return;
      }
    } else m.losBadT = 0;

    if (m.fists) {
      // an unarmed man has one range: his arms. Close on the mark; inside it
      // IQ.melee (stepMan) owns the footwork, the guard and the swing.
      const d = Math.hypot(tgt.pos.x - m.pos.x, tgt.pos.z - m.pos.z);
      if (d > meleeReach(m, tgt)) {
        m.target.set(tgt.pos.x, 0, tgt.pos.z);
        steerAroundWalls(m);
      }
      m.slot = "push";
      return;
    }
    if (m.launcher) {
      // launchers stand off; combat_iq has no rocket column, so the band is ours
      const d = Math.hypot(tgt.pos.x - m.pos.x, tgt.pos.z - m.pos.z);
      if (d < 22) { m.target.set(m.pos.x + (m.pos.x - tgt.pos.x) / d * 12, 0, m.pos.z + (m.pos.z - tgt.pos.z) / d * 12); m.slot = "back"; }
      else if (d > 52) { m.target.set(tgt.pos.x, 0, tgt.pos.z); m.slot = "close"; }
      else { m.slot = "fire"; m.target.set(m.pos.x, 0, m.pos.z); }
      return;
    }
    const slot = CBZ.combatIQ && CBZ.combatIQ.posture
      ? CBZ.combatIQ.posture(m, tgt, thinkDt) : "fire";
    m.slot = slot || "fire";

    // THE WALL RULE RUNS BEFORE THE SPREAD, deliberately: a projected goal is
    // a flow-field cell CENTRE, and two men walled off the same bearing would
    // otherwise be handed the same metre of street — the anti-clump below has
    // to get the last word on every goal, projected or not. (cover and peek
    // hug walls by design — the hide point sits just past the box — so the
    // rule only audits the long moves: bands, bearings, flanks.)
    if (m.slot !== "cover" && m.slot !== "peek") steerAroundWalls(m);

    // anti-clump on the goal, from the grid: posture's own separation scans
    // city rosters, which are empty out here
    const a = grid.get(gridKey(Math.floor(m.pos.x / GRID_CELL), Math.floor(m.pos.z / GRID_CELL)));
    if (a && a.length > 1) {
      let ox = 0, oz = 0, n = 0;
      for (let i = 0; i < a.length && n < 4; i++) {
        const o = a[i];
        if (o === m || o.dead) continue;
        const dx = m.target.x - o.pos.x, dz = m.target.z - o.pos.z;
        const d = Math.hypot(dx, dz);
        if (d > 2.6 || d < 0.001) continue;
        ox += dx / d * (2.6 - d); oz += dz / d * (2.6 - d); n++;
      }
      m.target.x += ox; m.target.z += oz;
    }
  }

  /* ============================================================ SIM STEP */
  function stepMan(m, sdt) {
    if (m.dead) {
      if (m.dieT > 0 && m.dieT < 1) {
        m.dieT = Math.min(1, m.dieT + sdt * 2.4);
        const k = 1 - (1 - m.dieT) * (1 - m.dieT);
        // a man topples over his own facing; a four-legged body falls ONTO
        // ITS SIDE — the roll axis is the honest one for a quadruped
        if (m.beast) m.group.rotation.z = m.dieDir * k * 1.45;
        else m.group.rotation.x = m.dieDir * k * (Math.PI / 2 - 0.07);
      }
      return;
    }
    if (simT >= m.thinkAt) think(m, simT);
    if (m.reloadT > 0) {
      m.reloadT -= sdt;
      if (m.reloadT <= 0) m.mag = m.magSize;
    }
    m.cool -= sdt;

    // ---- THE STRIKE BUBBLE. Inside claw range creature_combat owns the
    // whole beat — approach, facing, windup, the hit, the recover — through
    // the exact seams it published: opts.move walks on THIS map's walls and
    // ground, opts.onHit lands in THIS page's damage funnel. Outside the
    // bubble the beast is just another marcher below.
    if (m.beast) {
      const bt = m.tgt;
      if (bt && !bt.dead && !over) {
        const bd = Math.hypot(bt.pos.x - m.pos.x, bt.pos.z - m.pos.z);
        if (bd < m.reach + 2.6) {
          beastFight(m, bt, sdt);
          // a striking beast still answers to the walls: the separation pass
          // shoves bodies without asking the world, and this early return
          // used to skip the standing resolve for the whole swing — measured
          // as one gorilla probed inside an arena crate mid-maul
          m.resT = (m.resT || 0) - sdt;
          if (m.resT <= 0) { m.resT = 0.25; CBZ.micro.resolveCircle(m.pos, m.rad || 0.5, m.pos.y, 1.8); }
          return;
        }
      } else if (m._atkAnim != null && m._atkAnim >= 0 && CBZ.creatureEndAttack) {
        // the victim died under the swing: cancel it CLEANLY or the strike
        // pose stays latched on a living body forever — measured on the
        // probe as _atkAnim frozen at 0.94 on a gorilla marching victorious
        try { CBZ.creatureEndAttack(m); } catch (e) {}
      }
    }

    // ---- move toward the goal combat_iq (or the march) set. A man is not a
    // pathfinder: when a wall eats his progress he slides ALONG it for a
    // while instead of pressing his face into it — one distance test, no
    // graph, and a column flows around a tower like water instead of queueing
    // against the facade (the shipped city bug this block exists to fix). ----
    const dx = m.target.x - m.pos.x, dz = m.target.z - m.pos.z;
    const d = Math.hypot(dx, dz);
    const tgt0 = m.tgt;
    const tdist = tgt0 && !tgt0.dead
      ? Math.hypot(tgt0.pos.x - m.pos.x, tgt0.pos.z - m.pos.z) : 1e9;
    let spd = 0;
    if (d > 1.1) {
      const hurtish = m.hp < m.maxHp * 0.45;
      // a wounded man limps AWAY slower than a fresh man walks IN — the old
      // 7.0 fallback outran every pursuer and froze a whole battle behind
      // one unkillable runner. And an army that outnumbers the last few
      // holdouts eight to one smells blood and sprints.
      if (m.beast) {
        // the species' own legs: charge in, lope on the march, and a beaten
        // runner flees just under charge pace — catchable, like the men
        const tn = m.tn;
        spd = m.slot === "fallback" ? tn.chase * 0.92 :
              m.slot === "push" ? tn.chase : tn.march;
        if (m.hunt && tdist < 999) spd = Math.max(spd, tn.chase * 1.08);
      } else {
        spd = m.slot === "fallback" ? 5.2 :
              (m.slot === "push" || m.slot === "march" || m.slot === "flank") ? (m.hunt ? 7.6 : 6.2) :
              (m.slot === "cover" || hurtish) ? 7.0 : 4.6;
        // holding the fire token forty metres out of range is not holding
        // anything: closing to the band is a RUN, whatever the slot says
        if (tdist < 1e9 && tdist > 42 && spd < 6.2) spd = m.hunt ? 7.6 : 6.4;
        // and a mob eight-to-one over the last holdouts does not respect the
        // band at all — it runs them down. This rule is what ENDS a battle.
        if (m.hunt && tdist < 999) spd = Math.max(spd, 8.0);
      }
      let nx = dx / d, nz = dz / d;
      if (m.detourT > 0) {
        m.detourT -= sdt;
        const sw = m.detourDir || 1;
        const tx = nz * sw, tz = -nx * sw;      // 90 degrees off the blocked line
        nx = tx; nz = tz;
      }
      const ox = m.pos.x, oz = m.pos.z;
      m.pos.x += nx * spd * sdt;
      m.pos.z += nz * spd * sdt;
      CBZ.micro.resolveCircle(m.pos, m.rad || 0.5, m.pos.y, 1.8);
      const got = Math.hypot(m.pos.x - ox, m.pos.z - oz);
      const want = spd * sdt;
      if (want > 0.001 && got < want * 0.25) {
        m.stuckT = (m.stuckT || 0) + sdt;
        if (PROBE) QUAL.wallSeconds += sdt;      // the wall-running metric, held near zero
        if (m.stuckT > 0.8) {
          m.stuckT = 0;
          m.detourT = 1.5 + ((m.i % 5) * 0.35);
          m.detourDir = (m.i & 1) ? 1 : -1;
        }
      } else if (got > want * 0.6 && m.stuckT) m.stuckT = Math.max(0, m.stuckT - sdt * 2);
    } else {
      // STANDING MEN GET RESOLVED TOO. The separation pass and blast shoves
      // move bodies without asking the world, and a man embedded in a crate
      // is invisible to every line of sight — an immortal, and a battle that
      // cannot end. A slow timer keeps the cost of honesty near zero.
      m.resT = (m.resT || 0) - sdt;
      if (m.resT <= 0) {
        m.resT = 0.25;
        CBZ.micro.resolveCircle(m.pos, m.rad || 0.5, m.pos.y, 1.8);
      }
    }
    m.speed = spd;
    m.pos.y = MAP.groundAt(m.pos.x, m.pos.z);

    // face the fight when there is one, else the walk
    const tgt = m.tgt;
    if (m.beast) {
      // the animal convention: heading h faces (cos h, sin h), nose on +X.
      // Outside the strike bubble the beast faces its own travel; inside it
      // creature_combat turned the head already.
      if (spd > 0.1 && d > 0.05) {
        const want = Math.atan2(dz, dx);
        let dh = want - m.heading;
        while (dh > Math.PI) dh -= Math.PI * 2;
        while (dh < -Math.PI) dh += Math.PI * 2;
        m.heading += dh * Math.min(1, sdt * 6);
        m.faceH = m.heading;
        CBZ.faceAnimalHeading(m, m.heading);
      }
      return;                                    // no rifle on an animal
    }
    const engaged = tgt && !tgt.dead && m.sees;
    if (!engaged && spd > 0.1) {
      const want = Math.atan2(dx, dz);
      let dy = want - m.yaw;
      while (dy > Math.PI) dy -= Math.PI * 2;
      while (dy < -Math.PI) dy += Math.PI * 2;
      m.yaw += dy * Math.min(1, sdt * 7);
      m.group.rotation.y = m.yaw;
    }

    // ---- the trigger ----
    if (!tgt || tgt.dead || m.reloadT > 0) return;
    const dist = Math.hypot(tgt.pos.x - m.pos.x, tgt.pos.z - m.pos.z);
    if (m.fists) {
      // THE PUNCH EXCHANGE is combat_iq's own melee brain — close, circle,
      // guard, windup, swing — the same beat structure every brawler in the
      // city fights with. It writes m.target for the footwork; "swing" is
      // the one frame a blow lands, through the same funnel as a bullet.
      const mr = meleeReach(m, tgt);
      if (dist < mr * 1.9 && CBZ.combatIQ && CBZ.combatIQ.melee) {
        // `incoming` is how a brawler reads the other man's windup and gets
        // his guard up — without it two NPCs never block each other
        const st = CBZ.combatIQ.melee(m, tgt, sdt,
          { reach: mr, incoming: (tgt._windup || 0) > 0 || (tgt._iqM && tgt._iqM.st === "windup") });
        if (st === "swing") {
          hurtMan(tgt, m.punch * (0.85 + lcg() * 0.4), { by: m });
          stats[m.team].shots++; stats[m.team].hits++;   // the ledger counts blows thrown and landed
          m.shotsF++; m.hitsF++; gunLedger("fists").shots++; gunLedger("fists").hits++;
        }
      }
      return;
    }
    if (m.launcher) {
      if (m.cool <= 0 && m.sees && dist > 16 && dist < 95) {
        const w = CBZ.weaponById(m.wid);
        fireRocket(m, tgt);
        if (m.mag <= 0) { m.reloadT = w.reloadTime || w.reload || 2; m.mag = 0; m.reloads++; gunLedger(m.wid).reloads++; }
        m.cool = (w.fireDelay || w.interval || 1.2) + 0.6 + lcg() * 0.8;
      }
      return;
    }
    const p = CBZ.combatIQ && CBZ.combatIQ.profile ? CBZ.combatIQ.profile(m) : null;
    let fireMax = p ? Math.min(125, p.hi * 2.6 + 8) : 60;
    if (m.hunt) fireMax *= 1.6;          // running a man down includes shooting at him
    if (!m.sees || dist > fireMax) return;
    if (m.slot !== "fire" && m.slot !== "peek" && m.slot !== "push" && m.slot !== "sidestep" && dist > 12) return;
    if (m.cool > 0) return;
    /* THE LINE IS CHECKED WHEN THE TRIGGER IS PULLED, NOT WHEN HE LAST THOUGHT.
       `m.sees` is up to half a second old — a think-tick answer about two men
       who have both been moving since — and stale LOS is how rounds get fired
       into a wall that closed in between (measured: 2 in the kill box, and it
       is the walls that move the count, not the men). This test only runs
       once the cooldown has already expired, so it costs about one segment
       trace per shot and it is what makes the blind-fire counter honest. */
    if (!FIRE_OLD) {
      m.sees = eyeLos(m, tgt);
      if (!m.sees) { m.cool = 0.12; return; }
      const side = mateInLane(m, tgt);
      if (side) { stepOffLine(m, tgt, side); return; }
    }
    const w = CBZ.weaponById(m.wid);
    const r = CBZ.combatIQ && CBZ.combatIQ.shot
      ? CBZ.combatIQ.shot(m, tgt, dist, 0, w ? w.damage : 14) : null;
    if (!r) { m.cool = 0.5; return; }
    m.cool = r.cd;
    if (!r.fire) return;
    fireShot(m, tgt, r);
    if (m.mag <= 0) {
      m.reloadT = (w && (w.reloadTime || w.reload)) || 1.6;
      m.reloads++; gunLedger(m.wid).reloads++;
      const dCam = Math.sqrt(camDist2(m.pos));
      if (dCam < 60 && CBZ.audioManifest && CBZ.audioManifest.effects && CBZ.audioManifest.effects.reload) {
        try { CBZ.sfx("reload", { dist: dCam, ghost: true }); } catch (e) {}
      }
    }
  }

  /* ============================================================ CAMERA
     Three postures. FREE: drag orbits, wheel zooms, WASD pans. FOLLOW: over
     the shoulder of whoever is doing the shooting. AUTO: a director that
     cuts between crane shots and shoulders wherever the fire is. Any manual
     input takes the camera back. */
  const cam = {
    mode: "auto",
    focus: V(), yaw: 0.9, pitch: 0.62, dist: 64,
    wFocus: V(), wYaw: 0.9, wPitch: 0.62, wDist: 64,
    followM: null, cutAt: 0, shot: "crane", craneSpin: 0.05,
    followTeam: "red", holdT: 0, reptT: 0,
  };
  /* THE CAMERA DOES NOT GO THROUGH A WALL.

     On sand and in the kill box the only thing between the lens and the fight
     was air, so the orbit arm never had to ask. Put the same director in the
     real downtown and it parks inside the Exchange Bank every other cut —
     measured, the first city capture of this wave is a screenshot of an
     office interior with a battle somewhere outside it.

     One segment test from the focus outward, and the arm shortens until the
     line is clear. It SNAPS in (a frame of masonry across the lens is worse
     than a jump) and eases back out, which is the ordinary third-person
     answer and the reason a pillar does not make the shot pump. */
  let camOccl = 1;
  function camApply(dt) {
    const k = 1 - Math.pow(0.002, dt);
    cam.focus.lerp(cam.wFocus, k);
    cam.yaw += (cam.wYaw - cam.yaw) * k;
    cam.pitch += (cam.wPitch - cam.pitch) * k;
    cam.dist += (cam.wDist - cam.dist) * k;
    const c = CBZ.camera;
    const cp = Math.max(0.12, Math.min(1.42, cam.pitch));
    const sx = Math.sin(cam.yaw) * Math.cos(cp), sz = Math.cos(cam.yaw) * Math.cos(cp), sy = Math.sin(cp);
    const fy = cam.focus.y + 1.2;
    let want = 1;
    if (CBZ.micro.segmentBlocked) {
      for (let t = 0; t < 6; t++) {
        const d = cam.dist * want;
        const px = cam.focus.x + sx * d, pz = cam.focus.z + sz * d;
        let py = cam.focus.y + sy * d;
        const g = MAP.groundAt(px, pz) + 1.6;
        if (py < g) py = g;
        if (!CBZ.micro.segmentBlocked(cam.focus.x, fy, cam.focus.z, px, py, pz)) break;
        want *= 0.62;
        if (cam.dist * want < 2.6) { want = 2.6 / Math.max(0.001, cam.dist); break; }
      }
    }
    camOccl = want < camOccl ? want : camOccl + (want - camOccl) * Math.min(1, dt * 1.6);
    const dist = cam.dist * camOccl;
    const x = cam.focus.x + sx * dist, z = cam.focus.z + sz * dist;
    let y = cam.focus.y + sy * dist;
    const g = MAP.groundAt(x, z) + 1.6;
    if (y < g) y = g;
    c.position.set(x, y, z);
    c.lookAt(cam.focus.x, fy, cam.focus.z);
  }
  function hotspot() {
    if (!shotsRing.length) return null;
    const seed = shotsRing[(lcg() * shotsRing.length) | 0];
    let x = 0, z = 0, n = 0;
    for (let i = 0; i < shotsRing.length; i++) {
      const s = shotsRing[i];
      if (simT - s.t > 7) continue;
      if (Math.hypot(s.x - seed.x, s.z - seed.z) > 46) continue;
      x += s.x; z += s.z; n++;
    }
    return n ? { x: x / n, z: z / n } : { x: seed.x, z: seed.z };
  }
  function hottestMan() {
    let best = null, bt = -1e9;
    for (let i = 0; i < men.length; i++) {
      const m = men[i];
      if (m.dead || m.lastShotT < bt) continue;
      bt = m.lastShotT; best = m;
    }
    return best;
  }
  /* ============================================================ THE POINT MAN
     THE CAMERA WAS RIDING THE BACK OF THE ARMY.

     "Whoever shot last" sounds like the action and is not: with five hundred
     men firing, the most recent trigger pull is a coin toss across the whole
     line, and because a column's REAR ranks have the clearest lanes past
     their own mates, the coin landed behind the army more often than in front
     of it. You watched shoulders and backpacks while the war happened three
     hundred metres up the street.

     The front of the group is a different man and a better one: he is the one
     in contact, he is the one being shot at, and he is the one who is about to
     die — which is exactly why the shot is worth taking. He is found as the
     living man CLOSEST TO THE ENEMY'S MASS, with one guard that matters: he
     must have his own group around him. Without it the pick is always the
     lunatic who broke ranks and sprinted forty metres ahead of everybody —
     the front of NOTHING, alone in a street, the least interesting man alive.
     So the deepest dozen are ranked, and the first one with mates at his
     shoulder takes the lens. */
  const POINT = { red: null, blue: null, at: -9 };
  const _pc = [];
  const _pn = [];
  function pointMan(team) {
    const foe = teamCOM[team === "red" ? "blue" : "red"];
    _pc.length = 0;
    for (let i = 0; i < men.length; i++) {
      const m = men[i];
      if (m.dead || m.team !== team) continue;
      // depth INTO the enemy, plus a nudge for a man who is actually in a
      // fight — at equal depth the engaged man is the one to watch
      const d = Math.hypot(m.pos.x - foe.x, m.pos.z - foe.z) - (m.tgt && !m.tgt.dead ? 5 : 0);
      _pc.push(m, d);
    }
    if (!_pc.length) return null;
    let first = null;
    for (let pass = 0; pass < 12; pass++) {
      let bi = -1, bd = 1e18;
      for (let i = 0; i < _pc.length; i += 2) {
        if (_pc[i] && _pc[i + 1] < bd) { bd = _pc[i + 1]; bi = i; }
      }
      if (bi < 0) break;
      const m = _pc[bi];
      _pc[bi] = null;
      if (!first) first = m;
      // does he have his group with him? three mates inside fifteen metres is
      // a spearhead; nobody inside fifteen metres is a man who has run away
      const near = fineNear(m.pos.x, m.pos.z, 15, _pn);
      let mates = 0;
      for (let k = 0; k < near.length; k++) {
        if (near[k] !== m && !near[k].dead && near[k].team === team && ++mates >= 3) break;
      }
      if (mates >= 3) return m;
    }
    return first;               // a squad of two left: the deepest IS the front
  }
  function updatePoint() {
    POINT.red = pointMan("red");
    POINT.blue = pointMan("blue");
    POINT.at = simT;
  }
  // who the lens should be on for a team: its point man, and never a corpse
  // (except for the death beat the director deliberately holds — see below)
  function subjectFor(team) {
    const p = POINT[team];
    if (p && !p.dead) return p;
    updatePoint();
    return POINT[team] && !POINT[team].dead ? POINT[team] : null;
  }
  /* THE FIGHT AXIS: the bearing from one army's mass to the other. Every shot
     below is framed off it, which is the whole difference between this
     director and the one that rolled `lcg() * 2PI` for its yaw and pointed the
     lens at a car park half the time. */
  function fightAxis() {
    const a = teamCOM.red, b = teamCOM.blue;
    const dx = b.x - a.x, dz = b.z - a.z;
    if (Math.abs(dx) + Math.abs(dz) < 0.001) return 0;
    return Math.atan2(dx, dz);              // camera-yaw convention: (sin, cos)
  }
  // is there sky between this focus and a camera parked on this bearing? The
  // arm-shortening in camApply saves a shot that is BLOCKED; it cannot save a
  // shot that is blocked in every direction because nobody checked before
  // committing. Four candidate bearings, one segment test each, per cut.
  function clearYaw(fx, fz, want, dist, spread) {
    const fy = MAP.groundAt(fx, fz) + 1.2;
    const tries = [0, spread, -spread, spread * 2, -spread * 2, Math.PI];
    for (let i = 0; i < tries.length; i++) {
      const y = want + tries[i];
      const px = fx + Math.sin(y) * dist * 0.86, pz = fz + Math.cos(y) * dist * 0.86;
      const py = Math.max(MAP.groundAt(px, pz) + 1.6, fy + dist * 0.4);
      if (!CBZ.micro.segmentBlocked || !CBZ.micro.segmentBlocked(fx, fy, fz, px, py, pz)) return y;
    }
    return want;
  }
  /* THE SHOT DECK. Four framings, all of them ABOUT something:
       point — over the point man's shoulder, looking where he is looking,
               which is at the men trying to kill him. The default, and the
               one the death beat belongs to.
       push  — planted in front of the advancing front rank, looking back
               INTO it: the shot that makes five hundred men read as five
               hundred men instead of a texture.
       line  — broadside of the contact, across the fight axis, both armies
               in frame trading fire.
       crane — high and wide down the axis, for the shape of the whole thing.
     Weights favour the point man because he is where the war is. */
  function directorCut() {
    const alive = aliveCount("red") + aliveCount("blue");
    const r = lcg();
    const subjTeam = lcg() < 0.5 ? "red" : "blue";
    const subj = subjectFor(subjTeam) || subjectFor(subjTeam === "red" ? "blue" : "red");
    cam.shot = !subj ? "crane" : r < 0.5 ? "point" : r < 0.7 ? "push" : r < 0.88 ? "line" : "crane";
    cam.followM = subj;
    cam.craneSpin = (lcg() < 0.5 ? -1 : 1) * (0.02 + lcg() * 0.035);
    // a good shot is held; a wide is a punctuation mark
    cam.cutAt = simT + (cam.shot === "point" ? 8 + lcg() * 5 : 5 + lcg() * 3);
    const ax = fightAxis();
    if (cam.shot === "line" || cam.shot === "crane") {
      const hs = (subj ? { x: subj.pos.x, z: subj.pos.z } : hotspot()) || { x: MAP.cx, z: MAP.cz };
      cam.wFocus.set(hs.x, MAP.groundAt(hs.x, hs.z), hs.z);
      if (cam.shot === "line") {
        // across the axis: both firing lines in profile
        cam.wDist = 22 + Math.min(46, Math.sqrt(alive) * 3.4);
        cam.wPitch = 0.3 + lcg() * 0.22;
        cam.wYaw = clearYaw(hs.x, hs.z, ax + (lcg() < 0.5 ? 1 : -1) * Math.PI / 2, cam.wDist, 0.5);
      } else {
        cam.wDist = 46 + Math.min(150, Math.sqrt(alive) * 9);
        cam.wPitch = 0.62 + lcg() * 0.4;
        cam.wYaw = clearYaw(hs.x, hs.z, ax + Math.PI + (lcg() - 0.5) * 0.8, cam.wDist, 0.6);
      }
    }
  }
  // the death beat: when the man on the lens goes down, the camera STAYS on
  // him for a moment. He is the point man — watching him fall IS the shot, and
  // cutting away on the frame he dies is throwing away the only moment the
  // whole follow was built to catch.
  function subjectDied() {
    cam.holdT = 1.5;
    cam.wPitch = 0.22;
    cam.wDist = 7.5;
  }
  function frameSubject(m, dt) {
    cam.wFocus.set(m.pos.x, m.pos.y, m.pos.z);
    if (cam.shot === "push") {
      // ahead of him, walking backwards as the army comes on
      cam.wYaw = m.yaw + (lcg() - 0.5) * 0.02;
      cam.wPitch = 0.2; cam.wDist = 13;
    } else {
      cam.wYaw = m.yaw + Math.PI + 0.35;
      cam.wPitch = 0.28; cam.wDist = 9.5;
    }
    if (cam.holdT > 0) cam.holdT -= dt;
  }
  function stepCamera(dt) {
    const IN = CBZ.micro.input;
    if (simT - POINT.at > 0.5) updatePoint();
    if (cam.mode === "auto") {
      const subj = cam.followM;
      const subjGone = (cam.shot === "point" || cam.shot === "push") &&
        (!subj || (subj.dead && cam.holdT <= 0));
      if (subj && subj.dead && cam.holdT === 0) subjectDied();
      if (simT >= cam.cutAt || subjGone) directorCut();
      if ((cam.shot === "point" || cam.shot === "push") && cam.followM) frameSubject(cam.followM, dt);
      else cam.wYaw += cam.craneSpin * dt * 8;
    } else if (cam.mode === "follow") {
      /* FOLLOW IS THE FRONT OF THE GROUP, ALWAYS — and "always" is the word
         the first build got wrong. Latching onto the point man once and
         riding him until he died measured at frontness 0.55 over a 150-a-side
         city fight: the man the camera picked at the start of the advance was
         mid-pack by the time the armies met, because the FRONT MOVED and the
         camera did not. Half the army was ahead of the lens, which is the
         original complaint wearing a new hat.

         So the lens also hands over while he lives — but only when the front
         has genuinely left him behind (twelve metres, on a three-second
         cadence), never on the metre-to-metre jostle of a firing line. He
         dies, the camera holds the beat, then it takes the man who stepped
         over him. */
      const m = cam.followM;
      if (m && m.dead && cam.holdT === 0) subjectDied();
      if (!m || (m.dead && cam.holdT <= 0)) {
        const next = subjectFor(cam.followTeam);
        if (next) { cam.followM = next; cam.holdT = 0; cam.reptT = simT + 3; }
      } else if (!m.dead && simT >= cam.reptT) {
        cam.reptT = simT + 3;
        const p = POINT[cam.followTeam];
        if (p && p !== m && !p.dead) {
          const foe = teamCOM[cam.followTeam === "red" ? "blue" : "red"];
          const dm = Math.hypot(m.pos.x - foe.x, m.pos.z - foe.z);
          const dp = Math.hypot(p.pos.x - foe.x, p.pos.z - foe.z);
          if (dm - dp > 12) cam.followM = p;
        }
      }
      if (cam.followM) frameSubject(cam.followM, dt);
    } else if (IN) {
      const fwd = 46 * dt * (cam.dist / 60 + 0.4);
      const mx = IN.axis("KeyA", "KeyD"), mz = IN.axis("KeyS", "KeyW");
      if (mx || mz) {
        cam.wFocus.x += (-Math.sin(cam.yaw) * mz - Math.cos(cam.yaw) * mx) * fwd;
        cam.wFocus.z += (-Math.cos(cam.yaw) * mz + Math.sin(cam.yaw) * mx) * fwd;
        cam.wFocus.y = MAP.groundAt(cam.wFocus.x, cam.wFocus.z);
      }
    }
    camApply(dt);
  }
  /* ============================================================ THE CARD
     What the man on the lens is doing, in the only four numbers that matter
     while you are watching him: how hurt he is, what he is holding, how many
     rounds are left in it, and how many men he has killed. The magazine is
     the point — a rifle emptying and a man reloading behind a wall is the
     rhythm of the whole fight and it was happening invisibly.

     Every write is guarded by a cached string: this runs at 10 Hz on a page
     that is already drawing a thousand bodies, so it must not touch the DOM
     when nothing has changed. */
  const whoC = { n: "", g: "", a: "", k: "", hp: -1, mag: -1, rl: null, on: null, down: null };
  function stepWho() {
    const m = (cam.mode === "follow" || cam.shot === "point" || cam.shot === "push")
      ? cam.followM : null;
    const on = !!m;
    if (on !== whoC.on) { whoC.on = on; el("who").style.display = on ? "block" : "none"; }
    if (!m) return;
    const down = !!m.dead;
    if (down !== whoC.down) { whoC.down = down; el("who").classList.toggle("down", down); }
    const name = m.beast ? String(m.species.name).toUpperCase()
      : TEAMS[m.team].name + " " + (m.i + 1);
    const n = name + (down ? " <i>DOWN</i>" : "");
    if (n !== whoC.n) { whoC.n = n; el("whoN").innerHTML = n;
      el("whoN").style.color = "#" + TEAMS[m.team].color.toString(16).padStart(6, "0"); }
    const hp = m.maxHp > 1e8 ? 1 : Math.max(0, Math.min(1, m.hp / m.maxHp));
    if (Math.abs(hp - whoC.hp) > 0.01) {
      whoC.hp = hp;
      const s = el("whoHp").firstElementChild;
      s.style.width = (hp * 100) + "%";
      s.style.background = hp > 0.6 ? "#4fbf6a" : hp > 0.3 ? "#e2c14a" : "#ff5a3d";
    }
    const gun = m.beast ? "CLAWS AND TEETH" : m.fists ? "FISTS"
      : ((CBZ.weaponById(m.wid) || {}).label || m.weapon || "").toUpperCase();
    if (gun !== whoC.g) { whoC.g = gun; el("whoGun").textContent = gun; }
    // ammo: rounds left, or the reload counting itself down
    const reloading = m.reloadT > 0;
    const ammo = m.magSize > 0
      ? (reloading ? "RELOADING" : m.mag + "/" + m.magSize) : "—";
    if (ammo !== whoC.a) { whoC.a = ammo; el("whoAmmo").textContent = ammo; }
    const w = m.magSize > 0 ? (CBZ.weaponById(m.wid) || {}) : null;
    const full = w ? ((w.reloadTime || w.reload) || 1.6) : 1;
    const frac = m.magSize > 0
      ? (reloading ? Math.max(0, Math.min(1, 1 - m.reloadT / full)) : m.mag / m.magSize) : 0;
    if (Math.abs(frac - whoC.mag) > 0.01 || reloading !== whoC.rl) {
      whoC.mag = frac; whoC.rl = reloading;
      const t = el("whoMagT");
      t.style.display = m.magSize > 0 ? "block" : "none";
      t.classList.toggle("rl", reloading);
      t.firstElementChild.style.width = (frac * 100) + "%";
    }
    const k = "<b>" + (m.kills || 0) + "</b> KILLS" +
      (m.magSize > 0 ? " &middot; " + (m.reloads || 0) + " RELOADS" : "") +
      (m.shotsF ? " &middot; " + Math.round((m.hitsF / m.shotsF) * 100) + "% HIT" : "");
    if (k !== whoC.k) { whoC.k = k; el("whoK").innerHTML = k; }
  }

  function setCamMode(mode, team) {
    cam.mode = mode;
    if (team) cam.followTeam = team;
    el("cCam").textContent = mode === "auto" ? "AUTO CAM"
      : mode === "follow" ? "FOLLOW " + TEAMS[cam.followTeam].name : "FREE CAM";
    el("cCam").classList.toggle("on", mode === "auto");
    if (mode === "follow") {
      updatePoint();
      cam.followM = subjectFor(cam.followTeam) || hottestMan();
      cam.holdT = 0; cam.reptT = simT + 3;
      cam.shot = "point";          // else a stale AUTO framing rides along
    }
  }
  // AUTO -> FOLLOW RED -> FOLLOW BLUE -> FREE. Both armies have a front, and
  // which one you want to ride is the whole question a spectator has.
  function cycleCam() {
    if (cam.mode === "auto") setCamMode("follow", "red");
    else if (cam.mode === "follow" && cam.followTeam === "red") setCamMode("follow", "blue");
    else if (cam.mode === "follow") setCamMode("free");
    else setCamMode("auto");
  }
  // manual orbit: pointers on the page, ignored while the UI owns them
  let drag = null;
  const pinch = { d: 0 };
  function uiTarget(e) {
    return e.target && (e.target.closest && e.target.closest("#menu,#ctl,#end,button,select,input"));
  }
  window.addEventListener("pointerdown", function (e) {
    if (!started || uiTarget(e)) return;
    if (cam.mode !== "free") setCamMode("free");
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, b: e.button };
  });
  window.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.b === 2) {
      const s = cam.dist * 0.0016;
      cam.wFocus.x += (-Math.cos(cam.yaw) * -dx + Math.sin(cam.yaw) * -dy) * s;
      cam.wFocus.z += (Math.sin(cam.yaw) * -dx + Math.cos(cam.yaw) * -dy) * s;
    } else {
      cam.wYaw -= dx * 0.0052;
      cam.wPitch = Math.max(0.12, Math.min(1.42, cam.wPitch + dy * 0.004));
    }
  });
  window.addEventListener("pointerup", function () { drag = null; pinch.d = 0; });
  window.addEventListener("wheel", function (e) {
    if (!started || uiTarget(e)) return;
    if (cam.mode !== "free") setCamMode("free");
    cam.wDist = Math.max(6, Math.min(420, cam.wDist * (e.deltaY > 0 ? 1.13 : 0.885)));
  }, { passive: true });
  window.addEventListener("touchmove", function (e) {
    if (!started || e.touches.length !== 2) return;
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
    if (pinch.d) cam.wDist = Math.max(6, Math.min(420, cam.wDist * (pinch.d / d)));
    pinch.d = d;
  }, { passive: true });
  window.addEventListener("contextmenu", function (e) { if (started && !uiTarget(e)) e.preventDefault(); });

  /* ============================================================ RESOLUTION
     The cheapest frames in a massive battle are the pixels you stop drawing.
     When the frame rate slips the render scale steps down before anything
     else does; it climbs back when the war thins out. */
  const RES = { steps: [1], idx: 0, t: 0, good: 0 };
  function initRes(total) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    RES.steps = [dpr, 1, 0.78, 0.6].filter(function (v, i, a) { return a.indexOf(v) === i; })
      .sort(function (a, b) { return b - a; });
    RES.idx = total > 900 && RES.steps.length > 1 ? 1 : 0;
    applyRes();
  }
  function applyRes() {
    const R = CBZ.renderer;
    if (!R || !R.setPixelRatio) return;
    R.setPixelRatio(RES.steps[RES.idx]);
    R.setSize(window.innerWidth, window.innerHeight, false);
  }
  function stepRes(dt) {
    RES.t -= dt;
    if (RES.t > 0) return;
    RES.t = 1.6;
    const fps = CBZ.micro.fps || 0;
    if (fps > 4 && fps < 28 && RES.idx < RES.steps.length - 1) { RES.idx++; RES.good = 0; applyRes(); }
    else if (fps > 50 && RES.idx > 0 && ++RES.good >= 3) { RES.good = 0; RES.idx--; applyRes(); }
  }

  /* ============================================================ CLOCK */
  let effSpeed = 1;
  function setSpeed(s) {
    if (s > 0) lastSpeed = s;
    speed = s;
    el("spd").textContent = s === 0 ? "PAUSED" : "SPEED " + (s < 1 ? s.toFixed(2).replace("0.", ".") : s);
    el("cPause").textContent = s === 0 ? "PLAY" : "PAUSE";
    el("ctl").querySelectorAll("button[data-s]").forEach(function (b) {
      b.classList.toggle("on", parseFloat(b.dataset.s) === s);
    });
  }
  el("cPause").addEventListener("click", function () { setSpeed(speed === 0 ? lastSpeed : 0); });
  el("ctl").querySelectorAll("button[data-s]").forEach(function (b) {
    b.addEventListener("click", function () { setSpeed(parseFloat(b.dataset.s)); });
  });
  el("cCam").addEventListener("click", function () {
    cycleCam();
  });

  /* ============================================================ BENCH
     The honest answer to "how many". Everybody is unkillable so the census
     is exact; every few seconds the measured frame rate decides whether two
     more platoons walk on. When it dips under 30 twice, the last size that
     held is the machine's number. */
  function stepBench(dt) {
    const B = bench;
    B.t += dt;
    B.fpsAcc += dt; B.fpsN++;
    if (B.t < B.nextAt) return;
    const fps = CBZ.micro.fps || 0;
    B.t = 0; B.nextAt = 3.2;
    hud.note("BENCH " + aliveCount("red") + " PER SIDE  " + fps + " FPS");
    if (fps >= 33 && spawnQueue.length === 0) {
      B.lastGood = aliveCount("red");
      B.dips = 0;
      queueMen(B.step);
      B.grown += B.step;
    } else if (fps < 30) {
      B.dips++;
      if (B.dips >= 2) {
        const n = B.lastGood || aliveCount("red");
        try { localStorage.setItem("cbz-npcwar-max", String(n)); } catch (e) {}
        banner("MAX " + n + " PER SIDE", "AT 30 FPS ON THIS MACHINE");
        hud.note("BENCH DONE  " + n + " PER SIDE");
        bench = { done: true, n: n, t: 0, nextAt: 1e9, fpsAcc: 0, fpsN: 0, step: 0, grown: B.grown, lastGood: n, dips: 0 };
      }
    } else B.dips = 0;
  }

  /* ============================================================ SPAWN */
  function queueMen(perSide) {
    const r0 = spawnCount.red, b0 = spawnCount.blue;
    for (let i = 0; i < perSide; i++) {
      spawnQueue.push(["red", r0 + i], ["blue", b0 + i]);
    }
    spawnCount.red += perSide; spawnCount.blue += perSide;
    spawnTotal = spawnCount.red + spawnCount.blue;
  }
  const spawnCount = { red: 0, blue: 0 };
  function drainSpawns() {
    let n = 0;
    while (spawnQueue.length && n < 10) {
      const s = spawnQueue.shift();
      const kind = s[0] === "red" ? SET.redU : SET.blueU;
      const m = kind === "men" ? makeMan(s[0], s[1]) : makeBeast(s[0], s[1]);
      if (m) men.push(m);
      n++;
    }
  }

  /* ============================================================ BANNER / END */
  let bannerT = 0;
  function banner(big, small) {
    el("banner").innerHTML = big + (small ? "<small>" + small + "</small>" : "");
    el("banner").classList.add("on");
    bannerT = 3.4;
  }
  // the man with the most kills, alive or dead — the ledger's whole point
  function topKiller() {
    let best = null;
    for (let i = 0; i < men.length; i++) {
      if ((men[i].kills || 0) > (best ? best.kills : 0)) best = men[i];
    }
    return best;
  }
  function gunLabel(wid) {
    if (wid === "fists") return "FISTS";
    return ((CBZ.weaponById(wid) || {}).label || wid || "").toUpperCase();
  }
  function endWar(winner) {
    over = true;
    const rows = [
      ["DURATION", clockText()],
      ["RED KILLS", stats.red.kills], ["BLUE KILLS", stats.blue.kills],
      ["RED SHOTS", stats.red.shots + "  (" + pct(stats.red.hits, stats.red.shots) + " HIT)"],
      ["BLUE SHOTS", stats.blue.shots + "  (" + pct(stats.blue.hits, stats.blue.shots) + " HIT)"],
      ["LEFT STANDING", aliveCount("red") + aliveCount("blue")],
    ];
    const tk = topKiller();
    if (tk && tk.kills) {
      rows.push(["TOP KILLER", (tk.beast ? String(tk.species.name).toUpperCase()
        : TEAMS[tk.team].name + " " + (tk.i + 1)) + " &middot; " + tk.kills + " KILLS" +
        (tk.beast || tk.fists ? "" : " &middot; " + gunLabel(tk.wid))]);
    }
    // and the guns, ranked by what they actually did — the row MIXED and
    // EVERYTHING were always secretly asking for. A launcher lands NO hits by
    // construction (its damage is blast, through studio.boom), so printing it
    // a hit rate reads as a broken weapon rather than an honest column.
    const wids = Object.keys(GUNS).sort(function (a, b) { return GUNS[b].kills - GUNS[a].kills; });
    const gunRow = function (wid) {
      const g = GUNS[wid];
      let s = g.kills + " KILLS";
      if (g.hits > 0) s += " &middot; " + pct(g.hits, g.shots) + " HIT";
      if (g.reloads > 0) s += " &middot; " + g.reloads + " RELOADS";
      return [gunLabel(wid), s];
    };
    if (wids.length > 1) wids.slice(0, 5).forEach(function (wid) { rows.push(gunRow(wid)); });
    else if (wids.length === 1) rows.push(gunRow(wids[0]));
    el("endT").textContent = winner ? TEAMS[winner].name + " TAKE IT" : "NOBODY LEFT";
    el("endTable").innerHTML = rows.map(function (r) {
      return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>";
    }).join("");
    el("end").style.display = "grid";
  }
  function pct(a, b) { return b ? Math.round(a / b * 100) + "%" : "0%"; }
  el("endAgain").addEventListener("click", function () { location.reload(); });
  el("endMenu").addEventListener("click", function () {
    location.href = location.pathname;
  });
  el("endWatch").addEventListener("click", function () { el("end").style.display = "none"; });

  /* ============================================================ BEGIN */
  function begin(asBench) {
    el("menu").style.display = "none";
    /* THE AIR BELONGS TO THE PLACE. One desert haze over all five grounds put
       an orange dust horizon behind a glass downtown and washed the streets
       out to paper. Three skies: a hard flat light for the kill box, a clean
       maritime one for the city and the two islands, and the original basin
       haze for the dunes, which is the only map it was ever describing. */
    const SKY = {
      arena: {
        fov: 72, far: 3200, exposure: 0.92,
        sky: { top: 0x46586c, bottom: 0xb4ac96, fogNear: 260, fogFar: 1500, radius: 2600 },
        lights: { sun: 0.9, hemi: 0.5, shadowSpan: 320, groundColor: 0x6b6657 },
      },
      city: {
        fov: 70, far: 9000, exposure: 0.8,
        sky: { top: 0x27528c, bottom: 0x9fb6cc, fogNear: 420, fogFar: 3400, radius: 7000 },
        lights: { sun: 0.86, hemi: 0.52, shadowSpan: 420, groundColor: 0x6a6f76 },
      },
      dunes: {
        /* The sun came down from 0.98: at that level the sand's own vertex
           colours clipped to white and the whole erg rendered as a sheet of
           paper — the exact wash the city map already fixed for its stone.
           Sand is TAN, and the men and the dead have to read against it. */
        fov: 72, far: 16000, exposure: 0.8,
        sky: { top: 0x2a6bb2, bottom: 0xe3c893, fogNear: 1100, fogFar: 8600, radius: 12000 },
        /* skyColor: the hemisphere's sky side defaults to pale BLUE, and blue
           fill on tan sand is gray — the erg was desaturating itself. Desert
           ambience is the sand's own bounce: warm. */
        lights: { sun: 0.84, hemi: 0.42, shadowSpan: 620, skyColor: 0xcfc2a4, groundColor: 0x8f7850 },
      },
    };
    SKY.island = SKY.field = SKY.city;
    CBZ.micro.boot(SKY[SET.map] || SKY.dunes);
    CBZ.micro.pauseKey = null;                       // the clock is ours (Space)
    if (!CBZ.groundAt) CBZ.groundAt = function (x, z) { return MAP ? MAP.groundAt(x, z) : 0; };

    MAP = buildMap(SET.map);
    // THE GROUND IS FINISHED — settle it before a single man walks on. The
    // real fabric costs 17 000 draw calls raw and a fraction of that merged,
    // and the pass must run while the scene is still nothing but scenery:
    // anything added afterwards keeps its own live matrix, which is how the
    // men and the aircraft stay animated through it.
    if (Q.get("settle") !== "0") CBZ.studio.settle(CBZ.scene);
    // the walkable map, once, off the colliders the ground just registered
    navBuild(MAP.cx, MAP.cz, { city: 330, island: 340, field: 540, arena: 150, dunes: 220 }[SET.map] || 260);
    AIR.on = SET.redS !== "none" || SET.blueS !== "none";
    // a small war is short: the warhead arms early enough to matter
    AIR.nukeAt = 20 + Math.min(22, (SET.redN + SET.blueN) / 36);
    if (AIR.on && CBZ.ordnance && CBZ.ordnance.init) {
      CBZ.ordnance.init({ scene: CBZ.scene, groundAt: MAP.groundAt });
    }
    if (asBench) {
      bench = { t: 0, nextAt: 3.2, step: 30, lastGood: 0, dips: 0, grown: 0, fpsAcc: 0, fpsN: 0 };
      SET.redN = SET.blueN = 40;
      SET.redW = SET.blueW = (SET.redW === "everything" || SET.redW === "mixed") ? "ak47" : SET.redW;
    }

    // SHADOWS PAY TWICE (a shadow pass draws every caster again). Big armies
    // buy frames with the sun instead.
    const total = SET.redN + SET.blueN;
    const R = CBZ.renderer || (CBZ.micro && CBZ.micro.renderer);
    if (R && R.shadowMap && (total > 170 || asBench)) R.shadowMap.enabled = false;

    hud = CBZ.studio.hud({ health: false, clock: false, score: false, feed: true, note: true, prompt: false, danger: false, pause: false });

    spawnQueue.length = 0;
    // interleave the queues so uneven armies still stream in fairly
    for (let i = 0; i < Math.max(SET.redN, SET.blueN); i++) {
      if (i < SET.redN) spawnQueue.push(["red", i]);
      if (i < SET.blueN) spawnQueue.push(["blue", i]);
    }
    spawnCount.red = SET.redN; spawnCount.blue = SET.blueN;
    spawnTotal = SET.redN + SET.blueN;

    cam.focus.set(MAP.cx, MAP.groundAt(MAP.cx, MAP.cz) + 2, MAP.cz);
    cam.wFocus.copy(cam.focus);
    cam.wDist = Math.min(300, 40 + Math.sqrt(spawnTotal) * 3.2);
    cam.dist = cam.wDist + 60;
    cam.cutAt = 4;

    el("top").style.display = "flex";
    el("ctl").style.display = "flex";
    if (!COARSE) {
      el("hint").style.display = "block";
      el("hint").innerHTML = "DRAG ORBIT &middot; WHEEL ZOOM &middot; WASD PAN<br>SPACE PAUSE &middot; 1-5 SPEED &middot; F FRONT CAM";
    }
    setSpeed(1);
    setCamMode(asBench ? "free" : "auto");
    if (asBench) { cam.wPitch = 0.9; cam.wDist = 170; }
    initRes(spawnTotal);
    started = true;
    const armyName = function (team) {
      const u = team === "red" ? SET.redU : SET.blueU;
      const sp = u !== "men" && (CBZ.WILDLIFE_SPECIES || {})[u];
      return sp ? String(sp.name).toUpperCase() + "S" : TEAMS[team].name;
    };
    banner(MAPS[SET.map].label, armyName("red") + " " + SET.redN + "   V   " + armyName("blue") + " " + SET.blueN);
    if (AIR.on) spawnPlanes();
    CBZ.micro.onFrame(frame);
  }

  function clockText() {
    const s = Math.floor(simT);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  /* ============================================================ FRAME */
  let uiT = 0, winCheckT = 0, lastWall = 0, whoT = 0;
  function frame(dt) {
    if (!started) return;
    // THE SIM CLOCK IS WALL TIME, NOT RENDER TIME. microboot clamps its dt
    // for animation stability, so on a struggling machine the battle would
    // quietly run at a fraction of the dial. The dial is a promise: SPEED 1
    // is one real second per second, and the sub-steps below keep the
    // integration solid however long the frame took.
    const wall = performance.now();
    const realDt = lastWall ? Math.min(0.25, (wall - lastWall) / 1000) : dt;
    lastWall = wall;
    dt = realDt;                      // gait, camera and timers follow the same clock
    dbgWall += realDt; dbgN++;
    fxBudget = 0;
    drainSpawns();

    // keys: the clock and the cameras
    const IN = CBZ.micro.input;
    if (IN) {
      if (IN.pressed("Space")) setSpeed(speed === 0 ? lastSpeed : 0);
      if (IN.pressed("Digit1")) setSpeed(1);
      if (IN.pressed("Digit2")) setSpeed(2);
      if (IN.pressed("Digit3")) setSpeed(4);
      if (IN.pressed("Digit4")) setSpeed(8);
      if (IN.pressed("Digit5")) setSpeed(0.25);
      // F rides the front rank; pressing it again crosses to the other army
      if (IN.pressed("KeyF")) {
        setCamMode("follow", cam.mode === "follow" && cam.followTeam === "red" ? "blue" : "red");
      }
      if (IN.pressed("KeyC")) setCamMode(cam.mode === "auto" ? "free" : "auto");
    }

    // ---- SIM at the dialled speed, sub-stepped so 8x stays solid. The
    // sub-step cap means a machine that cannot COMPUTE eight seconds per
    // second degrades to what it can; effSpeed below is the HUD admitting it.
    let simDt = realDt * speed;
    const simBefore = simT;
    if (simDt > 0) {
      const sub = Math.min(8, Math.max(1, Math.ceil(simDt / 0.055)));
      const sdt = Math.min(0.055, simDt / sub);
      for (let s = 0; s < sub; s++) {
        simT += sdt;
        CBZ.now += sdt * 1000;             // combat_iq's clocks follow the dial
        if (simT - gridAt > 0.35) rebuildGrid();
        if (simT - comAt > 0.6) updateCOM();
        // the field is re-solved on a slow, STAGGERED tick: two solves in the
        // same sub-step is a visible hitch on a big battle and buys nothing
        if (NAV.on) {
          if (simT - NAV.at.red > 1.4) navSolve("red");
          else if (simT - NAV.at.blue > 1.4) navSolve("blue");
        }
        for (let i = 0; i < men.length; i++) stepMan(men[i], sdt);
        rebuildFine();                       // bodies moved: the body grid is stale
        separateSolve(Math.min(0.9, sdt * 26));
        stepRockets(sdt);
        if (AIR.on) {
          if (simT - airAimT > 3) {
            airAimT = simT;
            airAim.red = densestCellOf("blue");   // red's air looks at blue mass
            airAim.blue = densestCellOf("red");
          }
          if (CBZ.ordnance && CBZ.ordnance.step) CBZ.ordnance.step(sdt);
          stepPlanes(sdt);
        }
      }
    }

    /* THE SOLVER'S OWN VERDICT, ONCE A FRAME. It has to sweep where the
       bodies ARE — a residual read off the pre-push grid silently
       under-reports and would have exonerated the pass. Once per FRAME
       rather than per sub-step, and never during a benchmark: the benchmark
       exists to report what this machine can really carry, and an audit that
       only runs while you are measuring is an audit that changes the answer. */
    if (PROBE && !bench && simDt > 0) { rebuildFine(); sepResid = sepResidual(); }

    // ---- render-side work at real time: gait, aim pose, camera ----
    const camP = CBZ.camera.position;
    for (let i = 0; i < men.length; i++) {
      const m = men[i];
      if (m.dead) continue;
      const d2 = (m.pos.x - camP.x) * (m.pos.x - camP.x) + (m.pos.z - camP.z) * (m.pos.z - camP.z);
      m.animF = (m.animF + 1) & 1023;
      const every = d2 < 70 * 70 ? 1 : d2 < 150 * 150 ? 2 : 4;
      if (m.beast) {
        // the species walks on the shared rig — legs swing by distance
        // actually moved, so the charge, the march and the rout all animate
        // off the same law. LOD-skipped exactly like the men's gait.
        if ((m.animF % every) === 0 && CBZ.wildlifeRig) {
          try { CBZ.wildlifeRig.animateGait(m, dt * every); } catch (e) {}
        }
        continue;
      }
      if ((m.animF % every) === 0 && CBZ.animChar && m.char) {
        // A MAN IN COVER GETS SMALL. `ch.crouch` is the rig's own flag —
        // animChar damps `_cb` and folds the thighs off it, and nothing here
        // had ever set it, so combat_iq could send a soldier to a real piece
        // of cover and he would stand up straight behind it. One boolean, and
        // the posture the fight brain already chose is finally visible.
        m.char.crouch = m.slot === "cover" || m.slot === "peek" ||
          (m.slot === "fire" && m.speed < 0.2 && m.hp < m.maxHp * 0.5);
        try { CBZ.animChar(m.char, m.speed * speed, dt * every); } catch (e) {}
      }
      const engaged = m.tgt && !m.tgt.dead && m.sees;
      if (engaged && d2 < 190 * 190) {
        if (m.fists) {
          // a brawler squares up by turning his whole body — there is no
          // weapon arm for actorAimAt to lay on the line
          const want = Math.atan2(m.tgt.pos.x - m.pos.x, m.tgt.pos.z - m.pos.z);
          let dy = want - m.yaw;
          while (dy > Math.PI) dy -= Math.PI * 2;
          while (dy < -Math.PI) dy += Math.PI * 2;
          m.yaw += dy * Math.min(1, dt * 9);
          m.group.rotation.y = m.yaw;
        } else if (CBZ.actorAimAt) {
          CBZ.actorAimAt(m, m.tgt, dt);
          m.yaw = m.group.rotation.y;
        }
      }
      if (m._weaponProp) {
        const showGun = d2 < 130 * 130;
        if (m._weaponProp.visible !== showGun) m._weaponProp.visible = showGun;
      }
    }
    stepCamera(dt);
    stepRes(dt);
    effSpeed += ((realDt > 0 ? (simT - simBefore) / realDt : speed) - effSpeed) * Math.min(1, dt * 2);

    if (bench && !bench.done) stepBench(dt);
    if (bannerT > 0 && (bannerT -= dt) <= 0) el("banner").classList.remove("on");

    // ---- chrome on a slow tick ----
    // the card runs faster than the rest of the chrome: a magazine draining
    // and a reload filling are the two things on it that MOVE
    whoT -= dt;
    if (whoT <= 0) { whoT = 0.1; if (started) stepWho(); }
    uiT -= dt;
    if (uiT <= 0) {
      uiT = 0.25;
      const ar = aliveCount("red"), ab = aliveCount("blue");
      el("redC").textContent = ar;
      el("blueC").textContent = ab;
      el("redB").style.width = (spawnCount.red ? ar / spawnCount.red * 100 : 0) + "%";
      el("blueB").style.width = (spawnCount.blue ? ab / spawnCount.blue * 100 : 0) + "%";
      el("clk").textContent = clockText() + "  " + (CBZ.micro.fps || 0) + "FPS";
      // a dial the machine cannot honour says so instead of lying
      if (speed > 0 && effSpeed < speed * 0.8) {
        el("spd").textContent = "SPEED " + speed + "  REAL " + (Math.round(effSpeed * 10) / 10);
      } else if (speed > 0) {
        el("spd").textContent = "SPEED " + (speed < 1 ? speed.toFixed(2).replace("0.", ".") : speed);
      }
    }
    winCheckT -= dt;
    if (winCheckT <= 0 && !over && !bench && spawnQueue.length === 0) {
      winCheckT = 0.5;
      const ar = aliveCount("red"), ab = aliveCount("blue");
      if (ar === 0 || ab === 0) endWar(ar > 0 ? "red" : ab > 0 ? "blue" : null);
    }
  }

  /* ============================================================ PROBE
     The reuse claim, checkable instead of asserted. */
  let dbgWall = 0, dbgN = 0;

  /* THE FAULTS YOU CAN SEE, COUNTED. A battle you WATCH has exactly one class
     of bug that matters: the kind that shows. Each of these is a thing a
     person would point at on the screen, turned into an integer, so
     tools/battle-check.mjs can hold it at zero instead of somebody squinting.
     Read-only: it never touches a man. */
  const QUAL = { overlapPeak: 0, embeddedEver: 0, blindFire: 0, throughMate: 0,
    throughSand: 0, fratricide: 0, bodyW: 0, stuckSeen: 0, wallSeconds: 0 };
  function bodyWidth() {
    if (QUAL.bodyW) return QUAL.bodyW;
    for (let i = 0; i < men.length; i++) {
      const m = men[i];
      if (m.dead || !m.group) continue;
      try {
        const b = new THREE.Box3().setFromObject(m.group);
        QUAL.bodyW = Math.round(Math.max(b.max.x - b.min.x, b.max.z - b.min.z) * 1000) / 1000;
      } catch (e) { QUAL.bodyW = -1; }
      break;
    }
    return QUAL.bodyW;
  }
  /* OVERLAP IS A PAIR'S QUESTION, NOT A CONSTANT.

     0.62 m is the number for two MEN — 0.52 m across the shoulders plus a
     little. Applied to a lion it is meaningless and applied to an elephant it
     is a joke: this probe reported "0 overlap" for armies of animals visibly
     standing inside each other, because it was measuring them with a man's
     shoulders. The threshold is now a FRACTION of the pair's own radii, and
     the fraction is chosen so two men still resolve to exactly 0.62 —
     0.69 * (0.45 + 0.45) — which keeps every number this probe has ever
     reported for a man's war comparable with the ones before it. */
  const OVERLAP_K = 0.69;
  const BODY_CLEAR = 0.62;      // two men, for the audit line that names it
  function quality() {
    const live = [];
    for (let i = 0; i < men.length; i++) if (!men[i].dead) live.push(men[i]);
    let pairs = 0, worst = 9;
    // O(n^2) is fine in a probe and honest in a way a grid pass is not: the
    // grid is the thing under test, so the check must not share its blind spots
    for (let i = 0; i < live.length; i++) {
      for (let j = i + 1; j < live.length; j++) {
        const dx = live[j].pos.x - live[i].pos.x, dz = live[j].pos.z - live[i].pos.z;
        /* TWO MEN ON DIFFERENT LEVELS ARE NOT OVERLAPPING. This probe measured
           XZ alone, which was exactly right while every venue was a flat
           plate. Now that the ground is measured, `gov` has a terrace 3.4 m
           above its lawn and the speedway is banked 11 m: a man on the steps
           and a man below him share a square metre of map and nothing else.
           A body is 1.8 m tall, so anything further apart in Y than that is
           two men in the same footprint on different floors — which is what a
           real venue is FOR. */
        if (Math.abs(live[j].pos.y - live[i].pos.y) >= 1.8) continue;
        const d = Math.hypot(dx, dz);
        const need = OVERLAP_K * ((live[i].rad || 0.45) + (live[j].rad || 0.45));
        if (d < need) {
          pairs++;
          // how deep, as a FRACTION of what this pair owed each other, so a
          // lion pair and a man pair are comparable numbers
          const bite = Math.round((d / need) * 100) / 100;
          if (bite < worst) worst = bite;
        }
      }
    }
    if (pairs > QUAL.overlapPeak) QUAL.overlapPeak = pairs;
    let embedded = 0, stuck = 0, engaged = 0;
    const buf = [];
    for (let i = 0; i < live.length; i++) {
      const m = live[i];
      if (m.tgt && !m.tgt.dead && m.sees) engaged++;
      if ((m.stuckT || 0) > 3.5) stuck++;
      const cols = CBZ.micro.queryColliders(m.pos.x, m.pos.z, 0.1, buf);
      for (let c = 0; c < cols.length; c++) {
        const b = cols[c];
        if (m.pos.x < b.minX || m.pos.x > b.maxX || m.pos.z < b.minZ || m.pos.z > b.maxZ) continue;
        if (b.y0 != null && (m.pos.y + 0.9 < b.y0 || m.pos.y + 0.9 > b.y1)) continue;
        embedded++; break;
      }
    }
    if (embedded > QUAL.embeddedEver) QUAL.embeddedEver = embedded;
    if (stuck > QUAL.stuckSeen) QUAL.stuckSeen = stuck;
    return {
      alive: live.length, bodyW: bodyWidth(),
      overlapNow: pairs, overlapWorst: pairs ? worst : null, overlapPeak: QUAL.overlapPeak,
