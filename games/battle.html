    /* THE PURSUIT. A man whose mark has broken and is running does not hold
       his band and trade with a back: if he still has the nerve for it he
       goes after him, shooting (slot "push" fires). This is the half of a
       rout the watcher actually sees. */
    if (tgt.routed && !m.launcher && manMorale(m) > m.nerve + 0.12) {
      const pd = Math.hypot(tgt.pos.x - m.pos.x, tgt.pos.z - m.pos.z);
      if (pd < 110 && (!m.fists || pd > meleeReach(m, tgt))) {
        m.target.set(tgt.pos.x, 0, tgt.pos.z);
        steerAroundWalls(m);
        spreadGoal(m);
        m.slot = "push";
        return;
      }
    }

    if (m.fists) {
      // an unarmed man has one range: his arms. Close on the mark; inside it
      // IQ.melee (stepMan) owns the footwork, the guard and the swing.
      const d = Math.hypot(tgt.pos.x - m.pos.x, tgt.pos.z - m.pos.z);
      if (d > meleeReach(m, tgt)) {
        m.target.set(tgt.pos.x, 0, tgt.pos.z);
        steerAroundWalls(m);
      }
      m.slot = "push";
      return;
    }
    if (m.launcher) {
      // launchers stand off; combat_iq has no rocket column, so the band is ours
      const d = Math.hypot(tgt.pos.x - m.pos.x, tgt.pos.z - m.pos.z);
      if (d < 22) { m.target.set(m.pos.x + (m.pos.x - tgt.pos.x) / d * 12, 0, m.pos.z + (m.pos.z - tgt.pos.z) / d * 12); m.slot = "back"; }
      else if (d > 52) { m.target.set(tgt.pos.x, 0, tgt.pos.z); m.slot = "close"; }
      else { m.slot = "fire"; m.target.set(m.pos.x, 0, m.pos.z); }
      return;
    }
    const slot = CBZ.combatIQ && CBZ.combatIQ.posture
      ? CBZ.combatIQ.posture(m, tgt, thinkDt) : "fire";
    m.slot = slot || "fire";

    // THE WALL RULE RUNS BEFORE THE SPREAD, deliberately: a projected goal is
    // a flow-field cell CENTRE, and two men walled off the same bearing would
    // otherwise be handed the same metre of street — the anti-clump below has
    // to get the last word on every goal, projected or not. (cover and peek
    // hug walls by design — the hide point sits just past the box — so the
    // rule only audits the long moves: bands, bearings, flanks.)
    if (m.slot !== "cover" && m.slot !== "peek") steerAroundWalls(m);

    /* THE GROUND IS COVER. A rattled man on real dunes (or one already in
       his fold) takes the reverse slope behind the nearest crest instead of
       standing in the open — hullFor() throttles and budgets the search.
       Not on the sweep: a hunting army does not go to ground. The fold gets
       the body-scale spread, not the 2.6 m anti-clump, which could shove the
       goal out over the lip. */
    if (MAP.terrainLos && !m.hunt && (m.supp > 0.3 || m.hull)) {
      const hd = hullFor(m, tgt);
      if (hd) {
        m.target.set(hd.x, 0, hd.z);
        m.slot = "hull";
        spreadGoal(m);
        return;
      }
    }

    // anti-clump on the goal, from the grid: posture's own separation scans
    // city rosters, which are empty out here
    const a = grid.get(gridKey(Math.floor(m.pos.x / GRID_CELL), Math.floor(m.pos.z / GRID_CELL)));
    if (a && a.length > 1) {
      let ox = 0, oz = 0, n = 0;
      for (let i = 0; i < a.length && n < 4; i++) {
        const o = a[i];
        if (o === m || o.dead) continue;
        const dx = m.target.x - o.pos.x, dz = m.target.z - o.pos.z;
        const d = Math.hypot(dx, dz);
        if (d > 2.6 || d < 0.001) continue;
        ox += dx / d * (2.6 - d); oz += dz / d * (2.6 - d); n++;
      }
      m.target.x += ox; m.target.z += oz;
    }
  }

  /* ============================================================ SIM STEP */
  function stepMan(m, sdt) {
    /* A BODY IN A GORILLA'S HAND IS NOT A MARCHER. systems/ape_combat.js owns
       this man's world transform outright while the flag is up — his position,
       his facing and his rig — exactly the way grapple.js's `heldBy` stands the
       player's own mover down. Everything below (think, locomotion, the fire
       solution) would be fighting it for the same three numbers. The flag is
       cleared by the hold itself, and by apeReset on a restart, so nothing can
       strand a man mid-air. Tested first, above the death branch, because a man
       who dies IN the hand is still in the hand until it lets go. */
    if (m._apeHeld || m._apeFlying) return;
    if (m.dead) {
      // A SOLVED CORPSE HAS EXACTLY ONE WRITER. quadruped_ragdoll.js owns the
      // group's position and quaternion from the frame the animal died (this
      // page steps it on the sim clock — see the quadRagdollStep call in
      // frame()), and a second author here is precisely the double-write that
      // leaves a body latched half way through its own fall.
      if (m.ragdoll) return;
      // the shared tumble, when the mainland's wildlife.js is loaded and the
      // solver declined this body. Returns false once it has settled.
      if (m.tumble) {
        if (!CBZ.wildlifeDeathStep || !CBZ.wildlifeDeathStep(m, sdt)) m.tumble = false;
        return;
      }
      if (m.dieT > 0 && m.dieT < 1) {
        m.dieT = Math.min(1, m.dieT + sdt * 2.4);
        const k = 1 - (1 - m.dieT) * (1 - m.dieT);
        // A MAN topples over his own facing. A FOUR-LEGGED BODY falls onto its
        // flank, which is a roll about its own long axis — and on a body
        // authored nose-toward-+X that axis is rotation.x under the 'YXZ' order
        // beastDeathPhysics puts the corpse on, NOT rotation.z (which is the
        // model-local PITCH and was sitting every dead animal upright).
        if (m.beast && DEATH_OLD) m.group.rotation.z = m.dieDir * k * 1.45;   // the reverted pose
        else m.group.rotation.x = m.dieDir * k * (m.beast ? 1.45 : (Math.PI / 2 - 0.07));
      }
      return;
    }
    if (m.fled) return;              // off the field; updateMorale splices him out
    if (simT >= m.thinkAt) think(m, simT);
    if (m.fled) return;
    if (m.supp > 0) m.supp = Math.max(0, m.supp - sdt * SUPP_DECAY);
    if (m.reloadT > 0) {
      m.reloadT -= sdt;
      if (m.reloadT <= 0) m.mag = m.magSize;
    }
    m.cool -= sdt;

    // ---- THE STRIKE BUBBLE. Inside claw range creature_combat owns the
    // whole beat — approach, facing, windup, the hit, the recover — through
    // the exact seams it published: opts.move walks on THIS map's walls and
    // ground, opts.onHit lands in THIS page's damage funnel. Outside the
    // bubble the beast is just another marcher below.
    if (m.beast) {
      /* A GORILLA MID-SWING IS NOT MARCHING ANYWHERE. Its own hold owns its
         position, its facing and its pitch (systems/ape_combat.js, ticked by
         apeStep above). Without this the branch below falls through the moment
         the man in its hand DIES — `bt.dead` — and the locomotion at the bottom
         of this function walks a spinning silverback across the map while the
         body on its arm stays welded to a hand that is no longer where the
         swing thinks it is. */
      if (CBZ.apeOwns && CBZ.apeOwns(m)) {
        m.resT = (m.resT || 0) - sdt;
        if (m.resT <= 0) { m.resT = 0.25; CBZ.micro.resolveCircle(m.pos, m.rad || 0.5, m.pos.y, 1.8); }
        return;
      }
      const bt = m.tgt;
      if (bt && !bt.dead && !bt.fled && !over) {
        const bd = Math.hypot(bt.pos.x - m.pos.x, bt.pos.z - m.pos.z);
        if (bd < m.reach + 2.6) {
          beastFight(m, bt, sdt);
          // a striking beast still answers to the walls: the separation pass
          // shoves bodies without asking the world, and this early return
          // used to skip the standing resolve for the whole swing — measured
          // as one gorilla probed inside an arena crate mid-maul
          m.resT = (m.resT || 0) - sdt;
          if (m.resT <= 0) { m.resT = 0.25; CBZ.micro.resolveCircle(m.pos, m.rad || 0.5, m.pos.y, 1.8); }
          return;
        }
      } else if (m._atkAnim != null && m._atkAnim >= 0 && CBZ.creatureEndAttack) {
        // the victim died under the swing: cancel it CLEANLY or the strike
        // pose stays latched on a living body forever — measured on the
        // probe as _atkAnim frozen at 0.94 on a gorilla marching victorious
        try { CBZ.creatureEndAttack(m); } catch (e) {}
      }
    }

    // ---- move toward the goal combat_iq (or the march) set. A man is not a
    // pathfinder: when a wall eats his progress he slides ALONG it for a
    // while instead of pressing his face into it — one distance test, no
    // graph, and a column flows around a tower like water instead of queueing
    // against the facade (the shipped city bug this block exists to fix). ----
    const dx = m.target.x - m.pos.x, dz = m.target.z - m.pos.z;
    const d = Math.hypot(dx, dz);
    const tgt0 = m.tgt;
    const tdist = tgt0 && !tgt0.dead
      ? Math.hypot(tgt0.pos.x - m.pos.x, tgt0.pos.z - m.pos.z) : 1e9;
    let spd = 0;
    if (d > 1.1) {
      const hurtish = m.hp < m.maxHp * 0.45;
      // a wounded man limps AWAY slower than a fresh man walks IN — the old
      // 7.0 fallback outran every pursuer and froze a whole battle behind
      // one unkillable runner. And an army that outnumbers the last few
      // holdouts eight to one smells blood and sprints.
      if (m.beast) {
        // the species' own legs: charge in, lope on the march, and a beaten
        // runner flees just under charge pace — catchable, like the men
        const tn = m.tn;
        spd = m.slot === "fallback" ? tn.chase * 0.92 :
              m.slot === "push" ? tn.chase : tn.march;
        if (m.hunt && tdist < 999) spd = Math.max(spd, tn.chase * 1.08);
      } else {
        // a ROUTING man runs a shade faster than a pursuer walks in (6.2) and
        // slower than a sweep (7.6-8.0): a broken line gets away from a line
        // that is still fighting, and is run down by one that has won
        spd = m.slot === "rout" ? (hurtish ? 5.4 : 6.6) :
              m.slot === "fallback" ? 5.2 :
              (m.slot === "push" || m.slot === "march" || m.slot === "flank") ? (m.hunt ? 7.6 : 6.2) :
              (m.slot === "cover" || m.slot === "hull" || hurtish) ? 7.0 : 4.6;
        // holding the fire token forty metres out of range is not holding
        // anything: closing to the band is a RUN, whatever the slot says
        if (tdist < 1e9 && tdist > 42 && spd < 6.2) spd = m.hunt ? 7.6 : 6.4;
        // and a mob eight-to-one over the last holdouts does not respect the
        // band at all — it runs them down. This rule is what ENDS a battle.
        if (m.hunt && tdist < 999) spd = Math.max(spd, 8.0);
      }
      let nx = dx / d, nz = dz / d;
      if (m.detourT > 0) {
        m.detourT -= sdt;
        const sw = m.detourDir || 1;
        const tx = nz * sw, tz = -nx * sw;      // 90 degrees off the blocked line
        nx = tx; nz = tz;
      }
      const ox = m.pos.x, oz = m.pos.z;
      m.pos.x += nx * spd * sdt;
      m.pos.z += nz * spd * sdt;
      CBZ.micro.resolveCircle(m.pos, m.rad || 0.5, m.pos.y, 1.8);
      const got = Math.hypot(m.pos.x - ox, m.pos.z - oz);
      const want = spd * sdt;
      if (want > 0.001 && got < want * 0.25) {
        m.stuckT = (m.stuckT || 0) + sdt;
        if (PROBE) QUAL.wallSeconds += sdt;      // the wall-running metric, held near zero
        if (m.stuckT > 0.8) {
          m.stuckT = 0;
          m.detourT = 1.5 + ((m.i % 5) * 0.35);
          m.detourDir = (m.i & 1) ? 1 : -1;
        }
      } else if (got > want * 0.6 && m.stuckT) m.stuckT = Math.max(0, m.stuckT - sdt * 2);
    } else {
      // STANDING MEN GET RESOLVED TOO. The separation pass and blast shoves
      // move bodies without asking the world, and a man embedded in a crate
      // is invisible to every line of sight — an immortal, and a battle that
      // cannot end. A slow timer keeps the cost of honesty near zero.
      m.resT = (m.resT || 0) - sdt;
      if (m.resT <= 0) {
        m.resT = 0.25;
        CBZ.micro.resolveCircle(m.pos, m.rad || 0.5, m.pos.y, 1.8);
      }
    }
    m.speed = spd;
    if (MAP.water) stepDepth(m, sdt);
    m.pos.y = MAP.bodyY(m, m.pos.x, m.pos.z);

    // face the fight when there is one, else the walk
    const tgt = m.tgt;
    if (m.beast) {
      // the animal convention: heading h faces (cos h, sin h), nose on +X.
      // Outside the strike bubble the beast faces its own travel; inside it
      // creature_combat turned the head already.
      if (spd > 0.1 && d > 0.05) {
        const want = Math.atan2(dz, dx);
        let dh = want - m.heading;
        while (dh > Math.PI) dh -= Math.PI * 2;
        while (dh < -Math.PI) dh += Math.PI * 2;
        m.heading += dh * Math.min(1, sdt * 6);
        m.faceH = m.heading;
        CBZ.faceAnimalHeading(m, m.heading);
      }
      return;                                    // no rifle on an animal
    }

    /* ---- STANCE. In a fold he works it (down, up to shoot, down to
       reload). In the open a man who has stopped and is pinned or badly hurt
       KNEELS — smaller, and the enemy's rounds pay CROUCH_HIT for it — and
       stands again to move or once the fire comes off him. A running man is
       always up. coverK is what fireShot multiplies a round's hit chance by. */
    m.up = true;
    if (m.routed || m.fists) { if (m.stance !== "stand") setStance(m, "stand"); }
    else if (m.slot === "hull" && m.hull) m.up = workHull(m, sdt);
    else if (m.stance === "crouch") {
      if (spd > 0.1 || !tgt || tgt.dead || (m.supp < 0.12 && m.hp >= m.maxHp * 0.5)) setStance(m, "stand");
    } else if (spd <= 0.1 && tgt && !tgt.dead && (m.supp > 0.35 || m.hp < m.maxHp * 0.5)) {
      setStance(m, "crouch");
    }
    m.coverK = m.stance === "crouch" ? CROUCH_HIT
      : (m.slot === "hull" && m.hull && m.up) ? HULL_UP_HIT : 1;

    const engaged = tgt && !tgt.dead && m.sees;
    if (!engaged && spd > 0.1) {
      const want = Math.atan2(dx, dz);
      let dy = want - m.yaw;
      while (dy > Math.PI) dy -= Math.PI * 2;
      while (dy < -Math.PI) dy += Math.PI * 2;
      m.yaw += dy * Math.min(1, sdt * 7);
      m.group.rotation.y = m.yaw;
    }

    // ---- the trigger ----
    if (m.routed) return;                  // a broken man is not fighting
    if (!tgt || tgt.dead || tgt.fled || m.reloadT > 0) return;
    const dist = Math.hypot(tgt.pos.x - m.pos.x, tgt.pos.z - m.pos.z);
    if (m.fists) {
      // THE PUNCH EXCHANGE is combat_iq's own melee brain — close, circle,
      // guard, windup, swing — the same beat structure every brawler in the
      // city fights with. It writes m.target for the footwork; "swing" is
      // the one frame a blow lands, through the same funnel as a bullet.
      const mr = meleeReach(m, tgt);
      if (dist < mr * 1.9 && CBZ.combatIQ && CBZ.combatIQ.melee) {
        // `incoming` is how a brawler reads the other man's windup and gets
        // his guard up — without it two NPCs never block each other
        const st = CBZ.combatIQ.melee(m, tgt, sdt,
          { reach: mr, incoming: (tgt._windup || 0) > 0 || (tgt._iqM && tgt._iqM.st === "windup") });
        if (st === "swing") {
          /* AND IT MATTERS WHO HE IS HITTING. `m.punch` is a number off the
             THROWER and nothing else, so a civilian's fist used to take the
             same bite out of a 190 kg silverback as out of another man — the
             single reason a hundred unarmed men could hand-wrestle a gorilla
             down on arithmetic alone. systems/bodymass.js turns the pair into
             a ratio; man on man is 1.0, so every men-only battle this page has
             ever run is numerically untouched. */
          const mk = CBZ.meleeScale ? CBZ.meleeScale(m, tgt) : 1;
          hurtMan(tgt, m.punch * (0.85 + lcg() * 0.4) * mk, { by: m });
          stats[m.team].shots++; stats[m.team].hits++;   // the ledger counts blows thrown and landed
          m.shotsF++; m.hitsF++; gunLedger("fists").shots++; gunLedger("fists").hits++;
        }
      }
      return;
    }
    if (m.launcher) {
      if (m.cool <= 0 && m.sees && dist > 16 && dist < 95) {
        const w = CBZ.weaponById(m.wid);
        fireRocket(m, tgt);
        if (m.mag <= 0) { m.reloadT = w.reloadTime || w.reload || 2; m.mag = 0; m.reloads++; gunLedger(m.wid).reloads++; }
        m.cool = (w.fireDelay || w.interval || 1.2) + 0.6 + lcg() * 0.8;
      }
      return;
    }
    const p = CBZ.combatIQ && CBZ.combatIQ.profile ? CBZ.combatIQ.profile(m) : null;
    let fireMax = p ? Math.min(125, p.hi * 2.6 + 8) : 60;
    if (m.hunt) fireMax *= 1.6;          // running a man down includes shooting at him
    if (!m.sees || dist > fireMax) return;
    if (m.slot !== "fire" && m.slot !== "peek" && m.slot !== "push" && m.slot !== "sidestep" &&
        m.slot !== "hull" && dist > 12) return;
    if (!m.up) return;                     // ducked behind his crest (workHull)
    if (m.cool > 0) return;
    /* THE LINE IS CHECKED WHEN THE TRIGGER IS PULLED, NOT WHEN HE LAST THOUGHT.
       `m.sees` is up to half a second old — a think-tick answer about two men
       who have both been moving since — and stale LOS is how rounds get fired
       into a wall that closed in between (measured: 2 in the kill box, and it
       is the walls that move the count, not the men). This test only runs
       once the cooldown has already expired, so it costs about one segment
       trace per shot and it is what makes the blind-fire counter honest. */
    if (!FIRE_OLD) {
      m.sees = eyeLos(m, tgt);
      if (!m.sees) { m.cool = 0.12; return; }
      const side = mateInLane(m, tgt);
      if (side) { stepOffLine(m, tgt, side); return; }
    }
    const w = CBZ.weaponById(m.wid);
    const r = CBZ.combatIQ && CBZ.combatIQ.shot
      ? CBZ.combatIQ.shot(m, tgt, dist, 0, w ? w.damage : 14) : null;
    if (!r) { m.cool = 0.5; return; }
    m.cool = r.cd;
    if (!r.fire) return;
    fireShot(m, tgt, r);
    if (m.mag <= 0) {
      m.reloadT = (w && (w.reloadTime || w.reload)) || 1.6;
      m.reloads++; gunLedger(m.wid).reloads++;
      const dCam = Math.sqrt(camDist2(m.pos));
      if (dCam < 60 && CBZ.audioManifest && CBZ.audioManifest.effects && CBZ.audioManifest.effects.reload) {
        try { CBZ.sfx("reload", { dist: dCam, ghost: true }); } catch (e) {}
      }
    }
  }

  /* ============================================================ CAMERA
     Three postures. FREE: drag orbits, wheel zooms, WASD pans. FOLLOW: over
     the shoulder of whoever is doing the shooting. AUTO: a director that
     cuts between crane shots and shoulders wherever the fire is. Any manual
     input takes the camera back. */
  const cam = {
    mode: "auto",
    focus: V(), yaw: 0.9, pitch: 0.62, dist: 64,
    wFocus: V(), wYaw: 0.9, wPitch: 0.62, wDist: 64,
    followM: null, cutAt: 0, shot: "crane", craneSpin: 0.05,
    followTeam: "red", holdT: 0, reptT: 0,
    waveLock: false, waveY: 0.3,
  };
  /* THE CAMERA DOES NOT GO THROUGH A WALL.

     On sand and in the kill box the only thing between the lens and the fight
     was air, so the orbit arm never had to ask. Put the same director in the
     real downtown and it parks inside the Exchange Bank every other cut —
     measured, the first city capture of this wave is a screenshot of an
     office interior with a battle somewhere outside it.

     One segment test from the focus outward, and the arm shortens until the
     line is clear. It SNAPS in (a frame of masonry across the lens is worse
     than a jump) and eases back out, which is the ordinary third-person
     answer and the reason a pillar does not make the shot pump. */
  let camOccl = 1, camLift = 0;
  /* HOW LOW THE LENS MAY LOOK FROM. Everywhere else the ground is opaque, so a
     camera below its own focus is a camera inside a hill and the arm has always
     been clamped to +0.12 rad. In OPEN WATER the sea is NOT a wall — the shot
     that shows a shark best is the one taken from under it, looking up at a
     bright surface — so the clamp goes negative exactly there and nowhere else.
     (?swim=old restores the flat clamp with everything else in that wave.) */
  function pitchLo() { return (MAP && MAP.water && !SWIM_OLD) ? -1.15 : 0.12; }
  function camApply(dt) {
    // THE LENS AT WAVE HEIGHT is a property of the SHOT, so it is read here
    // rather than written by three different framing functions that would each
    // have to remember to clear it.
    cam.waveLock = cam.mode === "surface" && SEA.on && !SWIM_OLD;
    const k = 1 - Math.pow(0.002, dt);
    cam.focus.lerp(cam.wFocus, k);
    cam.yaw += (cam.wYaw - cam.yaw) * k;
    cam.pitch += (cam.wPitch - cam.pitch) * k;
    cam.dist += (cam.wDist - cam.dist) * k;
    const c = CBZ.camera;
    const cp = Math.max(pitchLo(), Math.min(1.42, cam.pitch));
    const sx = Math.sin(cam.yaw) * Math.cos(cp), sz = Math.cos(cam.yaw) * Math.cos(cp), sy = Math.sin(cp);
    const fy = cam.focus.y + 1.2;
    let want = 1;
    if (CBZ.micro.segmentBlocked) {
      for (let t = 0; t < 6; t++) {
        const d = cam.dist * want;
        const px = cam.focus.x + sx * d, pz = cam.focus.z + sz * d;
        let py = cam.focus.y + sy * d;
        const g = MAP.camFloor(px, pz);
        if (py < g) py = g;
        if (!CBZ.micro.segmentBlocked(cam.focus.x, fy, cam.focus.z, px, py, pz)) break;
        want *= 0.62;
        if (cam.dist * want < 2.6) { want = 2.6 / Math.max(0.001, cam.dist); break; }
      }
    }
    camOccl = want < camOccl ? want : camOccl + (want - camOccl) * Math.min(1, dt * 1.6);
    const dist = cam.dist * camOccl;
    const x = cam.focus.x + sx * dist, z = cam.focus.z + sz * dist;
    let y = cam.focus.y + sy * dist;
    const g = MAP.camFloor(x, z);
    if (y < g) y = g;
    /* A DUNE IS A WALL THE COLLIDERS DO NOT KNOW ABOUT. The low framings on
       the erg can park the lens behind a crest, looking at a face of sand with
       the war on the other side of it. The arm is not shortened (that would
       walk the lens INTO the crest); it is lifted until the eye line clears,
       eased like the occlusion above so the shot rises rather than pops. */
    if (MAP.terrainTrue && !MAP.water) {
      let lift = 0;
      for (let t = 0; t < 8 && terrainBlocked(cam.focus.x, fy, cam.focus.z, x, y + lift, z); t++) lift += 2.2;
      camLift += (lift - camLift) * Math.min(1, lift > camLift ? dt * 6 : dt * 1.2);
      y += camLift;
    }
    /* AND THE ONE SHOT WHOSE HEIGHT IS NOT THE ARM'S TO DECIDE. A lens riding
       the swell has to be ON the swell — at the water under ITSELF, not at the
       water under the animal it is watching — so the crests between the two
       rise past the glass and a dorsal fin cuts the frame at eye level. It is
       the same swellAt() every body in the sea floats on, read one more time. */
    if (cam.waveLock) y = swellAt(x, z) + (cam.waveY == null ? 0.3 : cam.waveY);
    c.position.set(x, y, z);
    c.lookAt(cam.focus.x, fy, cam.focus.z);
  }
  function hotspot() {
    if (!shotsRing.length) return null;
    const seed = shotsRing[(lcg() * shotsRing.length) | 0];
    let x = 0, z = 0, n = 0;
    for (let i = 0; i < shotsRing.length; i++) {
      const s = shotsRing[i];
      if (simT - s.t > 7) continue;
      if (Math.hypot(s.x - seed.x, s.z - seed.z) > 46) continue;
      x += s.x; z += s.z; n++;
    }
    return n ? { x: x / n, z: z / n } : { x: seed.x, z: seed.z };
  }
  function hottestMan() {
    let best = null, bt = -1e9;
    for (let i = 0; i < men.length; i++) {
      const m = men[i];
      if (m.dead || m.lastShotT < bt) continue;
      bt = m.lastShotT; best = m;
    }
    return best;
  }
  /* ============================================================ THE POINT MAN
     THE CAMERA WAS RIDING THE BACK OF THE ARMY.

     "Whoever shot last" sounds like the action and is not: with five hundred
     men firing, the most recent trigger pull is a coin toss across the whole
     line, and because a column's REAR ranks have the clearest lanes past
     their own mates, the coin landed behind the army more often than in front
     of it. You watched shoulders and backpacks while the war happened three
     hundred metres up the street.

     The front of the group is a different man and a better one: he is the one
     in contact, he is the one being shot at, and he is the one who is about to
     die — which is exactly why the shot is worth taking. He is found as the
     living man CLOSEST TO THE ENEMY'S MASS, with one guard that matters: he
     must have his own group around him. Without it the pick is always the
     lunatic who broke ranks and sprinted forty metres ahead of everybody —
     the front of NOTHING, alone in a street, the least interesting man alive.
     So the deepest dozen are ranked, and the first one with mates at his
     shoulder takes the lens. */
  const POINT = { red: null, blue: null, at: -9 };
  const _pc = [];
  const _pn = [];
  function pointMan(team) {
    const foe = teamCOM[team === "red" ? "blue" : "red"];
    _pc.length = 0;
    for (let i = 0; i < men.length; i++) {
      const m = men[i];
      if (m.dead || m.team !== team) continue;
      // depth INTO the enemy, plus a nudge for a man who is actually in a
      // fight — at equal depth the engaged man is the one to watch
      const d = Math.hypot(m.pos.x - foe.x, m.pos.z - foe.z) - (m.tgt && !m.tgt.dead ? 5 : 0);
      _pc.push(m, d);
    }
    if (!_pc.length) return null;
    let first = null;
    for (let pass = 0; pass < 12; pass++) {
      let bi = -1, bd = 1e18;
      for (let i = 0; i < _pc.length; i += 2) {
        if (_pc[i] && _pc[i + 1] < bd) { bd = _pc[i + 1]; bi = i; }
      }
      if (bi < 0) break;
      const m = _pc[bi];
      _pc[bi] = null;
      if (!first) first = m;
      // does he have his group with him? three mates inside fifteen metres is
      // a spearhead; nobody inside fifteen metres is a man who has run away
      const near = fineNear(m.pos.x, m.pos.z, 15, _pn);
      let mates = 0;
      for (let k = 0; k < near.length; k++) {
        if (near[k] !== m && !near[k].dead && near[k].team === team && ++mates >= 3) break;
      }
      if (mates >= 3) return m;
    }
    return first;               // a squad of two left: the deepest IS the front
  }
  function updatePoint() {
    POINT.red = pointMan("red");
    POINT.blue = pointMan("blue");
    POINT.at = simT;
  }
  // who the lens should be on for a team: its point man, and never a corpse
  // (except for the death beat the director deliberately holds — see below)
  function subjectFor(team) {
    const p = POINT[team];
    if (p && !p.dead && !p.fled) return p;
    updatePoint();
    return POINT[team] && !POINT[team].dead ? POINT[team] : null;
  }
  /* THE FIGHT AXIS: the bearing from one army's mass to the other. Every shot
     below is framed off it, which is the whole difference between this
     director and the one that rolled `lcg() * 2PI` for its yaw and pointed the
     lens at a car park half the time. */
  function fightAxis() {
    const a = teamCOM.red, b = teamCOM.blue;
    const dx = b.x - a.x, dz = b.z - a.z;
    if (Math.abs(dx) + Math.abs(dz) < 0.001) return 0;
    return Math.atan2(dx, dz);              // camera-yaw convention: (sin, cos)
  }
  // is there sky between this focus and a camera parked on this bearing? The
  // arm-shortening in camApply saves a shot that is BLOCKED; it cannot save a
  // shot that is blocked in every direction because nobody checked before
  // committing. Four candidate bearings, one segment test each, per cut.
  function clearYaw(fx, fz, want, dist, spread) {
    const fy = MAP.groundAt(fx, fz) + 1.2;
    const tries = [0, spread, -spread, spread * 2, -spread * 2, Math.PI];
    for (let i = 0; i < tries.length; i++) {
      const y = want + tries[i];
      const px = fx + Math.sin(y) * dist * 0.86, pz = fz + Math.cos(y) * dist * 0.86;
      const py = Math.max(MAP.camFloor(px, pz), fy + dist * 0.4);
      if (!CBZ.micro.segmentBlocked || !CBZ.micro.segmentBlocked(fx, fy, fz, px, py, pz)) return y;
    }
    return want;
  }
  /* THE SHOT DECK. Four framings, all of them ABOUT something:
       point — over the point man's shoulder, looking where he is looking,
               which is at the men trying to kill him. The default, and the
               one the death beat belongs to.
       push  — planted in front of the advancing front rank, looking back
               INTO it: the shot that makes five hundred men read as five
               hundred men instead of a texture.
       line  — broadside of the contact, across the fight axis, both armies
               in frame trading fire.
       crane — high and wide down the axis, for the shape of the whole thing.
     Weights favour the point man because he is where the war is. */
  function directorCut() {
    const alive = aliveCount("red") + aliveCount("blue");
    const r = lcg();
    const subjTeam = lcg() < 0.5 ? "red" : "blue";
    const subj = subjectFor(subjTeam) || subjectFor(subjTeam === "red" ? "blue" : "red");
    cam.shot = !subj ? "crane" : r < 0.5 ? "point" : r < 0.7 ? "push" : r < 0.88 ? "line" : "crane";
    cam.followM = subj;
    cam.craneSpin = (lcg() < 0.5 ? -1 : 1) * (0.02 + lcg() * 0.035);
    // a good shot is held; a wide is a punctuation mark
    cam.cutAt = simT + (cam.shot === "point" ? 8 + lcg() * 5 : 5 + lcg() * 3);
    const ax = fightAxis();
    if (cam.shot === "line" || cam.shot === "crane") {
      const hs = (subj ? { x: subj.pos.x, z: subj.pos.z } : hotspot()) || { x: MAP.cx, z: MAP.cz };
      cam.wFocus.set(hs.x, MAP.groundAt(hs.x, hs.z), hs.z);
      if (cam.shot === "line") {
        // across the axis: both firing lines in profile
        cam.wDist = 18 + Math.min(40, Math.sqrt(alive) * 3.0);
        cam.wPitch = 0.1 + lcg() * 0.14;
        cam.wYaw = clearYaw(hs.x, hs.z, ax + (lcg() < 0.5 ? 1 : -1) * Math.PI / 2, cam.wDist, 0.5);
      } else {
        cam.wDist = 38 + Math.min(95, Math.sqrt(alive) * 5.5);
        cam.wPitch = 0.34 + lcg() * 0.24;
        cam.wYaw = clearYaw(hs.x, hs.z, ax + Math.PI + (lcg() - 0.5) * 0.8, cam.wDist, 0.6);
      }
    }
  }
  // the death beat: when the man on the lens goes down, the camera STAYS on
  // him for a moment. He is the point man — watching him fall IS the shot, and
  // cutting away on the frame he dies is throwing away the only moment the
  // whole follow was built to catch.
  function subjectDied() {
    cam.holdT = 1.5;
    cam.wPitch = 0.22;
    cam.wDist = 7.5;
  }
  function frameSubject(m, dt) {
    cam.wFocus.set(m.pos.x, m.pos.y, m.pos.z);
    if (cam.shot === "push") {
      // ahead of him, walking backwards as the army comes on
      cam.wYaw = m.yaw + (lcg() - 0.5) * 0.02;
      cam.wPitch = 0.12; cam.wDist = 11;
    } else {
      cam.wYaw = m.yaw + Math.PI + 0.35;
      cam.wPitch = 0.16; cam.wDist = 7.8;
    }
    if (cam.holdT > 0) cam.holdT -= dt;
  }

  /* ============================================================ THE STUDY DESK
     AN ARENA YOU CANNOT STAND STILL IN IS NOT A TEST BED.

     The owner's brief for OPEN WATER was "a lightweight test arena, great for
     animation" — and every camera this page had was built for the opposite
     job. AUTO cuts every eight seconds by design, FOLLOW rides a rifleman's
     shoulder, FREE is a pair of hands. None of them will hold one shark in
     frame long enough to watch a single tail beat finish, which is the only
     thing an animation test bed is for.

     So: three more postures, each of them ABOUT one body or about the water it
     is in, and none of them ever cuts.

       study    LOCKED ON ONE ANIMAL, orbiting it at a range taken off the
                BODY'S OWN measured length — noseR, the half-length this page
                already measures off the bounding box at spawn — so a sardine
                and a megalodon fill the same fraction of the frame and you
                never have to touch the wheel. [ and ] walk the roster. With
                the sim clock at a quarter (key 5) and the frame step (.), that
                is the whole test bed the brief asked for.
       under    THE SEAT NOBODY HAD. Below the swell looking UP, the animal a
                silhouette against a bright surface. This shot was not merely
                missing, it was IMPOSSIBLE: the arm's pitch clamped at +0.12
                rad, so the lens could never get below the thing it was
                pointing at. See pitchLo().
       surface  THE LENS AT WAVE HEIGHT — y is the swell itself, at the
                camera's own position, so crests roll between you and the fish
                and a dorsal fin cuts the frame at eye level.

     STUDY.m is a REFERENCE to a live body, so it can go stale exactly once (a
     corpse), and every framing function revalidates before it reads. */
  const STUDY = { m: null, idx: 0, orbit: 0.9, spin: 0.28 };
  function studyList() {
    const out = [];
    for (let i = 0; i < men.length; i++) if (!men[i].dead && men[i].beast) out.push(men[i]);
    // a battle with no animals in it still deserves a locked lens
    if (!out.length) for (let i = 0; i < men.length; i++) if (!men[i].dead) out.push(men[i]);
    return out;
  }
  // no argument: the BIGGEST thing alive, because that is what you came to
  // look at and because it is stable across two runs of the same war.
  // +/-1: walk the roster from wherever the lens already was.
  function studyPick(delta) {
    const list = studyList();
    if (!list.length) { STUDY.m = null; return null; }
    if (delta == null) {
      let bi = 0;
      for (let i = 1; i < list.length; i++) {
        if ((list[i].noseR || list[i].rad || 0) > (list[bi].noseR || list[bi].rad || 0)) bi = i;
      }
      STUDY.idx = bi;
    } else {
      const cur = STUDY.m ? list.indexOf(STUDY.m) : -1;
      const from = cur >= 0 ? cur : STUDY.idx;
      STUDY.idx = ((from + delta) % list.length + list.length) % list.length;
    }
    STUDY.m = list[STUDY.idx];
    return STUDY.m;
  }
  // a tool asks for a body by species id or by index; a person never does
  function studyPickBy(sel) {
    const list = studyList();
    if (!list.length) { STUDY.m = null; return null; }
    let idx = -1;
    if (typeof sel === "number") idx = ((sel | 0) % list.length + list.length) % list.length;
    else if (typeof sel === "string") {
      for (let i = 0; i < list.length; i++) {
        if (list[i].beast && list[i].species && list[i].species.id === sel) { idx = i; break; }
      }
      if (idx < 0) return studyPick(null);
    }
    if (idx < 0) return studyPick(null);
    STUDY.idx = idx; STUDY.m = list[idx];
    return STUDY.m;
  }
  /* HOW FAR BACK THE LENS SITS, and it is the body that answers. A constant
     distance is the reason a shot of a sardine and a shot of a megalodon are
     the same picture of nothing: 2.4 body lengths puts the whole animal in
     frame with room for the water it is moving through, at 0.6 m and at 18 m
     alike. Bounded so a bait fish is not photographed from inside its own gills
     and a whale is not photographed from orbit. */
  function studyRange(m) {
    const len = Math.max(0.6, (m.noseR || m.rad || 0.5) * 2);
    return Math.max(3.2, Math.min(140, len * 2.4 + 1.5));
  }
  function studyBody() {
    let m = STUDY.m;
    if (!m || m.dead) m = studyPick(null);
    return m;
  }
  function studyHold(m) {
    cam.followM = m;              // the card names whatever the lens is on
    cam.shot = "study";
  }
  function frameStudy(dt) {
    const m = studyBody();
    if (!m) { cam.wFocus.set(MAP.cx, MAP.groundAt(MAP.cx, MAP.cz), MAP.cz); cam.wDist = 60; return; }
    STUDY.orbit += STUDY.spin * dt;
    cam.wFocus.set(m.pos.x, m.pos.y + (m.eyeH || 1) * 0.3, m.pos.z);
    cam.wYaw = (m.faceH == null ? 0 : m.faceH) + STUDY.orbit;
    cam.wPitch = 0.22;
    cam.wDist = studyRange(m);
    studyHold(m);
  }
  function frameUnder(dt) {
    const m = studyBody();
    STUDY.orbit += STUDY.spin * 0.5 * dt;
    const hs = m ? { x: m.pos.x, z: m.pos.z } : (hotspot() || { x: MAP.cx, z: MAP.cz });
    const y = m ? m.pos.y
      : (MAP.water ? swellAt(hs.x, hs.z) - 3 : MAP.groundAt(hs.x, hs.z) + 1);
    cam.wFocus.set(hs.x, y, hs.z);
    cam.wYaw = STUDY.orbit;
    cam.wPitch = -0.46;                       // below the body, looking up at it
    cam.wDist = m ? Math.max(7, studyRange(m) * 0.85) : 26;
    studyHold(m);
  }
  function frameWave(dt) {
    const m = studyBody();
    STUDY.orbit += STUDY.spin * 0.4 * dt;
    const hs = m ? { x: m.pos.x, z: m.pos.z } : (hotspot() || { x: MAP.cx, z: MAP.cz });
    cam.wFocus.set(hs.x, MAP.water ? swellAt(hs.x, hs.z) : MAP.groundAt(hs.x, hs.z) + 0.6, hs.z);
    cam.wYaw = STUDY.orbit;
    cam.wPitch = 0.02;                        // dead level: the horizon is the shot
    cam.wDist = m ? Math.max(9, studyRange(m) * 1.15) : 30;
    studyHold(m);
  }

  /* ============================================================ THE KILL CAM
     A TAKEDOWN IS OVER IN ABOUT A FIFTH OF A SECOND.

     creature_combat's strike lands, quadruped_ragdoll takes the body, and at
     SPEED 1 the whole event is three frames — which is exactly why "eight
     orcas kill a megalodon" reads as a health bar emptying rather than as a
     kill. The page already owns a sim clock that can go to a quarter and a
     camera that can be pointed at a body; the kill cam is those two things
     fired by the death itself.

     WALL-CLOCKED, NOT SIM-CLOCKED, and that is not a detail: this is a piece
     of DIRECTION, not part of the battle, so a two-second beat measured on the
     clock it just slowed would take eight seconds to play. It restores the
     speed it found, never the dial's default.

     It refuses in three situations, all of them for the same reason — the shot
     would be a lie or a cost:
       · during a benchmark (the benchmark exists to report frames, and an
         unannounced camera cut and a speed change are two variables in it);
       · while a person is driving the camera by hand (FREE means free);
       · for a body that is not in the shot, or a man (a rifleman falling is
         the ordinary texture of this page; a 15 m animal going down is not).
     ?killcam=0 is the revert. */
  const KILLCAM = Q.get("killcam") !== "0";
  const KILL = { t: 0, cool: 0, m: null, speed: 1, mode: null, shot: null, n: 0 };
  function killCam(m) {
    if (!KILLCAM || bench || over || !started) return;
    if (!m || !m.beast || KILL.t > 0 || KILL.cool > 0) return;
    if (cam.mode === "free" || cam.mode === "kill") return;
    if (camDist2(m.pos) > 110 * 110) return;
    KILL.t = 2.1; KILL.cool = 7; KILL.n++;
    KILL.m = m; KILL.speed = speed > 0 ? speed : lastSpeed;
    KILL.mode = cam.mode; KILL.shot = cam.shot;
    setSpeed(0.25);
    cam.mode = "kill";
    cam.wYaw = (m.faceH == null ? 0 : m.faceH) + 1.35;
    cam.wPitch = 0.18;
    cam.wDist = Math.max(4.5, studyRange(m) * 0.6);
    // SNAP the arm in rather than easing: a two-second beat spent flying the
    // camera across the map from wherever the director was is a beat that
    // photographs the journey and misses the death.
    cam.dist = cam.wDist; cam.yaw = cam.wYaw; cam.pitch = cam.wPitch;
    cam.wFocus.set(m.pos.x, m.pos.y + (m.eyeH || 1) * 0.4, m.pos.z);
    cam.focus.copy(cam.wFocus);
    studyHold(m);
    STUDY.m = m;
  }
  function stepKill(dt) {
    if (KILL.cool > 0) KILL.cool -= dt;
    if (KILL.t <= 0) return;
    KILL.t -= dt;
    const m = KILL.m;
    if (m) {
      // the body keeps solving under the lens — follow it down
      cam.wFocus.set(m.pos.x, m.pos.y + (m.eyeH || 1) * 0.4, m.pos.z);
      cam.wYaw += dt * 0.55;
    }
    if (KILL.t <= 0) {
      setSpeed(KILL.speed);
      cam.mode = KILL.mode || "auto";
      cam.shot = KILL.shot || "crane";
      cam.cutAt = simT;                    // and the director takes a fresh shot
      KILL.m = null;
    }
  }

  function stepCamera(dt) {
    const IN = CBZ.micro.input;
    if (simT - POINT.at > 0.5) updatePoint();
    if (cam.mode === "auto") {
      const subj = cam.followM;
      const subjGone = (cam.shot === "point" || cam.shot === "push") &&
        (!subj || subj.fled || (subj.dead && cam.holdT <= 0));
      if (subj && subj.dead && cam.holdT === 0) subjectDied();
      if (simT >= cam.cutAt || subjGone) directorCut();
      if ((cam.shot === "point" || cam.shot === "push") && cam.followM) frameSubject(cam.followM, dt);
      else cam.wYaw += cam.craneSpin * dt * 8;
    } else if (cam.mode === "follow") {
      /* FOLLOW IS THE FRONT OF THE GROUP, ALWAYS — and "always" is the word
         the first build got wrong. Latching onto the point man once and
         riding him until he died measured at frontness 0.55 over a 150-a-side
         city fight: the man the camera picked at the start of the advance was
         mid-pack by the time the armies met, because the FRONT MOVED and the
         camera did not. Half the army was ahead of the lens, which is the
         original complaint wearing a new hat.

         So the lens also hands over while he lives — but only when the front
         has genuinely left him behind (twelve metres, on a three-second
         cadence), never on the metre-to-metre jostle of a firing line. He
         dies, the camera holds the beat, then it takes the man who stepped
         over him. */
      const m = cam.followM;
      if (m && m.dead && cam.holdT === 0) subjectDied();
      if (!m || m.fled || (m.dead && cam.holdT <= 0)) {
        const next = subjectFor(cam.followTeam);
        if (next) { cam.followM = next; cam.holdT = 0; cam.reptT = simT + 3; }
      } else if (!m.dead && simT >= cam.reptT) {
        cam.reptT = simT + 3;
        const p = POINT[cam.followTeam];
        if (p && p !== m && !p.dead) {
          const foe = teamCOM[cam.followTeam === "red" ? "blue" : "red"];
          const dm = Math.hypot(m.pos.x - foe.x, m.pos.z - foe.z);
          const dp = Math.hypot(p.pos.x - foe.x, p.pos.z - foe.z);
          if (dm - dp > 12) cam.followM = p;
        }
      }
      if (cam.followM) frameSubject(cam.followM, dt);
    } else if (cam.mode === "kill") {
      // stepKill owns the targets this frame; nothing else may touch them
    } else if (cam.mode === "study") {
      frameStudy(dt);
    } else if (cam.mode === "under") {
      frameUnder(dt);
    } else if (cam.mode === "surface") {
      frameWave(dt);
    } else if (IN) {
      const fwd = 46 * dt * (cam.dist / 60 + 0.4);
      const mx = IN.axis("KeyA", "KeyD"), mz = IN.axis("KeyS", "KeyW");
      if (mx || mz) {
        cam.wFocus.x += (-Math.sin(cam.yaw) * mz - Math.cos(cam.yaw) * mx) * fwd;
        cam.wFocus.z += (-Math.cos(cam.yaw) * mz + Math.sin(cam.yaw) * mx) * fwd;
        cam.wFocus.y = MAP.groundAt(cam.wFocus.x, cam.wFocus.z);
      }
    }
    camApply(dt);
  }
  /* ============================================================ THE CARD
     The man on the lens, as two bars and nothing else: blood (only once he
     has been hit) and the magazine (only if he carries one), in his army's
     colour. A rifle emptying and refilling orange behind a wall is the rhythm
     of the fight; his name, his gun's label and his tally were words about it.

     Every write is guarded by a cached value: this runs at 10 Hz on a page
     that is already drawing a thousand bodies. */
  const whoC = { on: null, team: "", hp: -1, low: null, mag: -1, rl: null, hasMag: null, hurt: null };
  function stepWho() {
    const m = (cam.mode === "follow" || cam.shot === "point" ||
      cam.shot === "push" || cam.shot === "study" || cam.shot === "kill")
      ? cam.followM : null;
    const on = !!m && !m.dead;
    if (on !== whoC.on) { whoC.on = on; el("who").classList.toggle("on", on); }
    if (!on) return;
    if (m.team !== whoC.team) {
      whoC.team = m.team;
      el("who").style.setProperty("--tc", "#" + TEAMS[m.team].color.toString(16).padStart(6, "0"));
    }
    const hp = m.maxHp > 1e8 ? 1 : Math.max(0, Math.min(1, m.hp / m.maxHp));
    const hurt = hp < 0.995;
    if (hurt !== whoC.hurt) { whoC.hurt = hurt; el("whoHp").style.display = hurt ? "block" : "none"; }
    if (Math.abs(hp - whoC.hp) > 0.01) {
      whoC.hp = hp;
      el("whoHp").firstElementChild.style.width = (hp * 100) + "%";
      const low = hp < 0.34;
      if (low !== whoC.low) { whoC.low = low; el("whoHp").classList.toggle("low", low); }
    }
    const hasMag = m.magSize > 0;
    if (hasMag !== whoC.hasMag) { whoC.hasMag = hasMag; el("whoMagT").style.display = hasMag ? "block" : "none"; }
    if (!hasMag) return;
    const reloading = m.reloadT > 0;
    const w = CBZ.weaponById(m.wid) || {};
    const full = (w.reloadTime || w.reload) || 1.6;
    const frac = reloading ? Math.max(0, Math.min(1, 1 - m.reloadT / full)) : m.mag / m.magSize;
    if (Math.abs(frac - whoC.mag) > 0.01 || reloading !== whoC.rl) {
      whoC.mag = frac; whoC.rl = reloading;
      const t = el("whoMagT");
      t.classList.toggle("rl", reloading);
      t.firstElementChild.style.width = (frac * 100) + "%";
    }
  }

  function setCamMode(mode, team) {
    // a kill-cam beat in flight must not be left holding the old speed
    if (cam.mode === "kill" && mode !== "kill" && KILL.t > 0) {
      KILL.t = 0; KILL.m = null; setSpeed(KILL.speed);
    }
    cam.mode = mode;
    if (team) cam.followTeam = team;
    // the camera button lights while a director owns the lens, in the
    // followed army's colour when it is riding one of them
    const cb = el("cCam");
    cb.classList.toggle("on", mode !== "free");
    cb.style.setProperty("--cc", mode === "follow"
      ? "#" + TEAMS[cam.followTeam].color.toString(16).padStart(6, "0") : "#ff7a45");
    if (mode === "follow") {
      updatePoint();
      cam.followM = subjectFor(cam.followTeam) || hottestMan();
      cam.holdT = 0; cam.reptT = simT + 3;
      cam.shot = "point";          // else a stale AUTO framing rides along
    } else if (mode === "study" || mode === "under" || mode === "surface") {
      if (!STUDY.m || STUDY.m.dead) studyPick(null);
      cam.shot = "study";
    }
  }
  /* AUTO -> FOLLOW RED -> FOLLOW BLUE -> STUDY -> (the water postures) -> FREE.
     Both armies have a front and which one you ride is the question a
     spectator has; which ANIMAL you are looking at is the question this map
     was built to answer, so STUDY is in the ring for every venue. UNDER and
     WAVE are only in it where there is a waterline to be on the wrong side
     of — offering "look up through the sea" on the kill box is a control that
     does nothing, which is worse than no control. */
  function cycleCam() {
    const wet = !!(MAP && MAP.water && !SWIM_OLD);
    const ring = ["auto", "followRed", "followBlue", "study"]
      .concat(wet ? ["under", "surface"] : []).concat(["free"]);
    const now = cam.mode === "follow" ? "follow" + (cam.followTeam === "red" ? "Red" : "Blue") : cam.mode;
    let i = ring.indexOf(now);
    const next = ring[(i + 1) % ring.length];
    if (next === "followRed") setCamMode("follow", "red");
    else if (next === "followBlue") setCamMode("follow", "blue");
    else setCamMode(next);
  }
  // manual orbit: pointers on the page, ignored while the UI owns them
  let drag = null;
  const pinch = { d: 0 };
  function uiTarget(e) {
    return e.target && (e.target.closest && e.target.closest("#menu,#ctl,#end,button,select,input"));
  }
  window.addEventListener("pointerdown", function (e) {
    if (!started || uiTarget(e)) return;
    if (cam.mode !== "free") setCamMode("free");
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, b: e.button };
  });
  window.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.b === 2) {
      const s = cam.dist * 0.0016;
      cam.wFocus.x += (-Math.cos(cam.yaw) * -dx + Math.sin(cam.yaw) * -dy) * s;
      cam.wFocus.z += (Math.sin(cam.yaw) * -dx + Math.cos(cam.yaw) * -dy) * s;
    } else {
      cam.wYaw -= dx * 0.0052;
      cam.wPitch = Math.max(pitchLo(), Math.min(1.42, cam.wPitch + dy * 0.004));
    }
  });
  window.addEventListener("pointerup", function () { drag = null; pinch.d = 0; });
  window.addEventListener("wheel", function (e) {
    if (!started || uiTarget(e)) return;
    if (cam.mode !== "free") setCamMode("free");
    cam.wDist = Math.max(6, Math.min(420, cam.wDist * (e.deltaY > 0 ? 1.13 : 0.885)));
  }, { passive: true });
  window.addEventListener("touchmove", function (e) {
    if (!started || e.touches.length !== 2) return;
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
    if (pinch.d) cam.wDist = Math.max(6, Math.min(420, cam.wDist * (pinch.d / d)));
    pinch.d = d;
  }, { passive: true });
  window.addEventListener("contextmenu", function (e) { if (started && !uiTarget(e)) e.preventDefault(); });

  /* ============================================================ RESOLUTION
     The cheapest frames in a massive battle are the pixels you stop drawing.
     When the frame rate slips the render scale steps down before anything
     else does; it climbs back when the war thins out. */
  const RES = { steps: [1], idx: 0, t: 0, good: 0 };
  function initRes(total) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    RES.steps = [dpr, 1, 0.78, 0.6].filter(function (v, i, a) { return a.indexOf(v) === i; })
      .sort(function (a, b) { return b - a; });
    RES.idx = total > 900 && RES.steps.length > 1 ? 1 : 0;
    applyRes();
  }
  function applyRes() {
    const R = CBZ.renderer;
    if (!R || !R.setPixelRatio) return;
    R.setPixelRatio(RES.steps[RES.idx]);
    R.setSize(window.innerWidth, window.innerHeight, false);
  }
  function stepRes(dt) {
    RES.t -= dt;
    if (RES.t > 0) return;
    RES.t = 1.6;
    const fps = CBZ.micro.fps || 0;
    if (fps > 4 && fps < 28 && RES.idx < RES.steps.length - 1) { RES.idx++; RES.good = 0; applyRes(); }
    else if (fps > 50 && RES.idx > 0 && ++RES.good >= 3) { RES.good = 0; RES.idx--; applyRes(); }
  }

  /* ============================================================ CLOCK */
  const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  const ICON_FAST = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l8 6-8 6zM12 6l8 6-8 6z"/></svg>';
  const SPEED_RING = [1, 2, 4, 8, 0.25];
  function setSpeed(s) {
    if (s > 0) lastSpeed = s;
    speed = s;
    const pb = el("cPause");
    pb.innerHTML = s === 0 ? ICON_PLAY : ICON_PAUSE;
    pb.classList.toggle("on", s === 0);
    // the speed button is the fast-forward mark at real time and the dial's
    // number once it is anything else
    const sb = el("cSpeed"), shown = s === 0 ? lastSpeed : s;
    sb.innerHTML = shown === 1 ? ICON_FAST : (shown < 1 ? "&frac14;" : shown) + "&times;";
    sb.classList.toggle("on", shown !== 1);
  }
  el("cPause").addEventListener("click", function () { setSpeed(speed === 0 ? lastSpeed : 0); });
  el("cSpeed").addEventListener("click", function () {
    const i = SPEED_RING.indexOf(speed === 0 ? lastSpeed : speed);
    setSpeed(SPEED_RING[(i + 1) % SPEED_RING.length]);
  });
  el("cCam").addEventListener("click", function () {
    cycleCam();
  });
  /* THE CONTROLS LEAVE THE PICTURE. Still mouse for three seconds and the row
     fades out; any movement, touch or key brings it back. On a touch screen it
     only dims, since there is no hover to summon it with. */
  let ctlIdleAt = 0;
  function wakeCtl() {
    ctlIdleAt = performance.now() + 3000;
    el("ctl").classList.remove("idle");
  }
  ["pointermove", "pointerdown", "keydown", "wheel"].forEach(function (ev) {
    window.addEventListener(ev, wakeCtl, { passive: true });
  });
  // out of the war: back to the war room (which carries MAIN MENU to the hub)
  el("cBack").addEventListener("click", function () { location.href = location.pathname; });

  /* ============================================================ BENCH
     The honest answer to "how many". Everybody is unkillable so the census
     is exact; every few seconds the measured frame rate decides whether two
     more platoons walk on. When it dips under 30 twice, the last size that
     held is the machine's number. */
  /* HOW BIG A STEP THE BENCHMARK TAKES, AND WHY IT IS NOT ALWAYS THIRTY.

     "Two more platoons" is the right increment for men and nonsense for the
     sea. Thirty more megalodons is a step from forty to seventy of the most
     expensive body in the game — the run overshoots the machine's real number
     on its first growth and reports the floor of a huge bracket. Thirty more
     sardines is not a step at all: a shoal that costs almost nothing takes
     twenty growths to find its edge and the run never finishes.

     So the roster's own SCALE sets it, read off the live registry like
     everything else on this page. Men answer exactly 30 by construction, so a
     benchmark of riflemen returns the number it always returned and the saved
     `cbz-npcwar-max` keeps meaning what it meant. There is still NO CAP —
     this only changes how fast the count walks toward the frame rate's verdict,
     which is the only thing allowed to end the run. */
  function benchScale() {
    const SP = CBZ.WILDLIFE_SPECIES || {};
    let k = 0;
    [SET.redU, SET.blueU].forEach(function (u) {
      String(u).split("|").forEach(function (id) {
        const sc = id === "men" ? 1 : ((SP[id] || {}).scale || 1);
        if (sc > k) k = sc;
      });
    });
    return k || 1;
  }
  function benchStepFor() {
    return Math.max(2, Math.min(160, Math.round(30 / Math.max(0.35, benchScale()))));
  }
  // what the number is COUNTING, so "MAX 220" is not silently a number about
  // sardines being read as a number about men
  function benchUnit() {
    const same = SET.redU === SET.blueU;
    return (SET.redU === "men" && same) ? "PER SIDE"
      : (same ? kindLabel(SET.redU) : "BODIES") + " PER SIDE";
  }
  function benchKey() {
    return SET.redU === "men" && SET.blueU === "men"
      ? "cbz-npcwar-max" : "cbz-npcwar-max-" + SET.redU + "-v-" + SET.blueU;
  }
  function stepBench(dt) {
    const B = bench;
    B.t += dt;
    B.fpsAcc += dt; B.fpsN++;
    if (B.t < B.nextAt) return;
    const fps = CBZ.micro.fps || 0;
    B.t = 0; B.nextAt = 3.2;
    hud.note("BENCH " + aliveCount("red") + " " + benchUnit() + "  " + fps + " FPS");
    if (fps >= 33 && spawnQueue.length === 0) {
      B.lastGood = aliveCount("red");
      B.dips = 0;
      queueMen(B.step);
      B.grown += B.step;
    } else if (fps < 30) {
      B.dips++;
      if (B.dips >= 2) {
        const n = B.lastGood || aliveCount("red");
        try { localStorage.setItem(benchKey(), String(n)); } catch (e) {}
        banner("MAX " + n + " " + benchUnit(), "AT 30 FPS ON THIS MACHINE");
        hud.note("BENCH DONE  " + n + " " + benchUnit());
        bench = { done: true, n: n, t: 0, nextAt: 1e9, fpsAcc: 0, fpsN: 0, step: 0, grown: B.grown, lastGood: n, dips: 0 };
      }
    } else B.dips = 0;
  }

  /* ============================================================ SPAWN */
  function queueMen(perSide) {
    const r0 = spawnCount.red, b0 = spawnCount.blue;
    for (let i = 0; i < perSide; i++) {
      spawnQueue.push(["red", r0 + i], ["blue", b0 + i]);
    }
    spawnCount.red += perSide; spawnCount.blue += perSide;
    spawnTotal = spawnCount.red + spawnCount.blue;
  }
  const spawnCount = { red: 0, blue: 0 };
  function drainSpawns() {
    let n = 0;
    while (spawnQueue.length && n < 10) {
      const s = spawnQueue.shift();
      const kind = kindAt(s[0] === "red" ? SET.redU : SET.blueU, s[1]);
      const m = kind === "men" ? makeMan(s[0], s[1]) : makeBeast(s[0], s[1], kind);
      if (m) men.push(m);
      n++;
    }
  }

  /* ============================================================ BANNER / END
     The banner is the bench's alone now: "MAX 480 MEN" is a measurement
     whose whole point is the sentence. A war says what happened with the
     camera (the director goes wide over a rout, lands on the last man) and
     the sound (a falling horn when a line gives way), not with captions. */
  let bannerT = 0;
  function banner(big, small) {
    el("banner").innerHTML = big + (small ? "<small>" + small + "</small>" : "");
    el("banner").classList.add("on");
    bannerT = 3.4;
  }
  /* ============================================================ THE CALL
     A WAR YOU WATCH NEEDS SOMETHING RIDING ON IT. The question machine was
     always "who wins?" — so the page asks it. You call a side before START
     (the war room) or for the next round (the result card); the result card
     answers it, and a streak remembers how good your eye is across rounds.
     LOSER +50% is the other half of the loop: it hands the beaten side half
     again and runs it back, which is how "how many men DOES it take to beat a
     gorilla" gets answered in five rounds instead of argued about. */
  function sideName(team) {
    const u = team === "red" ? SET.redU : SET.blueU;
    if (u === "men" || typeof kindLabel !== "function") return TEAMS[team].name;
    return kindLabel(u);
  }
  const STREAK_KEY = "cbz-npcwar-streak";
  function readStreak() {
    try { return Object.assign({ streak: 0, best: 0, calls: 0, right: 0 }, JSON.parse(localStorage.getItem(STREAK_KEY) || "{}")); }
    catch (e) { return { streak: 0, best: 0, calls: 0, right: 0 }; }
  }
  let nextCall = null, callScored = false;
  function warURL(o) {
    const p = new URLSearchParams();
    p.set("map", SET.map);
    p.set("red", o.red != null ? o.red : SET.redN); p.set("blue", o.blue != null ? o.blue : SET.blueN);
    p.set("ru", SET.redU); p.set("bu", SET.blueU); p.set("rw", SET.redW); p.set("bw", SET.blueW);
    p.set("rt", SET.redT); p.set("bt", SET.blueT); p.set("rs", SET.redS); p.set("bs", SET.blueS);
    if (o.call) p.set("call", o.call);
    p.set("auto", "1");
    return location.pathname + "?" + p.toString();
  }
  /* MOMENTUM, SHOWN. The man layer calls this when the war turns: an army
     breaks and runs, or is down to its last man. The director answers with
     the lens and the horn; nothing is captioned. Rallies and kill streaks
     are visible in the fight itself and need no hook here. */
  function warEvent(kind, d) {
    d = d || {};
    const team = d.team;
    if (!team || !TEAMS[team]) return;
    if (kind === "rout") {
      // the director goes wide over the run: the broken line and the pursuit
      // behind it is the picture of the moment the war was decided
      const c = teamCOM[team];
      if (c && cam.mode === "auto" && MAP) {
        cam.shot = "crane"; cam.followM = null;
        cam.wFocus.set(c.x, MAP.groundAt(c.x, c.z), c.z);
        cam.wDist = 58; cam.wPitch = 0.44;
        cam.wYaw = fightAxis() + Math.PI * 0.75;
        cam.craneSpin = 0.02; cam.cutAt = simT + 7;
      }
      // a falling horn: the sound of a line giving way
      if (CBZ.micro.sfx && CBZ.micro.sfx.tone) { try { CBZ.micro.sfx.tone(196, 0.9, { type: "sawtooth", slideTo: 110, gain: 0.08 }); } catch (e) {} }
    } else if (kind === "lastman") {
      let m = null;
      for (let i = 0; i < men.length; i++) if (men[i].id === d.id) { m = men[i]; break; }
      // the lens goes to him: this is the shot the whole war was building to
      if (m && !m.dead && cam.mode === "auto") {
        cam.shot = "point"; cam.followM = m; cam.holdT = 0; cam.cutAt = simT + 12;
      }
    }
  }
  function endWar(won) {
    over = true;
    winner = won;
    const h = el("endT");
    h.textContent = won ? sideName(won) + " WIN" : "NOBODY LEFT";
    h.className = won || "";
    // the call, scored once; the streak is only worth saying once it is one
    const ec = el("endCall");
    ec.className = ""; ec.textContent = "";
    if (SET.call && won && !callScored) {
      callScored = true;
      const st = readStreak();
      const right = SET.call === won;
      st.calls++; if (right) { st.right++; st.streak++; st.best = Math.max(st.best, st.streak); } else st.streak = 0;
      try { localStorage.setItem(STREAK_KEY, JSON.stringify(st)); } catch (e) {}
      ec.className = right ? "right" : "wrong";
      ec.textContent = right ? (st.streak >= 2 ? st.streak + " IN A ROW" : "YOU CALLED IT") : "WRONG CALL";
    }
    nextCall = SET.call || null;
    el("end").querySelectorAll(".calls button").forEach(function (b) { b.classList.toggle("on", b.dataset.call === nextCall); });
    const loserTeam = won === "red" ? "blue" : won === "blue" ? "red" : null;
    el("endLoser").style.display = loserTeam ? "" : "none";
    if (loserTeam) {
      const n = loserTeam === "red" ? SET.redN : SET.blueN;
      el("endLoser").textContent = sideName(loserTeam) + " " + n + " TO " + Math.max(n + 1, Math.ceil(n * 1.5));
    }
    el("end").style.display = "grid";
    el("ctl").classList.add("idle");
  }
  el("end").querySelectorAll(".calls button").forEach(function (b) {
    b.addEventListener("click", function () {
      nextCall = nextCall === b.dataset.call ? null : b.dataset.call;
      el("end").querySelectorAll(".calls button").forEach(function (x) { x.classList.toggle("on", x.dataset.call === nextCall); });
    });
  });
  // AGAIN used to be location.reload(), which on a war started from the menu
  // (no ?auto) dropped you straight back on the setup card. A rematch is the
  // same war, now, with your next call riding on it.
  el("endAgain").addEventListener("click", function () { location.href = warURL({ call: nextCall }); });
  el("endLoser").addEventListener("click", function () {
    const o = { call: nextCall };
    if (winner === "red") o.blue = Math.max(SET.blueN + 1, Math.ceil(SET.blueN * 1.5));
    else if (winner === "blue") o.red = Math.max(SET.redN + 1, Math.ceil(SET.redN * 1.5));
    location.href = warURL(o);
  });
  el("endMenu").addEventListener("click", function () {
    location.href = location.pathname;
  });
  el("endWatch").addEventListener("click", function () { el("end").style.display = "none"; });

  /* ============================================================ BEGIN */
  function begin(asBench) {
    el("menu").style.display = "none";
    // a restart must not inherit a body from the last war: apeReset drops every
    // live hold and puts anything still in the air back on its feet, unowned
    if (CBZ.apeReset) { try { CBZ.apeReset(); } catch (e) {} }
    // packsFor() sets this on every route that loads ground packs; the bench
    // button reaches begin() without one, so state it here too.
    HAS_BEASTS = SET.redU !== "men" || SET.blueU !== "men";
    /* THE AIR BELONGS TO THE PLACE. One desert haze over all five grounds put
       an orange dust horizon behind a glass downtown and washed the streets
       out to paper. Three skies: a hard flat light for the kill box, a clean
       maritime one for the city and the two islands, and the original basin
       haze for the dunes, which is the only map it was ever describing. */
    const SKY = {
      arena: {
        fov: 72, far: 3200, exposure: 0.92,
        sky: { top: 0x46586c, bottom: 0xb4ac96, fogNear: 260, fogFar: 1500, radius: 2600 },
        lights: { sun: 0.9, hemi: 0.5, shadowSpan: 320, groundColor: 0x6b6657 },
      },
      city: {
        fov: 70, far: 9000, exposure: 0.8,
        sky: { top: 0x27528c, bottom: 0x9fb6cc, fogNear: 420, fogFar: 3400, radius: 7000 },
        lights: { sun: 0.86, hemi: 0.52, shadowSpan: 420, groundColor: 0x6a6f76 },
      },
      dunes: {
        /* The sun came down from 0.98: at that level the sand's own vertex
           colours clipped to white and the whole erg rendered as a sheet of
           paper — the exact wash the city map already fixed for its stone.
           Sand is TAN, and the men and the dead have to read against it. */
        /* LATE AFTERNOON, NOT NOON. A sun 55° up over sand lights every face
           the same and the erg reads flat whatever its shape; at ~20° the
           slip faces fall into shade, the crests catch the light, and every
           man throws a long shadow down the slope — which is the picture of a
           desert war. The fill drops so the shade is shade (warm sand bounce,
           cool sky), and the haze goes gold toward the horizon. */
        fov: 64, far: 16000, exposure: 0.8,
        sky: { top: 0x2f63a3, bottom: 0xe6b57c, fogNear: 700, fogFar: 7200, radius: 12000, exponent: 0.55 },
        lights: { sun: 1.1, hemi: 0.36, shadowSpan: 160, shadowMap: 2048, sunColor: 0xffcf98,
          skyColor: 0x9db4d0, groundColor: 0xb48a58 },
        sunDir: [0.78, 0.36, 0.5],
      },
      /* OPEN WATER. A maritime sun high enough to put caustic-bright tops on
         the swell, a short fog so the horizon is haze and not a hard rim on a
         26 km plate, and a GROUND colour for the hemisphere light that is the
         sea itself — bounce off water is blue-green, and lighting a shark with
         a tan desert bounce is what made the first draft read as a toy. */
      water: {
        fov: 70, far: 9000, exposure: 0.88,
        sky: { top: 0x1b4c80, bottom: 0x9dc0d4, fogNear: 240, fogFar: 2400, radius: 7000 },
        lights: { sun: 1.2, hemi: 0.5, shadowSpan: 240, sunColor: 0xfff0d8, skyColor: 0xc4dced, groundColor: 0x1d4258 },
        sunDir: [0.72, 0.5, 0.48],
      },
    };
    SKY.island = SKY.field = SKY.city;
    CBZ.micro.boot(SKY[SET.map] || SKY.dunes);
    CBZ.micro.pauseKey = null;                       // the clock is ours (Space)
    sunRig((SKY[SET.map] || SKY.dunes).sunDir);
    if (!CBZ.groundAt) CBZ.groundAt = function (x, z) { return MAP ? MAP.groundAt(x, z) : 0; };

    MAP = buildMap(SET.map);
    // THE GROUND IS FINISHED — settle it before a single man walks on. The
    // real fabric costs 17 000 draw calls raw and a fraction of that merged,
    // and the pass must run while the scene is still nothing but scenery:
    // anything added afterwards keeps its own live matrix, which is how the
    // men and the aircraft stay animated through it.
    if (Q.get("settle") !== "0") CBZ.studio.settle(CBZ.scene);
    // the walkable map, once, off the colliders the ground just registered
    navBuild(MAP.cx, MAP.cz, { city: 330, island: 340, field: 540, arena: 150, dunes: 220, water: 200 }[SET.map] || 260);
    AIR.on = SET.redS !== "none" || SET.blueS !== "none";
    // a small war is short: the warhead arms early enough to matter
    AIR.nukeAt = 20 + Math.min(22, (SET.redN + SET.blueN) / 36);
    if (AIR.on && CBZ.ordnance && CBZ.ordnance.init) {
      CBZ.ordnance.init({ scene: CBZ.scene, groundAt: MAP.groundAt });
    }
    if (asBench) {
      const step = benchStepFor();
      bench = { t: 0, nextAt: 3.2, step: step, lastGood: 0, dips: 0, grown: 0, fpsAcc: 0, fpsN: 0,
        unit: benchUnit(), scale: Math.round(benchScale() * 100) / 100 };
      // the opening size is one step plus a little, so the first measurement is
      // taken on a field that is already doing something. Men: 40, as always.
      SET.redN = SET.blueN = Math.max(4, Math.min(400, step + 10));
      SET.redW = SET.blueW = (SET.redW === "everything" || SET.redW === "mixed") ? "ak47" : SET.redW;
    }

    // SHADOWS PAY TWICE (a shadow pass draws every caster again). Big armies
    // buy frames with the sun instead.
    const total = SET.redN + SET.blueN;
    const R = CBZ.renderer || (CBZ.micro && CBZ.micro.renderer);
    if (R && R.shadowMap && (total > 170 || asBench)) R.shadowMap.enabled = false;

    // the studio HUD carries one line, and only for the bench: its running
    // census IS the measurement. A war you watch gets no ticker.
    hud = CBZ.studio.hud({ health: false, clock: false, score: false, feed: false, note: !!asBench, prompt: false, danger: false, pause: false });

    spawnQueue.length = 0;
    // interleave the queues so uneven armies still stream in fairly
    for (let i = 0; i < Math.max(SET.redN, SET.blueN); i++) {
      if (i < SET.redN) spawnQueue.push(["red", i]);
      if (i < SET.blueN) spawnQueue.push(["blue", i]);
    }
    spawnCount.red = SET.redN; spawnCount.blue = SET.blueN;
    spawnTotal = SET.redN + SET.blueN;

    cam.focus.set(MAP.cx, MAP.groundAt(MAP.cx, MAP.cz) + 2, MAP.cz);
    cam.wFocus.copy(cam.focus);
    cam.wDist = Math.min(300, 40 + Math.sqrt(spawnTotal) * 3.2);
    cam.dist = cam.wDist + 60;
    /* THE OPENING IS A CRANE DOWN BEHIND THE RED LINE, not a satellite view:
       it starts high and settles low across the field so the first thing a
       stranger sees is two armies facing each other over the ground. */
    cam.yaw = cam.wYaw = Math.atan2(-0.8, 0.6);
    cam.pitch = 0.62; cam.wPitch = MAP.water ? 0.3 : 0.2;
    cam.cutAt = 5;

    el("ctl").style.display = "flex";
    wakeCtl();
    setSpeed(1);
    setCamMode(asBench ? "free" : "auto");
    if (asBench) { cam.wPitch = 0.9; cam.wDist = 170; }
    initRes(spawnTotal);
    started = true;
    if (AIR.on) spawnPlanes();
    CBZ.micro.onFrame(frame);
  }

  /* THE SUN IS AIMED, AND ITS SHADOW FOLLOWS THE LENS'S SUBJECT.
     microboot parks the sun at a fixed noon bearing over the CAMERA and spans
     its shadow map 600 m — at 2048 texels that is 0.6 m a texel, so a man
     (0.5 m across) cast no readable shadow at all and the armies floated on
     the sand. Here the map owns the bearing (`sunDir`, low and warm on the
     dunes), the shadow box is centred on what the lens is LOOKING AT, and it
     is sized to the arm: tight and crisp on a follow shot, wide on a crane.
     The sky dome gets the sun too — a glow and a disc where the light comes
     from, so the key light has a source in frame. */
  function sunRig(dir) {
    const sun = CBZ.micro.sun;
    if (!sun) return;
    const v = new THREE.Vector3(0.55, 1, 0.35);
    if (dir) v.fromArray(dir);
    v.normalize();
    const D = 700;
    let lastSpan = 0;
    /* THE BUG THAT HID EVERY SHADOW ON THIS PAGE. studio.settle() freezes the
       scene's static matrices, and the sun's TARGET is a plain Object3D in the
       scene — so it was frozen where boot put it, at the world origin, while
       the sun itself (a light, skipped by the freeze) followed the camera. The
       key light aimed from over the battle toward a point two kilometres away:
       wrong direction, and a shadow frustum that never contained a single man.
       The target is marked dynamic before the settle, and its matrix is
       rebuilt by hand every frame regardless. */
    sun.target.userData.dynamic = true;
    sun.target.matrixAutoUpdate = true;
    CBZ.micro.onFrame(function () {
      const f = cam.focus;
      sun.position.set(f.x + v.x * D, f.y + v.y * D, f.z + v.z * D);
      sun.target.position.set(f.x, f.y, f.z);
      sun.target.updateMatrix();
      sun.target.updateMatrixWorld(true);
      if (!sun.castShadow) return;
      const span = Math.max(38, Math.min(460, cam.dist * camOccl * 1.2 + 26));
      if (Math.abs(span - lastSpan) > lastSpan * 0.12) {
        lastSpan = span;
        const sc = sun.shadow.camera;
        sc.left = -span; sc.right = span; sc.top = span; sc.bottom = -span;
        sc.near = 20; sc.far = D * 2;
        sc.updateProjectionMatrix();
        const texel = span * 2 / (sun.shadow.mapSize.width || 2048);
        sun.shadow.bias = -0.0004;
        sun.shadow.normalBias = texel * 1.6;
      }
    }, { order: 50 });
    const dome = CBZ.micro.skyDome;
    if (dir && dome && dome.material && dome.material.uniforms) {
      dome.material.uniforms.sunDir = { value: v.clone() };
      dome.material.fragmentShader =
        "uniform vec3 topColor;uniform vec3 bottomColor;uniform float offset;uniform float exponent;uniform vec3 sunDir;" +
        "varying vec3 vW;void main(){float h=normalize(vW+vec3(0.0,offset,0.0)).y;" +
        "vec3 col=mix(bottomColor,topColor,pow(max(h,0.0),exponent));" +
        "vec3 dir=normalize(vW-cameraPosition);float s=max(dot(dir,sunDir),0.0);" +
        "col+=vec3(1.0,0.66,0.36)*(pow(s,6.0)*0.32+pow(s,48.0)*0.5)*(1.0-max(h,0.0)*0.6);" +
        "col=mix(col,vec3(1.0,0.95,0.84)*2.2,smoothstep(0.9993,0.9997,s));" +
        "gl_FragColor=vec4(col,1.0);}";
      dome.material.needsUpdate = true;
    }
  }

  /* ============================================================ FRAME */
  let winCheckT = 0, lastWall = 0, whoT = 0;
  /* THE PROBE'S CLOCK. The sim below reads performance.now() on purpose — the
     speed dial is a promise about REAL seconds and a render-time clock cannot
     keep it. That also means a headless tool cannot advance this battle by a
     stated amount: it can only wait, at whatever rate a software rasteriser
     manages, which is how a two-minute war becomes a two-hour probe and why in
     practice nobody photographed one. `injectDt` is the seam — set it and the
     next frame consumes exactly that many seconds instead of asking the wall.
     Read once and cleared, so a missed frame can never silently double a step.
     Driven only by __battle.advance(); play never touches it. */
  let injectDt = 0;
  let stepPulse = 0;             // one hand-cranked frame, from the `.` key
  function frame(dt) {
    if (!started) return;
    // THE SIM CLOCK IS WALL TIME, NOT RENDER TIME. microboot clamps its dt
    // for animation stability, so on a struggling machine the battle would
    // quietly run at a fraction of the dial. The dial is a promise: SPEED 1
    // is one real second per second, and the sub-steps below keep the
    // integration solid however long the frame took.
    const wall = performance.now();
    let realDt = lastWall ? Math.min(0.25, (wall - lastWall) / 1000) : dt;
    lastWall = wall;
    if (injectDt > 0) { realDt = injectDt; injectDt = 0; }   // the probe's clock

    dt = realDt;                      // gait, camera and timers follow the same clock
    if (!firstFrameAt) firstFrameAt = Math.round(performance.now());
    dbgWall += realDt; dbgN++;
    fxBudget = 0;
    drainSpawns();

    // keys: the clock and the cameras
    const IN = CBZ.micro.input;
    if (IN) {
      if (IN.pressed("Space")) setSpeed(speed === 0 ? lastSpeed : 0);
      if (IN.pressed("Digit1")) setSpeed(1);
      if (IN.pressed("Digit2")) setSpeed(2);
      if (IN.pressed("Digit3")) setSpeed(4);
      if (IN.pressed("Digit4")) setSpeed(8);
      if (IN.pressed("Digit5")) setSpeed(0.25);
      // F rides the front rank; pressing it again crosses to the other army
      if (IN.pressed("KeyF")) {
        setCamMode("follow", cam.mode === "follow" && cam.followTeam === "red" ? "blue" : "red");
      }
      if (IN.pressed("KeyC")) setCamMode(cam.mode === "auto" ? "free" : "auto");
      /* THE TEST BED'S OWN KEYS. V locks the lens on one animal, [ and ] walk
         the roster, U drops it under the swell and B sits it on the waterline.
         Each is a toggle back to FREE, so the same finger that took the shot
         gives the camera back. */
      if (IN.pressed("KeyV")) setCamMode(cam.mode === "study" ? "free" : "study");
      if (IN.pressed("KeyU")) setCamMode(cam.mode === "under" ? "free" : "under");
      if (IN.pressed("KeyB")) setCamMode(cam.mode === "surface" ? "free" : "surface");
      if (IN.pressed("BracketLeft")) { studyPick(-1); if (cam.mode === "free") setCamMode("study"); }
      if (IN.pressed("BracketRight")) { studyPick(1); if (cam.mode === "free") setCamMode("study"); }
      /* THE FRAME STEP. A quarter-speed clock is still a clock; "does the tail
         cross the centre line before the jaw opens" is a question you can only
         answer by stopping and nudging. `.` pauses if it has to and then hands
         the next frame exactly one thirtieth of a second — the same injected-dt
         seam the headless probe uses, so a person and a tool step this battle
         through the identical code path. */
      if (IN.pressed("Period")) { if (speed !== 0) setSpeed(0); stepPulse = 1 / 30; }
    }

    // ---- SIM at the dialled speed, sub-stepped so 8x stays solid. The
    // sub-step cap means a machine that cannot COMPUTE eight seconds per
    // second degrades to what it can.
    let simDt = realDt * speed;
    if (stepPulse > 0) { simDt = stepPulse; stepPulse = 0; }   // one frame, by hand
    const simBefore = simT;
    if (simDt > 0) {
      const sub = Math.min(8, Math.max(1, Math.ceil(simDt / 0.055)));
      const sdt = Math.min(0.055, simDt / sub);
      for (let s = 0; s < sub; s++) {
        simT += sdt;
        CBZ.now += sdt * 1000;             // combat_iq's clocks follow the dial
        if (simT - gridAt > 0.35) rebuildGrid();
        if (simT - comAt > 0.6) updateCOM();
        // the field is re-solved on a slow, STAGGERED tick: two solves in the
        // same sub-step is a visible hitch on a big battle and buys nothing
        if (NAV.on) {
          if (simT - NAV.at.red > 1.4) navSolve("red");
          else if (simT - NAV.at.blue > 1.4) navSolve("blue");
        }
        for (let i = 0; i < men.length; i++) stepMan(men[i], sdt);
        /* THE HOLD AND EVERYTHING IN THE AIR. This has to be its own call and
           not a seam inside beastFight: the strike bubble above only runs while
           the gorilla has a LIVING target inside reach, and a man being swung
           around by the ankle is usually dead before the second revolution —
           the moment his corpse stopped qualifying, the swing would freeze
           mid-air with him welded to a fist. Driven here, on the sim clock, it
           also runs at the dialled battle speed like everything else.

           GATED ON THE ROSTER for the same measured reason the corpse solver
           below is, and it is worth stating rather than copying: a war of
           riflemen is held to `overlapPeak === 0` by tools/battle-check.mjs,
           and that is a knife-edge which ANY added work in this innermost
           sub-step can push over (the solver's own note records 0 pairs on
           three runs ungated versus 1-2 with). There is no ape in a men-only
           battle, so there is nothing here for it to step. */
        if (HAS_BEASTS && CBZ.apeStep) { try { CBZ.apeStep(sdt); } catch (e) {} }
        /* THE DEAD RUN ON THE SAME CLOCK AS THE LIVING. quadruped_ragdoll.js
           normally ticks itself off the frame hook, which would leave the
           corpses folding at wall speed while the battle ran at quarter speed
           — and still folding while SPACE says the war is paused. The page
           claimed the solver (CBZ.quadRagdollDriven, set at the top) precisely
           so it could be stepped HERE, inside the sub-step, with the sim's own
           dt. Nothing else on this page has to know.

           GATED ON THE ROSTER, and the gate is not an optimisation — it is the
           proof. tools/battle-check.mjs holds a battle of RIFLEMEN to
           `overlapPeak === 0`, a knife-edge that a man's shoulder either
           crosses or does not, and adding any work to the innermost loop of
           that battle moved it (measured: 0 overlapping pairs on three runs of
           the old code, 1-2 on three runs with this call ungated). A war
           between men has no quadruped to solve, so it should not enter the
           solver at all — and now the men-only sub-step is the one it always
           was, which is the only way that check keeps meaning what it says. */
        if (deadSolving > 0) {
          if (HAS_BEASTS && CBZ.quadRagdollStep) CBZ.quadRagdollStep(sdt);
          if (CBZ.ragdollStep) CBZ.ragdollStep(sdt);
        }
        rebuildFine();                       // bodies moved: the body grid is stale
        separateSolve(Math.min(0.9, sdt * 26));
        if (!SEP_OLD) { rebuildFine(); pinnedPass(); }   // and what no sweep can fix: a wall
        stepRockets(sdt);
        if (AIR.on) {
          if (simT - airAimT > 3) {
            airAimT = simT;
