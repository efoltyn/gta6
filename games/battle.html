<!-- ============================================================
  NPC WAR — a battle you WATCH.

  Two armies of Gang City's own people, any size, any gun in the armoury,
  fighting each other with the engine's own combat brain while you fly a
  camera around it and turn the clock up.

  Nothing violent here is drawn by this file. The men are studio.cast. The
  guns in their hands are weapons/appearances via systems/actorweapons.js.
  HOW they fight is systems/combat_iq.js — the same fire tokens, cover
  breaks, flanking arcs, suppression and per-training accuracy the city
  runs. Tracers, muzzle flashes, impacts and the pocked walls afterwards
  are systems/gunfx.js. Dead men sprawl through CBZ.deathPose and their
  rifles fall through CBZ.weaponPhysics and clatter on the real ground.
  Rockets detonate through studio.boom, so they hurt both sides and bring
  the towers down through the same collapse chain a bomber uses.

  What IS this file: who is on which side, the spectator cameras, the sim
  clock (pause, quarter speed, up to eight times), and the ?bench=1 benchmark that
  answers "how many can this machine actually show" by measuring instead
  of guessing. There is NO cap on team size anywhere in this page — the
  input takes what you type and the frame rate tells you the truth.

  2026-09-30, "NPC WAR SUCKS NOW BUT IT IS VERY CAPABLE". What sucked, and
  what changed:
    • Every battle had one shape: both armies walked at each other's centre
      of mass and melted together in the middle. ORDERS: a side holds a line
      or advances on one. The outnumbered men dig in (the few hold, the many
      come), kneel on their line, take the reverse slope of a crest, and only
      leave it to run down a broken enemy. ?hold=0 is the old meeting.
    • You could only watch. YOU: the rifle button (G) puts you in the boots
      of a man on your side; the same button hands it back.
    • Two open grounds. Snow and fields are the same honest erg under
      another surface and sky.
    • THE FRONT: Gang City's wars are fought here (city/frontline.js opens
      this page over the city with ?front=<the battle>): two nations, their
      men, rifles, colours and flags, who holds, the General's HOLD/ADVANCE
      and his airstrikes, and the result posted home.
  tools/npcwar-headless.mjs runs this page's sim in node and holds all of it.
============================================================ -->

           "200 SOLDIERS" (src/battle/core/sides.js); the "red"/"blue" in the
           ids and classes are the two slot keys, never shown. -->
      <div class="team red">
        <div class="th"><h3 id="redH"></h3><span class="kind" id="redK"></span></div>
        <div class="cnt">
          <button data-t="red" data-d="-1" aria-label="fewer on the first side">&minus;</button>

        </div>
        <label class="f"><span>WHO</span><select id="redU"></select></label>
        <label class="f"><span>ARMED WITH</span><select id="redW"></select></label>
        <label class="f"><span>TRAINING</span><select id="redT"></select></label>
        <label class="f"><span>FLAG</span><select id="redF"></select></label>
        <label class="f"><span>AIR SUPPORT</span><select id="redS"></select></label>
      </div>
      <div class="vs">V</div>
      <div class="team blue">
        <div class="th"><h3 id="blueH"></h3><span class="kind" id="blueK"></span></div>
        <div class="cnt">
          <button data-t="blue" data-d="-1" aria-label="fewer on the second side">&minus;</button>
          <input id="blueN" type="number" inputmode="numeric" min="1" value="30" aria-label="how many on the second side">
          <button data-t="blue" data-d="1" aria-label="more on the second side">+</button>
        </div>
        <label class="f"><span>WHO</span><select id="blueU"></select></label>
        <label class="f"><span>ARMED WITH</span><select id="blueW"></select></label>
        <label class="f"><span>TRAINING</span><select id="blueT"></select></label>
        <label class="f"><span>FLAG</span><select id="blueF"></select></label>
        <label class="f"><span>AIR SUPPORT</span><select id="blueS"></select></label>
      </div>
    </div>
    <div class="presets" id="presets">
      <span>BOTH SIDES</span>
      <button data-n="1">1 v 1</button>
      <button data-n="10">10 v 10</button>
      <button data-n="30">30 v 30</button>
      <button data-n="80">80 v 80</button>
      <button data-n="200">200 v 200</button>
      <button data-n="500">500 v 500</button>
      <button data-n="10000">10K v 10K</button>
      <button data-n="100000">100K v 100K</button>
    </div>
    <div class="presets" id="bestof">
      <span>BEST OF</span>
      <button data-bo="1">1</button>
      <button data-bo="3">3</button>
      <button data-bo="5">5</button>
      <button data-bo="7">7</button>
    </div>
  </section>

  <section>
    <div class="lbl"><b>04</b>WHO WINS?<i>make the call, or leave it open</i></div>
    <div class="callrow" id="callrow">
      <button class="cr" data-call="red"><b id="redCallN"></b><i id="redCallK"></i></button>
      <button class="cb" data-call="blue"><b id="blueCallN"></b><i id="blueCallK"></i></button>
    </div>
    <div id="streak"></div>
  </section>

  <div class="dock"><div class="din">
    <button id="start">START THE WAR</button>
    <div id="bootst"></div>
    <div id="boottrack"><div id="bootbar"></div></div>
  </div></div>

  <button id="cRifle" aria-label="take a rifle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 13h11l1.5-2H21v2.5h-4l-1 1.5h-3.5l-1.6 4H8.6l1.2-4H2z"/></svg></button>
