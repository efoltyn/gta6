      // THE REAL FABRIC. Eight blocks square is 490 m of street — big enough
      // that an army has to cross ground it does not own, small enough that
      // the two sides find each other without a search party.
      cx = TOWN_AT.x; cz = TOWN_AT.z;
      town = CBZ.studio.town({
        at: TOWN_AT, seed: "npcwar-" + (Q.get("seed") || "talloran"), name: "Talloran",
        cols: 8, rows: 8, blockW: 44, blockD: 44, roadW: 15,
        // the studio's default downtown palette is authored for the mainland's
        // own light. Under this map's sun the sidewalks and the square came
        // out as paper — a white field with a road painted on it — so the
        // stone comes down to something a camera can still see men against.
        palette: {
          ground: 0x5f636a, sidewalk: 0x6d7278, road: 0x2b2e34,
          plaza: 0x6f747b, wood: 0x4c545d, accent: 0x616a75,
        },
      });
      if (town && town.rect) {
        // a WIDE apron and no water: the downtown is inland, and the sea plate
        // this map used to carry was the thing fighting the road for the depth
        // buffer. Ground that runs out to the fog is the honest answer here.
        apron(town.rect.minX - 900, town.rect.maxX + 900, town.rect.minZ - 900, town.rect.maxZ + 900, 0x555a61);
        spawners = {
          red: streetSpawner(town.roads, cx, cz, -1, gap),
          blue: streetSpawner(town.roads, cx, cz, 1, gap),
        };
      }
    } else if (M.raise) {
      /* A REAL GANG CITY VENUE, MEASURED RATHER THAN DECLARED.

         Every raised venue took the same three hand-written constants before
         this: a centre, an apron rectangle and a flat groundAt. All three were
         guesses that nothing checked, and all three are readable from the
         geometry once it exists. Raise into our OWN group so the heightfield
         casts against the venue and not the skybox, then ask it where it is
         and how high it stands. A venue that is flat measures flat; the
         speedway's banking measures as banking, for free. */
      if (M.sea) seaPlate();
      const venue = new THREE.Group();
      CBZ.scene.add(venue);
      for (let i = 0; i < M.raise.length; i++) {
        const got = CBZ.studio.raise(M.raise[i], { parent: venue });
        if (!base) base = got;
        if (!got) console.error("[battle] nothing raised for pack:", M.raise[i]);
      }
      const H = CBZ.studio.heightfield(venue, { step: 6, pad: 30 });
      if (H) {
        groundAt = H.heightAt;
        cx = H.cx; cz = H.cz;
        // ground out to the fog under the venue's own floor, so its edge is a
        // quay and not the inside of the sky dome
        apron(H.box.min.x - 420, H.box.max.x + 420, H.box.min.z - 420, H.box.max.z + 420,
              M.apronColor || 0x7d7a6c, H.minY);
        // the armies start half the venue apart, clamped to a distance two
        // sides can actually cross before the watcher loses interest
        // ...and 320 m is not that distance. MEASURED on `city` at 304 m: the
        // first round went off at t=10.9 s, forty-five of fifty-two men were
        // still in slot `march` at t=13, and the two sides were not inside
        // 100 m of each other until t=41. Closure through real geometry runs
        // about 5 m/s combined, not the 12 m/s two marching columns suggest,
        // so the old ceiling was a full minute of watching crowds walk. 190 is
        // where the fixed maps measure (Halloran 6.5 s to first contact,
        // island 7.1) and it still leaves a venue-length approach to fight.
        gapOverride = Math.max(90, Math.min(190, Math.min(H.spanX, H.spanZ) * 0.5));
        MEASURED = { cols: H.cols, rows: H.rows, step: +H.step.toFixed(1), miss: H.miss,
                     minY: +H.minY.toFixed(2), maxY: +H.maxY.toFixed(2),
                     spanX: Math.round(H.spanX), spanZ: Math.round(H.spanZ) };
      } else {
        console.error("[battle] heightfield measured nothing for", id, "— falling back to flat");
      }
    }

    if (gapOverride) gap = gapOverride;
    /* HOW MUCH GROUND IS THERE IN THIS GROUND? One number, measured off the
       same groundAt the men will stand on, over the same window they will
       fight in — so the audit can state it and the checker can hold the map
       named OPEN DUNES to actually having dunes. */
    let relief = 0;
    (function () {
      const span = gap * 0.5 + 120;
      let lo = 1e9, hi = -1e9;
      for (let sx = -span; sx <= span; sx += 12) for (let sz = -span; sz <= span; sz += 12) {
        const y = groundAt(cx + sx, cz + sz);
        if (y < lo) lo = y; if (y > hi) hi = y;
      }
      relief = Math.round((hi - lo) * 10) / 10;
    })();
    const grid = function (team, i) {
      const side = team === "red" ? -1 : 1;
      const col = (i / 10) | 0, row = i % 10;
      const x = cx + side * (gap / 2 + 8 + col * 3.1) + (sWorld() - 0.5) * 1.8;
      const z = cz + (row - 4.5) * 3.4 + (col % 2) * 1.7 + (sWorld() - 0.5) * 1.8;
      return { x: x, z: z };
    };
    /* WHERE A BODY ACTUALLY SITS, which on every other map is the ground and
       on OPEN WATER is not. groundAt answers "where is the surface" — the
       camera, the rockets, the bombers and the director all still want that —
       and bodyY answers "where is THIS body", which is the surface minus its
       own swim depth. Two questions that used to be one because on land they
       always had the same answer. */
    const water = id === "water";
    const bodyY = water
      ? function (m, x, z) { return swellAt(x, z) - (m && m.swimD != null ? m.swimD : cruiseDepth(m)); }
      : function (m, x, z) { return groundAt(x, z); };
    /* AND HOW LOW THE CAMERA MAY GO. Everywhere else the lens stops 1.6 m over
       the ground because the ground is opaque. Here the whole point is that you
       can put the lens UNDER the swell and watch a shark come at it, so the
       floor is the seabed instead — the sea is not a wall. */
    const camFloor = (water && !SWIM_OLD)
      ? function () { return SEA.seabed + 2.2; }
      : function (x, z) { return groundAt(x, z) + 1.6; };
    return {
      id: id, gap: gap, cx: cx, cz: cz, groundAt: groundAt, relief: relief,
      water: water, bodyY: bodyY, camFloor: camFloor,
      /* TERRAIN JOINS THE SIGHT LINE — but only where groundAt is genuinely
         TERRAIN. The dunes map's height function is the desert's own analytic
         surface, so a sample along the eye line is sand and nothing else. A
         RAISED venue's groundAt is a raycast heightfield, and a raycast from
         above cannot tell a roof from a hill — arming terrain sight there
         would wall off every lane that passes beside a building the grid
         touched. The buildings already block sight the honest way, through
         their own colliders. So: dunes only, until a map's ground is measured
         by something that knows the difference. */
      terrainTrue: id === "dunes",
      terrainLos: id === "dunes" && relief > 6 && Q.get("tlos") !== "0",
      // team spawn: down the streets where there are streets, ranked columns
      // where there are not, and in both cases OUT of the geometry
      spawnAt: function (team, i, r) {
        const s = spawners && spawners[team];
        const p = (s && s(i)) || grid(team, i);
        return freeSpot(p.x, p.z, r);
      },
    };
  }

  /* ============================================================ THE MEN */
  const trainingOf = function (id) {
    for (let i = 0; i < TRAININGS.length; i++) if (TRAININGS[i].id === id) return TRAININGS[i];
    return TRAININGS[3];
  };
  function pickGun(choice, i) {
    if (choice === "fists") return "fists";
    if (choice === "mixed") return MIX_RIFLES[(i * 7 + ((i / MIX_RIFLES.length) | 0)) % MIX_RIFLES.length];
    if (choice === "everything") return GUN_ORDER[(i * 5 + ((i / GUN_ORDER.length) | 0)) % GUN_ORDER.length];
    return GUN_NAME[choice] ? choice : "ak47";
  }
  /* ============================================================ UNIFORMS
     TWO ARMIES, NOT TWO PAINT BUCKETS. Every man used to be cast with one flat
     team colour over torso, collar and cap (0xff5a3d / 0x3fa8ff) — traffic-cone
     orange and swimming-pool blue on olive trousers, which is what made the
     whole page read as a toy. A side is a uniform: fatigues that belong on the
     ground, a helmet cover in the team colour so a crane shot still sorts the
     two lines, and a little fade from man to man so a rank is not one clone.
     Soldiers/SWAT/guards wear the full kit; untrained men and street thugs keep
     their own trousers and wear the colour as a shirt, which is what a militia
     looks like. */
  const UNIFORM = {
    red:  { torso: 0x7a3b28, arms: 0x6e3525, legs: 0x5e4a36, cap: 0x9c2f22, shoes: 0x2a2119, belt: 0x3a2e22,
            shirt: 0x9a3c2c, swatT: 0x4a2a24 },
    blue: { torso: 0x2f4a66, arms: 0x2b4460, legs: 0x363f4a, cap: 0x2a63a8, shoes: 0x1c1d20, belt: 0x23272c,
            shirt: 0x2f5f95, swatT: 0x1f2c3a },
  };
  function shade(hex, k) {
    const r = Math.min(255, ((hex >> 16) & 255) * k) | 0, g = Math.min(255, ((hex >> 8) & 255) * k) | 0,
      b = Math.min(255, (hex & 255) * k) | 0;
    return (r << 16) | (g << 8) | b;
  }
  function uniformFor(teamId, trId, i) {
    const U = UNIFORM[teamId];
    // three fades of the same cloth: quantised so the material cache stays small
    const k = [0.9, 1, 1.09][(i * 7 + 3) % 3];
    if (trId === "civ" || trId === "thug") return { torso: shade(U.shirt, k), collar: shade(U.shirt, k), arms: shade(U.shirt, k * 0.96) };
    if (trId === "swat") return { torso: shade(U.swatT, k), collar: shade(U.swatT, k), arms: shade(U.swatT, k),
      legs: shade(0x22252a, k), cap: U.cap, shoes: U.shoes, belt: U.belt };
    return { torso: shade(U.torso, k), collar: shade(U.torso, k * 0.95), arms: shade(U.arms, k), legs: shade(U.legs, k),
      cap: U.cap, shoes: U.shoes, belt: U.belt };
  }
  /* A SOLDIER WEARS A HELMET, NOT A BASEBALL CAP. The rig's cap is a flat box
     with a brim box — right for a cop, a toy on a rifleman. For the trained
     tiers the cap box is re-shaped into a combat helmet (a low dome that comes
     down over the brow and the ears) in the team's cover colour, and the brim
     goes. Found by the colour the uniform just gave it, so nothing in the rig
     has to learn a new part name. */
  const HELMET_GEO = {};
  function helmetGeometry(w) {
    const key = Math.round(w * 1000);
    if (HELMET_GEO[key]) return HELMET_GEO[key];
    const ck = w / 0.66;
    const r = w * 0.7;                 // wide enough to swallow the head box's corners
    const g = new THREE.SphereGeometry(r, 16, 7, 0, Math.PI * 2, 0, Math.PI * 0.5);
    g.scale(1, 0.62, 1.04);
    g.translate(0, -0.29 * ck, 0.015 * ck);   // rim just above the brow, crown 5 cm over the skull
    return (HELMET_GEO[key] = g);
  }
  function helmetOn(group, capHex) {
    const caps = [];
    group.traverse(function (o) {
      if (o.isMesh && o.material && o.material.color && o.material.color.getHex() === capHex) caps.push(o);
    });
    if (caps.length < 2) return;
    // the taller of the two boxes is the crown, the flatter one the brim
    const size = function (o) {
      if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
      const b = o.geometry.boundingBox; return { w: b.max.x - b.min.x, h: b.max.y - b.min.y };
    };
    caps.sort(function (a, b) { return size(b).h - size(a).h; });
    const crown = caps[0];
    crown.geometry = helmetGeometry(size(crown).w);
    crown.castShadow = true;
    for (let k = 1; k < caps.length; k++) caps[k].visible = false;
  }
  function makeMan(teamId, i) {
    const T = TEAMS[teamId];
    const tr = trainingOf(teamId === "red" ? SET.redT : SET.blueT);
    const wid = pickGun(teamId === "red" ? SET.redW : SET.blueW, i);
    const fists = wid === "fists";
    const w = fists ? null : (CBZ.weaponById(wid) || CBZ.weaponById("ak47"));
    const group = CBZ.studio.cast(tr.role, { uniform: uniformFor(teamId, tr.id, i), variant: i * 2 + (teamId === "red" ? 0 : 1) });
    if (!group) return null;
    if (tr.id === "pro" || tr.id === "elite" || tr.id === "swat") helmetOn(group, UNIFORM[teamId].cap);
    const at = MAP.spawnAt(teamId, i);
    group.position.set(at.x, MAP.groundAt(at.x, at.z), at.z);
    group.rotation.y = teamId === "red" ? Math.PI / 2 : -Math.PI / 2;
    CBZ.scene.add(group);
    const man = {
      id: teamId + i, team: teamId, i: i,
      group: group, char: group.userData.charRig,
      pos: group.position,                    // combat_iq + actorweapons read .pos
      target: V(),                            // combat_iq's posture() steers this
      yaw: group.rotation.y, speed: 0,
      hp: bench ? 1e9 : tr.hp, maxHp: bench ? 1e9 : tr.hp,
      armed: !fists, weapon: fists ? null : GUN_NAME[wid], wid: wid,
      /* AND NOBODY THROWS A HOOK WHILE TREADING WATER. A punch delivers a
         fixed impulse THROUGH THE GROUND — that is what bracing is — and a
         swimmer has no ground to push against. Without this a bare-handed
         crowd in the open sea arithmetics a great white to death exactly the
         way a hundred men used to arithmetic a gorilla, which is the fight
         systems/bodymass.js exists to have stopped. A quarter is a judgement,
         not a measurement, and ?swimpunch=N is the dial. */
      fists: fists, rad: 0.45,
      punch: (PUNCH[tr.id] || 8) * (MAP.water ? SWIM_PUNCH : 1),
      launcher: !!(w && w.explosive),
      mag: w ? (w.magSize || w.mag || 30) : 0, magSize: w ? (w.magSize || w.mag || 30) : 0,
      cool: 0.4 + lcg() * 1.2, reloadT: 0,
      tgt: null, losBadT: 0, slot: "hold", thinkAt: simT + lcg() * 0.3, lastThink: simT,
      dead: false, dieT: 0, dieDir: 1, animF: (i % 4),
      lastShotT: -9, sq: Math.floor(i / 10), sqSlot: i % 10,
      kills: 0, shotsF: 0, hitsF: 0, reloads: 0,
      // THE BODY AS THE FIGHT SEES IT, and the standing originals setStance()
      // restores. eyeLos / fireShot always read these with a man default;
      // stamping them here is what lets a crouch actually change them.
      eyeH: 1.52, losY: 1.35, aimY: 1.28, headY: 1.62,
      eyeH0: 1.52, losY0: 1.35, aimY0: 1.28, headY0: 1.62,
      stance: "stand", coverK: 1, up: true,
      // the hull-down fold he has committed to, its search clock, the pop clock
      hull: null, hullT: 0, popT: 0,
      // MORALE: his training's nerve (seeded jitter so a line does not break
      // as one body), how rattled he is, and the rout bookkeeping
      tier: tr.id, nerve: nerveFor(tr.id, i), supp: 0,
      routed: false, fled: false, routT: 0, routBest: 0, routStall: 0, rallyT: 0,
    };
    man.target.set(at.x, 0, at.z);
    (squads[teamId][man.sq] = squads[teamId][man.sq] || []).push(man);
    // when there is an air war, every man is a thing a bomb can find — through
    // ordnance's OWN cover rules, so a roof or a wall between the bang and the
    // body genuinely spares him
    if (AIR.on && CBZ.ordnance && CBZ.ordnance.addTarget) {
      man.ordTgt = CBZ.ordnance.addTarget({
        pos: man.pos, team: teamId, unit: man,
        onDamage: function (dmg, info) {
          hurtMan(man, dmg, { byTeam: info && info.team, cause: "bomb" });
        },
      });
    }
    // training tier fields combat_iq's roleTier() already reads off city actors
    if (tr.id === "swat") man.swat = true;
    else if (tr.id === "elite") man.kind = "soldier";
    else if (tr.id === "pro") man.kind = "guard";
    else if (tr.id === "thug") man.aggr = 0.92;
    if (!fists && CBZ.syncActorWeapon) CBZ.syncActorWeapon(man);
    if (MAP.water) { man.swimD = cruiseDepth(man); man.pos.y = MAP.bodyY(man, at.x, at.z); }
    return man;
  }

  /* ============================================================ THE BEASTS
     An army out of the bestiary. The body is the species' own build() — the
     same low-poly animal the mainland hunts — walked by the shared gait rig
     and fought by creature_combat's one strike driver. NOTHING here is a new
     animal AI: stats come off the species row (hp, spd, danger, bite), the
     lope comes from wildlife_rig's class table, and the bite comes from
     CBZ.creatureFight with this page's ground and damage funnel plugged into
     its seams. */
  const BEAST_TUNE = {};
  function beastTuning(sp) {
    let b = BEAST_TUNE[sp.id];
    if (b) return b;
    const cls = CBZ.wildlifeRig.classify(sp);
    // charge speed off the species' own wander speed and its class's attack
    // multiplier, lifted into the men's speed register (walkers 4.6–8.0) so
    // a wolf runs a man down and an elephant arrives like weather
    const chase = Math.max(4.2, Math.min(8.6, (sp.spd || 2) * (cls.atkM || 2.2) * 1.15));
    b = BEAST_TUNE[sp.id] = {
      chase: chase,
      march: Math.max(2.6, chase * 0.55),
      dmg: Math.max(6, (sp.bite || 10) * 1.35),   // the men's own +45% band rule, scaled for teeth
      // a dangerous animal strikes FASTER, not just harder — measured on the
      // first arena run: at a flat 1.24 s a gorilla ring-fenced by circling
      // brawlers landed ~7% of its potential strikes and thirty of them lost
      // to thirty thugs, which is not what a silverback is
      rate: 0.95 + (1 - Math.min(1, sp.danger || 0)) * 0.7,
      brave: (sp.danger || 0) >= 0.7,             // bears, cats, the gorilla: no rout in them
      prey: (sp.danger || 0) < 0.15,              // deer and rabbits fight nobody
    };
    return b;
  }
  function makeBeast(teamId, i, spIdIn) {
    const spId = spIdIn || kindAt(teamId === "red" ? SET.redU : SET.blueU, i);
    const sp = (CBZ.WILDLIFE_SPECIES || {})[spId];
    if (!sp || !sp.build) return null;
    const T = TEAMS[teamId];
    let group = null;
    try { group = sp.build({ THREE: THREE, mat: CBZ.cmat, rng: lcg }); } catch (e) { console.warn("[war] species build failed:", spId, e); }
    if (!group) return null;
    /* EVERY ANIMAL IS AN INDIVIDUAL, if a neighbour publishes the draw.
       city/wildlife_traits.js gives each body its own multiplier off a position
       hash — most of a shoal near the species norm, the extremes earned, and
       roughly one in a few hundred off the monster tail. Read GUARDED, so this
       page behaves exactly as it always did when that file is not loaded.

       The hash argument is the spawn INDEX rather than the spawn point, and
       deliberately: the point is not known until after the body is measured,
       and (i, team) is just as order-independent, which is the property the
       traits file actually needs. */
    let sizeMul = 1;
    if (CBZ.wildlifeTraits && CBZ.wildlifeTraits.sampleSize) {
      try {
        const v = +CBZ.wildlifeTraits.sampleSize(sp, (teamId === "red" ? -1 : 1) * (i + 1) * 3.7, (i + 1) * 2.3);
        if (v > 0.05 && v < 4) sizeMul = v;
      } catch (e) {}
    }
    const s = (sp.scale || 1) * sizeMul;
    group.scale.setScalar(s);
    // measure the body once: separation radius, aim heights, the collar seat
    const bb = new THREE.Box3().setFromObject(group);
    const H = Math.max(0.5, bb.max.y - bb.min.y);
    /* THE FOOTPRINT AN ANIMAL ACTUALLY OCCUPIES.

       The first pass took 0.3 of the SMALLER of (length, 1.6 x width) and
       capped it at 1.1 m, which asked a 2.2 m dog to keep 0.84 m from the
       next dog and a lion 1.26 m — so a pack closed up and drew straight
       through itself, exactly as reported. A body's separation circle has to
       account for the length as well as the beam, because an animal is long
       and it turns: half the mean of the two spans is the honest radius for a
       circle standing in for a body that can face any way. */
    const spanX = Math.max(0.3, bb.max.x - bb.min.x);     // nose to tail (+X authored)
    const spanZ = Math.max(0.3, bb.max.z - bb.min.z);     // across the shoulders
    const rad = Math.min(3.4, Math.max(0.45, (spanX + spanZ) * 0.28));
    /* ...AND WHERE ITS TEETH ARE, WHICH IS NOT THE SAME NUMBER AND ON A LONG
       ANIMAL IS NOT EVEN CLOSE.

       `rad` is a circle standing in for a body that can face any way, and it is
       CAPPED at 3.4 m because an uncapped one would have a herd of elephants
       spawning a bus apart. creature_combat's tooth-contact gate does not care
       about that circle at all: it asks whether the attacker's own JAW POINT —
       out at the front of the model — landed inside the victim. For a lion
       those two numbers are within a body's breadth of each other and nobody
       ever noticed. For a MEGALODON the nose is ~10 m in front of the centre
       and the cap holds the centre 3.9 m off the mark, so the jaws close eleven
       metres BEYOND the man being bitten: MEASURED, one megalodon against
       twenty men landed 0 bites in 45 s and missed 12. It was not a balance
       problem; the animal was physically unable to reach anything.

       So the nose gets measured too, and both the strike range and the
       stand-off below are stated in terms of it. Man-sized animals answer
       exactly what they always did — the max() only bites when the body is
       genuinely longer than it is wide. */
    const noseR = Math.max(0.2, bb.max.x);
    noteBodyRadius(rad);
    // the coat stays the animal's own — a thin team collar says whose side,
    // seated on the neck line the box measured rather than a guessed height
    const collar = new THREE.Mesh(CBZ.boxGeom(0.18 / s, 0.12 / s, Math.min(0.9, spanZ * 0.85) / s),
      CBZ.cmat(T.color));
    collar.position.set((bb.max.x * 0.55) / s, (H * 0.7) / s, 0);
    group.add(collar);
    const at = MAP.spawnAt(teamId, i, rad);
    group.position.set(at.x, MAP.groundAt(at.x, at.z), at.z);
    CBZ.scene.add(group);
    const tn = beastTuning(sp);
    const m = {
      id: teamId + i, team: teamId, i: i, beast: true, species: sp, tn: tn,
      group: group, pos: group.position, target: V(),
      heading: teamId === "red" ? 0 : Math.PI, faceH: teamId === "red" ? 0 : Math.PI,
      yaw: 0, speed: 0, state: "wander",           // gait's flee-bound reads .state
      /* SIZE IS LOAD-BEARING, NOT COSMETIC — the traits file's own words. The
         exponent is that file's too (sizeKit: dmg *= k^1.35), used on BOTH the
         bite and the body so a fight between two average individuals of the
         same species is numerically identical and only the MISMATCHES move.
         Exactly 1.0 when no size draw landed, so a page without
         wildlife_traits is byte-for-byte what it always was. */
      hp: bench ? 1e9 : Math.round((sp.hp || 40) * Math.pow(sizeMul, 1.35)),
      maxHp: bench ? 1e9 : Math.round((sp.hp || 40) * Math.pow(sizeMul, 1.35)),
      _sizeMul: sizeMul, _sizeEff: s,
      armed: false, weapon: null, launcher: false, mag: 0, magSize: 0,
      cool: 0, reloadT: 0,
      rad: rad,
      /* REACH IS A DISTANCE BETWEEN CENTRES, so it has to clear whatever the
         separation pass will hold this body away from — the men's melee
         circle (IQ.melee orbits at ~1.8 m; measured as the run where thirty
         gorillas lost to thirty thugs by idling at the edge of their own
         strike gate) AND, now that bodies keep their real footprints, a
         second animal of its own kind. Two lions holding 2.6 m apart with a
         2.47 m reach would have circled each other forever. */
      reach: Math.max(1.2 + s * 1.1, rad * 2 + 0.55, noseR * 0.95),

      if (m.routT > 4 && eff > m.nerve + RALLY_BAND && m.supp < 0.3) {
        m.routed = false; m.rallyT = 6;
        return false;
      }
      // FLED: far enough that this war is no longer his (or he has outrun
      // it for most of a minute)
      if (fd > FLEE_GAPS * (MAP.gap || 150) || m.routT > 45) {
        m.fled = true;
        return true;
      }
    }
    // THE RUN: away from their fighting centre, leaning toward his own start
    // edge, with a man-stable lateral so a broken line fans out instead of
    // funnelling. No steerAroundWalls: its field descends TOWARD the enemy.
    // stepMan's wall-slide detour is what gets a runner round a corner.
    let ax = m.pos.x - foe.x, az = m.pos.z - foe.z;
    const al = Math.hypot(ax, az) || 1;
    ax /= al; az /= al;
    ax += (m.team === "red" ? -1 : 1) * 0.55;
    const bl = Math.hypot(ax, az) || 1;
    ax /= bl; az /= bl;
    const lat = (((m.i * 13) % 9) - 4) * 0.09;
    m.target.set(m.pos.x + (ax - az * lat) * 30, 0, m.pos.z + (az + ax * lat) * 30);
    m.slot = "rout";
    m.tgt = null; m.sees = false;
    return true;
  }

  /* ============================================================ STANCE
     A MAN IS A DIFFERENT SHAPE WHEN HE IS DOWN (ported from the warlord
     fork). eyeH is where he sees from, losY is what an enemy has to see to
     shoot him, aimY / headY are where a round arrives: dropping all four by
     a crouched man's real ratio (about 1.0 m of eye against 1.52) is what
     makes going down actually hide him behind a dune lip. And a crouched body
     is a smaller one — coverK is the hit-chance multiplier fireShot applies
     to rounds aimed at him (set each step in stepMan). */
  const STANCE_K = { stand: 1, crouch: 0.645 };
  const CROUCH_HIT = 0.5;        // a kneeling man presents about half the target
  const HULL_UP_HIT = 0.7;       // up over a crest, the sand still covers his legs
  function setStance(m, st) {
    if (m.beast || m.stance === st || m.eyeH0 == null) return;
    m.stance = st;
    const k = STANCE_K[st] || 1;
    m.eyeH = m.eyeH0 * k;
    m.losY = m.losY0 * k;
    m.aimY = m.aimY0 * k;
    m.headY = m.headY0 * k;
  }
  // what the rig should show: the stance, plus combat_iq's box-cover slots
  // (read by frame()'s animChar pass)
  function crouchPose(m) {
    return m.stance === "crouch" || m.slot === "cover" || m.slot === "peek";
  }
  // "could he see him if he stood up" — a man crouched behind his fold is
  // not blind, he is ducking; think() asks this so the duck does not read as
  // lost contact and send him charging out of his own cover
  function seesStanding(m, o) {
    if (m.stance !== "crouch") return eyeLos(m, o);
    const e = m.eyeH;
    m.eyeH = m.eyeH0;
    const s = eyeLos(m, o);
    m.eyeH = e;
    return s;
  }

  /* ============================================================ HULL DOWN
     THE GROUND IS COVER (ported from the warlord fork's hullDown). On a map
     whose sand takes part in the sight lines (MAP.terrainLos), a man under
     fire looks for a reverse-slope position: somewhere a CROUCHED man is
     hidden from the threat by the crest but a STANDING one can see over it.
     Per bearing (fanned away from the threat) march out until the crouched
     ray first goes blocked, bisect onto the lip, step just behind it, and
     accept it only if standing there still has the shot. A hole with no shot
     out of it is not a position.

     COST: a search is <= 7 bearings x ~9 marched probes x one terrain ray.
     It runs only for a man who is RATTLED (or already in a fold), on a
     per-man clock of 2.5-4 s phased off his index, and under a global
     budget of HULL_RATE searches per sim-second — a 500 v 500 line cannot
     all probe on the same frame. */
  const HULL_BEARINGS = [0, 0.6, -0.6, 1.25, -1.25, 1.9, -1.9];
  const HULL_R0 = 2.5, HULL_R1 = 20, HULL_STEP = 2.2;
  const HULL_CROUCH_EYE = 1.0, HULL_STAND_EYE = 1.55, HULL_BEHIND = 0.7;
  const HULL_RATE = 60;          // searches per sim-second, whole field
  let hullTokens = 20, hullTokT = 0, hullQ = 0, hullHit = 0;
  function hullDown(x, z, tx, tz) {
    const gA = MAP.groundAt;
    const ty = gA(tx, tz) + HULL_STAND_EYE;
    const away = Math.atan2(x - tx, z - tz);
    const dThreat = Math.hypot(x - tx, z - tz);
    hullQ++;
    let best = null, bs = 1e9;
    for (let ai = 0; ai < HULL_BEARINGS.length; ai++) {
      const ang = away + HULL_BEARINGS[ai];
      const sa = Math.sin(ang), ca = Math.cos(ang);
      let lo = -1, hi = -1;
      for (let rad = HULL_R0; rad <= HULL_R1; rad += HULL_STEP) {
        const px = x + sa * rad, pz = z + ca * rad;
        if (terrainBlocked(tx, ty, tz, px, gA(px, pz) + HULL_CROUCH_EYE, pz, gA)) { hi = rad; break; }
        lo = rad;
      }
      if (hi < 0) continue;
      if (lo < 0) lo = Math.max(0.5, hi - HULL_STEP);
      for (let kk = 0; kk < 4; kk++) {
        const mid = (lo + hi) * 0.5;
        const px = x + sa * mid, pz = z + ca * mid;
        if (terrainBlocked(tx, ty, tz, px, gA(px, pz) + HULL_CROUCH_EYE, pz, gA)) hi = mid; else lo = mid;
      }
      for (let back = 0; back < 3; back++) {
        const rad = hi + HULL_BEHIND * (back ? back * 0.5 : 1);
        const px = x + sa * rad, pz = z + ca * rad;
        if (blockedAt(px, pz)) continue;
        const gy = gA(px, pz);
        if (!terrainBlocked(tx, ty, tz, px, gy + HULL_CROUCH_EYE, pz, gA)) continue;
        if (terrainBlocked(tx, ty, tz, px, gy + HULL_STAND_EYE, pz, gA)) continue;
        const walk = Math.hypot(px - x, pz - z);
        const closing = Math.max(0, dThreat - Math.hypot(px - tx, pz - tz));
        const score = walk + closing * 1.4 + Math.abs(HULL_BEARINGS[ai]) * 1.1;
        if (score < bs) { bs = score; best = { x: px, z: pz, d: walk }; }
        break;
      }
    }
    if (best) hullHit++;
    return best;
  }
  function hullFor(m, tgt) {
    if (m.hullT > simT) return m.hull;
    // the global budget, refilled on the sim clock
    if (simT > hullTokT) {
      hullTokens = Math.min(HULL_RATE * 0.5, hullTokens + (simT - hullTokT) * HULL_RATE);
      hullTokT = simT;
    }
    if (hullTokens < 1) { m.hullT = simT + 0.4 + (m.i % 7) * 0.05; return m.hull; }
    hullTokens--;
    m.hullT = simT + (m.hull ? 3.4 : 2.5) + (m.i % 9) * 0.07;
    const found = hullDown(m.pos.x, m.pos.z, tgt.pos.x, tgt.pos.z);
    if (!found) { m.hull = null; return null; }
    // STICKY: the fold he is in outbids a marginally nearer one
    if (m.hull) {
      const keep = Math.hypot(m.hull.x - m.pos.x, m.hull.z - m.pos.z);
      if (keep < found.d + 3) return m.hull;
    }
    m.hull = found;
    return found;
  }
  /* IN THE FOLD AND WORKING IT: down behind the lip (invisible to the
     enemy's eyeLos — not harder to hit, NOT THERE), up over it to shoot,
     down again to reload. Returns true while he is up. 3.2 m, because the
     anti-clump nudges his goal and stepMan stops him a metre short of it:
     a fold is a stretch of ground, not a coordinate. */
  function workHull(m, sdt) {
    const d = Math.hypot(m.hull.x - m.pos.x, m.hull.z - m.pos.z);
    if (d > 3.2) { setStance(m, "stand"); return false; }
    if (m.reloadT > 0) { setStance(m, "crouch"); m.popT = Math.min(m.popT, 0.3); return false; }
    m.popT -= sdt;
    if (m.popT <= 0) {
      const up = m.stance === "crouch";
      m.popT = up ? (1.2 + (m.i % 7) * 0.14) : (1.1 + (m.i % 5) * 0.2);
      setStance(m, up ? "stand" : "crouch");
    }
    return m.stance === "stand";
  }

  /* ============================================================ A BEAST DIES
     OWNER, on this page: "it shows dead beasts sitting up on back and then
     they disappear — they should be real ragdoll and not disappear."

     BOTH HALVES WERE ONE LINE EACH, AND BOTH WERE WRONG THE SAME WAY: they
     invented a death instead of asking the engine for one.

     SITTING UP. stepMan's dead branch eased `group.rotation.z` to ±1.45 rad
     with the comment "a four-legged body falls ONTO ITS SIDE — the roll axis
     is the honest one for a quadruped". The intent is right and the axis is
     not. Every animal asset is authored nose toward +X, THREE.Euler's default
     order 'XYZ' composes R = Rx·Ry·Rz, and Rz therefore applies FIRST, in
     model space — so rotation.z on one of these bodies is the model-local
     PITCH and +1.45 rad is a NOSE 83° INTO THE AIR. The page was not laying
     the animal down; it was sitting it up and pointing its head at the sky,
     which is the picture in the report, verbatim. (systems/predator_anim.js
     states the same rule in its r128 note; systems/quadruped_ragdoll.js's
     header quotes the owner's original complaint about it in the city.)

     So this page stops authoring deaths. quadruped_ragdoll.js is a real
     14-point verlet solver — legs that splay, a head that lolls, a body that
     drapes over the terrain it fell on and cannot come to rest on its feet —
     and it now rides in the `beasts` pack this page already loads. It is asked
     first, with the killing round's own direction and energy so the body goes
     over AWAY from what shot it. When it declines (a snake, a body past the
     range gate, the budget full) we fall through to CBZ.wildlifeDeathTumble
     when the mainland is loaded, and otherwise to the same tumble's shape
     inline — on rotation.order 'YXZ', where rotation.x IS the long-axis roll,
     which is the corrected version of the line this replaces. */
  const _kdir = { x: 0, y: 0, z: 0 };
  const _kpt = { x: 0, y: 0, z: 0 };
  function beastDeathPhysics(m, imp) {
    const grp = m.group;
    if (!grp) return "none";
    if (DEATH_OLD) { m.dieT = 0.0001; return "topple"; }
    // WHICH WAY IT GOES OVER. A body does not fall over its own facing, it
    // falls away from whatever hit it: the shooter's line if we have one, the
    // blast centre if we have that, else the direction it was already going.
    let dx = 0, dz = 0;
    const by = imp && imp.by;
    if (by && by.pos) { dx = m.pos.x - by.pos.x; dz = m.pos.z - by.pos.z; }
    else if (imp && imp.fromX != null) { dx = m.pos.x - imp.fromX; dz = m.pos.z - imp.fromZ; }
    const dl = Math.hypot(dx, dz);
    if (dl > 0.01) { dx /= dl; dz /= dl; }
    else { const a = lcg() * Math.PI * 2; dx = Math.cos(a); dz = Math.sin(a); }
    _kdir.x = dx; _kdir.y = 0; _kdir.z = dz;
    // the impact point: the shooter's side of the body, so the solver's roll
    // couple picks the flank the round actually crossed.
    _kpt.x = m.pos.x - dx * (m.rad || 0.5);
    _kpt.y = m.pos.y + (m.eyeH || 1) * 0.6;
    _kpt.z = m.pos.z - dz * (m.rad || 0.5);
    // ENERGY. A rocket throws a wolf; a pistol round folds it where it stands.
    // The solver's band is 1..30 (~6 a pistol, ~14 a shotgun, 20+ a blast).
    const cause = imp && imp.cause;
    const energy = cause === "bomb" ? 24 : (by && by.beast) ? 9 : 11;
    if (CBZ.quadRagdoll) {
      try {
        if (CBZ.quadRagdoll(m, { point: _kpt, dir: _kdir, imp: energy })) {
          m.ragdoll = true; m.dieT = 0;      // the solver owns the transform now
          deadSolving++;
          return "ragdoll";
        }
      } catch (e) {}
    }
    if (CBZ.wildlifeDeathTumble) {
      try {
        if (CBZ.wildlifeDeathTumble(m, _kdir, 3.2 + energy * 0.28, _kpt)) {
          m.tumble = true; m.dieT = 0;
          return "tumble";
        }
      } catch (e) {}
    }
    // THE LAST RESORT, and the honest version of the line it replaces: roll
    // about the body's own long axis, which under 'YXZ' is rotation.x.
    grp.rotation.order = "YXZ";
    m.dieT = 0.0001;
    return "topple";
  }

  /* ============================================================ A MAN DIES
     The animals got a real corpse solver and the men standing next to them
     kept a plank: `group.rotation.x` eased to 90 degrees over 0.4s, one axis,
     the whole body rigid, the legs frozen mid-stride. city/ragdoll.js has
     solved this properly since it shipped — 13 mass points, Jakobsen sticks,
     joint limits, ground friction, a whisper of bounce, writing back onto the
     SAME rig meshes so the wounds and the blood soak ride along — and it
     refused to run here for one reason: it tested `game.mode === "city"`.
     That gate was never about the solver, and it is now a capability the page
     opts into (RAGDOLL_ANY_MODE, declared at the top of this file).

     Same shape as beastDeathPhysics: the killing round decides which way the
     body goes over, the solver is asked first, and the canned topple is what
     is left when it declines (budget full, too far, no rig). */
  function manDeathPhysics(m, imp) {
    if (DEATH_OLD || !m.group || !m.char) { m.dieT = 0.0001; return "topple"; }
    let dx = 0, dz = 0;
    const by = imp && imp.by;
    if (by && by.pos) { dx = m.pos.x - by.pos.x; dz = m.pos.z - by.pos.z; }
    else if (imp && imp.fromX != null) { dx = m.pos.x - imp.fromX; dz = m.pos.z - imp.fromZ; }
    const dl = Math.hypot(dx, dz);
    if (dl > 0.01) { dx /= dl; dz /= dl; }
    else { const a = lcg() * Math.PI * 2; dx = Math.cos(a); dz = Math.sin(a); }
    _kdir.x = dx; _kdir.y = 0; _kdir.z = dz;
    // the entry point: chest height on the shooter's side, so the solver's
    // topple bias throws the high mass over AWAY from the gun.
    _kpt.x = m.pos.x - dx * 0.28;
    _kpt.y = m.pos.y + 1.28;
    _kpt.z = m.pos.z - dz * 0.28;
    /* HOW HARD. The solver's band is the human one it was tuned on: ~6 a
       pistol, ~14 a shotgun, 20+ a blast. A punch is not a bullet and must not
       throw a body across the street, which is exactly the read the survival
       brawl's own "land on real fist contact" wave was about. */
    const cause = imp && imp.cause;
    const w = (by && by.wid) ? CBZ.weaponById(by.wid) : null;
    let energy = 7;
    if (cause === "bomb") energy = 22;
    else if (by && by.beast) energy = 9;                    // teeth: a maul, not a round
    else if (by && by.fists) energy = 4;                    // a fist drops you where you stand
    else if (w) energy = w.pellets ? 15 : Math.max(5, Math.min(13, (w.damage || 20) * 0.35));
    if (CBZ.cityRagdoll) {
      try {
        if (CBZ.cityRagdoll(m, _kpt, _kdir, energy)) {
          m.ragdoll = true; m.dieT = 0;      // the solver owns the transform now
          deadSolving++;
          manDeathGore(m, _kdir, energy);
          return "ragdoll";
        }
      } catch (e) {}
    }
    m.dieT = 0.0001;
    manDeathGore(m, _kdir, energy);
    return "topple";
  }

  /* AND HE BLEEDS — when this battle loaded the blood at all. `gore` rides in
     only when the roster earns it (a beast army, or ?blood=1), because 2.5k
     lines of it is a real cost and gunfx has drawn the men's impacts since it
     shipped. When it IS here, a kill is a kill: the same directional spray,
     mist and ground pool an animal's bite throws, priced off what killed him.
     Guarded end to end, so a battle without the pack is byte-identical. */
  function manDeathGore(m, dir, energy) {
    if (typeof CBZ.goreImpact !== "function") return;
    const sev = Math.max(0.4, Math.min(1.8, energy * 0.09));
    _gore.dir = dir;
    _gore.amount = sev;
    _gore.mist = energy >= 13;            // only a real crunch atomises anything
    _gore.pool = energy >= 6;             // only an open wound stains the ground
    _gore.player = false;
    _gore.sfx = false;                    // gunfx already cracked; do not double it
    try { CBZ.goreImpact(m.pos.x, m.pos.y + 1.15, m.pos.z, _gore); } catch (e) {}
  }
  const _gore = { dir: null, amount: 0.8, mist: false, pool: true, player: false, sfx: false };

  /* THE OLDEST BODY LEAVES THE FIELD — it is not deleted where it lies.

     `corpses` was a hard FIFO: past the cap the oldest was dropped from the
     scene in the same frame, so a carcass you were looking at vanished
     mid-shot. That is the second half of the report and it is not a budget
     problem, it is a PRESENTATION problem — the budget has to exist, but a
     body may not blink out in front of the camera. So the oldest corpse that
     is NOT the one you are looking at starts sinking through the ground and
     is dropped once it is genuinely out of sight. The list is walked from the
     oldest end for the first body far enough from the camera; if every corpse
     on the field is close (a small battle that has not filled the budget can
     never get here), the oldest goes anyway rather than let the list grow. */
  const sinking = [];
  const SINK_NEAR2 = 55 * 55;          // don't start a fade this close to the eye
  function retireOldestCorpse() {
    if (DEATH_OLD) {                       // the FIFO that popped a body out of the world
      const gone = corpses.shift();
      if (!gone) return;
      const j = men.indexOf(gone);
      if (j >= 0) men.splice(j, 1);
      if (gone.group) CBZ.studio.drop(gone.group);
      return;
    }
    let pick = -1;
    for (let i = 0; i < corpses.length; i++) {
      if (camDist2(corpses[i].pos) > SINK_NEAR2) { pick = i; break; }
    }
    if (pick < 0) pick = 0;
    const old = corpses.splice(pick, 1)[0];
    if (!old) return;
    const k = men.indexOf(old);
    if (k >= 0) men.splice(k, 1);
    if (!old.group) return;
    // hand the solver its slot back before the body starts sinking, or a
    // frozen pose keeps a slot a live death could have used — and the solver
    // would go on writing this group's transform against the sink.
    if (CBZ.quadRagdollDrop) { try { CBZ.quadRagdollDrop(old); } catch (e) {} }
    if (CBZ.ragdollDrop) { try { CBZ.ragdollDrop(old); } catch (e) {} }
    if (old.ragdoll) { old.ragdoll = false; deadSolving = Math.max(0, deadSolving - 1); }
    sinking.push({ g: old.group, t: 0, h: Math.max(0.6, (old.eyeH || 1) * 1.4) });
  }
  // the sink itself: real time, because it is presentation and not simulation
  // — a paused battle should still finish tidying up behind itself.
  function stepSinking(dt) {
    for (let i = sinking.length - 1; i >= 0; i--) {
      const s = sinking[i];
      s.t += dt;
      s.g.position.y -= dt * s.h * 0.55;
      if (s.t > 2.2) { CBZ.studio.drop(s.g); sinking.splice(i, 1); }
    }
  }

  /* ============================================================ THE GRID
     Target search over thousands of men cannot be O(n squared). One uniform
     grid, rebuilt on a slow tick, queried in rings. */
  const GRID_CELL = 14;
  const grid = new Map();
  let gridAt = -1;
  function gridKey(cx, cz) { return cx * 73856093 ^ cz * 19349663; }
  function rebuildGrid() {
    grid.clear();
    for (let i = 0; i < men.length; i++) {
      const m = men[i];
      if (m.dead || m.fled) continue;
      const k = gridKey(Math.floor(m.pos.x / GRID_CELL), Math.floor(m.pos.z / GRID_CELL));
      let a = grid.get(k);
      if (!a) { a = []; grid.set(k, a); }
      a.push(m);
    }
    gridAt = simT;
  }
  function nearestEnemy(m, range) {
    const cx = Math.floor(m.pos.x / GRID_CELL), cz = Math.floor(m.pos.z / GRID_CELL);
    const maxR = Math.ceil(range / GRID_CELL);
    let best = null, bd = range * range;
    for (let r = 0; r <= maxR; r++) {
      for (let dx = -r; dx <= r; dx++) for (let dz = -r; dz <= r; dz++) {
        if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;   // ring shell only
        const a = grid.get(gridKey(cx + dx, cz + dz));
        if (!a) continue;
        for (let i = 0; i < a.length; i++) {
          const o = a[i];
          if (o.team === m.team || o.dead) continue;
          const d = (o.pos.x - m.pos.x) * (o.pos.x - m.pos.x) + (o.pos.z - m.pos.z) * (o.pos.z - m.pos.z);
          if (d < bd) { bd = d; best = o; }
        }
      }
      if (best && r > 1) break;    // a full ring past the first hit is enough
    }
    return best;
  }
  /* THE NEAREST MAN IS NOT THE MAN YOU CAN SHOOT. On open sand those are the
     same sentence and the old code was right; put a city under it and the
     nearest enemy is routinely three buildings away, so every soldier locked
     onto somebody he could not see, waited out 2.6 s of `losBadT`, and
     assaulted a facade while a clean target stood in the street beside him.
     So: gather the near candidates, and prefer one there is a line to. The
     LOS tests only happen on a RE-target — a man keeps his mark until it dies
     or the dead-end timer gives up on it — so this is a handful of segment
     tests per casualty, not per frame. */
  const _cand = [];
  function pickTarget(m, range) {
    const cx = Math.floor(m.pos.x / GRID_CELL), cz = Math.floor(m.pos.z / GRID_CELL);
    const maxR = Math.ceil(range / GRID_CELL);
    _cand.length = 0;
    for (let r = 0; r <= maxR; r++) {
      for (let dx = -r; dx <= r; dx++) for (let dz = -r; dz <= r; dz++) {
        if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
        const a = grid.get(gridKey(cx + dx, cz + dz));
        if (!a) continue;
        for (let i = 0; i < a.length; i++) {
          const o = a[i];
          if (o.team === m.team || o.dead) continue;
          const d2 = (o.pos.x - m.pos.x) * (o.pos.x - m.pos.x) + (o.pos.z - m.pos.z) * (o.pos.z - m.pos.z);
          if (d2 < range * range) _cand.push(o, d2);
        }
      }
      if (_cand.length >= 12 && r > 1) break;
    }
    if (!_cand.length) return null;
    // nearest first, then the first four get asked whether they can be seen
    let bestO = null, bestD = 1e18;
    for (let i = 0; i < _cand.length; i += 2) if (_cand[i + 1] < bestD) { bestD = _cand[i + 1]; bestO = _cand[i]; }
    let tries = 0;
    while (tries < 4) {
      let o = null, od = 1e18, oi = -1;
      for (let i = 0; i < _cand.length; i += 2) {
        if (_cand[i] && _cand[i + 1] < od) { od = _cand[i + 1]; o = _cand[i]; oi = i; }
      }
      if (!o) break;
      _cand[oi] = null;
      tries++;
      if (eyeLos(m, o)) return o;
    }
    return bestO;               // nobody visible: take the nearest and go to him
  }
  /* ============================================================ BODIES
     A MAN IS 0.52 m ACROSS THE SHOULDERS AND THE GRID WAS 14 m WIDE.

     The old separation pass ran on the TARGET-SEARCH grid, and the two jobs
     want opposite cells: target search wants cells big enough that a 175 m
     look is a handful of lookups, separation wants cells at BODY scale. On a
     14 m cell it could only ever be wrong in three ways at once, and all
     three were measured:

       • it never compared across a cell boundary, so two men 0.2 m apart on
         opposite sides of an invisible line interpenetrated forever;
       • it capped the inner loop at five neighbours (`i + 6`), so in the
         press of a real fight most pairs in the same cell were skipped, and
         WHICH five depended on spawn order;
       • it fired at 1.0 m, which for a 0.52 m body is contact, not clearance.

     clearance test only ever needs the cell and its four FORWARD neighbours,

     be touching, so they never need comparing. The moment an army is lions

     more than the cell, so the pairs that mattered most were exactly the ones
     the sweep was allowed to skip. Measured on 120 lions v 400 dogs before
     this: 32 overlapping pairs at peak, the worst pair 84% inside each other.

     the completeness bound holds by construction: FINE > 2 * maxRadius >=

  /* ONE SWEEP IS NOT A SOLVER.

     pair moves one of them back. In open order that is invisible (a man's
     residual is under a shoulder width); in a crush of four hundred dogs
     converging on a pride it is not, because every body is inside several
     constraints at once and each correction partly cancels the last. The
     probe proved it was this and not a hole in the grid: instrumented with
     the grid's OWN sweep, the survivors after one pass matched the O(n^2)
     count exactly, 33 for 33 — nothing was being missed, everything was
     being undone.

     So the pass runs until it converges, up to three sweeps, rebuilding the
     body grid between them because the bodies have moved. It stops the
     instant a sweep corrects nothing, so open order still costs exactly one
     sweep, and a battle of men — whose radii never grow past 0.45 — never
     enters the loop at all. */

  function push2(m, o, k) {

    // shoving it out of the gorilla's fist (or out of its own flight arc) is
    // the pass correcting an "overlap" that is the entire point of the move
    if (o._apeHeld || m._apeHeld || o._apeFlying || m._apeFlying) return;
    // clearance is the PAIR's, not the species': a man by a man keeps the old
    // 0.9, a man by a bear keeps more, and the radii are clamped at build so
    // the widest pair (2.2) still fits the FINE cell's completeness bound
    const clr = (m.rad || 0.45) + (o.rad || 0.45);
    const dx = o.pos.x - m.pos.x, dz = o.pos.z - m.pos.z;
    const d2 = dx * dx + dz * dz;
    if (d2 > clr * clr) return;
    let d = Math.sqrt(d2), ux, uz;
    if (d < 1e-4) {

      // never Math.random — two men in the same spot must part the same way
      // every run or the battle stops being reproducible
      const a = ((m.i * 37 + o.i * 91) % 360) * Math.PI / 180;

    // A DEEP OVERLAP IS NOT A SPRING. Relaxation at k≈0.4 walks two men apart
    // over a few frames, which is right for a crowd easing itself out and
    // wrong for two bodies genuinely inside each other — that has to be gone
    // THIS step or it is on screen. Inside shoulder width the correction is
    // full; outside it, the soft pass keeps the crowd from jittering.
    const push = (clr - d) * 0.5 * (d < clr * 0.69 ? 1 : k);

    o.pos.x += ux * push; o.pos.z += uz * push;
    sepFixed++;
    // a shove is a move, and a move has to answer to the walls. Marking them
    // makes the NEXT step resolve them instead of every one of them now: a
    // body squeezed into a crate is invisible to every line of sight, so it
    // is immortal, and a battle with an immortal in it cannot end.
    m.resT = 0; o.resT = 0;

  // One shove, resolved against the world, reporting how much of it SURVIVED
  // along the axis it was aimed down. That number is the whole mechanism of
  // the pinned pass below: it is how a body finds out that a wall said no.
  function shove(m, ux, uz, amt) {
    const x0 = m.pos.x, z0 = m.pos.z;
    m.pos.x += ux * amt; m.pos.z += uz * amt;
    CBZ.micro.resolveCircle(m.pos, (m.rad || 0.45) + 0.05, m.pos.y, 1.8);
    return (m.pos.x - x0) * ux + (m.pos.z - z0) * uz;
  }
  /* ---- THE PINNED PAIR, and it is why walls were the last overlap left ----

     separateSolve above already answers the CROWD half of this: a body belongs
     to several pairs at once, so the shove that clears it of B walks it back
     into C, and it sweeps again until nothing moves. What no number of sweeps
     can answer is a WALL, because a wall does not take its half of the shove:
     separation puts him into the facade, the next step's resolveCircle puts
     him straight back out — which is straight back into the man he was cleared
     from — and the two of them oscillate in a doorway for as long as they both
     want to stand there. MEASURED, 26 v 26, 90 s: overlapPeak 0 on island,
     field, dunes and the kill box, and 3 on `city`, the one map made of walls.

     So a final pass runs over what the sweeps could not fix, and only over
     that — pairs still inside their own overlap line, which after convergence
     is a handful in a battle and usually none. It asks the world instead of
     assuming it:

       1. shove each man his half and see how much the world let him keep;
       2. hand what a wall refused to the OTHER man, who is the one with
          somewhere to go;
       3. if neither has, part them ALONG the wall rather than into it, on a
          bearing off their own ids so it is the same every run;
       4. and if the geometry genuinely cannot seat two men, separate them
          anyway without asking, because a frame drawn with two bodies inside
          each other is the fault being counted. resT = 0 hands them back to
          the world on the next step, where a wall gets the last word.        */
  function pinnedPass() {
    fine.forEach(function (a) {
      for (let i = 0; i < a.length; i++) {
        const m = a[i];
        if (m.dead) continue;
        for (let j = i + 1; j < a.length; j++) unpin(m, a[j]);
        const cx = Math.floor(m.pos.x / FINE), cz = Math.floor(m.pos.z / FINE);
        for (let f = 0; f < 4; f++) {
          const b = fine.get(gridKey(cx + FAN[f][0], cz + FAN[f][1]));
          if (!b) continue;
          for (let j = 0; j < b.length; j++) unpin(m, b[j]);
        }
      }
    });
  }
  function unpin(m, o) {
    if (o.dead || o === m) return;
    // the PAIR's clearance and the PAIR's overlap line, exactly as push2 and
    // the probe read them — a lion pinned against a hangar is the same fault
    // as a man pinned against a facade, and a man's numbers are still 0.9/0.62
    const clr = (m.rad || 0.45) + (o.rad || 0.45);
    const deep = clr * 0.69;
    let dx = o.pos.x - m.pos.x, dz = o.pos.z - m.pos.z;
    if (dx * dx + dz * dz >= deep * deep) return;            // the common case: nothing to do
    let d = Math.sqrt(dx * dx + dz * dz), ux, uz;
    if (d < 1e-4) {
      const ang = ((m.i * 37 + o.i * 91) % 360) * Math.PI / 180;
      ux = Math.cos(ang); uz = Math.sin(ang); d = 1e-4;
    } else { ux = dx / d; uz = dz / d; }
    const push = (clr - d) * 0.5;
    const gotM = shove(m, -ux, -uz, push);
    const gotO = shove(o, ux, uz, push);
    const owed = Math.max(0, push - gotM) + Math.max(0, push - gotO);
    if (owed > 0.01) {
      if (push - gotM > 0.01) shove(o, ux, uz, owed);
      else if (push - gotO > 0.01) shove(m, -ux, -uz, owed);
    }
    dx = o.pos.x - m.pos.x; dz = o.pos.z - m.pos.z;
    if (dx * dx + dz * dz < deep * deep) {
      const sgn = ((m.i * 37 + o.i * 91) & 1) ? 1 : -1;
      shove(m, uz * sgn, -ux * sgn, deep);                   // along the wall
      shove(o, -uz * sgn, ux * sgn, deep);
      dx = o.pos.x - m.pos.x; dz = o.pos.z - m.pos.z;
      if (dx * dx + dz * dz < deep * deep) {
        // nowhere left to put them: the frame wins, the world gets the next step
        const e = (deep - Math.sqrt(dx * dx + dz * dz)) * 0.5 + 0.01;
        m.pos.x -= ux * e; m.pos.z -= uz * e;

  }
  /* THE PASS THIS ONE REPLACED, kept so the claim is two-sided: ?sep=old and
     the overlap count has to come BACK. A fix that cannot be turned off has
     not been measured, it has been asserted. */
  function separateOld(k) {
    grid.forEach(function (a) {
      for (let i = 0; i < a.length; i++) {
        const m = a[i];
        if (m.dead) continue;
        const jEnd = Math.min(a.length, i + 6);
        for (let j = i + 1; j < jEnd; j++) {
          const o = a[j];
          if (o.dead) continue;
          const dx = o.pos.x - m.pos.x, dz = o.pos.z - m.pos.z;
          const d2 = dx * dx + dz * dz;
          if (d2 > 1.0 || d2 < 1e-6) continue;
          const d = Math.sqrt(d2);
          const push = (1.0 - d) * 0.5 * k / d;
          m.pos.x -= dx * push; m.pos.z -= dz * push;
          o.pos.x += dx * push; o.pos.z += dz * push;
        }
      }
    });
  }
  /* DID THE PASS ACTUALLY DO ITS JOB? The probe's overlap count is O(n^2) and
     deliberately shares none of the grid's assumptions, which makes it honest
     about the RESULT and silent about the CAUSE: a pair can survive because
     the pass never visited it (a grid that is not complete) or because it was
     visited and something moved it back. This counts the survivors using the
     grid's OWN sweep immediately after the pass — so a residual of zero here
     beside a non-zero probe means the grid is missing pairs, and a residual
     that matches the probe means the pass is being fought. */
  let sepResid = 0;
  function sepResidual() {
    let n = 0;
    fine.forEach(function (a) {
      for (let i = 0; i < a.length; i++) {
        const m = a[i];
        if (m.dead) continue;
        const cx = Math.floor(m.pos.x / FINE), cz = Math.floor(m.pos.z / FINE);
        for (let j = i + 1; j < a.length; j++) n += tooClose(m, a[j]);
        for (let f = 0; f < 4; f++) {
          const b = fine.get(gridKey(cx + FAN[f][0], cz + FAN[f][1]));

  function tooClose(m, o) {
    if (o.dead || o === m) return 0;
    if (Math.abs(m.pos.y - o.pos.y) >= 1.8) return 0;
    const need = 0.69 * ((m.rad || 0.45) + (o.rad || 0.45));
    const dx = o.pos.x - m.pos.x, dz = o.pos.z - m.pos.z;
    return (dx * dx + dz * dz) < need * need ? 1 : 0;

  // NEIGHBOURS, for anything that needs to ask about bodies rather than push
  // them: the fire-discipline lane test, and the director.
  const _fine1 = [];
  function fineNear(x, z, r, out) {
    out = out || _fine1;
    out.length = 0;
    const x0 = Math.floor((x - r) / FINE), x1 = Math.floor((x + r) / FINE);
    const z0 = Math.floor((z - r) / FINE), z1 = Math.floor((z + r) / FINE);
    for (let cx = x0; cx <= x1; cx++) for (let cz = z0; cz <= z1; cz++) {
      const a = fine.get(gridKey(cx, cz));
      if (a) for (let i = 0; i < a.length; i++) out.push(a[i]);
    }
    return out;
  }
  /* ============================================================ THE WAY THROUGH
     A MAN IS NOT A PATHFINDER — AND IN A CITY THAT IS NOT SURVIVABLE.

     Measured, first build on the real downtown: 25 of 40 men in slot "push",
     `cool` at -28 s, both armies 135 m apart with eight blocks of masonry
     between them and not a shot fired for half a minute. The wall-slide
     detour is the right instinct for a crate and hopeless against a city
     block: a man walks into the Exchange Bank, slides 1.5 s along the
     facade, turns back into it, and does that until the clock runs out.

     So the ground gets a FLOW FIELD, and it is multi-source on purpose. Seed
     Dijkstra from EVERY living enemy at once and the resulting field is
     "path distance to the nearest enemy" — one solve, and each man descending
     it walks toward whichever opponent is genuinely closest THROUGH the
     streets, not the one closest as the crow flies. Seeding from a centre of
     mass instead funnels an army into a single point, which is what the first
     draft did and what the corner-bunching in the measurement was.

     Cells are 4 m: a 15 m street is three of them wide, and a 490 m town is
     22 500 cells, which Dial's bucket queue clears in about a millisecond.
     The blocked map is built ONCE, because buildings do not move; the field
     is re-solved on a slow tick, because men do. */
  const NAV = { cell: 4, x0: 0, z0: 0, w: 0, h: 0, block: null, on: false,

  const NBX = [1, -1, 0, 0, 1, 1, -1, -1], NBZ = [0, 0, 1, -1, 1, -1, 1, -1];

  function navBuild(cx, cz, radius) {

    NAV.x0 = cx - radius; NAV.z0 = cz - radius; NAV.w = w; NAV.h = w;
    const block = new Uint8Array(w * w);

    for (let iz = 0; iz < w; iz++) for (let ix = 0; ix < w; ix++) {
      if (blockedAt(NAV.x0 + (ix + 0.5) * C, NAV.z0 + (iz + 0.5) * C)) { block[iz * w + ix] = 1; blocked++; }
    }
    NAV.block = block; NAV.blocked = blocked;
    // NOTHING IN THE WAY MEANS NO FIELD. On open sand a gradient is a worse
    // straight line than a straight line, and the solve is pure cost.
    NAV.on = blocked > 24;
    NAV.dist.red = new Uint16Array(w * w);
    NAV.dist.blue = new Uint16Array(w * w);

  }
  const _bk = [];
  function navSolve(team) {
    const w = NAV.w, C = NAV.cell, blk = NAV.block, d = NAV.dist[team];
    if (!d) return 0;
    d.fill(65535);
    for (let i = 0; i < NAV_MAXD; i++) { if (!_bk[i]) _bk[i] = []; else _bk[i].length = 0; }
    let seeded = 0;
    for (let i = 0; i < men.length; i++) {
      const m = men[i];
      if (m.dead || m.team === team) continue;
      const ix = ((m.pos.x - NAV.x0) / C) | 0, iz = ((m.pos.z - NAV.z0) / C) | 0;
      if (ix < 0 || iz < 0 || ix >= w || iz >= w) continue;
      const k = iz * w + ix;
      if (d[k] !== 0) { d[k] = 0; _bk[0].push(k); seeded++; }
    }
    NAV.at[team] = simT;
    if (!seeded) return 0;
    for (let b = 0; b < NAV_MAXD; b++) {
      const q = _bk[b];
      if (!q.length) continue;
      for (let qi = 0; qi < q.length; qi++) {
        const k = q[qi];
        if (d[k] !== b) continue;                       // a cheaper route already claimed it
        const ix = k % w, iz = (k / w) | 0;
        for (let n = 0; n < 8; n++) {
          const nx = ix + NBX[n], nz = iz + NBZ[n];
          if (nx < 0 || nz < 0 || nx >= w || nz >= w) continue;
          const nk = nz * w + nx;
          if (blk[nk]) continue;
          const nd = b + (n < 4 ? 10 : 14);
          if (nd < d[nk] && nd < NAV_MAXD) { d[nk] = nd; _bk[nd].push(nk); }

  }
  /* Descend the field a few cells and hand back where that lands. Three steps
     rather than one because a single-cell goal is 4 m away and makes a column
     walk in stair steps; three is far enough to read as a direction and near
     enough that the next think re-asks. */
  function navStep(m, out) {
    if (!NAV.on) return false;
    const w = NAV.w, C = NAV.cell, d = NAV.dist[m.team];
    if (!d) return false;
    let ix = ((m.pos.x - NAV.x0) / C) | 0, iz = ((m.pos.z - NAV.z0) / C) | 0;
    if (ix < 1 || iz < 1 || ix >= w - 1 || iz >= w - 1) return false;
    if (d[iz * w + ix] === 65535) return false;         // no route from here
    let moved = false;
    for (let s = 0; s < 3; s++) {
      let best = d[iz * w + ix], bx = -1, bz = -1;
      for (let n = 0; n < 8; n++) {
        const nx = ix + NBX[n], nz = iz + NBZ[n];
        if (nx < 1 || nz < 1 || nx >= w - 1 || nz >= w - 1) continue;
        const v = d[nz * w + nx];
        if (v < best) { best = v; bx = nx; bz = nz; }
      }
      if (bx < 0) break;
      ix = bx; iz = bz; moved = true;
      if (best === 0) break;                            // standing on him
    }
    if (!moved) return false;
    out.set(NAV.x0 + (ix + 0.5) * C, 0, NAV.z0 + (iz + 0.5) * C);
    return true;
  }

  const teamCOM = { red: { x: 0, z: 0 }, blue: { x: 0, z: 0 } };
  const HUNT = { red: false, blue: false };
  let comAt = -1;
  function updateCOM() {
    // the morale tick rides this one: same cadence, and it splices the fled
    // out of `men` before anything below counts them
    updateMorale();
    /* THE CENTRE IS WHERE THE FIGHTING MEN ARE. A routing man running for his
       edge is not where his army's guns are, and averaging him in dragged
       every march goal and every rout direction toward the runners. The
       living are the fallback when nobody is left fighting. */
    const count = { red: 0, blue: 0 }, live = { red: 0, blue: 0 };
    ["red", "blue"].forEach(function (t) {
      let x = 0, z = 0, n = 0, ax = 0, az = 0, an = 0;
      for (let i = 0; i < men.length; i++) {
        const m = men[i];
        if (m.team !== t || m.dead || m.fled) continue;
        ax += m.pos.x; az += m.pos.z; an++;
        if (m.routed) continue;
        x += m.pos.x; z += m.pos.z; n++;
      }
      count[t] = n; live[t] = an;
      if (n) { teamCOM[t].x = x / n; teamCOM[t].z = z / n; }
      else if (an) { teamCOM[t].x = ax / an; teamCOM[t].z = az / an; }
    });
    /* THE MOP-UP IS A PHASE, AND EIGHT TO ONE IS NOT WHERE IT STARTS.
       `hunt` is what ends a battle — a wider look, a straight march and a run
       (stepMan: speed 8.0, fireMax x1.6) — and it was gated on a ratio so
       extreme that by the time it could fire there was nothing left to hunt.
       MEASURED, 26 v 26 on `city`: at t=83 s it stood 17 v 4, a comfortable
       rout at 4.25:1, and the flag was still false; twenty-one men held a mark
       none of them could SEE, all of them in slot `push`, and the shot counter
       sat unchanged at 715 for the last three samples. That is dead air with
       the result already decided.

       Three to one is where an army stops manoeuvring and starts sweeping,
       which is both the real answer and the measured one. */
    // counted in FIGHTING men: an army whose line has broken is swept, even
    // while its runners still outnumber the men chasing them
    HUNT.red = count.red > 0 && (count.blue > 0 ? count.red >= count.blue * 3 : live.blue > 0);
    HUNT.blue = count.blue > 0 && (count.red > 0 ? count.blue >= count.red * 3 : live.red > 0);
    comAt = simT;
  }

  /* ============================================================ FIRE
     The trigger pull is combat_iq's: reaction beat, settle, burst rhythm,
     token discipline, derived damage. This page only draws the round,
     plays the report and applies the number it was handed. */
  const SIGHT = 175;
  /* A DUNE IS NOT MADE OF COLLIDERS. segmentBlocked answers for every box in
     the world and nothing else, which was the whole truth while every venue
     fought on a flat plate — and a lie the moment the war moved onto real
     dunes, where a man would sight and fire straight through twenty metres
     of sand. So on a map that declares terrainLos, the ground itself is
     sampled along the eye line: 3 m steps against a 420 m dune wavelength
     cannot step over a crest, and the first and last couple of metres are
     the two bodies' own footing and never count. The colliders are asked
     first because they are cheaper and usually the answer. ?tlos=0 turns the
     sand transparent again, so the difference is measurable. */
  function terrainBlocked(ax, ay, az, bx, by, bz, ground) {
    const g = ground || MAP.groundAt;   // buildMap scans before MAP exists
    const dx = bx - ax, dz = bz - az;
    const d = Math.hypot(dx, dz);
    if (d < 8) return false;
    const dy = by - ay, n = Math.ceil(d / 3);
    for (let i = 1; i < n; i++) {

         bearing forever and never arrive — it settles into a stable ring at

           turn — far out, slow to ~90 and haul around until the nose is ON

        const pr = CBZ.ordnance.predict(p.af.pos, p.af.vel, wantNuke ? nukeKind : "iron", 40);
        if (pr && pr.x != null) {
          const d = Math.hypot(pr.x - aim.x, pr.z - aim.z);
          p._predD = d;
          // a kilometre-radius weapon does not need a bullseye: any pass
          // within a few hundred metres of the mass IS on target
          if (wantNuke && (d < 400 || distAim < 700)) { releaseNuke(p); dropped = true; }
          // no bombs before the lines have even formed: the opening belongs
          // to the infantry, the air arrives ON a battle. The stick WALKS, so
          // overhead within half its spread is close enough when the
          // predicted point never quite kisses the aim.
          else if (!p.nuke && (d < 110 || (d < 300 && distAim < 500)) && p.dropCool <= 0 && simT > 10) { dropStick(p); dropped = true; }
        } else p._predD = -2;
      }
      // one pass, one stick: past the mass (or having dropped, or overshot
      // the locked line), swing out and set up the next run
      const overshot = p.runPt && Math.hypot(p.af.pos.x - p.runPt.x, p.af.pos.z - p.runPt.z) < 1100;
      if (!p.egress && p.mode === "in" && (dropped || distAim < 300 || overshot)) {
        p.mode = "out"; p.runPt = null;
        // outbound point: straight ahead through the mass and past it — kept
        // short, because every metre out here is lap time between passes
        const fwdH = p.af.heading();
        p.outPt = { x: p.af.pos.x - Math.sin(fwdH) * 1900, z: p.af.pos.z - Math.cos(fwdH) * 1900 };
      }
    }
  }

  /* ============================================================ THINK
     Slow tick per man: pick a mark, hand steering to combat_iq's posture
     (cover, fire token, band, bearing slot), advance when walls have kept
     the mark unseen too long. The fast path below only moves and shoots. */
  // nobody in sight: MARCH. Squads move as ranked columns behind their
  // senior man — the approach reads as an army, and it costs one lookup
  // per follower. Contact dissolves the parade: the moment anyone has a
  // mark, combat_iq (or the beast brain) owns him.
  //
  // THE SENIOR MAN IS THE ONLY ONE WHO NAVIGATES. He descends the flow
  // field, the column trails him on his own bearing, and a squad rounds a
  // block as a squad. Before this, every follower solved the same wall
  // independently and the formation came apart on the first corner.
  // (Shared with the beasts verbatim: a wolf pack files through the same
  // streets the men do, and spreads the same way when it finds the fight.)
  function marchGoal(m) {
    const com = teamCOM[m.team === "red" ? "blue" : "red"];
    const sq = squads[m.team][m.sq];
    let lead = null;
    if (sq) for (let i = 0; i < sq.length; i++) if (!sq[i].dead && !sq[i].fled && !sq[i].routed) { lead = sq[i]; break; }
    if (lead && lead !== m) {
      const ahead = lead.target;
      const my = Math.atan2(ahead.x - lead.pos.x, ahead.z - lead.pos.z);
      const row = ((m.sqSlot / 2) | 0) + 1, col = (m.sqSlot & 1) ? 1.25 : -1.25;
      m.target.set(
        lead.pos.x - Math.sin(my) * row * 2.0 + Math.cos(my) * col, 0,
        lead.pos.z - Math.cos(my) * row * 2.0 - Math.sin(my) * col);
    } else if (!navStep(m, m.target)) {
      const j = m.hunt ? 0 : 14;      // a hunt marches STRAIGHT at them
      m.target.set(com.x + (lcg() - 0.5) * j, 0, com.z + (lcg() - 0.5) * j);
    }
    // a pack marching in also spreads: the column-follow above is a MAN's
    // formation, and animals that ignore it would otherwise walk in a stack
    if (m.beast) spreadGoal(m);
    m.slot = "march";
  }
  /* THE WALL RULE — the fix this wave is actually for. A combat goal is only
     a straight line if the world agrees: posture()'s bearing and band goals
     are pure geometry around the mark, and in a real downtown they routinely
     land through a building, which is the man pressing his face into the
     facade until the detour timer spins him. One torso-height segment test
     per think; when the line is walled, descend the flow field instead — the
     same "around, not through" the marches already use. ?steer=old reverts. */
  function goalBlocked(m) {
    return CBZ.micro.segmentBlocked(
      m.pos.x, m.pos.y + 1.1, m.pos.z,
      m.target.x, MAP.groundAt(m.target.x, m.target.z) + 1.1, m.target.z);
  }
  function steerAroundWalls(m) {
    if (STEER_OLD) return;
    const gd = Math.hypot(m.target.x - m.pos.x, m.target.z - m.pos.z);
    if (gd > 8 && goalBlocked(m) && navStep(m, m.target)) {
      // the field hands every man in a cell the SAME cell centre, and two
      // walled men approaching it from opposite sides would meet head-on at
      // a point by construction. A man-stable lateral inside the 4 m cell
      // keeps the descent direction and loses the pile-up.
      m.target.x += ((m.i % 5) - 2) * 0.8;
      m.target.z += (((m.i * 7) % 5) - 2) * 0.8;
    }
  }
  /* A CHARGE IS NOT A QUEUE.

     The men have had a goal-level anti-clump since the first build: after
     combat_iq picks a spot, the goal is pushed off whichever mates are
     already standing near it, so two riflemen are never sent to the same
     metre of street. The beasts had NOTHING — every lion in the pride was
     steered at the same enemy body, so a hundred goals stacked on one point
     and the separation pass spent every frame shoving apart bodies that the
     steering shoved straight back together. Measured on 120 lions v 400 dogs:
     70 overlapping pairs at peak, and the probe named them for what they were
     — same team, both charging, mostly not even fighting anybody yet.

     Same rule as the men's, in the pair's own units: two lions need more room
     than two dogs, and the fine grid already knows who is nearby. */
  const _bn = [];
  function spreadGoal(m) {
    const reach = (m.rad + bodyRadMax) * 1.3;
    const a = fineNear(m.target.x, m.target.z, reach, _bn);
    let ox = 0, oz = 0, n = 0;
    for (let i = 0; i < a.length && n < 5; i++) {
      const o = a[i];
      if (o === m || o.dead || o.team !== m.team) continue;
      const want = (m.rad + (o.rad || 0.45)) * 1.1;
      const dx = m.target.x - o.pos.x, dz = m.target.z - o.pos.z;
      const d = Math.hypot(dx, dz);
      if (d > want || d < 0.001) continue;
      ox += (dx / d) * (want - d); oz += (dz / d) * (want - d); n++;
    }
    if (n) { m.target.x += ox; m.target.z += oz; }
  }
  // the beast's slow tick: pick the fight, close on it, surround it. The
  // strike itself is creature_combat's, in the bubble stepMan owns.
  function thinkBeast(m, tgt, thinkDt) {
    const tn = m.tn;
    /* AN ANIMAL DOES NOT CHASE ONE MARK ACROSS THE WHOLE MAP WHILE SOMETHING
       ELSE IS BITING ITS FLANK.

       Targets are sticky until the mark dies, which is right on land: a lion
       runs a deer down, terrain corners it, and the fight ends. In OPEN WATER
       it never ends — two animals of similar speed in a stern chase are a
       conga line, and MEASURED, eight orcas and a megalodon spent seventy
       simulated seconds in one with nobody so much as bleeding out, because the
       megalodon had latched onto the one orca that broke off at 64 m while
       seven more were inside ten.

       So a beast that is FAR from its mark re-asks, on a slow cadence, and only
       switches for something genuinely nearer (0.6x). Cheap (one grid query a
       second per far-off animal), and it is a fix for land packs too — a wolf
       should take the man in front of it, not the one it first saw. */
    if (tgt && !tgt.dead) {
      const far = Math.hypot(tgt.pos.x - m.pos.x, tgt.pos.z - m.pos.z);
      if (far > 16) {
        m.repickT = (m.repickT || 0) - thinkDt;
        if (m.repickT <= 0) {
          m.repickT = 0.9 + (m.i % 5) * 0.13;      // staggered, never a whole pod at once
          const o = pickTarget(m, far);
          if (o && o !== tgt &&
              Math.hypot(o.pos.x - m.pos.x, o.pos.z - m.pos.z) < far * 0.6) {
            m.tgt = o; tgt = o; m.losBadT = 0;
          }
        }
      }
    }
    // a mauled animal that is not one of the brave ones quits and runs — and
    // is run down or lives by the same chase-and-retreat physics the men
    // already play by. Prey species skip straight to flight.
    const beaten = m.hp < m.maxHp * 0.3 && !tn.brave;
    if (beaten || tn.prey) {
      const com = teamCOM[m.team === "red" ? "blue" : "red"];
      const fx = m.pos.x - (tgt ? tgt.pos.x : com.x), fz = m.pos.z - (tgt ? tgt.pos.z : com.z);
      const fl = Math.hypot(fx, fz) || 1;
      m.target.set(m.pos.x + (fx / fl) * 16, 0, m.pos.z + (fz / fl) * 16);
      m.slot = "fallback"; m.state = "flee"; m.tgt = null;
      return;
    }
    m.state = "charge";                        // the gait's flee-bound reads this
    const sees = eyeLos(m, tgt);
    m.sees = sees;
    if (!sees) {
      m.losBadT += thinkDt;
      if (m.losBadT > 7) { m.tgt = null; m.losBadT = 0; return; }
      if (m.losBadT > 2.0) {                   // an animal does not trade with a facade at all
        if (!navStep(m, m.target)) m.target.set(tgt.pos.x, 0, tgt.pos.z);
        m.slot = "push";
        return;
      }
    } else m.losBadT = 0;
    const d = Math.hypot(tgt.pos.x - m.pos.x, tgt.pos.z - m.pos.z);
    if (d < 14) {
      /* THE SURROUND: a pack does not queue single file behind the prey.
         Each pack index takes a bearing around the mark — the same slot idea
         the gunmen's fire arcs use, at claw range.

         The ring is the two BODIES' own sizes, not a fraction of the reach.
         Sizing it off reach put every attacker inside the clearance the
         separation pass was simultaneously trying to keep them at, so the two
         rules fought each other and the pack shimmered through itself — 25 of
         the 32 overlapping pairs in the lions-and-dogs measurement were on a
         surround ring. Twelve bearings around the WHOLE circle, too: seven
         slots across 172 degrees left the far side of the prey empty. */
      /* AND THE RING HAS A CAPACITY. One ring at touching distance holds
         2*pi*r / (bodies wide) animals and no more — for dogs on a lion that
         is eight — so when four hundred dogs pick the same lion, the ring
         itself was ordering three hundred of them to stand inside each other.
         Twelve bearings on THREE concentric rings, assigned off the animal's
         own stable index: the front rank bites, the ranks behind wait their
         turn at a body's distance back, and a pack reads as a pack closing in
         rather than a single pile. */
      const slot = (m.i % 12) * (Math.PI / 6);
      const ringN = (((m.i / 12) | 0) % 3);
      const base = Math.atan2(m.pos.x - tgt.pos.x, m.pos.z - tgt.pos.z) + slot;
      const r = m.rad + (tgt.rad || 0.45) + 0.12 + ringN * m.rad * 1.9;
      m.target.set(tgt.pos.x + Math.sin(base) * r, 0, tgt.pos.z + Math.cos(base) * r);
    } else {
      m.target.set(tgt.pos.x, 0, tgt.pos.z);
      steerAroundWalls(m);
    }
    spreadGoal(m);
    m.slot = "push";
  }

  /* Any think that does not end in the fold gives the fold up: a man told to
     push, chase or run does not carry a crouch across open sand. */
  function think(m, now) {
    thinkMan(m, now);
    if (m.hull && m.slot !== "hull") m.hull = null;
  }
  function thinkMan(m, now) {
    const thinkDt = Math.min(1.2, now - m.lastThink);
    m.lastThink = now;
    const crowd = men.length;
    m.thinkAt = now + 0.14 + Math.min(0.42, crowd / 2600) + lcg() * 0.06;
    m.hunt = HUNT[m.team];
    // HIS NERVE FIRST: a man who has broken is not deciding anything else
    if (routCheck(m, thinkDt)) return;
    // a man stepping off his own man's firing line finishes the step. Half a
    // second of not re-deciding is the whole point: re-deciding is what put
    // him back in the lane.
    if (m.stepAsideT > 0 && m.tgt && !m.tgt.dead && !m.tgt.fled) { m.stepAsideT -= thinkDt; return; }

    if (!m.tgt || m.tgt.dead || m.tgt.fled) { m.tgt = pickTarget(m, m.hunt ? SIGHT * 2 : SIGHT); m.losBadT = 0; }
    // CONTACT IS INFORMATION A SQUAD SHARES. Before marching blind past a
    // fight, a man asks his own column: a mate already engaged hands him the
    // mark, and the squad turns to the guns together instead of one man
    // duelling while nine file past. One squad scan per think, only while
    // unengaged — this is what "acting under orders" costs when it is real.
    if (!m.tgt && !SHARE_OLD) {
      /* AT MOST TWO MEN TURN ON ONE SHOUT. Whole-column adoption was a
         measured pile-up (ten mates beelining one mark crossed files into a
         sub-0.62 m pair on the arena probe); two is a buddy answering a
         contact, and the rest of the column keeps its shape and its march,
         acquiring organically as the fight arrives. The pair still tells
         the watcher the squad is a squad — without a scrum. */
      const sqB = squads[m.team][m.sq];
      if (sqB) for (let i = 0; i < sqB.length; i++) {
        const b = sqB[i];
        if (b === m || b.dead || b.routed || !b.tgt || b.tgt.dead || b.tgt.fled) continue;
        let onIt = 0;
        for (let j = 0; j < sqB.length; j++) {
          if (sqB[j] !== m && !sqB[j].dead && sqB[j].tgt === b.tgt) onIt++;
        }
        if (onIt >= 2) continue;
        const bd = Math.hypot(b.tgt.pos.x - m.pos.x, b.tgt.pos.z - m.pos.z);
        if (bd < SIGHT * 1.3) {
          m.tgt = b.tgt; m.losBadT = 0;
          // and hold rank for the rest of this beat — the man engages on his
          // own next think, with the fire arcs handing him a bearing.
          marchGoal(m);
          return;
        }
      }
    }
    const tgt = m.tgt;
    if (!tgt) { marchGoal(m); return; }
    if (m.beast) { thinkBeast(m, tgt, thinkDt); return; }
    const sees = seesStanding(m, tgt);
    m.sees = sees;
    if (!sees) {
      m.losBadT += thinkDt;
      // a wall has held this line too long: push up on the mark instead of
      // trading nothing with a facade. The assault around the corner IS the
      // readable behaviour — and "around" is the field's word, not a straight
      // line into the facade, which is what it used to mean.
      if (m.losBadT > 2.6) {
        // and a mark that stays unseeable even at arm's length is a dead end
        // (a body wedged in geometry, a hole nobody can shoot into) — let it
        // go and take the next fight rather than freezing the war on it
        if (m.losBadT > 7) { m.tgt = null; m.losBadT = 0; return; }
        if (!navStep(m, m.target)) m.target.set(tgt.pos.x, 0, tgt.pos.z);
        m.slot = "push";
        return;
      }
    } else m.losBadT = 0;
