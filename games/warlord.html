<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="data:,">
<title>Desert Warlord</title>
<!-- ============================================================
  DESERT WARLORD — start alone, end with an army.

  This is Bannerlord with everything removed except the part that made it
  work: you ride a huge map, you meet a party, and you decide whether to
  fight it, buy it, or frighten it into joining you. Then you look at the
  men you have and decide who gets the good rifle.

  WHAT THIS PAGE IS: the shell and the router. Which phase owns the screen,
  the load, the frame, and the one canvas everybody draws into. It contains
  NO gameplay. The game is six files under src/warlord/:

     core.js      the state, the men, the money, the phases   (no THREE in it)
     desert.js    the island — 14 km of analytic sand
     campaign.js  riding it, and the parties that ride it too
     army.js      the roster, morale, prisoners, the aftermath
     battle.js    the actual war — combat_iq, real guns, real corpses
     outpost.js   depots that sell guns and camps that sell men
     loadout.js   who carries what
     warnet.js    the same island with other warlords on it

  NOTHING VIOLENT HERE IS DRAWN BY THIS REPO'S NEW CODE. The men are
  studio.cast. The guns are weapons/appearances. How they fight is
  systems/combat_iq.js — the same brain games/battle.html runs. The dead
  fall through city/ragdoll.js. This game is a NEW CAMPAIGN wrapped around
  an engine that already knew how to have a battle.
============================================================ -->
<style>
  :root{color-scheme:dark;
    --sand:#d9b979; --sand-d:#8a6f3e; --ink:#f4ecd8; --bg:#120e09;
    --hot:#ff8a3d; --blood:#c4453a; --steel:#7fa8c8; --gold:#ffd166;
    /* ---- THE SAFE AREA, ONCE, BY NAME ----
       Twenty places across six files wrote env(safe-area-inset-*) directly,
       and the values were right. The problem was that NOTHING COULD CHECK
       THEM: Chrome's device emulation has no safe-area support, so env()
       resolves to 0 in every headless frame and a button sitting under the
       home indicator measures as perfectly placed. The inset was therefore
       the one part of this layout no gate could ever see.

       Naming it fixes that in both directions. On a real phone each var
       falls through to env() exactly as before; in a test frame a tool sets
       the four variables to that device's real insets and every layer moves
       — tools/warlord-fits.mjs does precisely this, per frame, and it is why
       the notch and the home bar are now measured instead of assumed. */
    --wl-safe-t: env(safe-area-inset-top, 0px);
    --wl-safe-b: env(safe-area-inset-bottom, 0px);
    --wl-safe-l: env(safe-area-inset-left, 0px);
    --wl-safe-r: env(safe-area-inset-right, 0px);
    /* how tall the bottom furniture currently is. match.js measures its own
       strip into this; 0 when there is no match. */
    --wl-footer: 0px;
    /* how tall the MEN/$/DAY strip currently is, measured and republished by
       paintHud on every repaint — it grows a row when events.js adds chips */
    --wl-hud: 46px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);
    font:600 15px/1.35 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  button{font:inherit;color:inherit}

  /* ---- boot ---- */
  #boot{position:fixed;inset:0;z-index:var(--z-boot);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(120% 90% at 50% 30%,#2a1d0e,#120e09 70%)}
  #boot h1{margin:0;font-size:clamp(28px,9vw,60px);letter-spacing:-.02em;line-height:.92;text-align:center}
  #boot h1 em{font-style:normal;color:var(--hot)}
  #bootbarwrap{width:min(420px,72vw);height:4px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
  #bootbar{height:100%;width:0;background:var(--hot);transition:width .18s linear}
  #bootst{font-size:11px;letter-spacing:.22em;opacity:.55}

  /* ============================================================ THE LADDER
     Every fixed layer in this game, in one place, in order. It is written
     down because it was not: the layers were numbered independently in six
     files and they collided in three separate ways, each of which made a
     control unpressable —

       · #verbs and #wl-match were BOTH z-index 55 pinned to the bottom, so
         the encounter's buttons were drawn under the match strip and the
         game could not be answered during a match at all;
       · #stage was 40 and campaign.js's compass was 45, so territory.js
         RAISED THE STAGE TO 66 at runtime for the life of the map — which
         put the map over the match strip and made BOARD unreachable on
         every device frame instead;
       · and nothing was above a screen on purpose, so which of two visible
         layers won came down to DOM insertion order.

     One ladder, one place, and no module mutates another's z-index. The two
     rules it encodes: A SCREEN OUTRANKS EVERY PIECE OF CAMPAIGN FURNITURE,
     and THE CLOCK AND THE HUD OUTRANK THE SCREEN — because the clock never
     pauses, and a screen you can open while your army is being counted must
     not be able to hide either. */
  :root{
    --z-camp:   45;   /* campaign.js's compass, map button, wardrobe button */
    --z-stage:  60;   /* a full screen: the map, the armoury, the endgame   */
    --z-match:  64;   /* the match clock — above a screen, on purpose       */
    --z-verbs:  66;   /* the verb rail (a screen closes it anyway)          */
    --z-hud:    68;   /* who you are: MEN, $, DAY, LOYALTY. always on top   */
    --z-toast:  80;
    --z-boot:   90;
  }

  /* ---- the one surface every screen paints into ---- */
  /* A FULL SCREEN IS NOT edge-to-edge CONTENT. It was `padding:18px 14px 34px`
     flat, so on a phone the first row went under the notch and the last row
     (ALLY / BREAK on the match board, RIDE HERE on the map) went under the
     home indicator AND under the match strip — measured, on five of seven
     device frames. The padding is the furniture, stated. */
  /* THE TOP INSET IS THE STRIP'S MEASURED HEIGHT, NOT 46. It was a typed 46,
     which is right for the strip's one-line form ("25 MEN $900 DAY 1") and
     wrong the moment events.js appends its own chips and #hud wraps to two
     rows: photographed on an iPhone at 393 pt, "SAND BANDITS" was printed
     straight through "0/4 WARLORDS". #hud is pointer-events:none over a
     gradient, so nothing was unclickable and no gate could see it — it just
     looked broken. paintHud() publishes --wl-hud after every repaint (it is
     the only code that knows how tall the strip actually came out), and 46 px
     stays as the fallback for the first paint. */
  #stage{position:fixed;inset:0;z-index:var(--z-stage);display:none;overflow:auto;
    background:radial-gradient(130% 100% at 50% 0%,#241a0e,#120e09 74%);
    padding:calc(var(--wl-safe-t) + var(--wl-hud, 46px) + 6px) calc(var(--wl-safe-r) + 14px)
            calc(var(--wl-safe-b) + var(--wl-footer) + 34px) calc(var(--wl-safe-l) + 14px)}
  #stage.on{display:block}
  #stage .in{max-width:860px;margin:0 auto}
  .wl-h{margin:2px 0 4px;font-size:clamp(22px,6vw,40px);letter-spacing:-.01em;line-height:1}
  .wl-h em{font-style:normal;color:var(--hot)}
  .wl-sub{margin:0 0 16px;opacity:.5;letter-spacing:.2em;font-size:11px}
  .wl-lbl{font-size:11px;letter-spacing:.22em;opacity:.55;margin:18px 0 8px}
  .wl-card{border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 14px;
    background:rgba(255,255,255,.03);margin-bottom:10px}
  .wl-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 0;
    border-bottom:1px solid rgba(255,255,255,.06)}
  .wl-row:last-child{border-bottom:0}
  .wl-btn{appearance:none;border:1px solid rgba(255,255,255,.16);border-radius:12px;
    background:rgba(255,255,255,.05);padding:11px 15px;cursor:pointer;letter-spacing:.08em;
    font-size:13px;transition:background .12s,border-color .12s}
  .wl-btn:hover{background:rgba(255,255,255,.1)}
  .wl-btn:active{transform:translateY(1px)}
  .wl-btn.hot{border-color:var(--hot);background:rgba(255,138,61,.14);color:#ffd7bd}
  .wl-btn.bad{border-color:var(--blood);background:rgba(196,69,58,.14)}
  .wl-btn.ghost{opacity:.55}
  .wl-btn[disabled]{opacity:.3;cursor:not-allowed}
  .wl-btns{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
  .wl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .wl-gold{color:var(--gold)}
  .wl-dim{opacity:.5}
  .wl-small{font-size:11px;letter-spacing:.1em}

  /* ---- the persistent strip: who you are, at all times ---- */
  #hud{position:fixed;left:0;right:0;top:0;z-index:var(--z-hud);display:none;
    padding:calc(var(--wl-safe-t) + 8px) 12px 8px;
    background:linear-gradient(#0009,#0000);pointer-events:none}
  #hud.on{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #hud b{font-size:15px;letter-spacing:.06em}
  #hud .chip{font-size:11px;letter-spacing:.16em;opacity:.75}

  /* ---- THE SPEED CONTROL ----
     OWNER: "a slider to speed up and slow down game speed going up to
     insanely fast so you can basically not move and people come to you."

     WHERE IT SITS, AND WHY THERE. Every corner of this game is already
     spoken for: the HUD owns the top strip, wardrobe.js's FIT button the top
     left at +52, campaign.js's MAP button and zoom pair the top right at +52
     and +100, the compass the bottom centre, match.js's strip and the verb
     rail the bottom edge. The one free block is the top LEFT under FIT, which
     is the mirror of the zoom column — so the pill goes there, at the same
     14 px inset off the same --wl-safe-* variables everything else on this
     page uses, and at --z-camp because it IS campaign furniture.

     IT IS A RANGE INPUT ON PURPOSE. A row of nine buttons is nine controls
     for the fits gate to place on an iPhone SE; one slider is one control, it
     is draggable with a thumb, it is the shape every strategy game has used
     for this since Civilization, and the keyboard (, and .) drives the same
     one number. 34 px tall because the gate's floor is 28 and a thumb is not
     a mouse. The track is generous and the thumb is square so a finger can
     find it without a hover state to help.

     THE READOUT IS A CHIP, NOT AN EXPLANATION — tools/button-gate.mjs's whole
     law. "64×" is the setting. A second muted tag appears only when there is
     something true to say that the setting does not: MATCH when a live match
     has pinned the clock (see match.js), or the achieved rate when the
     machine cannot deliver what was asked for. */
  #wlSpeed{position:fixed;z-index:var(--z-camp);display:none;align-items:center;gap:9px;
    left:calc(var(--wl-safe-l) + 14px);top:calc(var(--wl-safe-t) + 104px);
    padding:5px 11px 5px 9px;border-radius:13px;
    background:rgba(12,9,5,.62);border:1px solid rgba(255,255,255,.2)}
  #wlSpeed.on{display:flex}
  #wlSpeed input[type=range]{appearance:none;-webkit-appearance:none;
    width:126px;height:34px;margin:0;background:none;cursor:pointer;display:block}
  #wlSpeed input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;
    background:rgba(255,255,255,.22)}
  #wlSpeed input[type=range]::-moz-range-track{height:5px;border-radius:3px;
    background:rgba(255,255,255,.22)}
  #wlSpeed input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;
    width:16px;height:22px;margin-top:-8.5px;border-radius:5px;background:var(--hot);
    border:1px solid rgba(0,0,0,.45)}
  #wlSpeed input[type=range]::-moz-range-thumb{width:16px;height:22px;border-radius:5px;
    background:var(--hot);border:1px solid rgba(0,0,0,.45)}
  #wlSpeed input[type=range]:disabled{opacity:.35;cursor:not-allowed}
  #wlSpeedV{font:700 13px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;
    font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
  #wlSpeed.fast #wlSpeedV{color:var(--hot)}
  #wlSpeed.slow #wlSpeedV{color:var(--steel)}
  #wlSpeedT{font:700 9px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.16em;
    opacity:.55;display:none}
  #wlSpeedT.on{display:block}
  #wlSpeed.lag #wlSpeedT{opacity:.9;color:var(--gold)}
  /* A PHONE IN LANDSCAPE IS 393 px TALL and the pill would sit 104 px into
     it beside a right-hand verb column; it still fits, but the track does not
     need to be desktop-wide to be draggable there. */
  @media (max-height:520px){#wlSpeed input[type=range]{width:104px}}

  /* ---- THE VERB RAIL — what replaced the pop-up screens ----
     A game that never pauses cannot have a modal in it. You can be mid-menu
     and get attacked, and there is nothing in reality that stops the world
     while you read a card. So anything that happens IN THE WORLD — meeting a
     band, reaching a depot — docks a strip of one-word verbs at the bottom of
     the screen and leaves the world running behind it, exactly the way
     systems/interact.js does it for the city and the disaster island. Full
     screens are now only for things that genuinely are a stop: the map, the
     armoury, the end of a run. */
  /* --wl-footer is published by match.js: the height of its own bottom strip,
     measured, republished on every paint. The two used to share z-index 55
     and the same bottom edge, so in a live match the match bar was drawn over
     ATTACK / DEMAND / RIDE AWAY and the encounter could not be answered at
     all. The rail now docks above whatever that bar currently is, and 0px
     when there is no match. */
  /* THE TOP OF THE RAIL'S COLUMN CLEARS THE SPEED PILL, and it had to be
     measured to be believed: on an iPhone SE in a live match the footer is
     ~110 px, the roster body is capped at 34vh, and the whole column grew
     upward until its header sat at y=128 — directly on top of the slider at
     y=130. tools/warlord-fits.mjs's hit test caught it on exactly one of
     seven frames, which is the entire reason that test is a hit test and not
     a bounding box. 158 px is the pill's own bottom edge plus a gap; the body
     inside the rail is a flex child that shrinks and scrolls, so the cost is
     a shorter roster window on the smallest phone and nothing else. The two
     column layouts below put the rail on the right, where it never shares a
     column with the pill, and they take the 46 px back. */
  #verbs{position:fixed;left:0;right:0;z-index:var(--z-verbs);display:none;
    bottom:calc(var(--wl-safe-b) + var(--wl-footer) + 14px);
    top:calc(var(--wl-safe-t) + 158px);
    padding:0 calc(var(--wl-safe-r) + 12px) 0 calc(var(--wl-safe-l) + 12px);
    pointer-events:none}
  /* THE RAIL IS A FLEX COLUMN PINNED TO THE BOTTOM OF WHAT IS LEFT, not a
     block with a guessed max-height. The body used to be capped at a
     percentage of the viewport (42vh) and the head and the verbs added
     themselves on top of that, so on a phone in LANDSCAPE — 393 px of total
     height — the rail was taller than the screen and its own HIDE button sat
     40 px above the top edge. Bounding the whole column and letting the body
     take what is left cannot overflow at any height. */
  #verbs.on{display:flex;flex-direction:column;justify-content:flex-end}
  #verbs .vin{max-width:760px;margin:0 auto;pointer-events:auto;width:100%;
    display:flex;flex-direction:column;min-height:0;max-height:100%}
  /* ONE LINE, and the SUB is the part that gives way. It used to wrap, which
     pushed HIDE onto a line of its own and made the header two rows tall on
     every phone. The name and the toggle are fixed; the middle ellipsises. */
  #verbs .vhead{display:flex;gap:10px;align-items:baseline;flex-wrap:nowrap;flex:0 0 auto;
    margin:0 0 8px;padding:8px 12px;border-radius:12px;
    background:rgba(18,14,9,.82);border:1px solid rgba(255,255,255,.12)}
  #verbs .vhead b{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #verbs .vhead .vsub{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* THE READOUT. The content that used to be a full-screen card lives here
     instead: same tables, same numbers, but capped in height, scrolling
     inside itself, translucent, and — the whole point — sitting in a strip
     that does not cover the world or eat a click meant for the ground. */
  /* NO max-height ON THIS BOX, AND THAT DELETION IS THE FIX FOR THE MOST
     COMMON SCROLL IN THE GAME. It used to be `max-height:min(42vh,340px)`
     (34vh under 420px), which is a guess laid on top of a column that is
     ALREADY bounded: #verbs runs from a fixed top to a fixed bottom, .vin is
     max-height:100% of it, and the head and the verb row are flex:0 0 auto —
     so what is left over is exactly what the body may have, and flex works
     that out with no number from me. The guess was simply smaller than the
     leftover: measured on an iPhone SE, a depot's crate list is 249 px of
     content, the leftover column is 335 px, and the cap handed it 227 and
     made the player scroll 73 px of a list that fit. Two of the four rail
     screens tools/warlord-fits.mjs flagged under rule 5 were this one line.
     -webkit-overflow-scrolling stays: the body still scrolls when a genuinely
     long roster is in it, it is just no longer told to be short first. */
  #verbs .vbody{margin:0 0 8px;padding:10px 12px;border-radius:12px;
    background:rgba(18,14,9,.86);border:1px solid rgba(255,255,255,.12);
    flex:0 1 auto;min-height:0;
    overflow:auto;-webkit-overflow-scrolling:touch}
  #verbs .vbody.hid{display:none}
  #verbs .vbody .wl-row{padding:5px 0}
  #verbs .vbody .wl-lbl{margin:10px 0 5px}
  #verbs .vbody .wl-card{border:0;background:none;padding:0;margin:0 0 6px}
  /* 19 px tall was not a button. Anything a thumb is meant to find is at
     least 30 px on its short side — the fits gate enforces 28. */
  #verbs .vtoggle{appearance:none;border:0;background:none;color:var(--ink);
    opacity:.55;font-size:11px;letter-spacing:.18em;cursor:pointer;
    min-height:30px;padding:2px 8px;margin-left:auto}

  #verbs .vhead b{font-size:16px;letter-spacing:.06em}
  #verbs .vhead .vsub{font-size:11px;letter-spacing:.14em;opacity:.62}
  #verbs .vrow{display:flex;gap:8px;flex-wrap:wrap;flex:0 0 auto}
  #verbs .vbtn{appearance:none;flex:1 1 auto;min-width:96px;
    border:1px solid rgba(255,255,255,.18);border-radius:12px;
    background:rgba(18,14,9,.86);color:var(--ink);
    padding:13px 12px;cursor:pointer;letter-spacing:.1em;font-size:13px;
    display:flex;flex-direction:column;align-items:center;gap:3px}
  #verbs .vbtn:active{transform:translateY(1px)}
  #verbs .vbtn .vk{font-size:10px;opacity:.45;letter-spacing:.18em}
  #verbs .vbtn.hot{border-color:var(--hot);background:rgba(255,138,61,.2);color:#ffd7bd}
  #verbs .vbtn.bad{border-color:var(--blood);background:rgba(196,69,58,.2)}
  #verbs .vbtn[disabled]{opacity:.32;cursor:not-allowed}
  @media (max-width:420px){#verbs .vbtn{min-width:0;flex:1 1 30%;font-size:12px;padding:12px 6px}}

  /* ---- DESKTOP IS NOT A WIDE PHONE ----
     The rail was one layout at every width: a 760 px strip centred at the
     bottom. On a phone that is right — it is thumb-height and it is the whole
     width there is. On a 1500 px desktop it was a slab parked across the
     middle-bottom of the screen, which is precisely where the mouse clicks to
     ride, so the dock ate the click AND covered the thing the decision was
     about. Everything else on this page already lives in a corner (the HUD
     top-left, the compass bottom-centre, the match strip bottom-left), and
     the right edge was empty.

     So above 900 px the rail becomes a right-hand column: the world is
     uncovered, the ground under the cursor stays clickable, the body gets
     the vertical room a roster actually wants instead of a 340 px scroll
     window, and the verbs sit in a 2-up grid at thumb… mouse height. Below
     900 px nothing changes. */
  /* …and the same column on any SHORT viewport wide enough to hold it: a
     phone in landscape is 852x393, so a full-width rail with a body panel
     covers the compass, the zoom buttons and the wardrobe button at once.
     Height is the constraint there, not width. */
  @media (min-width:900px), (min-width:600px) and (max-height:520px){
    #verbs{left:auto;right:0;width:clamp(300px,34vw,400px);
      top:calc(var(--wl-safe-t) + 46px);
      padding:0 calc(var(--wl-safe-r) + 18px) 0 18px}
    #verbs .vin{max-width:none;margin:0}
    #verbs .vbody{max-height:min(58vh,540px)}
    #verbs .vrow{display:grid;grid-template-columns:1fr 1fr}
    #verbs .vbtn{min-width:0}
    /* RIDE AWAY / the last verb takes the full width: it is the way out, and
       a dangling half-width button in a 2-up grid reads as a broken cell. */
    #verbs .vrow .vbtn:last-child:nth-child(odd){grid-column:1 / -1}
  }

  /* A PHONE IN LANDSCAPE IS 393 px TALL, and that is the tightest box this
     rail ever gets. Two columns of six verbs is three rows — measured at 216
     px, which with the header on top came to 320 px in a 312 px rail and put
     RIDE AWAY 32 px below the screen. Three columns is two rows and 160 px,
     and the rail gets a little wider to pay for it. Height, not width, is
     what is scarce here. */
  @media (min-width:600px) and (max-height:520px){
    #verbs{width:clamp(360px,46vw,520px)}
    #verbs .vrow{grid-template-columns:repeat(3,1fr)}
    #verbs .vrow .vbtn:last-child:nth-child(odd){grid-column:auto}
    #verbs .vhead{padding:6px 10px;margin-bottom:6px}
    /* AND THE BODY GOES TWO-UP, for the same reason the full screens do at
       this shape: an 852x393 phone has width to spare and no height at all.
       Measured, the encounter readout is 188 px of content and the column
       left over after the header and two rows of verbs is 102 — so at one
       column the odds bar was 86 px past the fold in the one orientation
       where a player is most likely to be holding the phone in both hands.
       Two columns puts the same readout in ~96. break-inside:avoid keeps a
       bar and its own legend from being cut down the gutter. */
    #verbs .vbody{column-count:2;column-gap:14px;padding:8px 10px}
    #verbs .vbody > *{break-inside:avoid}
    #verbs .vbtn{padding:9px 8px}
  }


  /* ---- THE READOUT'S OWN PARTS ----
     A band used to be described to you in sentences ("210 men, mostly 120
     soldiers, best gun rpg / rocket launcher, 1% — they will destroy you")
     over a twelve-row scrolling table of "1 RAIDER · RPG / ROCKET LAUNCHER ·
     PLATE RIG". That is a spreadsheet of an army, and it is the wrong shape
     for a decision you make in three seconds with men riding at you. These
     four primitives say the same things as a picture: one bar for the odds,
     one stacked bar for what they are made of, and chips for what they are
     carrying. */
  .wl-split{display:flex;height:12px;border-radius:7px;overflow:hidden;
    background:rgba(255,255,255,.1);margin:2px 0 7px}
  .wl-split i{display:block;height:100%}
  .wl-ends{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;opacity:.62}
  .wl-verdict{font-size:clamp(15px,3.4vw,19px);letter-spacing:.02em;margin:7px 0 2px}
  .wl-verdict b{font-size:1.35em;font-variant-numeric:tabular-nums}
  .wl-stack{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:2px 0 7px;
    background:rgba(255,255,255,.07)}
  .wl-stack i{display:flex;align-items:center;justify-content:center;height:100%;
    font-size:10px;letter-spacing:.1em;color:#1a1206;font-weight:800;overflow:hidden}
  .wl-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;letter-spacing:.1em;opacity:.72}
  .wl-legend span{display:flex;align-items:center;gap:5px}
  .wl-legend em{width:8px;height:8px;border-radius:2px;font-style:normal;display:inline-block}
  .wl-chips{display:flex;flex-wrap:wrap;gap:6px}
  .wl-chip{border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:4px 10px;
    font-size:11px;letter-spacing:.1em;background:rgba(255,255,255,.04)}
  .wl-chip b{font-variant-numeric:tabular-nums}
  .wl-chip.arm{border-color:rgba(127,168,200,.45);color:#cfe2f0}

  /* ---- A UNIT CHIP: ONE STACK OF MEN, TINTED BY WHAT THEY ARE ----
     The roster behind INSPECT and the loot line in the aftermath were both
     full-width `.wl-row`s — one row per stack, 34 px each, border under every
     one. A 210-man band groups into ~30 stacks, which is 1 020 px of table on
     a 667 px phone and was the single largest scroll in the game (measured:
     2 053 px of content in a 667 px box).

     A stack is three short facts and they do not need a row each. As a chip
     that wraps, the same thirty stacks are ~14 rows of 22 px instead of 30
     rows of 34, and the tier — the fact that actually decides whether you
     fight — is carried by the left edge's COLOUR rather than by its name
     being spelled out again on every line. The blue dot is armour. */
  .wl-units{display:flex;flex-wrap:wrap;gap:5px}
  .wl-unit{display:flex;align-items:baseline;gap:5px;border:1px solid rgba(255,255,255,.12);
    border-left:3px solid var(--c,#8d8267);border-radius:7px;padding:3px 7px;
    font-size:10px;letter-spacing:.06em;background:rgba(255,255,255,.03)}
  .wl-unit b{font-variant-numeric:tabular-nums;font-size:12px}
  .wl-unit i{font-style:normal;opacity:.55}
  .wl-unit u{width:6px;height:6px;border-radius:2px;background:var(--steel);
    display:inline-block;text-decoration:none}

  /* ---- A NAME, AND NOTHING ELSE ----
     The aftermath printed every dead man as a `.wl-row` carrying his tier,
     his gun and his kill count. Nine dead was 300 px of table. The point of
     naming the dead is the NAME — core.js gives every man one for exactly
     this screen — and the rest is a stat block on a corpse. Wrapped, a
     nine-man casualty list is two lines. */
  .wl-names{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;letter-spacing:.02em;line-height:1.5}
  .wl-names span{white-space:nowrap}
  .wl-names .dead{color:var(--blood)}
  .wl-names .gold{color:var(--gold)}
  .wl-names .hurt{color:#ffc9c4;opacity:.72}
  .wl-names em{font-style:normal;opacity:.45;font-size:10px;letter-spacing:.12em}

  /* ---- THE AFTERMATH IS THE DENSEST SCREEN IN THE GAME ----
     It carries two casualty bars, the dead by name, the promotions, the take
     and every prisoner decision, and it has to do it in 667 px. The shell's
     default rhythm (18 px above every label, 40 px buttons) is right for a
     screen with four things on it and costs ~140 px on this one, which is the
     difference between fitting an iPhone SE and not. Scoped to .wl-aft so
     nothing else in the game gets tighter by accident. */
  .wl-aft .wl-h{margin:0 0 2px}
  .wl-aft .wl-sub{margin:0 0 9px}
  .wl-aft .wl-lbl{margin:11px 0 5px}
  .wl-aft .wl-stack{margin:2px 0 4px}
  .wl-aft .wl-chips{gap:5px}
  .wl-aft .wl-chip{padding:3px 8px;font-size:10px}
  .wl-aft .wl-legend{font-size:10px;gap:3px 10px}
  .wl-aft .wl-names{line-height:1.4}
  .wl-aft .wl-btns{gap:6px;margin-top:8px}
  .wl-aft .wl-btns .wl-btn{padding:8px 10px;font-size:11px;letter-spacing:.05em}
  .wl-aft .wl-btns.out{margin-top:14px}
  .wl-aft .wl-btns.out .wl-btn{padding:12px 18px;font-size:13px}
  /* the label IS the toggle — a separate ONE BY ONE button cost a whole 49 px
     row to say what an arrow on the heading says for nothing */
  .wl-aft .lblbtn{appearance:none;border:0;background:none;color:inherit;cursor:pointer;
    padding:0;font:inherit;display:flex;width:100%;justify-content:space-between;
    align-items:center;min-height:30px}
  .wl-aft .prow{display:flex;gap:8px;align-items:center;justify-content:space-between;
    padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .wl-aft .prow:last-child{border-bottom:0}
  .wl-aft .prow .who{font-size:12px;letter-spacing:.03em;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wl-aft .prow .acts{display:flex;gap:5px;flex:0 0 auto}
  .wl-aft .prow .acts .wl-btn{padding:7px 8px;font-size:10px;letter-spacing:.06em}

  /* ---- A PHONE IN LANDSCAPE IS 393 px TALL ----
     Which is 330 px of usable screen once #stage has cleared the notch and
     the home bar, and there is no amount of copy-cutting that puts an
     aftermath — two casualty bars, the dead by name, the take, and every
     prisoner decision — into 330 px of a ONE-COLUMN page. It was 185 px past
     the fold there while fitting every portrait frame with room to spare.

     The screen is not short of ROOM in that frame, it is short of HEIGHT: it
     has 852 px of width and is using 860 of them for a 640 px column. So on a
     short, wide viewport the page becomes two columns and the same content is
     half as tall. CSS columns rather than a grid because these screens are
     flat lists of siblings built by four different files — a grid would need
     every one of them to declare a cell, and the next screen somebody writes
     would silently not get one.

     break-inside:avoid on every direct child is what stops a card, a button
     row or a casualty bar being cut in half down the column gutter; without
     it the first draft split THE DEAD across the fold, which is worse than
     scrolling. Opted into by wrapper class, not applied to #stage .in
     wholesale, because territory.js's map is a canvas in there and a canvas
     in a column box is a resize bug waiting to happen. */
  @media (max-height:560px) and (min-width:700px){
    .wl-aft, .wl-ev, .wl-ch, .wl-cols{column-count:2;column-gap:22px}
    .wl-aft > *, .wl-ev > *, .wl-ch > *, .wl-cols > *{break-inside:avoid}
    .wl-aft .wl-h, .wl-ev .wl-h, .wl-ch .wl-h, .wl-cols .wl-h{column-span:all}
    /* A FLEX BOX CANNOT FRAGMENT, and that is why the first draft of this
       rule only half worked. `.wl-units` (thirty stack chips) and `.wl-names`
       (the dead) are flex containers, so the column algorithm treats each as
       ONE unbreakable block: the roster went from 2 053 px to 543 px and then
       stopped, with a 300 px slab of chips sitting in column one and column
       two empty under a short list. As a block box with inline-flex children
       they fragment like text and the columns fill evenly — measured 543 ->
       231 px on an 852x393 phone. Only at this shape; everywhere else the
       flex wrap is the better layout. */
    .wl-units, .wl-names{display:block}
    .wl-unit{display:inline-flex;margin:0 4px 4px 0;vertical-align:top}
    .wl-names span{margin-right:9px}
    .wl-cols > .wl-units, .wl-aft > .wl-names{break-inside:auto}
  }
  /* AND THREE COLUMNS ON A FULL-WIDTH PHONE IN LANDSCAPE. 852 px of width
     against 393 px of height is the most extreme aspect this game is ever
     held at, and two columns still left the armoury 41 px and the roster
     150 px past the fold. Three is ~260 px a column, which is wider than the
     phone is in portrait — nothing here is being squeezed, it is being
     unstacked. */
  @media (max-height:470px) and (min-width:820px){
    .wl-aft, .wl-ev, .wl-ch, .wl-cols{column-count:3;column-gap:16px}
    /* THE HEADING SPANS ALL THREE COLUMNS, so it is the one block on the page
       whose height is NOT divided by three — 40 px of a 292 px box for a
       title. clamp(22px,6vw,40px) reads 40 px here because the viewport is
       852 px WIDE; 6vw is the wrong unit in the one orientation where width
       is not the scarce thing. */
    .wl-aft .wl-h, .wl-ev .wl-h, .wl-ch .wl-h, .wl-cols .wl-h{font-size:21px;margin:0 0 5px}
    .wl-aft .wl-sub, .wl-ev .wl-sub, .wl-ch .wl-sub, .wl-cols .wl-sub{margin-bottom:8px}
    /* and a card in a 260 px column does not need 14 px of side padding */
    .wl-aft .wl-card, .wl-ev .wl-card, .wl-ch .wl-card, .wl-cols .wl-card{padding:9px 11px;margin-bottom:8px}
  }

  /* THE FURNITURE THAT BELONGS TO THE CAMPAIGN, hidden while a screen owns
     the interface — see ctx.screen(). Listed by id rather than by a class on
     each element because these are built by four different modules and a
     rule they all have to remember is a rule one of them will not. */
  body.wl-screen #wlCampHud,
  body.wl-screen #wlWardBtn,
  body.wl-screen #wlSpeed,
  body.wl-screen #verbs{display:none !important}
  /* AND THE RIGHT-HAND FURNITURE GOES WHEN THE RAIL IS A RIGHT-HAND COLUMN.
     Above 900 px (and on any short viewport wide enough) the verb rail stops
     being a bottom strip and becomes a column pinned to the right edge —
     which is exactly where campaign.js puts its MAP button (+52) and its zoom
     pair (+100). tools/warlord-fits.mjs's hit test caught all three coming
     back as #vBody / #vToggle on an 852x393 phone: they were drawn, they were
     inside the viewport, and a thumb landing on any of them pressed the rail.

     A control drawn underneath another control is worse than an absent one,
     because the player aims at it. #stage already takes the whole interface
     for the same reason (body.wl-screen, above); a right-hand rail takes the
     right edge. On a portrait phone the rail is a bottom strip, shares no
     column with them, and nothing here applies. */
  @media (min-width:900px), (min-width:600px) and (max-height:520px){
    body.wl-rail #wlMapBtn,
    body.wl-rail #wlIn,
    body.wl-rail #wlOut{display:none !important}
  }
  /* #wlSpeed is in that list and #hud carries the truth instead: the speed
     chip in the strip is the ONE thing that follows you into the armoury,
     because at 8x a screen is not a stop — it is eight times the wages. The
     slider itself would land on top of the map's own controls at that exact
     coordinate, and the keyboard (, .) still reaches it from a screen. */
  /* #wl-match deliberately STAYS. The whole design is that the clock never
     pauses, so hiding the countdown behind the armoury would be the interface
     telling the player the lie the engine refuses to tell. #stage pads its
     bottom by --wl-footer instead, so the strip sits over empty page rather
     than over the last row of controls. */

  /* ---- toasts ---- */
  #toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
    z-index:var(--z-toast);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
  .toast{background:rgba(18,14,9,.9);border:1px solid rgba(255,255,255,.14);border-radius:11px;
    padding:8px 14px;font-size:13px;letter-spacing:.05em;animation:tin .2s ease-out}
  .toast.bad{border-color:var(--blood);color:#ffc9c4}
  .toast.good{border-color:#5aa86a;color:#c9ffd4}
  @keyframes tin{from{opacity:0;transform:translateY(6px)}}

  body.coarse .wl-btn{padding:14px 17px}
</style>
</head>
<body>
<div id="boot">
  <h1>DESERT <em>WARLORD</em></h1>
  <div id="bootbarwrap"><div id="bootbar"></div></div>
  <div id="bootst">OPENING THE STUDIO</div>
</div>
<div id="hud"></div>
<div id="wlSpeed">
  <input id="wlSpeedR" type="range" min="0" max="8" step="1" value="2" aria-label="GAME SPEED">
  <b id="wlSpeedV">1×</b>
  <span id="wlSpeedT"></span>
</div>
<div id="stage"></div>
<div id="verbs"></div>
<div id="toasts"></div>

<script src="../src/core/studio.js?v=warlord1"></script>
<script>
"use strict";
(function () {
const el = function (id) { return document.getElementById(id); };
const bootst = function (t) { const n = el("bootst"); if (n) n.textContent = t; };
const CBZ = window.CBZ = window.CBZ || {};
const Q = new URLSearchParams(location.search);

/* ============================================================ LOAD
   Three lists, in three shapes, for three reasons.

   NEED is studio packs — the engine. `people` and `ragdoll` are what make a
   man a man and a corpse a corpse; `fx`, `damage`, `sound`, `batch` are the
   war. `caps` is the quality tier. This page does NOT load `beasts` or
   `bestiary`: there are no animals in this game and forty files of bestiary
   on a phone's first load is forty files nobody asked for.

   ARMOURY is loaded verbatim from the same place games/battle.html loads it,
   for exactly the same reason: the guns in this game are the repo's guns, and
   a second copy of a rifle is how two files start disagreeing about what a
   rifle does. Every one of these is engine source; this page adds nothing to
   any of them.

   WARLORD is the game — the only genuinely new code on the page. */
/* ============================================================ THE DEAD
   DECLARED BEFORE THE LOAD, AND THAT ORDERING IS THE WHOLE POINT.

   These four lines sat inside start() for six commits and did nothing at all.
   city/ragdoll.js opens with `if (CFG.RAGDOLL_ANY_MODE == null) CFG.
   RAGDOLL_ANY_MODE = false;` — it is loaded by studio.need() as part of the
   `ragdoll` pack, so by the time start() ran the value was already false, the
   `== null` guard never fired, and EVERY MAN IN EVERY BATTLE FELL LIKE A
   PLANK. The page was asking for real corpses politely, after the answer had
   already been given. battle.html declares the same flags above its own load
   for exactly this reason; this page copied the values and not the position,
   which is the more expensive half.

   Found by battle.js's own probe reporting `solving: 0` — a number nobody
   would have thought to look at, on a page whose screenshots all looked fine.

   WHY THE BUDGETS DIFFER FROM THE CITY'S. quadruped_ragdoll and city/ragdoll
   were both sized for a camera standing IN a fight, where only a handful of
   deaths can ever be near you. This game flies a camera over an ARMY and a
   whole rank goes down in the same second, so the caps are ceilings rather
   than allocations: the pool grows only as bodies actually arrive, and the
   active cap freezes the OLDEST settling corpse rather than refusing a fresh
   one. Every number here is a ?cfg_* away from the shipped default. */
CBZ.CONFIG = CBZ.CONFIG || {};
if (CBZ.CONFIG.RAGDOLL_ANY_MODE == null) CBZ.CONFIG.RAGDOLL_ANY_MODE = true;
if (CBZ.CONFIG.RAGDOLL_RANGE == null) CBZ.CONFIG.RAGDOLL_RANGE = 170;
if (CBZ.CONFIG.RAGDOLL_ACTIVE == null) CBZ.CONFIG.RAGDOLL_ACTIVE = 28;
if (CBZ.CONFIG.RAGDOLL_POOL == null) CBZ.CONFIG.RAGDOLL_POOL = 110;
CBZ.ragdollDriven = true;

const NEED = ["caps", "people", "ragdoll", "fx", "damage", "sound", "batch"];
const ARMOURY = [
  "weapons/weapon-data.js",
  "weapons/weapon-scale.js",
  "weapons/appearances/sidearm.js", "weapons/appearances/shotgun.js",
  "weapons/appearances/carbine.js", "weapons/appearances/smg.js",
  "weapons/appearances/revolver.js", "weapons/appearances/deagle.js",
  "weapons/appearances/ak47.js", "weapons/appearances/uzi.js",
  "weapons/appearances/sniper.js", "weapons/appearances/lmg.js",
  "weapons/appearances/bazooka.js", "weapons/appearances/taser.js",
  "weapons/appearances/glauncher.js",
  "systems/actorweapons.js",
  "systems/gunfx.js",
  "systems/combat_iq.js",
  "systems/wounds.js",
];
/* THE REPO'S OWN VILLAGE HUTS, and they are the reason an outpost has houses
   in it rather than four more boxes. city/villagekit.js registers hut_round,
   hut_square, shack_lean, well and stall_market — mud-brick and adobe
   dwellings with a slab roof, a doorway gap you can walk through and a made
   bedroll on the floor, at 3-4 m, which is rural scale and not city scale.

   IT IS THE ONLY HOUSE IN THIS REPO THAT WILL RUN ON THIS PAGE, and the
   search that established that is written up in props.js's houseKit(). The
   short version: city/facades/* (desertmod, adobe, ranch, spanish) emit only
   through a ctx minted inside city/buildings.js — 9 000 lines plus
   BufferGeometryUtils plus furniture.js — and the thing they dress is a
   22 m x 16 m four-storey shell, which is an office, not a house at a well.
   world/desertcity.js adds itself to the scene and its smallest structure is
   a 22 m blast shelter. city/construction.js returns at line 81; it has been
   dead since systems/building.js replaced it.

   villagekit needs city/assets.js (a self-contained registry: THREE and CBZ
   and nothing else) and CBZ.cmat, which the `look` pack already puts on this
   page. Two files, ~830 lines, no city world. They load BEFORE the warlord
   modules because props.js asks the registry for a hut at build time. */
const WARLORD = [
  "city/assets.js",        // the asset registry villagekit defines into
  "city/villagekit.js",    // mud-brick huts at 3-4 m — the repo's own houses
  "warlord/core.js",       // the state. Everything below reads it; nothing below redefines it.
  "warlord/camo.js",       // procedural camo patterns — outfits.js consumes it
  "warlord/outfits.js",    // every army's own painted uniform
  "warlord/wardrobe.js",   // YOUR fit: army dress, the black suit, a general's coat
  "warlord/sand.js",       // where a foot actually rests, and what it leaves behind
  "warlord/props.js",      // the object library both layers draw from
  "warlord/desert.js",     // the island
  "warlord/mounts.js",     // horses, camels, technicals — campaign speed AND cavalry
  "warlord/territory.js",  // who owns what, and the map that shows it
  "warlord/campaign.js",   // riding it, and the parties that ride it too
  "warlord/army.js",       // the roster, the encounter, the aftermath
  "warlord/gunplay.js",    // the engine's own shooting, mounted — not a fork
  "warlord/battle.js",     // the actual war
  "warlord/outpost.js",    // depots and camps
  "warlord/loadout.js",    // who carries what
  "warlord/events.js",     // everything else that can happen, and the endgame
  "warlord/feel.js",       // sound, impact, and the mixer that makes 300 rifles a war
  "warlord/warnet.js",     // TRANSPORT: sockets, host election, snapshot/apply
  "warlord/match.js",      // THE RULES OF THE MATCH: lobby, clock, diplomacy, victory
];
/* THE ORDER HERE IS EXECUTION ORDER, NOT DEPENDENCY ORDER, and the difference
   matters. These files only DECLARE themselves — W.module() registers a name
   and a boot function and does nothing else — so the real ordering happens in
   bootModules(), which walks each module's own `needs` and topologically
   sorts them. That is deliberate: a hand-maintained load order is a list that
   rots the moment somebody adds a file, and this page has thirteen of them.
   core.js is first of the warlord files because it is the only one that has
   to be; the two city/ files sit above it because they are not warlord
   modules at all — they define into CBZ.assets at load, and props.js reads
   that registry when it builds a hut. */

const PLAN = CBZ.studio.plan(NEED);
let TOTAL = PLAN.files.length + ARMOURY.length + WARLORD.length;
let got = 0;
function bar(label) {
  const b = el("bootbar");
  if (b) b.style.width = Math.round(got / Math.max(1, TOTAL) * 100) + "%";
  if (label) bootst(label + "  " + got + "/" + TOTAL);
}
CBZ.studio.onProgress(function (p) {
  got++;
  bar(p.file.replace(/^.*\//, "").replace(/\.js$/, "").toUpperCase());
});

/* ORDERED EXECUTION, PARALLEL DOWNLOAD — battle.html's own trick, and it is
   the difference between a 31-round-trip boot and a one-round-trip boot on a
   hop-per-file host. `async=false` on an appended script is the spec's
   "execute in order as soon as possible" list. Safe here because none of
   these files calls addLandmass, so no file depends on being alone in flight.
   An optional file that 404s must not take the page with it — a missing
   warnet.js should cost you multiplayer, not the game. */
function loadBatch(list, label, optional) {
  return new Promise(function (resolve) {
    let left = list.length;
    if (!left) return resolve();
    list.forEach(function (rel) {
      const s = document.createElement("script");
      s.src = CBZ.studio.root + rel;
      s.async = false;
      const tick = function () { got++; bar(label); if (--left === 0) resolve(); };
      s.onload = tick;
      s.onerror = function () {
        console.warn("[warlord] failed:", rel);
        if (!optional) console.error("[warlord] that file was required");
        tick();
      };
      document.head.appendChild(s);
    });
  });
}

bootst("OPENING THE STUDIO");
CBZ.studio.warm(ARMOURY.concat(WARLORD));
CBZ.studio.prefetch(NEED);

CBZ.studio.need(NEED)
  .then(function () { bootst("OPENING THE ARMOURY"); return loadBatch(ARMOURY, "ARMOURY"); })
  .then(function () { bootst("RAISING THE ISLAND"); return loadBatch(WARLORD, "WARLORD", true); })
  .then(start);

/* ============================================================ START */
function start() {
  const THREE = window.THREE;
  const W = CBZ.warlord;
  if (!W) { bootst("warlord/core.js did not load"); return; }

  /* ---- the shims that let the shared combat brain run out here ----
     Identical in kind to games/battle.html's three, and for the identical
     reason: combat_iq, ordnance and the two ragdoll solvers ask the CITY for
     services (colliders, the floor, a circle resolve) and the city is not on
     a slice page. Route the NAME to microboot's equivalent; never fork the
     file that asks. Which ground `floorAt` means depends on the phase, so it
     asks the modules rather than closing over one. */
  if (!CBZ.queryCollidersNear) {
    CBZ.queryCollidersNear = function (x, z, r, out) { return CBZ.micro.queryColliders(x, z, r, out); };
  }
  if (CBZ.now == null) CBZ.now = performance.now();
  if (!CBZ.floorAt) {
    CBZ.floorAt = function (x, z) {
      const B = W.battle;
      if (B && B.live && B.live() && B.groundAt) return B.groundAt(x, z);
      if (W.desert && W.desert.heightAt) return W.desert.heightAt(x, z);
      return 0;
    };
  }
  if (!CBZ.collide) {
    CBZ.collide = function (p, r, yLo, yHi) {
      return CBZ.micro.resolveCircle(p, r || 0.2, yLo == null ? p.y : yLo,
        Math.max(0.1, (yHi == null ? p.y + 0.2 : yHi) - (yLo == null ? p.y : yLo)));
    };
  }
  const COARSE = CBZ.studio.touchDevice;
  if (COARSE) document.body.classList.add("coarse");

  /* ---- one canvas, one loop, for the whole game ---- */
  /* ONE SKY AND ONE SUN, AND IT TOOK TWO AGENTS TO NOTICE.

     This page used to call micro.boot(), then micro.sky(), then
     micro.lights(). boot() ALREADY RAISES BOTH unless you tell it not to
     (`if (opts.sky !== false) micro.sky(...)`, same for lights), so the
     island was lit by two hemispheres and two suns under two nested sky
     domes — measured in the live scene: hemi [0.62, 0.37], dir [1.05, 0.79],
     domes 2, for 2.82x the intended exposure into an ACES curve.

     NOTHING LOOKED BROKEN, which is why it survived. It looked BLEACHED, and
     bleached is a thing you accept as a style. What it actually cost is the
     top half of the tonal range: at 2.82x, a dune albedo of 0.34 renders at
     sRGB 234 and a lit crest at 0.52 renders at 242 — eight levels apart, so
     the dunes had no shape and every sand-coloured thing in the game was the
     same white. Two separate agents independently measured this while
     authoring content (props.js first, then camo.js) and BOTH worked around
     it by hand-darkening their palettes, which is exactly how a bad default
     spreads: every author pays for it separately and none of them can fix it.

     So the sky and the lights are boot()'s parameters now, which is what they
     always were. Anything authored against the old exposure has to be
     re-tuned against this, and that is the correct direction of travel.

     THE AIR IS THE PLACE: the far plane is 16 km because the island is 14 km
     across and its far shore has to be something you SEE from a dune, not
     something that fades in as you ride. The fog colour is derived by
     micro.sky from its own horizon — never type a fog colour twice. */
  CBZ.micro.boot({
    /* NEAR 0.1, AND THE GUN IN YOUR HANDS IS THE ONLY REASON.

       microboot defaults near to 0.35 m. systems/fpsmode.js hangs its
       viewmodel off the camera at z = -0.31 — measured, that is the
       knuckle ridge at (0, 0.075, -0.31) — so at the default the weapon
       sits 4 cm INSIDE the near plane and is clipped away entirely. The
       audit said armed, gun sidearm, 17/17 in the mag, reticle dead centre;
       the screenshot showed empty hands. Nothing was broken except that the
       thing was being drawn behind the lens.

       city/scene.js has used 0.1 since the beginning and says why in its own
       comment — "camera children are used for first-person viewmodels" —
       which is the file fpsmode was written against. Matching it rather than
       inventing a third number.

       The cost is honest and worth stating: near 0.1 against a 16 km far
       plane is a 160,000:1 depth ratio where the city runs 10,000:1, so
       distant coplanar surfaces have less depth resolution to argue with.
       The island's own far geometry is terrain and a sea plate nine metres
       below it, which is not a close call at any range. */
    near: 0.1,
    far: 16000,
    sky: { top: 0x4478ad, bottom: 0xe6cda1, fogNear: 1400, fogFar: 11000, radius: 15000 },
    lights: { skyColor: 0xcfe0f2, groundColor: 0xbf9a5e, sunColor: 0xfff1cf,
              sun: 1.12, hemi: 0.5, shadowSpan: 260 },
  });

  const ctx = {
    THREE: THREE, CBZ: CBZ, W: W,
    scene: CBZ.scene, micro: CBZ.micro,
    coarse: COARSE, Q: Q,
    el: el, stage: el("stage"), hud: el("hud"),
  };
  CBZ.warlordCtx = ctx;

  /* ---- the toast surface, wired once ---- */
  W.on("toast", function (t) {
    const box = el("toasts");
    if (!box) return;
    const n = document.createElement("div");
    n.className = "toast " + (t.kind || "");
    n.textContent = t.text;
    box.appendChild(n);
    setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 2600);
  });

  /* ---- the strip. It is on for everything that happens on the island and
         off for the battle, which draws its own. ---- */
  function paintHud() {
    const h = el("hud");
    if (!h) return;
    const S = W.state;
    const p = W.phase();
    const show = p === "campaign" || p === "encounter" || p === "outpost" || p === "armoury";
    h.classList.toggle("on", show);
    if (!show) return;
    const C = W.clock;
    h.innerHTML =
      '<b>' + (S.army.length + 1) + ' MEN</b>' +
      '<span class="chip wl-gold">$' + S.gold + '</span>' +
      '<span class="chip">DAY ' + S.day + '</span>' +
      '<span class="chip wl-dim">-$' + W.payroll() + '/DAY</span>' +
      (S.prisoners.length ? '<span class="chip">' + S.prisoners.length + ' PRISONERS</span>' : '') +
      /* THE ONE THING THAT OUTRANKS A SCREEN. The slider is campaign
         furniture and hides under the armoury; this chip does not, because a
         day at 8x costs eight days of wages while you are reading a roster
         and the strip is where DAY and -$/DAY already are. Absent at 1x on
         purpose: a readout that is always there is furniture, and a readout
         that appears only when something is true is information. */
      (C.scale() !== 1 ? '<span class="chip" style="color:var(--hot)">' + C.label() + '</span>' : '');
    /* PUBLISH THE STRIP'S REAL HEIGHT, ON THE NEXT FRAME AND NOT NOW.
       #stage needs to clear this thing and used to guess 46 px, which is the
       one-line form; events.js wraps this very function and APPENDS its own
       chips (loyalty, the four warlords) immediately after it returns, which
       wraps the strip to two rows. Measuring synchronously here reads the
       height before that append and publishes 46 forever — which is exactly
       what the phone screenshot showed: "SAND BANDITS" printed through
       "0/4 WARLORDS". A rAF puts the read after every same-task appender,
       whoever they turn out to be, without this file having to know about
       them. The measured value is the content BELOW the safe-area inset,
       because the screens pad for that inset themselves. */
    requestAnimationFrame(function () {
      const hh = Math.max(0, h.offsetHeight -
        (parseFloat(getComputedStyle(document.documentElement)
          .getPropertyValue("--wl-safe-t")) || 0));
      if (hh > 0) document.documentElement.style.setProperty("--wl-hud", Math.round(hh) + "px");
    });
  }
  W.on("phase", paintHud);
  W.on("army", paintHud);
  W.on("gold", paintHud);
  W.on("dawn", paintHud);
  W.on("clock", paintHud);
  ctx.paintHud = paintHud;

  /* ============================================================ THE SPEED
     THE SLIDER, THE KEYBOARD, AND THE LOOP THAT OBEYS THEM.

     THREE THINGS HAD TO BE TRUE BEFORE A SLIDER COULD EXIST, and none of them
     is the slider.

     1. A BIG dt IS NOT MANY SMALL ONES. Handing the frame's dt × 64 to the
        world is how a man walks through a mesa and how two men resolve out
        of each other in the wrong direction. So core/microboot.js's tick()
        now splits the frame into SUBSTEPS of at most W.clock.MAX_STEP and
        runs the whole hook chain once per substep. Nothing downstream was
        told about the speed at all; every integrator still gets a step the
        size it was tuned against. 1/30 s is finer than the clamp every one
        of them already imposes on itself.

     2. THREE FILES KEPT THEIR OWN CLOCK. campaign.js's worldTick (the day,
        the wages, every band walking), battle.js's frame and events.js's
        weather all read performance.now() directly and threw the loop's dt
        away — deliberately, so a slow machine would not run the world in
        slow motion. Multiplying a dt they do not read would have moved
        nothing the owner asked to see. All three now ask W.clock.now(),
        which is the same monotonic millisecond count with the speed in it.

     3. A SLOW MACHINE MUST FALL BEHIND, NOT FREEZE. Substepping is unbounded
        work per frame, so the loop carries a wall budget (BUDGET_MS) and
        stops substepping when it is spent. That is why the readout reports
        the ACHIEVED rate as well as the asked-for one: at 64x on a laptop
        with three hundred men in a battle the honest answer is not 64.

     THE PLAYER STANDING STILL IS THE POINT. He does not need sixty rendered
     frames of not walking; he needs the island to have moved. So the frame
     still draws exactly once — the substeps are the world advancing, not
     sixty-four pictures of it. */
  (function speedControl() {
    const C = W.clock;
    const box = el("wlSpeed"), slider = el("wlSpeedR"),
          val = el("wlSpeedV"), tag = el("wlSpeedT");
    if (!box || !slider) return;

    /* ONE CLOCK, ASKED — NOT COPIED. The loop does not hold a scale of its
       own that something has to remember to keep in step; it holds a
       reference to the function that owns the number. There is exactly one
       time scale in this game and it lives in core.js. */
    CBZ.micro.simClock = C.now;
    CBZ.micro.maxStep = C.MAX_STEP;
    CBZ.micro.maxSubsteps = C.MAX_SUB;
    CBZ.micro.stepBudgetMs = C.BUDGET_MS;

    slider.max = String(C.SPEEDS.length - 1);
    slider.value = String(C.index());

    function paint() {
      /* A HOLD OUTLIVING ITS REASON IS A CONTROL THAT NEVER COMES BACK. The
         match takes the hold in begin() and drops it in end(); if a match is
         neither live nor over the hold is stale, so it is re-derived here
         rather than trusted. */
      if (C.heldFor() === "MATCH" && W.match && W.match.live &&
          !W.match.live() && !(W.matchState && W.matchState.over)) C.release("MATCH");
      const held = C.heldFor();
      const s = C.scale();
      slider.disabled = !!held;
      if (slider.value !== String(C.index())) slider.value = String(C.index());
      val.textContent = C.label();
      box.classList.toggle("fast", s > 1);
      box.classList.toggle("slow", s < 1);
      /* THE SECOND TAG ONLY SAYS THINGS THE FIRST ONE CANNOT. Held: name the
         holder. Falling behind by more than a fifth: name the real rate. */
      const ach = C.achieved();
      const lag = !held && s > 1 && ach < s * 0.8;
      box.classList.toggle("lag", lag);
      const t = held ? held : lag ? C.label(Math.max(1, Math.round(ach))) + " REAL" : "";
      tag.textContent = t;
      tag.classList.toggle("on", !!t);
    }

    slider.addEventListener("input", function () { C.setIndex(+slider.value); });
    /* A DRAG ON THE TRACK MUST NOT ALSO BE A CLICK ON THE GROUND. The
       campaign reads pointerdown on the window to set a ride destination, so
       without this every speed change also ordered the warlord to walk into
       the sea. */
    ["pointerdown", "pointerup", "click", "touchstart"].forEach(function (e) {
      box.addEventListener(e, function (ev) { ev.stopPropagation(); }, true);
    });

    /* THE KEYBOARD IS THE SAME ONE NUMBER. , and . are the < and > keys —
       the marks every media transport in the world uses for slower and
       faster — and 0 is the way back to real time. Digits 1-5 belong to the
       verb rail and 1-4 to battle orders, so 0 is the only digit free.
       Ignored while something is being typed into, because the multiplayer
       lobby has a name field. */
    window.addEventListener("keydown", function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA") && t !== slider) return;
      if (e.code === "Comma") { e.preventDefault(); C.nudge(-1); }
      else if (e.code === "Period") { e.preventDefault(); C.nudge(1); }
      else if (e.code === "Digit0") { e.preventDefault(); C.setScale(1); }
    });

    W.on("clock", paint);
    W.on("phase", function () {
      const p = W.phase();
      box.classList.toggle("on",
        p === "campaign" || p === "encounter" || p === "outpost" || p === "armoury");
      paint();
    });

    /* THE LOOP REPORTS WHAT IT ACTUALLY DELIVERED, once per drawn frame.
       Order 1000 is after everything including feel.js's mixer at 900, so
       micro.simDt is final. */
    /* THE ACHIEVED RATE IS MEASURED AGAINST THE UNCLAMPED WALL CLOCK, and it
       had to be told to: micro.frameDt is clamped at 0.1 s (a backgrounded
       tab must not hand a hook forty seconds), so on a 10 fps machine a
       230 ms frame reported 100 ms and the readout claimed the loop was
       running at 2.3x while sitting at 1x. The ratio is game seconds
       delivered over REAL seconds spent, and nothing in the middle may
       protect either number. */
    let paintN = 0, lastWall = 0;
    CBZ.micro.onFrame(function () {
      if (!CBZ.micro.drawing) return;
      const w = C.wall();
      if (lastWall) C.deliver(CBZ.micro.simDt, (w - lastWall) / 1000);
      lastWall = w;
      if (++paintN % 15 === 0) paint();
    }, { order: 1000, id: "warlord-speed" });

    /* ?speed=N boots straight into a rate. Every tool that measures this
       feature needs to state it in a URL rather than reach into the page. */
    const q = parseFloat(Q.get("speed"));
    if (q > 0) C.setScale(q);
    paint();
  })();

  /* ---- the stage helper every screen uses instead of touching innerHTML ---- */
  /* ONE OWNER OF THE SCREEN, ENFORCED HERE INSTEAD OF REMEMBERED EVERYWHERE.
     CONTRACT.md already says exactly one module owns the screen at a time and
     names two-modules-at-once as the failure this exists to stop — but it
     said it about SCENE objects, and nothing enforced it for DOM. So opening
     the map while standing at an outpost left three live layers stacked: the
     map over the outpost's screen over the outpost's verb rail, with the
     campaign's own floating buttons on top of all of it. Measured across the
     device frames: 9 of 12 controls on the map screen were either covered by
     something or answering for a layer the player could no longer see.

     A screen therefore takes the WHOLE interface: the rail closes, and the
     campaign's floating furniture (the map button, the wardrobe button) is
     hidden for as long as the screen is up. `body.wl-screen` is the switch,
     so a module that adds a new floating control opts into the rule with one
     CSS line instead of remembering to hide itself. */
  ctx.screen = function (html) {
    const s = el("stage");
    if (ctx.closeVerbs) ctx.closeVerbs();
    document.body.classList.add("wl-screen");
    s.classList.add("on");
    s.innerHTML = '<div class="in">' + html + '</div>';
    s.scrollTop = 0;
    return s;
  };
  ctx.closeScreen = function () {
    const s = el("stage");
    document.body.classList.remove("wl-screen");
    s.classList.remove("on");
    s.innerHTML = "";
  };

  /* ============================================================ THE VERBS
     ctx.verbs({title, sub, options:[{label, note, key, kind, disabled, on}]})

     THE REPLACEMENT FOR THE POP-UP, and the argument for it is one sentence:
     you cannot be mid-menu and get attacked. This game's clock never stops —
     that is the whole multiplayer design — so a modal screen over a live
     world is a lie about what is happening behind it, and in a match it is
     also a way to die while reading. There is no pop-up in reality either; a
     man who rides up to an armed camp gets a choice, not a dialog box.

     So a world interaction docks ONE-WORD verbs at the bottom of the screen
     and nothing else changes: the camera still runs, the band still walks,
     the day still turns, and if somebody attacks you mid-decision the attack
     happens. Same grammar systems/interact.js uses for the city and the
     disaster island — a short rail of verbs, a price or a consequence as a
     small chip inside the button, and the result spoken as a toast rather
     than another panel.

     Keys 1-5 bind automatically so a desktop player never reaches for the
     mouse, and the whole rail is thumb-height on a phone. */
  let verbKeyHandler = null;
  ctx.verbs = function (spec) {
    const box = el("verbs");
    if (!box) return;
    const opts = (spec.options || []).filter(Boolean);
    let html = '<div class="vin">';
    if (spec.title || spec.sub) {
      html += '<div class="vhead">' +
        (spec.title ? '<b>' + spec.title + '</b>' : '') +
        (spec.sub ? '<span class="vsub">' + spec.sub + '</span>' : '') +
        (spec.body ? '<button class="vtoggle" id="vToggle">HIDE</button>' : '') + '</div>';
    }
    /* THE BODY IS THE CONTENT, NOT A SUMMARY OF IT. The first pass at killing
       the pop-ups threw the readout away and left five bare verbs, and that
       was the wrong lesson: the tables were never the problem — BLOCKING was.
       A composition breakdown, an odds bar and a roster are exactly what a
       decision needs, so they come back verbatim; they just live in a strip
       that the world keeps running behind, that never swallows a tap meant
       for the ground, and that a thumb can fold away. */
    if (spec.body) html += '<div class="vbody" id="vBody">' + spec.body + '</div>';
    html += '<div class="vrow">';
    opts.forEach(function (o, i) {
      html += '<button class="vbtn ' + (o.kind || '') + '" data-i="' + i + '"' +
        (o.disabled ? ' disabled' : '') + '>' +
        '<span>' + o.label + '</span>' +
        '<span class="vk">' + (o.key || (i + 1)) + (o.note ? ' · ' + o.note : '') + '</span>' +
        '</button>';
    });
    html += '</div></div>';
    box.innerHTML = html;
    box.classList.add("on");
    // see body.wl-rail in the stylesheet: a right-hand rail owns the right edge
    document.body.classList.add("wl-rail");

    const fire = function (i) {
      const o = opts[i];
      if (!o || o.disabled) return;
      /* THE RAIL CLOSES BEFORE THE HANDLER RUNS, always. A verb that opens
         another rail would otherwise be racing its own teardown, and the
         first draft left two docks stacked on screen. */
      ctx.closeVerbs();
      if (typeof o.on === "function") o.on();
    };
    Array.prototype.forEach.call(box.querySelectorAll(".vbtn"), function (b) {
      b.onclick = function () { fire(parseInt(b.dataset.i, 10)); };
    });
    const tog = el("vToggle"), bodyEl = el("vBody");
    if (tog && bodyEl) {
      tog.onclick = function () {
        const hid = bodyEl.classList.toggle("hid");
        tog.textContent = hid ? "SHOW" : "HIDE";
      };
    }
    /* A RAIL CAN BE REPAINTED WITHOUT BEING REOPENED — a purchase changes the
       stock list under the same verbs, and tearing the whole dock down to
       redraw one table is what made the old screen flicker on every tap. */
    ctx.verbsBody = function (htm) {
      const b = el("vBody");
      if (b) b.innerHTML = htm;
    };
    verbKeyHandler = function (e) {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= opts.length) { e.preventDefault(); fire(n - 1); }
    };
    window.addEventListener("keydown", verbKeyHandler);
  };
  ctx.closeVerbs = function () {
    const box = el("verbs");
    if (box) { box.classList.remove("on"); box.innerHTML = ""; }
    document.body.classList.remove("wl-rail");
    if (verbKeyHandler) { window.removeEventListener("keydown", verbKeyHandler); verbKeyHandler = null; }
  };
  ctx.verbsOpen = function () { const b = el("verbs"); return !!(b && b.classList.contains("on")); };
  /* A SCREEN THAT IS NOT THE CURRENT PHASE'S SCREEN MUST NOT BE UP. Every
     module gets this for free rather than each of them remembering to tear
     its own DOM down — forgetting once leaves a dead menu over a live game. */
  W.on("phase", function (t) {
    if (t.to === "campaign" || t.to === "battle") ctx.closeScreen();
    // a battle or a full screen takes the world; a dangling verb rail over
    // either is the same bug the rail exists to remove
    if (t.to === "battle" || t.to === "armoury" || t.to === "over") ctx.closeVerbs();
  });

  /* ---- boot the modules, then hand the screen to the menu ---- */
  const booted = W.bootModules(ctx);
  console.log("[warlord] modules:", booted.join(", "));
  if (Q.get("audit") === "1") console.log("[warlord] audit", W.audit());

  const b = el("boot");
  if (b) b.style.display = "none";
  CBZ.micro.start();

  /* ============================================================ MENU */
  function menu() {
    W.setPhase("menu");
    const resume = W.hasSave();
    ctx.screen(
      '<h1 class="wl-h">DESERT <em>WARLORD</em></h1>' +
      /* THE SUBTITLE IS THE WHOLE PITCH AND THE CARD UNDER IT SAID IT AGAIN
         IN THREE SENTENCES. "ONE MAN · ONE PISTOL · FOURTEEN KILOMETRES OF
         SAND" already states that you begin alone with a pistol; the card
         then explained that you start alone, that every man is paid for or
         frightened into it, and that nobody is given to you — which is this
         game's central mechanic described to somebody who has not played it
         yet, i.e. a manual page on a title screen. Deleted, 137 characters.
         The mechanic teaches itself in the first ten minutes. */
      '<p class="wl-sub">ONE MAN · ONE PISTOL · FOURTEEN KILOMETRES OF SAND</p>' +
      '<div class="wl-btns">' +
        '<button class="wl-btn hot" id="mNew" data-boot-entry>RIDE OUT</button>' +
        (resume ? '<button class="wl-btn" id="mLoad">CONTINUE</button>' : '') +
        '<button class="wl-btn" id="mNet">MULTIPLAYER</button>' +
      '</div>'
    );
    el("mNew").onclick = function () {
      W.newGame({ seed: parseInt(Q.get("seed") || "", 10) || undefined });
      if (W.campaign && W.campaign.enter) W.campaign.enter();
    };
    const l = el("mLoad");
    if (l) l.onclick = function () {
      if (W.load() && W.campaign && W.campaign.enter) W.campaign.enter();
      else W.toast("that save is from an older build", "bad");
    };
    el("mNet").onclick = function () {
      if (W.warnet && W.warnet.lobby) W.warnet.lobby();
      else W.toast("multiplayer did not load", "bad");
    };
  }
  ctx.menu = menu;
  W.on("mainmenu", menu);

  /* ?go=1 skips the menu — every tool that photographs this page needs to be
     ON the island, not looking at a title card. */
  if (Q.get("go") === "1") {
    W.newGame({ seed: parseInt(Q.get("seed") || "", 10) || 1337 });
    if (W.campaign && W.campaign.enter) W.campaign.enter();
  } else {
    menu();
  }

  /* ---- the hook the before/after tool stages through ---- */
  window.__warlordReady = true;
}
})();
</script>
</body>
</html>
