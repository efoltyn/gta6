<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="data:,">
<title>President</title>
<meta name="description" content="Run a country from one office. Every number on the desk is one connected world: markets, bonds, wars, elections, and the people who carry out your orders.">
<!-- ============================================================
  PRESIDENT — one office, one desk, the whole world.

  This page is the shell. The game is src/president/:
     world.js   the world as one deterministic model (no THREE, node-tested:
                tools/president-sim-check.mjs)
     ai.js      the other presidents, through the same actions you have
     holler.js  what people say, read off what happened
     papers.js  the desk: Treasury, Commerce, Cabinet & Polls, the bill, the
                phone, the map table
     office.js  the room, the people, the camera, the scenes
     net.js     several presidents in one world (lockstep over net/rooms.js)
     game.js    the start, the clock, the end
  The engine pieces (bodies, speech, furniture, ragdolls, guns, the three-
  answer prompt) come from the studio; nothing here re-draws a person.
============================================================ -->
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/campaign.css?v=pres1026">
<style>
  :root{color-scheme:dark;--ink:#f3efe4;--bg:#0c111a;--gold:#c8a24a;--paper:#f2ede0;--red:#b3261e;
    --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.35 Fredoka,system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body.playing{overflow:hidden;touch-action:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  #microCanvas{touch-action:none}

  /* ---- the start: a world, a country ---- */
  #start{position:relative;min-height:100%;padding:calc(18px + var(--st)) calc(16px + var(--sr)) calc(28px + var(--sb)) calc(16px + var(--sl));
    background:radial-gradient(ellipse at 50% -10%,#1d2c46 0%,#0c111a 60%)}
  #start h1{margin:0 0 2px;font:700 clamp(40px,9vw,84px)/.9 Georgia,serif;letter-spacing:.06em;color:var(--paper)}
  #start .sub{opacity:.6;margin:0 0 14px}
  .wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;max-width:1300px}
  @media (max-width:820px){.wrap{grid-template-columns:1fr}}
  #preview{width:100%;aspect-ratio:160/96;border-radius:10px;display:block;image-rendering:pixelated;cursor:pointer;border:1px solid #2a3a55}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
  .row label{opacity:.65;font-size:13px}
  input{font:inherit;color:#fff;background:#141c2a;border:1px solid #2c3b55;border-radius:8px;padding:8px 10px;width:110px}
  .chip{padding:8px 12px;border-radius:8px;background:#141c2a;border:1px solid #2c3b55}
  .chip.on{background:#25406e;border-color:#4d79c4}
  #clist{display:flex;flex-direction:column;gap:6px;max-height:min(62vh,620px);overflow:auto;padding-right:4px}
  .crow{display:grid;grid-template-columns:14px 1fr;column-gap:10px;text-align:left;padding:9px 10px;border-radius:9px;background:#121a27;border:1px solid #1f2b40}
  .crow i{grid-row:span 3;width:14px;border-radius:3px}
  .crow b{font-size:16px}
  .crow span,.crow em{font-size:12.5px;opacity:.72;font-style:normal}
  .crow.on{border-color:var(--gold);background:#1c2233}
  .crow.taken{opacity:.5}
  .go{display:inline-block;padding:14px 26px;border-radius:999px;background:var(--gold);color:#16120a;font:700 18px Fredoka,sans-serif;letter-spacing:.06em}
  .go.q{background:#1b2537;color:var(--ink);border:1px solid #33476a}
  #netmsg{opacity:.75;min-height:1.3em}
  #lobby{margin-top:14px;padding:14px;border-radius:12px;background:#111a28;border:1px solid #2c3b55;max-width:640px}
  #code{font:700 38px Fredoka,monospace;letter-spacing:.2em;color:var(--gold)}
  #seats div{padding:3px 0}
  #bootst{position:fixed;left:50%;bottom:calc(10px + var(--sb));transform:translateX(-50%);opacity:.5;font-size:12px;pointer-events:none}

  /* ---- playing: a clock, a way back, nothing else ---- */
  #hud{position:fixed;z-index:20;left:calc(10px + var(--sl));top:calc(10px + var(--st));display:flex;gap:6px;align-items:center;
    padding:6px 8px;border-radius:12px;background:rgba(10,14,22,.62);backdrop-filter:blur(6px)}
  #date{font:700 15px Fredoka,sans-serif;min-width:104px;padding:0 4px}
  #hud [data-sp]{width:38px;height:34px;border-radius:8px;background:rgba(255,255,255,.08);font-size:13px;font-weight:700}
  #hud [data-sp].on{background:var(--gold);color:#15110a}
  #hud [data-sp]:disabled{opacity:.4}
  #back{position:fixed;z-index:20;right:calc(12px + var(--sr));top:calc(10px + var(--st));width:48px;height:48px;border-radius:50%;
    background:rgba(10,14,22,.66);font-size:24px;display:none}
  body.focused #back{display:block}
  #over{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,6,10,.78)}
  #over .in{max-width:560px;width:100%;max-height:92vh;overflow:auto;background:var(--paper);color:#1c1d22;border-radius:6px;padding:28px 26px;font-family:Georgia,serif;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  #overt{margin:0 0 6px;font:700 36px Georgia,serif}
  #overs{margin:0 0 14px;opacity:.7}
  #overl div{padding:3px 0;border-bottom:1px solid rgba(0,0,0,.08);font-size:15px}
  #overl .me{font-weight:700}
  #over .go{margin-top:16px;font-family:Fredoka,sans-serif}
  /* the plain three-answer prompt, if campaign_ui is not on the page */
  .pres-prompt{position:fixed;z-index:30;left:50%;bottom:calc(18px + var(--sb));transform:translateX(-50%);width:min(680px,94vw);
    padding:14px;border-radius:14px;background:rgba(10,14,22,.86);text-align:center}
  .pres-prompt p{margin:6px 0 12px;font-size:18px}
  .pres-prompt div{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .pres-prompt button{padding:12px 16px;border-radius:10px;background:#25406e;font-weight:700}
  /* the campaign phone from Gang City has no place on this page */
  .campaign-phone,.campaign-phone-peek,#campaignPhone{display:none!important}
  body.playing #portalHome{display:none!important}
</style>
</head>
<body>
<div id="start">
  <h1>PRESIDENT</h1>
  <p class="sub">One office. One desk. The whole world.</p>
  <div class="wrap">
    <div>
      <canvas id="preview" width="960" height="576"></canvas>
      <div class="row">
        <label>World</label><input id="seed" inputmode="numeric" aria-label="World seed"><button class="chip" id="reroll" type="button">New world</button>
        <label>Countries</label><button class="chip" data-n="8" type="button">8</button><button class="chip" data-n="12" type="button">12</button><button class="chip" data-n="16" type="button">16</button>
      </div>
      <div class="row">
        <button class="go" id="solo" type="button">TAKE OFFICE</button>
        <button class="go q" id="host" type="button">HOST A ROOM</button>
        <input id="jcode" placeholder="CODE" maxlength="6" aria-label="Room code"><button class="go q" id="join" type="button">JOIN</button>
      </div>
      <div class="row"><label>Your name</label><input id="pname" maxlength="20" placeholder="President" style="width:170px"></div>
      <div id="netmsg"></div>
      <div id="lobby" hidden>
        <div>Room <span id="code">....</span></div>
        <div id="seats"></div>
        <div class="row"><button class="go" id="begin" type="button" hidden>BEGIN</button><span id="lobbywait">The host begins.</span></div>
      </div>
    </div>
    <div id="clist"></div>
  </div>
</div>

<div id="hud" hidden>
  <span id="date"></span>
  <button data-sp="0" type="button" aria-label="Pause">II</button>
  <button data-sp="1" type="button" aria-label="Slow">1</button>
  <button data-sp="2" type="button" aria-label="Normal">2</button>
  <button data-sp="3" type="button" aria-label="Fast">3</button>
  <button data-sp="4" type="button" aria-label="Fastest">4</button>
</div>
<button id="back" type="button" aria-label="Put it down">×</button>
<div id="over" hidden><div class="in">
  <h2 id="overt"></h2><p id="overs"></p><div id="overl"></div>
  <button class="go" id="again" type="button">NEW WORLD</button>
  <button class="go q" id="watch" type="button">WATCH</button>
</div></div>
<div id="bootst">LOADING</div>

<script src="../src/core/stage.js?v=pres1026"></script>
<script src="../src/core/studio.js?v=pres1026"></script>
<script src="../src/president/world.js?v=pres1026"></script>
<script src="../src/president/ai.js?v=pres1026"></script>
<script src="../src/president/holler.js?v=pres1026"></script>
<script src="../src/president/papers.js?v=pres1026"></script>
<script src="../src/net/rooms.js?v=pres1026"></script>
<script src="../src/president/net.js?v=pres1026"></script>
<script src="../src/president/game.js?v=pres1026"></script>
<a href="../" id="portalHome" style="position:fixed;left:12px;top:10px;z-index:2147483000;font:700 13px/1 Fredoka,Arial,sans-serif;letter-spacing:.08em;color:#fff;text-decoration:none;background:rgba(4,20,36,.55);padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25)">◀ ALL GAMES</a>
</body>
</html>
