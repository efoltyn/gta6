<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="data:,">
<title>President</title>
<meta name="description" content="Run a real country from the Oval Office: the budget, the bond market, tariffs, wars and elections are one connected world, and every order goes through a person who can refuse it.">
<!-- ============================================================
  PRESIDENT — this page is the door, not the game.

  You pick a real country (president/nations.js: the countries, their
  leaders, their numbers; president/earth.js: the real map) and TAKE OFFICE
  opens the real Executive Mansion in the real engine:
     index.html?slice=estate&president=<country>
  (city/president_game.js). There you are a body in the chair behind the
  Resolute desk, and you get up and walk the West Wing and the grounds.
  A room of presidents is set up here and then played there, one world on
  the host's clock (president/net.js).
============================================================ -->
<link rel="stylesheet" href="../css/fonts.css">
<style>
  :root{color-scheme:dark;--ink:#f3efe4;--bg:#0c111a;--gold:#c8a24a;--paper:#f2ede0;
    --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.35 Fredoka,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  #start{position:relative;min-height:100vh;padding:calc(18px + var(--st)) calc(16px + var(--sr)) calc(28px + var(--sb)) calc(16px + var(--sl));
    background:radial-gradient(ellipse at 50% -10%,#1d2c46 0%,#0c111a 60%)}
  h1{margin:0 0 2px;font:700 clamp(40px,9vw,84px)/.9 Georgia,serif;letter-spacing:.06em;color:var(--paper)}
  .sub{opacity:.6;margin:0 0 14px}
  .wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;max-width:1300px}
  @media (max-width:820px){.wrap{grid-template-columns:1fr}}
  #preview{width:100%;height:auto;border-radius:10px;display:block;image-rendering:pixelated;cursor:pointer;border:1px solid #2a3a55}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
  .row label{opacity:.65;font-size:13px}
  input{font:inherit;color:#fff;background:#141c2a;border:1px solid #2c3b55;border-radius:8px;padding:8px 10px;width:110px}
  #clist{display:flex;flex-direction:column;gap:6px;max-height:min(70vh,720px);overflow:auto;padding-right:4px}
  .crow{display:grid;grid-template-columns:14px 1fr;column-gap:10px;text-align:left;padding:9px 10px;border-radius:9px;background:#121a27;border:1px solid #1f2b40}
  .crow i{grid-row:span 2;width:14px;border-radius:3px}
  .crow b{font-size:16px}
  .crow span{font-size:13px;opacity:.72}
  .crow.on{border-color:var(--gold);background:#1c2233}
  .crow.taken{opacity:.5}
  .go{display:inline-block;padding:14px 26px;border-radius:999px;background:var(--gold);color:#16120a;font:700 18px Fredoka,sans-serif;letter-spacing:.06em}
  .go.q{background:#1b2537;color:var(--ink);border:1px solid #33476a;font-size:15px;padding:12px 18px}
  #netmsg{opacity:.75;min-height:1.3em}
  #lobby{margin-top:14px;padding:14px;border-radius:12px;background:#111a28;border:1px solid #2c3b55;max-width:640px}
  #code{font:700 38px Fredoka,monospace;letter-spacing:.2em;color:var(--gold)}
  #seats div{padding:3px 0}
  #asof{opacity:.45;font-size:12px}
</style>
</head>
<body>
<div id="start">
  <h1>PRESIDENT</h1>
  <p class="sub">The Oval Office. The real world.</p>
  <div class="wrap">
    <div>
      <canvas id="preview" width="1200" height="440" aria-label="The world: tap a country"></canvas>
      <div class="row">
        <button class="go" id="solo" type="button">TAKE OFFICE</button>
        <label for="pname">Your name</label><input id="pname" maxlength="20" placeholder="President" style="width:150px">
      </div>
      <div class="row">
        <button class="go q" id="host" type="button">HOST A ROOM</button>
        <input id="jcode" placeholder="CODE" maxlength="6" aria-label="Room code"><button class="go q" id="join" type="button">JOIN</button>
      </div>
      <div id="netmsg"></div>
      <div id="lobby" hidden>
        <div>Room <span id="code">....</span></div>
        <div id="seats"></div>
        <div class="row"><button class="go" id="begin" type="button" hidden>BEGIN</button><span id="lobbywait">The host begins.</span></div>
      </div>
      <p id="asof"></p>
    </div>
    <div id="clist"></div>
  </div>
</div>
<script src="../src/president/earth.js?v=pres1028"></script>
<script src="../src/president/nations.js?v=pres1028"></script>
<script src="../src/president/world.js?v=pres1028"></script>
<script src="../src/net/rooms.js?v=pres1026"></script>
<script src="../src/president/net.js?v=pres1028"></script>
<script src="../src/president/game.js?v=pres1028"></script>
</body>
</html>
