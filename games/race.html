<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="data:,">
<title>Bullring</title>
<meta name="description" content="Ten stock cars, a half-mile concrete bowl, a night race under the lights.">
<!-- ============================================================
  BULLRING: the racing game, on its own page.

  It used to live only inside Gang City (the speedway island), which meant
  every change to a car or a corner cost a 25 km world boot to look at. Now
  it is this page and src/race/*.js, nothing else: three.js, the circuit, the
  cars, the bowl, the drivers. It boots in a couple of seconds on a phone.
  In Gang City the same race is run in the world (your character walks into
  the Bullring and gets into a car); this page is the bench for the modules.
============================================================ -->
<link rel="stylesheet" href="../css/fonts.css">
<style>
  :root{color-scheme:dark;--disp:Oswald,"Arial Narrow",Impact,sans-serif;--red:#ff3b30;--amber:#ffb020;--ink:#07080b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;color:#f3f1ec;
    font:600 15px/1.3 Fredoka,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  #stage canvas{display:block}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:500 14px var(--disp);letter-spacing:.3em;opacity:.6}

  /* the one card before the race */
  #card{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding:0 16px calc(12vh + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,rgba(7,8,11,0) 40%,rgba(7,8,11,.85) 100%);transition:opacity .35s}
  #card.gone{opacity:0;pointer-events:none}
  #card h1{margin:0;font:700 clamp(64px,16vw,150px)/.85 var(--disp);letter-spacing:.04em;text-transform:uppercase;
    text-shadow:0 6px 40px rgba(0,0,0,.6)}
  #card h1 em{font-style:normal;color:var(--red)}
  #go{margin-top:22px;padding:16px 58px;border-radius:999px;background:var(--red);font:700 22px var(--disp);letter-spacing:.2em;
    box-shadow:0 10px 40px rgba(255,59,48,.35)}
  #go:active{transform:scale(.97)}

  /* the race HUD: a chip, the speed, the lamps */
  .hud{position:fixed;z-index:10;pointer-events:none;opacity:0;transition:opacity .3s}
  body.racing .hud{opacity:1}
  #chip{left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;gap:14px;
    padding:6px 16px;border-radius:10px;background:rgba(7,8,11,.55);font:600 20px var(--disp);letter-spacing:.06em}
  #chip #hPos{color:#fff}
  #chip #hLap{opacity:.75}
  #speedo{right:calc(18px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));text-align:right}
  #speedo b{font:700 42px/1 var(--disp);font-variant-numeric:tabular-nums}
  #speedo span{font:500 12px var(--disp);letter-spacing:.2em;opacity:.6}
  #speedo i{display:inline-block;margin-left:10px;font:700 20px var(--disp);font-style:normal;color:var(--amber)}
  #rpmBar{width:120px;height:4px;margin:6px 0 0 auto;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
  #hRpm{height:100%;background:linear-gradient(90deg,#46e08a,#ffd23a 70%,#ff3b30);transform-origin:0 50%;transform:scaleX(0)}
  #lights{left:50%;top:22%;transform:translateX(-50%);display:flex;gap:12px;padding:12px 16px;border-radius:14px;background:rgba(0,0,0,.6);opacity:0}
  #lights.show{opacity:1}
  #lights i{width:34px;height:34px;border-radius:50%;background:#1b1d22;box-shadow:inset 0 0 0 3px #2a2d33}
  #lights i.r{background:#ff2a1f;box-shadow:0 0 24px #ff2a1f}
  #lights i.g{background:#27e06b;box-shadow:0 0 24px #27e06b}
  #flag{left:50%;top:34%;transform:translate(-50%,-50%) scale(.9);font:700 clamp(40px,9vw,84px) var(--disp);letter-spacing:.08em;
    opacity:0;transition:opacity .25s,transform .25s;text-shadow:0 4px 30px rgba(0,0,0,.7)}
  #flag.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #flag.chk{color:#fff}
  #flag.white{color:#fff}

  /* corner buttons */
  .corner{position:fixed;z-index:12;top:calc(10px + env(safe-area-inset-top,0px));width:44px;height:44px;border-radius:12px;
    background:rgba(7,8,11,.5);display:none;align-items:center;justify-content:center}
  body.racing .corner{display:flex}
  #pauseBtn{left:calc(12px + env(safe-area-inset-left,0px))}
  #camBtn{left:calc(64px + env(safe-area-inset-left,0px))}
  .corner svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* touch: a wheel for the left thumb, two pedals for the right */
  .tc{display:none;position:fixed;z-index:11;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  body.touch.racing .tc{display:block}
  #steerPad{left:0;width:48vw;height:46vh}
  #steerRail{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:10px;width:190px;height:64px;border-radius:32px;
    background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.14)}
  #steerKnob{position:absolute;left:63px;top:0;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.28);
    border:2px solid rgba(255,255,255,.5);transition:transform .08s}
  #steerPad.on #steerKnob{transition:none;background:rgba(255,255,255,.45)}
  .pedal{position:fixed;z-index:11;border-radius:18px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18)}
  .pedal.on{background:rgba(255,255,255,.3)}
  #gas{right:calc(18px + env(safe-area-inset-right,0px));width:92px;height:140px;border-color:rgba(70,224,138,.55)}
  #brk{right:calc(122px + env(safe-area-inset-right,0px));width:84px;height:92px;border-color:rgba(255,59,48,.55)}
  .pedal::after{content:"";position:absolute;left:18%;right:18%;top:18%;bottom:18%;border-radius:8px;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 4px,transparent 4px 10px)}

  /* pause and results */
  .sheet{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(7,8,11,.72)}
  .sheet.show{display:flex}
  .sheet .in{width:min(560px,100%);text-align:center}
  .btn{display:inline-block;margin:10px 6px 0;padding:14px 34px;border-radius:999px;background:var(--red);font:700 18px var(--disp);letter-spacing:.16em}
  .btn.q{background:rgba(255,255,255,.12)}
  #boardTitle{margin:0 0 12px;font:700 clamp(48px,12vw,96px)/.9 var(--disp);letter-spacing:.04em}
  table{width:100%;border-collapse:collapse;font:500 15px var(--disp);letter-spacing:.04em}
  td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}
  td:first-child{width:34px;opacity:.6}
  td:nth-child(4),td:nth-child(5){text-align:right;font-variant-numeric:tabular-nums}
  tr.me td{background:rgba(255,59,48,.18)}
  td.fl{color:#c77dff}
  /* the portal's back link (injected by the release build) never sits over a race */
  body.racing #portalHome{display:none!important}
</style>
</head>
<body>
<div id="boot">LOADING</div>
<div id="stage"></div>

<div id="card"><h1>BULL<em>RING</em></h1><button id="go" type="button">RACE</button></div>

<div class="hud" id="chip"><span id="hPos">P6/10</span><span id="hLap">LAP 1/8</span></div>
<div class="hud" id="speedo"><div><b id="hSpd">0</b><i id="hGear">1</i></div><span>MPH</span><div id="rpmBar"><div id="hRpm"></div></div></div>
<div class="hud" id="lights"><i></i><i></i><i></i><i></i><i></i></div>
<div class="hud" id="flag"></div>

<button class="corner" id="pauseBtn" type="button" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
<button class="corner" id="camBtn" type="button" aria-label="Camera"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>

<div class="tc" id="steerPad"><div id="steerRail"><div id="steerKnob"></div></div></div>
<button class="pedal tc" id="brk" type="button" aria-label="Brake"></button>
<button class="pedal tc" id="gas" type="button" aria-label="Throttle"></button>

<div class="sheet" id="pause"><div class="in"><button class="btn" id="resume" type="button">RESUME</button></div></div>
<div class="sheet" id="board"><div class="in">
  <h2 id="boardTitle">WINNER</h2>
  <table><tbody id="boardRows"></tbody></table>
  <button class="btn" id="again" type="button">RACE AGAIN</button>
</div></div>

<script src="../src/vendor/three.r128.min.js"></script>
<script src="../src/race/race_core.js?v=speedway1009"></script>
<script src="../src/race/race_physics.js?v=ric0929"></script>
<script src="../src/race/race_ai.js?v=speedway1009"></script>
<script src="../src/race/race_session.js?v=speedway1009"></script>
<script src="../src/race/race_car.js?v=ric0929"></script>
<script src="../src/race/race_track.js?v=ric0929"></script>
<script src="../src/race/race_venue.js?v=speedway1009"></script>
<script src="../src/race/race_audio.js?v=ric0929"></script>
<script src="../src/race/race_game.js?v=ric0929"></script>
</body>
</html>
